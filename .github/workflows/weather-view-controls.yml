name: Weather folder controls verification
on:
  push:
    branches: ['feat/weather-folder-switch-search-2026-10-25']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-view-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATPL_ACCOUNTS_ENABLED: 'false'
      AVILOG_WORKSPACE_SYNC_ENABLED: 'false'
      AVILOG_EVIDENCE_SYNC_ENABLED: 'false'
      AVILOG_LOGBOOK_V14_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Search and independent folder contracts
        id: contract
        run: node --test tests/weather-view-controls.test.js
      - name: Locked install and SDK build
        id: build
        if: ${{ !cancelled() && steps.contract.outcome == 'success' }}
        run: |
          mkdir -p test-results/weather-view
          npm ci --ignore-scripts > test-results/weather-view/install.log 2>&1
          npm run build:atpl-account
      - name: Full unit suite (existing failures remain visible)
        id: unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          code=0
          node --test --test-reporter=tap tests/*.test.js > test-results/weather-view/unit.tap 2>&1 || code=$?
          grep -E '^not ok|^# (tests|pass|fail)' test-results/weather-view/unit.tap || true
          exit "$code"
      - name: Reject new unit failures
        id: gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const log=readFileSync('test-results/weather-view/unit.tap','utf8');
          const bad=[...log.matchAll(/^not ok \d+ - (.+)$/gm)].map(m=>m[1]);
          const known=['v4 rejects extended preferences without acknowledging pending edits; v5 replays the original reminder edit and keeps watchlist','v5 requires reload for grouped preferences while v6 still accepts flat v5 data'];
          assert(bad.every(x=>known.includes(x)),JSON.stringify(bad));assert(bad.length<=2);assert(Number(log.match(/^# pass (\d+)/m)?.[1])>=265);
          console.log(JSON.stringify({existingFailures:bad,newFailures:0}));
          NODE
      - name: Browser engines
        id: browsers
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit > test-results/weather-view/browsers.log 2>&1
      - name: Folder switching, search, SPECI, focus and offline behavior
        id: feature
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/verify-weather-view.cjs
      - name: Existing Weather group, offline and account regression
        id: weather
        if: ${{ !cancelled() && steps.feature.outcome == 'success' }}
        run: node -r ./scripts/weather-regression-diagnostics.cjs scripts/verify-weather-ui.cjs > test-results/weather-view/weather-regression.log 2>&1 || { tail -65 test-results/weather-view/weather-regression.log; exit 1; }
      - name: Existing shared UI, Flight Log and Weather attention
        id: regression
        if: ${{ !cancelled() && steps.feature.outcome == 'success' }}
        run: |
          node scripts/verify-shared-ui.cjs
          node scripts/verify-flight-scan.cjs
          node scripts/verify-weather-attention.cjs
      - name: Private data, parsers, font and provider code unchanged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code 1624bc0ac166bda7c79de2397aed8f42374c60a1 -- public/app.js public/lib public/account public/atpl public/workspace/schema.js public/workspace/model.js public/workspace/repository.js public/workspace/session.js public/workspace/weather-watch.js public/workspace/weather-report.js public/workspace/weather-groups.js public/workspace/weather-attention.js public/ui/system.css public/ui/tokens.css public/style.css public/navy-teal.css data lib server.js firestore.rules storage.rules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: avilog-weather-view-checks
          path: test-results/
          retention-days: 7
