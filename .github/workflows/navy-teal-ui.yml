name: Navy teal UI verification

on:
  push:
    branches: ["ui/navy-teal-2026-10-24"]
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/verify-navy-teal.cjs'
      - '.github/workflows/navy-teal-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navy-teal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATPL_ACCOUNTS_ENABLED: 'false'
      AVILOG_WORKSPACE_SYNC_ENABLED: 'false'
      AVILOG_EVIDENCE_SYNC_ENABLED: 'false'
      AVILOG_LOGBOOK_V14_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install locked dependencies
        run: |
          mkdir -p test-results/navy-teal
          npm ci --ignore-scripts > test-results/navy-teal/install.log 2>&1 || { tail -60 test-results/navy-teal/install.log; exit 1; }
          tail -18 test-results/navy-teal/install.log
      - name: Build account SDK
        id: build
        run: npm run build:atpl-account
      - name: Unit regression suite
        id: units
        shell: bash
        run: |
          code=0
          npm test > test-results/navy-teal/unit.log 2>&1 || code=$?
          grep -E '^[✖×]|^not ok|^ℹ (tests|pass|fail)|^# (tests|pass|fail)' test-results/navy-teal/unit.log || true
          tail -14 test-results/navy-teal/unit.log
          exit "$code"
      # Failed units remain failed; browser diagnostics still run independently.
      - name: Install browser engines
        id: browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium webkit > test-results/navy-teal/browser-install.log 2>&1 || { tail -60 test-results/navy-teal/browser-install.log; exit 1; }
          tail -5 test-results/navy-teal/browser-install.log
      - name: Color contrast, real editor and offline shell
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/verify-navy-teal.cjs
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navy-teal-browser-results
          path: test-results/navy-teal/
          retention-days: 7
          if-no-files-found: ignore
