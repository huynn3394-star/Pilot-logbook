name: Shared AviLog interface verification
on:
  push:
    branches: ['ui/shared-interface-2026-10-25']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATPL_ACCOUNTS_ENABLED: 'false'
      AVILOG_WORKSPACE_SYNC_ENABLED: 'false'
      AVILOG_EVIDENCE_SYNC_ENABLED: 'false'
      AVILOG_LOGBOOK_V14_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install locked dependencies and build
        id: build
        run: |
          mkdir -p test-results/shared-ui
          npm ci --ignore-scripts > test-results/shared-ui/install.log 2>&1
          npm run build:atpl-account
      - name: Unit regression suite (failures stay visible)
        id: unit
        run: |
          code=0
          npm test > test-results/shared-ui/unit.log 2>&1 || code=$?
          grep -E '^[✖×]|^not ok|^ℹ (tests|pass|fail)|^# (tests|pass|fail)' test-results/shared-ui/unit.log || true
          tail -16 test-results/shared-ui/unit.log
          exit "$code"
      - name: Install browser engines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: browsers
        run: npx playwright install --with-deps chromium webkit > test-results/shared-ui/browsers.log 2>&1
      - name: All tabs, banks, themes and offline shell
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        id: shared
        run: node scripts/verify-shared-ui.cjs
      - name: Existing flight-editor color regression
        if: ${{ !cancelled() && steps.shared.outcome == 'success' }}
        run: node scripts/verify-navy-teal.cjs
      - name: Original ATPL scoring, source images and offline data
        if: ${{ !cancelled() && steps.shared.outcome == 'success' }}
        run: node scripts/verify-atpl-browser.cjs > test-results/shared-ui/atpl.log 2>&1 || { tail -70 test-results/shared-ui/atpl.log; exit 1; }
      - name: Protected files unchanged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git diff --exit-code 8a17e4908fbe54783fbe92b047ff2422c87ce1fe -- public/app.js public/lib public/workspace public/account public/atpl/banks public/atpl/manifests public/atpl/catalog.json public/atpl/identities.json data lib server.js firestore.rules storage.rules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: avilog-shared-interface-checks
          path: test-results/
          retention-days: 7
