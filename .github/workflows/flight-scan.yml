name: Per-flight Flight Log import verification
on:
  push:
    branches: ['feat/flight-log-per-flight-2026-10-25']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flight-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATPL_ACCOUNTS_ENABLED: 'false'
      AVILOG_WORKSPACE_SYNC_ENABLED: 'false'
      AVILOG_EVIDENCE_SYNC_ENABLED: 'false'
      AVILOG_LOGBOOK_V14_ENABLED: 'false'
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Prepare exact source candidate when present
        run: |
          mkdir -p test-results/flight-scan
          if [ -f scripts/apply-flight-scan.mjs ]; then node scripts/apply-flight-scan.mjs; fi
      - name: Per-flight action contract
        id: contract
        run: node --test tests/flight-scan-entry.test.js
      - name: Locked install and build
        id: build
        if: ${{ !cancelled() && steps.contract.outcome == 'success' }}
        run: |
          npm ci --ignore-scripts > test-results/flight-scan/install.log 2>&1
          npm run build:atpl-account
      - name: Full unit suite (failures remain visible)
        id: unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          code=0
          node --test --test-reporter=tap tests/*.test.js > test-results/flight-scan/unit.tap 2>&1 || code=$?
          grep -E '^not ok|^# (tests|pass|fail)' test-results/flight-scan/unit.tap || true
          exit "$code"
      - name: Reject any additional unit failure
        id: gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const log=readFileSync('test-results/flight-scan/unit.tap','utf8');
          const bad=[...log.matchAll(/^not ok \d+ - (.+)$/gm)].map(m=>m[1]);
          const known=['v4 rejects extended preferences without acknowledging pending edits; v5 replays the original reminder edit and keeps watchlist','v5 requires reload for grouped preferences while v6 still accepts flat v5 data'];
          assert(bad.every(x=>known.includes(x)),JSON.stringify(bad));assert(bad.length<=2);assert(Number(log.match(/^# pass (\d+)/m)?.[1])>=258);
          console.log(JSON.stringify({existingFailures:bad,newFailures:0}));
          NODE
      - name: Browser engines
        id: browsers
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        run: npx playwright install --with-deps chromium webkit > test-results/flight-scan/browsers.log 2>&1
      - name: Per-flight scan, draft guards, FINAL and cancellation
        id: feature
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/verify-flight-scan.cjs
      - name: All tabs, ATPL, Flight Detail, weather and offline regressions
        id: regression
        if: ${{ !cancelled() && steps.feature.outcome == 'success' }}
        run: |
          node scripts/verify-shared-ui.cjs
          node scripts/verify-navy-teal.cjs > test-results/flight-scan/navy.log 2>&1 || { tail -50 test-results/flight-scan/navy.log; exit 1; }
          node scripts/verify-weather-attention.cjs
      - name: Data, OCR, theme and provider code preservation
        id: protected
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git diff --exit-code f65d73f467a10b4a6865ed8acefc12febf0577ae -- public/workspace public/account public/atpl public/ui public/style.css public/navy-teal.css public/lib/a320-scan.js public/lib/importers.js public/lib/parsers.js public/lib/domain.js public/lib/flight-assist.js data lib server.js firestore.rules storage.rules package.json package-lock.json
      - name: Package exact tested source
        id: package
        if: ${{ !cancelled() && steps.gate.outcome == 'success' && steps.feature.outcome == 'success' && steps.regression.outcome == 'success' && steps.protected.outcome == 'success' }}
        run: |
          mkdir -p candidate
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const paths=['public/app.js','public/lib/flight-editor.js','public/sw.js','tests/v14-build-cache.test.js','tests/workspace-service-worker.test.js'];
          const files=paths.map(path=>{const content=readFileSync(path,'utf8');return{path,content,bytes:Buffer.byteLength(content),sha256:createHash('sha256').update(content).digest('hex')};});
          writeFileSync('candidate/candidate.json',JSON.stringify({parent:process.env.GITHUB_SHA,base:'f65d73f467a10b4a6865ed8acefc12febf0577ae',files}));
          NODE
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: avilog-flight-scan-checks
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ steps.package.outputs.ready == 'true' }}
        with:
          name: avilog-flight-scan-verified-source
          path: candidate/
          retention-days: 7
  candidate:
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avilog-flight-scan-verified-source
          path: candidate
      - name: Create verified Git objects only, no branch changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const p=JSON.parse(readFileSync('candidate/candidate.json','utf8'));
          assert.equal(p.parent,process.env.EXPECTED_PARENT);assert.equal(p.base,'f65d73f467a10b4a6865ed8acefc12febf0577ae');
          const allowed=['public/app.js','public/lib/flight-editor.js','public/sw.js','tests/v14-build-cache.test.js','tests/workspace-service-worker.test.js'];assert.deepEqual(p.files.map(f=>f.path).sort(),allowed.sort());
          const api=async(path,body)=>{const r=await fetch('https://api.github.com/repos/'+process.env.REPOSITORY+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('Git objects request failed: '+r.status);return r.json();};
          const parent=await api('/git/commits/'+p.parent),tree=[];
          for(const f of p.files){assert.equal(Buffer.byteLength(f.content),f.bytes);assert.equal(createHash('sha256').update(f.content).digest('hex'),f.sha256);const b=await api('/git/blobs',{content:f.content,encoding:'utf-8'});tree.push({path:f.path,mode:'100644',type:'blob',sha:b.sha});}
          const t=await api('/git/trees',{base_tree:parent.tree.sha,tree}),c=await api('/git/commits',{message:'feat(flight): import Flight Log directly into the selected saved flight',tree:t.sha,parents:[p.parent]});console.log('VERIFIED_CANDIDATE_COMMIT='+c.sha);
          NODE
