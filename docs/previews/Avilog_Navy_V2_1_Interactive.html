/* V2.1.1 — Unified iOS-style typography; system fonts only, no remote downloads. */

html,body,button,input,select,textarea{font-family:var(--font-ui)}
button,input,select,textarea{font-variant-numeric:tabular-nums}
.status,.brand,.month-title,.fc-head,.airport,.duration,.toolbar-title,.flight-totals strong,.summary h3,.filter-header{font-family:var(--font-display)}
.status{font-weight:650;letter-spacing:0}
.brand{font-weight:700;letter-spacing:.065em}
.month-title strong{font-weight:450;letter-spacing:-.025em}

.fc-role,.fc-type{font-weight:650;letter-spacing:.025em}
.duration,.flight-totals strong,.station,.total,.sum-row b,.floating-month,.cell input,.time-cell input,.counter span{font-variant-numeric:tabular-nums lining-nums}
.duration{font-weight:650;letter-spacing:-.025em}
.flight-totals strong{font-weight:500;letter-spacing:-.025em}

.navbtn{font-weight:500;letter-spacing:0}

function logbook(){let fs=data.map((f,i)=>({...f,index:i})).filter(f=>{let q=state.query.toLowerCase();return(!q||[f.num,f.from,f.to,f.dep,f.arr,f.tail].some(v=>v.toLowerCase().includes(q)))&&(state.month==='all'||f.date.startsWith(state.month))&&(state.filter.aircraft==='all'||f.type===state.filter.aircraft)&&(state.filter.airport==='all'||f.from===state.filter.airport||f.to===state.filter.airport)&&(state.filter.function==='all'||f.role===state.filter.function)&&(!state.filter.incomplete)});let months=[...new Set(fs.map(f=>f.date.slice(0,7)))];return `${chrome()}<main class="main"><div class="searchrow"><label class="search"><b>⌕</b><input id="query" placeholder="Search logbook" value="${escapeHTML(state.query)}" aria-label="Search logbook"/></label><button class="round" data-go="filters" title="Bộ lọc">▽</button></div><div class="promo"><span class="promo-icon">✧</span><div><strong>Every flight. Beautifully logged.</strong><small>Avilog Navy V2.1 · giao diện demo</small></div></div>${months.map((month,idx)=>{const group=fs.filter(f=>f.date.startsWith(month));return`<section><div class="month-title"><strong>${monthName(month).split(' ')[0]} <small>${month.split('-')[0]}</small></strong><div class="total"><small>ACTUAL</small> ${sum(group)}</div></div>${idx===0?'<div class="now"><span>● NOW</span></div>':''}${group.map(f=>flightCard(f,f.index)).join('')}</section>`}).join('')||'<div class="group"><div class="g-row">Không tìm thấy chuyến bay phù hợp.</div></div>'}<button class="floating-month" data-monthpicker="1">⌃ ${state.month==='all'?'Nov 2026':monthName(state.month).replace('ember','').slice(0,8)}</button></main>${navbar()}`}
function row(label,value,extra=''){return`<div class="rowvalue"><span>${label}</span>${extra||`<strong>${value}</strong>`}</div>`}
function editor(){let f=data[state.current];return`${chrome(true)}<main class="main"><section class="group"><div class="formgrid"><div class="cell"><label>Flight</label><input value="${f.num}" data-edit="flight" aria-label="Flight number"/></div><div class="cell"><label>Date</label><input type="date" value="${f.date}" data-edit="date" aria-label="Flight date"/></div><div class="cell"><label>Tail number</label><input value="${f.tail}" data-edit="tail"/></div><div class="cell"><label>Type</label><span style="color:var(--teal);font-size:12px">${f.type}</span></div><div class="cell"><label>ETD</label><span>— UTC</span></div><div class="cell"><label>ETA</label><span>— UTC</span></div></div>${row('Crew','H · Đ1 · Đ7 · T4')}</section><section class="group"><div class="formgrid"><div class="cell center"><b>${f.dep}</b><span>${f.dep}/${f.from}</span></div><div class="cell center"><b>${f.arr}</b><span>${f.arr}/${f.to}</span></div><div class="cell"><label>OUT</label><div class="time-cell"><input value="${f.out}" data-edit="out" aria-label="Off block UTC"/><small>UTC</small></div></div><div class="cell"><label>ON</label><div class="time-cell"><input value="${f.num==='HVN435'?'04:15':f.in}" data-edit="in" aria-label="Landing UTC"/><small>UTC</small></div></div><div class="cell"><label>OFF</label><div class="time-cell"><input value="23:58" data-edit="off"/><small>UTC</small></div></div><div class="cell"><label>IN</label><div class="time-cell"><input value="04:26" data-edit="on"/><small>UTC</small></div></div></div>${row('Pilot Flying','',`<button class="switch ${state.multi?'on':''}" data-toggle="multi" aria-label="Pilot Flying"></button>`)}</section><section class="group flight-totals"><div><small>FLIGHT</small><strong>${f.flight}</strong></div><div><small>BLOCK</small><strong>${f.block}</strong></div></section><section class="group"><div class="cnt-head"><div>✈ Takeoffs</div><div>✈ Landings</div></div>${[['takeDay','landDay','day'],['takeNight','landNight','night']].map(([a,b,label])=>`<div class="cnt-row">${[a,b].map(k=>`<div class="counter"><button data-count="${k}" data-delta="-1">‹</button><span>${state.counts[k]} ${label}</span><button data-count="${k}" data-delta="1">›</button></div>`).join('')}</div>`).join('')}</section><div class="label">Flight conditions</div><section class="group">${row('Multi-pilot','',`<button class="switch ${state.multi?'on':''}" data-toggle="multi" aria-label="Multi-pilot"></button>`)}${row('Function',f.role)}${row('Flight Rules','IFR')}${row('Flight Conditions','Actual instrument')}${row('Cross country','',`<button class="switch" data-toggle="cross" aria-label="Cross country"></button>`)}</section><section class="group">${row('PIC / SIC','SIC')}${row('Actual instrument','00:25')}${row('Day','04:43')}${row('Night','00:00')}</section><div class="label">Departure</div><section class="group">${row('Runway','Not configured')}${row('SID procedure','Unavailable')}${row('Threats','No backend support')}${row('Notes','—')}</section><div class="label">Arrival</div><section class="group">${row('Runway','Not configured')}${row('STAR procedure','Unavailable')}${row('Threats','No backend support')}${row('Notes','—')}</section><div class="label">Remarks</div><section class="group" style="padding:15px"><textarea aria-label="Remarks" placeholder="Ghi chú (demo)" style="background:transparent;border:0;color:white;width:100%;min-height:45px" data-edit="notes"></textarea></section><section class="group summary"><h3>Flight times <a>SUMMARY</a></h3>${rowSummary('Second in command',f.block)}${rowSummary('Actual instrument','00:25')}<div class="sum-grid">${[['Day',f.block],['Night','00:00'],['VFR','00:00'],['IFR',f.block],['Stick','Not recorded'],['Rest','Not recorded']].map(([k,v])=>rowSummary(k,v)).join('')}</div><div class="editor-bottom-actions"><button data-next="1">✈ Next flight</button><button data-next="-1">✈ Return flight</button><button data-share="1">⇧ Share</button></div></section><p style="font-size:11px;color:var(--muted)">Đây là demo với dữ liệu giả lập. Save chỉ cập nhật bản xem trước trong bộ nhớ, không ghi database.</p></main>`}
function rowSummary(k,v){return`<div class="sum-row"><span>${k}</span><b>${v}</b></div>`}
function filters(){const sf=state.filter;let options=(k,items)=>`<select data-filter="${k}">${items.map(x=>`<option value="${x}" ${sf[k]===x?'selected':''}>${x==='all'?'Any':x}</option>`).join('')}</select>`;return`<div class="status"><span>22:04</span><span class="signals">▂▄▆ ᯤ ▰94</span></div><div class="top"><button class="round" data-go="logbook" aria-label="Close filters">×</button><div class="toolbar-title">Filters</div><button class="save" data-clear="1">Clear</button></div><main class="main filter-main"><div class="filtergroup group">${row('Period','',`<select data-filter="period"><option value="all">All time</option><option value="month">This month</option></select>`)}</div><div class="filtergroup group">${row('Show','',`<strong style="font-size:13px">Flights &nbsp; Sims &nbsp; <span style="color:var(--teal)">Both</span></strong>`)}${row('Incomplete only','',`<button class="switch ${sf.incomplete?'on':''}" data-toggle="incomplete" aria-label="Incomplete only"></button>`)}</div><div class="filtergroup group">${row('Aircraft type','',options('aircraft',['all','Airbus A321','Airbus A321neo']))}${row('Tail number','',`<input placeholder="Any" data-filter="tail" />`)}</div><div class="filtergroup group">${row('Airports','',options('airport',['all','SGN','DAD','CXR','HPH','PUS','CMB']))}</div><div class="filtergroup group">${row('Function','',options('function',['all','SIC','PIC']))}${row('Pilots','Any')}</div><div class="filtergroup group">${row('Rules','IFR')}${row('Conditions','Any')}</div><div class="filtergroup group">${row('Block time','Under / Over')}</div></main><button class="filter-action" data-apply="1">Show ${filteredCount()} records</button>`}
function filteredCount(){return data.filter(f=>(state.filter.aircraft==='all'||f.type===state.filter.aircraft)&&(state.filter.airport==='all'||f.from===state.filter.airport||f.to===state.filter.airport)&&(state.filter.function==='all'||f.role===state.filter.function)&&!state.filter.incomplete).length}
function more(){let account=[['♙','Profile & Account'],['⚙','Settings'],['☁','Synchronization'],['⇩','Database Manager']];let tools=[['▥','Dashboard & Statistics'],['▤','Export'],['⇩','Import hours'],['☰','Abbreviations'],['▦','Calculator'],['▤','Ôn thi ATPL'],['AŽ','Phonetic Alphabet'],['◷','Time Calculator']];return`${chrome()}<main class="main"><div class="more-title">Account</div>${moreGroup(account)}<div class="more-title">Tools</div>${moreGroup(tools)}<p style="font-size:11px;color:var(--muted)">Các mục này chỉ minh họa bố cục. Những chức năng ngoài Avilog sẽ không được bật trong bản tích hợp.</p></main>${navbar()}`}

function wxTAF(raw){return raw.replace(/\\n/g,'\n').split(/\n/).map((line,i)=>`<div class="wx-taf-line ${i?'wx-change':''}">${fmtWx(line)}</div>`).join('')}
function weather(){const s=weatherStations.find(x=>x[0]===state.weatherIcao)||weatherStations[0];const w=weatherSamples[s[0]],values=weatherValues[s[0]],list=weatherStations.filter(x=>x.join(' ').toLowerCase().includes(state.weatherSearch.toLowerCase()));return `${chrome()}<main class="main wx-page"><div class="wx-head"><div><div class="wx-eyebrow">AVILOG / FLIGHT WEATHER</div><h1>Thời tiết <span>✦</span></h1><p>METAR · SPECI · TAF theo phong cách Navy V2.1</p></div><button class="round" data-weather-refresh="1" aria-label="Làm mới bản tin minh họa">↻</button></div><div class="wx-demo-label">● DỮ LIỆU MINH HỌA — KHÔNG DÙNG ĐỂ BAY</div><div class="wx-tools"><label class="search"><b>⌕</b><input id="weather-search" placeholder="Tìm ICAO / IATA / sân bay" value="${escapeHTML(state.weatherSearch)}"></label><span class="wx-count">${list.length} sân bay</span></div><div class="wx-airports">${list.map(x=>`<button class="wx-airport ${x[0]===s[0]?'selected':''}" data-weather-icao="${x[0]}"><strong>${x[0]}</strong><span>${x[1]}</span><small>${escapeHTML(x[2])}</small></button>`).join('')||'<p>Không tìm thấy sân bay phù hợp.</p>'}</div><div class="wx-section-label"><span>◉ ĐANG CHỌN</span><span>03 NOV 2026 · UTC · DEMO</span></div><section class="wx-station group"><div class="wx-station-title"><div class="wx-iata">${s[1]}</div><div><strong>${s[0]} · ${escapeHTML(s[2])}</strong><small>${escapeHTML(s[3])}</small></div><span class="wx-condition">DEMO</span></div><div class="wx-stat-grid"><div><small>GIÓ</small><b>${values[0]}</b></div><div><small>TẦM NHÌN</small><b>${values[1]}</b></div><div><small>NHIỆT ĐỘ</small><b>${values[2]}</b></div><div><small>QNH</small><b>${values[3]}</b></div></div><div class="wx-footnote">Các chỉ số trên là minh họa theo bản tin giả lập; không dùng vận hành.</div></section><div class="wx-tabs">${[['metar','METAR'],['speci','SPECI'],['taf','TAF']].map(([k,v])=>`<button class="${state.weatherTab===k?'active':''}" data-weather-tab="${k}">${v}</button>`).join('')}</div><section class="wx-report group"><header><span><span class="wx-live-dot"></span>${state.weatherTab.toUpperCase()} · ${s[0]}</span><span class="wx-report-date">03 NOV 2026 · DEMO</span></header>${state.weatherTab==='metar'?`<div class="wx-report-raw">${fmtWx(w.metar)}</div><div class="wx-legend"><span>○ Dữ liệu bản tin nguyên văn</span><span>UTC</span></div>`:state.weatherTab==='speci'?'<div class="wx-no-speci"><div>◌</div><strong>Chưa có SPECI trong bộ dữ liệu demo</strong><p>Khi tích hợp Avilog, phần này sẽ thể hiện SPECI nhận được từ nguồn thời tiết của ứng dụng.</p></div>':`<div class="wx-taf">${wxTAF(w.taf)}</div><div class="wx-warning"><span>⚠</span><p><b>TSRA / CB</b> được đánh dấu để dễ nhận biết. Không tự sửa nội dung TAF hoặc diễn giải bản tin thành dự báo chính thức.</p></div>`}</section><div class="wx-legend-panel group"><strong>Chú giải nhanh</strong><div><span class="wx-trend">TEMPO</span><span>Biến đổi tạm thời</span></div><div><span class="wx-trend">BECMG</span><span>Chuyển biến dự báo</span></div><div><span class="wx-trend">PROB30/40</span><span>Xác suất được nêu trong TAF</span></div><div><span class="wx-severe">TSRA / CB</span><span>Dông mưa / mây vũ tích</span></div></div><p class="wx-disclaimer">UI demo hoạt động offline với bản tin giả lập. Bản tích hợp sẽ dùng nguồn METAR/TAF sẵn có của Avilog, giữ nguyên chuỗi gốc và timestamp.</p></main>${navbar()}`}
function wideSidebar(){const options=[['logbook','✈','Logbook'],['study','▤','Ôn thi ATPL'],['weather','☁','Thời tiết'],['more','•••','More']];return `<aside class="wide-sidebar" aria-label="Điều hướng màn hình lớn"><div class="wide-logo"><img src="${AVL_LOGO}" alt="AVL AVILOG"></div><div class="wide-side-caption">PILOT WORKSPACE</div><nav>${options.map(([k,ico,label])=>`<button type="button" class="wide-side-btn ${state.page===k||(k==='logbook'&&['editor','filters'].includes(state.page))||(k==='study'&&state.page.startsWith('study-'))?'active':''}" data-go="${k}"><span class="side-ico">${ico}</span><span class="side-label">${label}</span></button>`).join('')}</nav><div class="wide-side-spacer"></div><div class="wide-side-bottom"><div class="wide-user">H</div><div class="side-label"><strong>Avilog Navy V2.1</strong><small>Interactive UI Preview</small></div></div><div class="wide-side-hint">Dữ liệu minh họa · không đồng bộ</div></aside>`}
function draw(){app.innerHTML=`<div class="shell">${wideSidebar()}${state.page==='editor'?editor():state.page==='filters'?filters():state.page==='more'?more():state.page==='study'?studyHome():state.page==='weather'?weather():state.page==='study-subject'?studySubject():state.page==='study-question'?studyQuestion():logbook()}${state.sheet?sheet():''}${state.add?addMenu():''}</div>`}
app.addEventListener('input',e=>{if(e.target.id==='weather-search'){let pos=e.target.selectionStart;state.weatherSearch=e.target.value;draw();let x=$('#weather-search');x?.focus();x?.setSelectionRange(pos,pos);return}if(e.target.id==='study-query'){let pos=e.target.selectionStart;state.studyQuery=e.target.value;draw();let x=$('#study-query');x?.focus();x?.setSelectionRange(pos,pos);return}if(e.target.id==='query'){let pos=e.target.selectionStart;state.query=e.target.value;draw();let x=$('#query');x?.focus();x?.setSelectionRange(pos,pos)}if(e.target.dataset.edit)state.changed=true;if(e.target.dataset.filter){state.filter[e.target.dataset.filter]=e.target.value;let b=$('[data-apply]');if(b)b.textContent=`Show ${filteredCount()} records`;}});
app.addEventListener('change',e=>{if(e.target.dataset.filter){state.filter[e.target.dataset.filter]=e.target.value;let b=$('[data-apply]');if(b)b.textContent=`Show ${filteredCount()} records`}});
app.addEventListener('click',e=>{let b=e.target.closest('button,[data-open],[data-info],[data-close-overlay]');if(!b)return;if(b.dataset.weatherTab){state.weatherTab=b.dataset.weatherTab;draw();return}if(b.dataset.weatherIcao){state.weatherIcao=b.dataset.weatherIcao;draw();return}if(b.dataset.weatherExpand){state.weatherExpanded=!state.weatherExpanded;draw();return}if(b.dataset.weatherRefresh){toast('Bản tin minh họa — không truy vấn dữ liệu thời tiết thật');return}if(b.dataset.studyBank){state.studyBank=b.dataset.studyBank;state.page='study-subject';state.studyIndex=0;window.scrollTo(0,0);draw();return}if(b.dataset.studyStart){state.page='study-question';state.studyIndex=0;state.studySelected=null;state.studyReveal=false;window.scrollTo(0,0);draw();return}if(b.dataset.studyAnswer!==undefined){state.studySelected=Number(b.dataset.studyAnswer);draw();return}if(b.dataset.studyReveal){if(state.studySelected===null){toast('Hãy chọn một đáp án minh họa');return}state.studyReveal=true;draw();return}if(b.dataset.studyNext){state.studyIndex=(state.studyIndex+1)%3;state.studySelected=null;state.studyReveal=false;draw();return}if(b.dataset.studyPrevious!==undefined){state.studyIndex=Math.max(0,state.studyIndex-1);state.studyReveal=false;state.studySelected=null;draw();return}if(b.dataset.studyBookmark){state.studyBookmarked=!state.studyBookmarked;draw();return}if(b.dataset.studyInfo!==undefined||b.dataset.studyQuit!==undefined){toast('Đây là bản demo UI, không ghi tiến độ, tài khoản hoặc ngân hàng đề');return}if(b.dataset.go){if(state.changed&&state.page==='editor'&&!confirm('Bỏ thay đổi demo chưa lưu?'))return;state.changed=false;state.page=['briefing','social'].includes(b.dataset.go)?'more':b.dataset.go;draw();return}if(b.dataset.open!==undefined){state.current=Number(b.dataset.open);state.page='editor';window.scrollTo(0,0);draw();return}if(b.dataset.sheet){state.sheet=true;draw();return}if(b.dataset.closeOverlay){state.sheet=false;draw();return}if(b.dataset.add){state.add=!state.add;draw();return}if(b.dataset.addChoice){state.add=false;if(b.dataset.addChoice==='flight'){state.current=0;state.page='editor';draw()}else{draw();toast('Tính năng chưa tích hợp backend — không có nút giả trong bản production')}return}if(b.dataset.monthpicker){state.month=state.month==='all'?'2026-10':state.month==='2026-10'?'2026-09':'all';draw();return}if(b.dataset.toggle){if(b.dataset.toggle==='incomplete')state.filter.incomplete=!state.filter.incomplete;else state.multi=!state.multi;draw();return}if(b.dataset.count){let k=b.dataset.count;state.counts[k]=Math.max(0,Math.min(20,state.counts[k]+Number(b.dataset.delta)));draw();return}if(b.dataset.clear){state.filter={period:'all',aircraft:'all',function:'all',airport:'all',incomplete:false};draw();return}if(b.dataset.apply){state.page='logbook';state.month='all';draw();return}if(b.dataset.demoSave!==undefined){state.changed=false;toast('Đã lưu bản xem trước trong bộ nhớ — không chạm dữ liệu thật');return}if(b.dataset.next){state.current=(state.current+Number(b.dataset.next)+data.length)%data.length;draw();return}if(b.dataset.share){toast('Share chỉ là giao diện demo');return}if(b.dataset.info){state.sheet=false;if(b.dataset.info==='Ôn thi ATPL'){state.page='study';draw();return}draw();toast(`${b.dataset.info}: giao diện demo`);return}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){state.sheet=false;state.add=false;draw()}if(e.key==='Enter'&&e.target.dataset.open){state.current=Number(e.target.dataset.open);state.page='editor';draw()}});draw();
</script></body></html>
