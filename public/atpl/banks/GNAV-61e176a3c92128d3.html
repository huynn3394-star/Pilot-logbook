ing","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":266,"uid":"GNAV-01-266","sourceNumber":266,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the Wind Correction Angle (WCA). Track: 135°(T); Crosswind component: 21 kt from left to right; TAS: 120 kt","options":{"A":"+10.5°","B":"- 10.5°","C":"-6°","D":"+6°"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gió trái sang phải 21 kt nên heading phải sửa trái track. WCA=−asin(21/120)=−10,08°; key−10,5° dùng xấp xỉ, cùng đúng dấu trái.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":267,"uid":"GNAV-01-267","sourceNumber":267,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"During an approach the Flight Management Display indicates the following values: Hdg = 270°T; GS = 220 kt; W/V = 240/20 kt; What is the value of the Cross Wind Component and Track in this situation?","options":{"A":"10 kt from the left and 267°","B":"11 kt from the right and 273°","C":"11 kt from the left and 273°","D":"11 kt from the right and 267°"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gió 240°/20 kt ở trái heading 270°, crosswind≈20 sin 30°=10 kt, đẩy sang phải. Với GS 220 kt, drift≈asin(10/220)=2,6°, track≈273°; key 11 kt là xấp xỉ.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":268,"uid":"GNAV-01-268","sourceNumber":268,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is departing from an airport which has an elevation of 2000 ft. The QNH is 1013 hPa. 10 NM away there is a waypoint the aircraft is required to pass at an altitude of 7500 ft. Given a groundspeed of 100 kt, what is the minimum rate of climb?","options":{"A":"1080 ft/min","B":"590 ft/min","C":"750 ft / min","D":"920 ft/min"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Δh=7.500−2.000=5.500 ft; time=10/100 × 60=6 min. ROC=5.500/6=916,7 ft/min, chọn 920 ft/min.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":269,"uid":"GNAV-01-269","sourceNumber":269,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Magnetic Track = 210°, Magnetic HDG = 215°, VAR = 15°E, TAS = 360 kt, Aircraft flies 64 NM in 12 MIN. Calculate the true W/V?","options":{"A":"195°/50 kt","B":"235°/50 kt","C":"300°/30 kt","D":"265° /50 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 360 kt/230°, GS 320.0 kt/225°. Hiệu véc-tơ cho gió thổi từ 264.1°T, tốc độ 49.8 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":360,"heading":230,"track":225,"GS":320,"windFrom":264.084,"windSpeed":49.767},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":270,"uid":"GNAV-01-270","sourceNumber":270,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Consider variation and deviation are NOT zero. Which combination of heading and track is correct, given a drift of 7° to the left?","options":{"A":"CH = 200°; MT = 207°","B":"MH = 179°; MT = 186°","C":"TH = 099°,TT = 092°","D":"TH = 302°; MT = 295°"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Drift trái 7° nghĩa TT=TH−7° nếu hai dữ kiện cùng mốc True. TH 099°−7°=TT 092°; không so sánh trực tiếp heading Compass với track True.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":271,"uid":"GNAV-01-271","sourceNumber":271,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The climb gradient required is 4%. TAS for the best rate of climb is 230 kt. Given a tailwind of 15 kt, what minimum rate of climb to be achieved?","options":{"A":"935 ft/min","B":"995 ft /min","C":"875 ft/min","D":"595 ft/min"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gradient 4% nghĩa là tăng/giảm 4 ft trên 100 ft ngang. Với GS 245 kt: VS=4/100 × 245 × 6076,1/60≈992 ft/min; làm tròn theo yêu cầu tối thiểu.","status":"derived","method":"gradient-rate","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":272,"uid":"GNAV-01-272","sourceNumber":272,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The angle between the plane of the ecliptic and the plane of the equator is approximately.?","options":{"A":"23.5°.","B":"25.3°.","C":"27.5°.","D":"66.5°."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Trục quay Trái Đất nghiêng khoảng 23,5° so với pháp tuyến của mặt phẳng quỹ đạo, tương đương góc giữa mặt phẳng xích đạo và hoàng đạo. Hai bán cầu nhận bức xạ và độ dài ngày trái mùa; tháng 7 là mùa hè Bắc bán cầu, tháng 1 là mùa hè Nam bán cầu.","status":"derived","method":"authored","references":["USNO-SEASONS"],"referenceRecords":[{"title":"US Naval Observatory · Earth's Seasons","url":"https://aa.usno.navy.mil/faq/rs_solstices","section":"Equinoxes and solstices","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":273,"uid":"GNAV-01-273","sourceNumber":273,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is flying under VFR by DR along a track of 312° (T), heading 310° (M) to account for the wind, and the variation of 2°W. On the first part of the leg, the pilot sees several gliders and turns to the left off the intended track to avoid them.After clearing the gliders the pilot spots a railway bridge and is able to fix the position of the aircraft. Given the following information, what is the best magnetic heading to fly for the next check feature? Fix position: 15 NM from the start of the leg and 2 NM off track; Distance to the next check feature: 18 NM","options":{"A":"325° (M)","B":"319° (M)","C":"317° (M)","D":"321° ( M)"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Heading planned 310°M=308°T so với track 312°T đã bù gió 4°trái. Từ fix lệch 2 NM, còn 18 NM, closing angle≈60 × 2/18=6,7°phải. Sửa thêm về phải:310+≈11→321°M.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Nếu coi đây chỉ là lệch do tránh glider rồi quay lại heading planned, chỉ cần closing angle≈7°. Key 321°M giả định thêm track error từ 15 NM đã đi.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":274,"uid":"GNAV-01-274","sourceNumber":274,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the earth distance of one degree of longitude at latitude 60° South?","options":{"A":"30 NM","B":"90 NM","C":"60 NM","D":"52 NM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"1°kinh độ tại 60°S=60 cos 60°=30 NM. Theo cùng kinh tuyến 1°vĩ độ vẫn khoảng 60 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":275,"uid":"GNAV-01-275","sourceNumber":275,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Complete the following statement regarding magnetic variation. The charted values of magnetic variation on Earth normally change annually due to","options":{"A":"magnetic pole movement causing numerical values at all locations to increase.","B":"an increasing field strength causing numerical values at all locations to increase.","C":"magnetic pole movement causing numerical values at all locations to increase or decrease","D":"a reducing field strength causing numerical values at all locations to decrease"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Từ trường Trái Đất biến đổi chậm theo thời gian do chuyển động vật chất dẫn điện trong lõi. Vì vậy isogonic lines và variation có năm chuẩn cùng mức thay đổi; phải dùng bản đồ còn hiệu lực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":276,"uid":"GNAV-01-276","sourceNumber":276,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft flies over a small lake which is located some degrees to the left of the planned track. Given the following values, and using the 1-in-60 rule, what is the drift angle of this aircraft (rounded to the nearest whole degree)? TAS: 100 kt; Tailwind component: 15 kt; Flight time from previous waypoint: 11 min; Off-track distance between the lake and the track: 2.4 NM","options":{"A":"7°","B":"5°","C":"9°","D":"11°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"GS≈100+15=115 kt; distance=115 × 11/60=21,08 NM. Track error≈60 × 2,4/21,08=6,83°≈7°; hướng trái theo vị trí lake.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":277,"uid":"GNAV-01-277","sourceNumber":277,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Course: 040°(T) TAS: 120 kt Wind speed: 30 kt. Maximum drift angle will be obtained for a wind direction of.?","options":{"A":"130°","B":"115°","C":"145°","D":"120°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Với course 040° và TAS cố định, crosswind lớn nhất khi gió vuông góc track:040+90=130° hoặc 310°. Trong các lựa chọn,130° là góc vuông.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Đây là maximum WCA đối với track đã ấn định; maximum drift đối với heading cố định là bài toán khác.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":278,"uid":"GNAV-01-278","sourceNumber":278,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 135 kt, HDG (T) = 278°, W/V = 140/20kt. Calculate the Track (°T) and GS?","options":{"A":"275-150 kt","B":"283- 150 kt","C":"272-121 kt","D":"279-152 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 140° thành véc-tơ thổi tới 320°. Cộng véc-tơ TAS 135 kt theo heading 278° với gió 20 kt: track=283.1°T, GS=150.5 kt; drift=5.1° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":135,"heading":278,"windFrom":140,"windSpeed":20,"track":283.103,"GS":150.459,"driftRight":5.103},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":279,"uid":"GNAV-01-279","sourceNumber":279,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 140 kt, HDG (T) = 005, W/V = 265/25kt. Calculate the drift and GS?","options":{"A":"9R - 140 kt","B":"10R -146 kt","C":"11R - 142 kt","D":"11R - 140 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 265° thành véc-tơ thổi tới 085°. Cộng véc-tơ TAS 140 kt theo heading 005° với gió 25 kt: track=14.7°T, GS=146.4 kt; drift=9.7° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":140,"heading":5,"windFrom":265,"windSpeed":25,"track":14.68,"GS":146.426,"driftRight":9.68},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":280,"uid":"GNAV-01-280","sourceNumber":280,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the longitude of a position 6 NM due east of 58°42'N, 094°00'W?","options":{"A":"094°12.0'W","B":"093°54.0'W","C":"093°53.1'W","D":"093°48.5'W"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Departure 6 NMở 58°42′N: Δλ′=6/cos 58,7°≈11,55′. Đi đông từ 094°00′W giảm kinh độ tây, tới 093°48,5′W.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":281,"uid":"GNAV-01-281","sourceNumber":281,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what is the compass heading? True track: 348° Drift: 17° left Variation: 32° W Deviation: 4° E","options":{"A":"033°","B":"337°","C":"359°","D":"007°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Drift trái 17°: TH=TT+17=365°→005°T. VAR 32°W: MH 037°; deviation 4°E: CH 033°. Chuẩn hóa 360° sau cùng.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":282,"uid":"GNAV-01-282","sourceNumber":282,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft follows a radial to a VOR/DME station. At 10:00 the DME reads 120 NM. At 10:03 the DME reads 105 NM. The estimated time overhead the VOR/DME station is","options":{"A":"10:24","B":"10:27","C":"10:21","D":"10:18"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"DME giảm 15 NM trong 3 min→GS 300 kt=5 NM/min. Từ 10:03 còn 105 NM mất 21 min→10:24. Giả định DME≈ground range và tốc độ không đổi.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":283,"uid":"GNAV-01-283","sourceNumber":283,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 205 kt, HDG (T) = 180°, W/V = 240/25kt. Calculate the drift and GS?","options":{"A":"6L -194 kt","B":"4L - 195 kt","C":"3L - 190 kt","D":"6R - 192 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 240° thành véc-tơ thổi tới 060°. Cộng véc-tơ TAS 205 kt theo heading 180° với gió 25 kt: track=173.6°T, GS=193.7 kt; drift=6.4° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":205,"heading":180,"windFrom":240,"windSpeed":25,"track":173.583,"GS":193.714,"driftRight":-6.417},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":284,"uid":"GNAV-01-284","sourceNumber":284,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the effective headwind component: Runway direction 083°(M) Surface W/V 035°(M)/35 kt","options":{"A":"24 kt","B":"31 kt","C":"34 kt","D":"27 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Góc gió=83−35=48°. HWC=35 cos 48°=23,42 kt, phương án 24 kt là làm tròn/đọc flight computer.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":285,"uid":"GNAV-01-285","sourceNumber":285,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The great circle distance between position A (59°34.1'N 008°08.4'E) and B (30°25.9'N 171°51.6'W) is:","options":{"A":"2 700 NM","B":"10 800 km","C":"5 400 NM","D":"10 800 NM"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Kinh độ hai điểm chênh 180°, vĩ độ cộng đúng 90°. GC qua cực có cung(90−59°34,1′)+(90−30°25,9′)=90°, distance 90 × 60=5.400 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":286,"uid":"GNAV-01-286","sourceNumber":286,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The angle between True North and Magnetic North is called....?","options":{"A":"deviation.","B":"drift.","C":"compass error.","D":"variation."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Variation là góc giữa True North và Magnetic North. Quy ước đông dương: True=Magnetic+Variation; độ lệch kim do máy bay là deviation.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":287,"uid":"GNAV-01-287","sourceNumber":287,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A negative (westerly) magnetic variation signifies that....?","options":{"A":"Compass North is east of Magnetic North.","B":"Compass North is west of Magnetic North.","C":"True North is west of Magnetic North.","D":"True North is East of Magnetic North."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Variation tây nghĩa Magnetic Nor thở tây True North, hay True Nor thở đông Magnetic North. Vì vậy T=M−|VARW| vàM=T+|VARW|.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":288,"uid":"GNAV-01-288","sourceNumber":288,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The distance along a Meridian between 63°55'N and 13°47'S is:","options":{"A":"7702 NM","B":"5008 NM","C":"3008 NM","D":"4662 NM"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Hai điểm khác bán cầu: Δφ=63°55′+13°47′=77°42′=4.662 phút. Dọc kinh tuyến≈4.662 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":289,"uid":"GNAV-01-289","sourceNumber":289,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"If an aircraft flies a great circle track from 56°N, 070°W to 62°N, 110°E, the total distance travelled is....?","options":{"A":"2040 NM.","B":"5420 NM.","C":"1788 NM.","D":"3720 NM."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Δλ=180° nên GC qua Bắc cực: arc=(90−56)+(90−62)=62°. Distance=62 × 60=3.720 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":290,"uid":"GNAV-01-290","sourceNumber":290,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The flight log gives the following data True track, Drift, True heading, Magnetic variation, Magnetic heading, Compass deviation, Compass heading. The right solution, in the same order, is:","options":{"A":"117°; 4°L; 121°; 1°E; 122°; -3°; 119°","B":"119°;3°L;122°; 2°E; 120°; +4°; 116°","C":"115°; 5°R; 120°; 3°W; 123°; +2°; 121°","D":"125°; 2°R; 123°; 2°W; 121°; -4°; 117°."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"TT 119°, drift trái 3°→TH 122°. Variation 2°E: MH 120°. Deviation+4°E: CH 116°. Kiểm tra ngược 116+4+2−3=119° để tránh nhầm dấu.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":291,"uid":"GNAV-01-291","sourceNumber":291,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A nautical mile is:","options":{"A":"1609 metres","B":"1012 metres","C":"1500metres","D":"1852 metres"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Một nautical mile quốc tế được định nghĩa chính xác bằng 1.852 m. Khi đổi sang km nhân 1,852; khi đổi từ km sang NM chia 1,852.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":292,"uid":"GNAV-01-292","sourceNumber":292,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Compass deviation is defined as the angle between.?","options":{"A":"Magnetic North and Compass North","B":"True North and Compass North.","C":"the horizontal and the total intensity of the Earth's magnetic field.","D":"True North and Magnetic North."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Deviation là góc giữa Magnetic North và Compass North do từ trường máy bay, thiết bị và ảnh hưởng cảm ứng. Nó thay đổi theo heading; đọc bảng compass swing cho đúng hướng đang bay.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":293,"uid":"GNAV-01-293","sourceNumber":293,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The lines on the Earth's surface that join points of equal magnetic variation are called...","options":{"A":"isogonal","B":"isotachs.","C":"isogrivs.","D":"isoclines."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Isogonals nối các điểm có cùng variation tại cùng thời điểm chuẩn. Ag on ic line là đường variation bằng 0; isoclinic lines là cùng góc dip.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":294,"uid":"GNAV-01-294","sourceNumber":294,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Calculate the W/V if: True heading: 310°TAS: 200 kt GS: 176 kt Drift angle: 7° right.","options":{"A":"360° (T)/33 kt","B":"180° (T)/33 kt","C":"090° (T)/33 kt","D":"270° (T) /33 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 200 kt/310°, GS 176.0 kt/317°. Hiệu véc-tơ cho gió thổi từ 269.7°T, tốc độ 33.2 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":200,"heading":310,"track":317,"GS":176,"windFrom":269.722,"windSpeed":33.178},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":295,"uid":"GNAV-01-295","sourceNumber":295,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"For take-off an aircraft requires a headwind component of at least 10 kt and has a cross wind limitation of 35 kt. If the angle between the wind direction and the runway is 60°, what are the minimum and maximum allowable wind speeds?","options":{"A":"15 kt and 43 kt","B":"18 kt and 50 kt","C":"20 kt and 40 kt","D":"12 kt and 38 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"HWC=W cos 60°≥10 nên W min=20 kt. XWC=Ws in 60°≤35 nên W max=35/sin 60°=40,41 kt≈40 kt. Kiểm tra đồng thời cả hai dải, không lấy gió cực đại 35 kt trực tiếp.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":296,"uid":"GNAV-01-296","sourceNumber":296,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the headwind/tailwind component (HWC/TWC) and the crosswind component (XWC). Aircraft lined-up on runway 26, ATIS W/V: 285°/24 kt, Variation: 15° W.","options":{"A":"HWC: 4 kt, XWC: 22 kt","B":"HWC: 24 kt, XWC: 4 kt","C":"HWC: 22 kt; XWC: 10 kt","D":"HWC: 18 kt, XWC: 15 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"ATIS 285°M và runway 26≈260°M theo giả định đề: Δ 25°. HWC=24 cos 25°=21,75 kt≈22; XWC=24 sin 25°=10,14 kt≈10. Không đổi thêm VAR 15°W khi hai đã magnetic.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":297,"uid":"GNAV-01-297","sourceNumber":297,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the CAS of the aircraft. Altitude: FL 100; OAT: +15° C; TAS: 215 kt","options":{"A":"188 kt","B":"184 kt","C":"260 kt","D":"178 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại FL 100/OAT 15°C, đổi ngược TAS 215 kt về CAS qua Mach và áp suất ISA cho≈178 kt. TAS lớn hơn CAS vì mật độ giảm; không áp quy tắc 2%/1.000 ft quá thô khi đáp án khí t.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":298,"uid":"GNAV-01-298","sourceNumber":298,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The following information is for an aircraft in the cruise at 11:50 UTC. What will be the ground speed? Cruise level: FL80; Track Direction: 343° (T); OAT: ISA +10° C; CAS: 145 kt; W/V: 163* (T)/15 kt.","options":{"A":"166 kt","B":"151 kt","C":"194 kt","D":"181 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"FL 80 ISA+10°C: CAS 145 kt→TAS≈166 kt. Gió 163° đối diện track 343°nên tailwind 15 kt; GS≈166+15=181 kt. Thời gian 11:50 không cần cho GS.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":299,"uid":"GNAV-01-299","sourceNumber":299,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Complete the following statement regarding magnetic variation. The charted values of magnetic variation on Earth normally change annually due to","options":{"A":"magnetic pole movement causing numerical values at all locations to increase or decrease.","B":"magnetic pole movement causing numerical values at all locations to increases.","C":"a reducing field strength causing numerical values at all locations to decreases","D":"an increasing field strength causing numerical values at all locations to increases."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Từ trường Trái Đất biến đổi chậm theo thời gian do chuyển động vật chất dẫn điện trong lõi. Vì vậy isogonic lines và variation có năm chuẩn cùng mức thay đổi; phải dùng bản đồ còn hiệu lực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":300,"uid":"GNAV-01-300","sourceNumber":300,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Runway direction 230°(T), Surface W/V 280°(T)/40 kt. Calculate the effective cross- wind component?","options":{"A":"36 kt","B":"31 kt","C":"21 kt","D":"26 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Góc gió 280−230=50°. XWC=40 sin 50°=30,64 kt≈31 kt; gió thổi từ phải track.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":301,"uid":"GNAV-01-301","sourceNumber":301,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Route 'A' (44°N, 026°E) to 'B' (46°N, 024°E) forms an angle of 35° with longitude 026°E. Variation at A is 3°E. What is the initial magnetic track from A to B?","options":{"A":"322°","B":"032°","C":"038°","D":"328°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"A→B có hướng tây bắc, tạo 35°với kinh tuyến bắc: TT 325°. MT=325−VAR 3°E=322°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":302,"uid":"GNAV-01-302","sourceNumber":302,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A pilot flies from Aerodrome A to Aerodrome B. The return flight to Aerodrome A is scheduled after a quick turn-around. Assume the same wind conditions for both flights. Calculate the GS for the return flight with the following flight data: Average TAS from Aerodrome A to Aerodrome B: 135 kt, HWC from Aerodrome A to Aerodrome B: 25 kt. Average TAS for the return flight: 145 kt.","options":{"A":"160 kt","B":"110 kt","C":"170 kt","D":"120 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gió ngược chặng đi 25 kt thành gió xuôi chặng về trên track ngược. TAS return 145+TWC 25=GS 170 kt; không dùng TAS 135 của chặng đi.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":303,"uid":"GNAV-01-303","sourceNumber":303,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: A (56°N, 145°E) B (57°N, 165°W) What is the difference in longitude between A and B?","options":{"A":"020°","B":"050°","C":"001°","D":"130°"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Qua 180°, Δλ ngắn=360−145−165=50°. Không lấy 310°là cung ngắn giữa hai điểm.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":304,"uid":"GNAV-01-304","sourceNumber":304,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The airport chart for Halifax, Nova Scotia, Canada shows the variation is 18°W. The final approach track for the ILS to runway 23 is given as 233°. The drift on final approach is 6° right. What is the true direction of the final approach track?","options":{"A":"215°( T)","B":"209°(T)","C":"257°(T)","D":"251°(T)"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Final approach track 233°trên chart là magnetic; True=233+VAR−18=215°T. Drift 6°chỉ đổi heading, không đổi track đã công bố.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":305,"uid":"GNAV-01-305","sourceNumber":305,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Magnetic Track = 315°, HDG = 301 °(M), VAR = 5°W, TAS = 225 kt, The aircraft flies 50 NM in 12 MIN. Calculate the W/V(°T)?","options":{"A":"355°/15 kt","B":"190°/ 63 kt","C":"195°/63 kt","D":"195°/61 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 225 kt/296°, GS 250.0 kt/310°. Hiệu véc-tơ cho gió thổi từ 189.8°T, tốc độ 63.0 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":225,"heading":296,"track":310,"GS":250,"windFrom":189.798,"windSpeed":62.982},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":306,"uid":"GNAV-01-306","sourceNumber":306,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft departs point A at 12:05 with a groundspeed of 140 kt and an ETA at point B of 13:20. At 12:35, the pilot notices a deviation of 7 NM left of the intended track. To fly direct to point B from this point, using the 1-in-60 rule, the pilot must alter the track.?","options":{"A":"10° to the right","B":"13° to the right","C":"12° to the right.","D":"6° to the right."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại 12:35 đã bay 30 min× 140 kt=70 NM. Cross-track 7 NM→track error 6°. Còn 45 min× 140 kt=105 NM→closing angle 4°. Tổng sửa track 6+4=10°phải.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":307,"uid":"GNAV-01-307","sourceNumber":307,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: A descending aircraft flies in a straight line to a DME. DME 55.0 NM, altitude 33000 ft DME 43.9 NM, altitude 30500 ft M = 0.72, GS = 525 kt, OAT = ISA The descent gradient is:","options":{"A":"3.7%","B":"3.5%","C":"3.9%","D":"4.1%"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Altitude change=33.000−30.500=2.500 ft; ΔDME=55−43,9=11,1 NM. Gradient≈100 × 2.500/(11,1 × 6.076,1)=3,71%. Mach và GS không cần; kết quả dùng DME chênh≈ground distance.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":308,"uid":"GNAV-01-308","sourceNumber":308,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A flight is to be made from A 49°S, 180°E/W to B 58°S, 180°E/W. The distance in kilometres from A to B is approximately....?","options":{"A":"804.","B":"1222.","C":"540.","D":"1000."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cùng kinh tuyến 180°, Δφ=58−49=9°. Distance=9 × 60=540 NM;540 × 1,852=1.000,08 km≈1.000 km.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":309,"uid":"GNAV-02-001","sourceNumber":1,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following are problems associated with VFR navigation (without GPS) over low-lying desert late in the morning at about 11 AM? 1. Good navigation features might be widely separated. -2. Visual range is likely to be restricted. -3. Maps might be incomplete or out-of-date.- 4. Visibility into the Sun might be difficult due to glare.","options":{"A":"1 and 3 only","B":"2 and 3 only","C":"1 and 2 only","D":"1,2, and 4 only"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Sa mạc có ít điểm nổi bật, hơi nóng/bụi làm hạn chế tầm nhìn, và nhìn về phía Mặt Trời có thể bị lóa. Bản đồ cũ là vấn đề chung nhưng không tự suy ra chỉ vì bay trên sa mạc; do đó chọn tổ hợp 1,2,4.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":310,"uid":"GNAV-02-002","sourceNumber":2,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"When flying a day VFR flight at low level, using checkpoints on a 1:500 000 map, the most suitable features are...?","options":{"A":"very large ones, such as an extensive wooded area.","B":"minor roads in a bulit up area.","C":"ones that are tall and prominent,such as towers.","D":"small ones, such a individual houses distributed over an area of farmland."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Chọn địa vật nổi bật, tương phản, có hình dạng hoặc giao điểm đặc trưng và khớp bản đồ: đồi cô lập, tháp/ống khói, hồ lớn, nhà máy cạnh s ô ng. Tránh lấy nhiều căn nhà hoặc đường phố giống nhau làm fix; tháp dễ nhận dạng nhưng vẫn là chướng ngại cần giữ khoảng cách.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":311,"uid":"GNAV-02-003","sourceNumber":3,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft is making a VFR cross-country flight at low level. The flight involves at least four visual checkpoints on the route. Which option indicates the most suitable types of checkpoint?","options":{"A":"Fly as low as possible and select aerodromes that are active for parachuting and gliding.","B":"If flying over a wet, lowland area, choose small lakes rather than large ones.","C":"Look for distinctive features such as a railway line to lead into a checkpoint.","D":"Choose large, built-up areas that can be seen easily from low level."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Đường sắt hoặc tuyến s ô ng đặc trưng có thể dẫn mắt tới checkpoint. Fix tốt phải xác định vị trí cụ thể, không chỉ một vùng đô thị lớn khó biết đang ở góc nào.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":312,"uid":"GNAV-02-004","sourceNumber":4,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"With regards to visual navigation, you are flying over land that is covered in snow with no visual features. You should..?","options":{"A":"turn around 180 and return the way you came.","B":"turn at the time expected overhead the next waypoint.","C":"start flying larger concentric circles.","D":"climb and commence the lost procedure."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Khi địa hình tuyết không có landmark nhận dạng, tiếp tục DR và rẽ tại ETA đã tính thay vì đoán một fix không tồn tại. Sau đó dùng landmark hoặc navaid thích hợp để xác nhận lại vị trí; điều này giả định vẫn duy trì được VMC/an toàn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":313,"uid":"GNAV-02-005","sourceNumber":5,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Your on an airfield elevation 2000ft, QNH 1003. You want to climb to FL50, your rate of climb is 1000ft/min, your TAS is 100 and you have a headwind of 20. What is the distance it takes to get to FL50?","options":{"A":"4.0 NM","B":"4.8 NM","C":"3.6 NM","D":"4.4 NM"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"PA sân bay≈2.000+(1.013−1.003)× 30=2.300 ft. Height gain tớiFL 50=2.700 ft; leo 1.000 ft/min mất 2,7 min. GS 100−20=80 kt, distance 80 × 2,7/60=3,6 NM.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":314,"uid":"GNAV-02-006","sourceNumber":6,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Isogonals are lines of equal.?","options":{"A":"magnetic variation.","B":"compass deviation.","C":"pressure.","D":"wind velocity."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Isogonals nối các điểm có cùng variation. Không nhầm đường cùng từ khuynh với isoclinic hoặc đường zero variation với ag on ic line.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":315,"uid":"GNAV-02-007","sourceNumber":7,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Given the following information, what is the maximum allowable wind speed that can be accepted without exceeding the tailwind limit? Maximum allowable tailwind component for landing: 10 kt Planned runway: 05 (047° (M)) Surface wind direction reported by ATIS: 210° VAR: 17°E","options":{"A":"8 kt","B":"10 kt","C":"15 kt","D":"18 kt"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Nếu ATIS 210° là magnetic như giả định key, góc so runway 047° là 163°. Tailwind fraction=|cos 163°|≈0,956; W max≈10/0,956=10,46 kt, gần 10 kt. Nếu gió được báo True, phải đổi theo VAR 17°E trước; cần xác nhận quy ước nguồn.","status":"limited","method":"authored","references":["FAA-NAV"],"noteVi":"Đề không ghi rõ mốc True/Magnetic của ATIS; key dùng gió magnetic.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":316,"uid":"GNAV-02-008","sourceNumber":8,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is planning for a VFR cross-country flight, using visual checkpoints. Which of the following would be the most suitable checkpoint?","options":{"A":"A small lake in a mountainous regions.","B":"A feature that contrasts with its natural surrounding","C":"A valley in an area of low hills.","D":"A feature that merges into its natural surroundings."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Chọn địa vật nổi bật, tương phản, có hình dạng hoặc giao điểm đặc trưng và khớp bản đồ: đồi cô lập, tháp/ống khói, hồ lớn, nhà máy cạnh s ô ng. Tránh lấy nhiều căn nhà hoặc đường phố giống nhau làm fix; tháp dễ nhận dạng nhưng vẫn là chướng ngại cần giữ khoảng cách.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":317,"uid":"GNAV-02-009","sourceNumber":9,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is planning to fly a VFR day flight over hilly terrain. Which option gives the best advice for selecting checkpoints?","options":{"A":"A range of hills of uniform size, with NO additional features, is the best terrain to maintain good visual checkpoints.","B":"Small rivers will be easy to spot in hilly terrains.","C":"Isolated and prominent hills provide a good opportunity for check feature","D":"The interpretation of topography from the map is easier than the interpretation of water features."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Chọn địa vật nổi bật, tương phản, có hình dạng hoặc giao điểm đặc trưng và khớp bản đồ: đồi cô lập, tháp/ống khói, hồ lớn, nhà máy cạnh s ô ng. Tránh lấy nhiều căn nhà hoặc đường phố giống nhau làm fix; tháp dễ nhận dạng nhưng vẫn là chướng ngại cần giữ khoảng cách.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":318,"uid":"GNAV-02-010","sourceNumber":10,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"When wanting to check flight progress by observation of a single visual position line (e.g. a canal) the latter must be","options":{"A":"more or less parallel to the track.","B":"oblique to the track.","C":"curved across the track.","D":"more or less perpendicular to the track"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Địa vật dạng tuyến cắt gần vuông góc track cho thời điểm qua rất rõ, phù hợp kiểm tra dọc tuyến và GS=distance/time. Tuyến song song track hữu ích phát hiện lệch ngang, nhưng không chỉ ra chính xác đã đi được bao xa.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":319,"uid":"GNAV-02-011","sourceNumber":11,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The evaluation of the differences between DR (dead reckoned) positions and actual positions (fixes) can refine flight performance and navigation. Which of the following factors affect the accuracy of a DR position? 1. The accuracy of the last positive fix; 2. The accuracy with which heading has been maintained; 3. The accuracy with which air speed has been maintained; 4. The accuracy of our estimate of the wind affecting the aircraft; NOTE: This is an example question designed to reflect a particular 2018 LO and has not been reported as having been seen in this form in an exam.","options":{"A":"1,2,3 and 4","B":"1, 2 and 3","C":"2 and 3","D":"3 and 4"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"DR xuất phát từ last positive fix, rồi tích lũy véc-tơ bay theo heading, TAS, gió và thời gian. Sai số của cả bốn yếu tố được liệt kê đều ảnh hưởng vị trí; không chọn riêng sai số gió.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":320,"uid":"GNAV-02-012","sourceNumber":12,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot planning a VFR flight leg is looking for a ground feature part way along a leg that is NOT in a built-up area. All of the following are marked on the VFR chart in suitable locations for a visual fix. Which might allow the pilot to fix the position of the aircraft? 1. Dual-carriageway (four-lane) road crossing the intended track.; 2. Dual-carriageway (four-lane) road crossing a river close to the intended track.; 3. Disused railway crossing a river on the intended track.; 4. Single-carriageway (two-lane) road crossing a railway close to the intended track.","options":{"A":"1, 3, and 4 only","B":"1, 2, and 4 only","C":"2,3, and 4 only","D":"1, 2, and 3 only"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Một con đường đơn lẻ chỉ cho position line. Giao đường–s ô ng, đường sắt–s ô ng hoặc hai tuyến khác nhau cho một vị trí giao cụ thể: tổ hợp 2,3,4. Phải nhận đúng loại tuyến và đặc điểm quanh giao điểm.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":321,"uid":"GNAV-02-013","sourceNumber":13,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Calculate the constant of the cone of a Lambert chart that has the parallel of origin at 30°N.","options":{"A":"0.3","B":"1","C":"0.866","D":"0.5"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Lambert có cone constant n=sin(latitude of origin). Với 30°N: n=sin 30°=0,5; không dùng cos 30°.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":322,"uid":"GNAV-02-014","sourceNumber":14,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A straight line on a Lambert Conformal Projection chart for normal flight planning purposes:","options":{"A":"is a Rhumb line","B":"is approximately a Great Circle","C":"can only be a parallel of latitude","D":"is a Loxodromic line"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Ở vùng khai thác quanh vĩ tuyến gốc, đường thẳng Lambert xấp xỉ GC và giữ góc địa phương. Nó không phải GC chính xác trên toàn bản đồ; chỉ kinh tuyến là trường hợp trùng chính xác.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":323,"uid":"GNAV-02-015","sourceNumber":15,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following are methods of representing relief on a map? 1. Spot elevations; 2. Lines of latitude; 3. Contour lines; 4. Different tints of colour; 5. Graduated scaling; 6. Shading","options":{"A":"1,3,4, and 6","B":"1, 2, and 5","C":"3, 4, 5, and 6","D":"2, 3, 4, and 5"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Địa hình thể hiện bằng spot elevation, contour, màu độ cao và shading:1,3,4,6. Vĩ tuyến chỉ vị trí địa lý; graduated scale dùng đo độ dài, không mô tả độ cao.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":324,"uid":"GNAV-02-016","sourceNumber":16,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is flying a VFR cross-country flight and spots a landmark at a bearing of 45° relative to the track. After 3 minutes the bearing to the landmark is 90° relative to the track. If the TAS is 90 kt and there is a tailwind of 30 kt, what is the distance to the landmark at the time of the second bearing?","options":{"A":"2 NM","B":"6 NM","C":"4.5 NM","D":"3 NM"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"TAS 90+tailwind 30=GS 120 kt. Trong 3 phút đi 6 NM. Bearing từ 45° tới 90° tạo tam giác vuông cân nên khoảng ngang tới landmark ở lần thứ hai cũng 6 NM.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":325,"uid":"GNAV-02-017","sourceNumber":17,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft tracks radial 200 inbound to a VOR station with a Magnetic Heading (MH) of 010°. After being overhead the VOR station the aircraft tracks radial 090 outbound with a MH of 080°. The TAS is 240 kt and the magnetic variation in the area is 5°W. What is the wind vector (T)?","options":{"A":"320°/ 50 kt","B":"300°/50 kt","C":"310°/60 kt","D":"330°/50 kt"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Inbound radial 200° có track 020°M và heading 010°M; outbound track 090°M, heading 080°M. Cùng drift 10°phải và TAS 240 kt xác định gió magnetic khoảng 325°/50 kt; đổi VAR 5°W cho gió True≈320°/50 kt.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":326,"uid":"GNAV-02-018","sourceNumber":18,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The distance in NM between point K (32°48'N, 078°12'E) and point L (32°48'N, 034°21'E) is...?","options":{"A":"5676 NM.","B":"2631 NM","C":"2212 NM.","D":"6753 NM."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Δλ=78°12′−34°21′=43°51′. Nếu đi dọc vĩ tuyến 32°48′N: distance=43,85 × 60 cos 32,8°≈2.212 NM.","status":"limited","method":"authored","references":["FAA-NAV"],"noteVi":"Key dùng rhumb line dọc vĩ tuyến; đề không ghi rõ loại distance, GC sẽ ngắn hơn.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":327,"uid":"GNAV-02-019","sourceNumber":19,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Given: TAS = 470 kt, True HDG = 317°, W/V = 045°(T)/45kt. Calculate the drift angle and GS?","options":{"A":"5°R - 475 kt","B":"5°L - 475 kt","C":"3°R - 470 kt","D":"5°L -470 kt"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Đổi gió khí tượng từ 045° thành véc-tơ thổi tới 225°. Cộng véc-tơ TAS 470 kt theo heading 317° với gió 45 kt: track=311.5°T, GS=470.6 kt; drift=5.5° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":470,"heading":317,"windFrom":45,"windSpeed":45,"track":311.516,"GS":470.583,"driftRight":-5.484},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":328,"uid":"GNAV-02-020","sourceNumber":20,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Given: TAS = 190 kt, HDG (T) = 355°, W/V = 165/25kt. Calculate the drift and GS?","options":{"A":"1L - 225 kt","B":"1R - 175 kt","C":"1L -215 kt","D":"1R - 165 kt"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Đổi gió khí tượng từ 165° thành véc-tơ thổi tới 345°. Cộng véc-tơ TAS 190 kt theo heading 355° với gió 25 kt: track=353.8°T, GS=214.7 kt; drift=1.2° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":190,"heading":355,"windFrom":165,"windSpeed":25,"track":353.841,"GS":214.664,"driftRight":-1.159},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":329,"uid":"GNAV-02-021","sourceNumber":21,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Direct Mercator chart, meridians are..?","options":{"A":"inclined, equally spaced, straight lines that meet at the nearer pole.","B":"parallel,equally spaced, vertical straight lines.","C":"parallel, unequally spaced, vertical straight lines.","D":"inclined, unequally spaced, curved lines that meet at the nearer pole."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên Direct Mercator, các kinh tuyến là những đường thẳng song song, cách đều nhau. Trục ngang biểu diễn kinh độ tuyến tính; chart convergence bằng 0.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":330,"uid":"GNAV-02-022","sourceNumber":22,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"How is layer tinting used to define elevation on a chart?","options":{"A":"Different color’s indicate ranges of elevation,between defined limits","B":"Different colours indicate the change from land to water features","C":"Different colours indicate points of equal elevation","D":"Different colours indicate specific steepness of elevation"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Layer tinting dùng các dải màu cho từng khoảng độ cao được định nghĩa trong legend. Không suy độ cao tuyệt đối chỉ từ một màu nếu chưa xem thang màu của chart.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":331,"uid":"GNAV-02-023","sourceNumber":23,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Direct Mercator chart, a humbline appears as a","options":{"A":"Curve convex to the nearer pole","B":"Small circle concave to the nearer pole","C":"Straight- line","D":"Spiral curve"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Mercator làm mọi rhumb line thành đường thẳng vì giữ góc với các kinh tuyến song song. GC thường là đường cong, ngoại trừ kinh tuyến và Xích đạo.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":332,"uid":"GNAV-02-024","sourceNumber":24,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which option describes the greatest potential threat for VFR navigation at night?","options":{"A":"When external lighting provides good visual cues, flying by cross-reference to instruments may cause spatial disorientation.","B":"It is difficult to determine the flight direction of other aircraft unless their landing lights are on.","C":"Exposure to red light can cause the eyes to lose dark adaptation and may cause temporary blindness.","D":"The aircraft height during an approach can be easily misjudged due to insufficient external visual cues"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Ban đêm thiếu cue địa hình, kết cấu bề mặt và chân trời nên dễ ước lượng sai độ cao trong tiếp cận. Trời quang không loại bỏ black-hole illusion hoặc đánh giá sai khoảng cách.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":333,"uid":"GNAV-02-025","sourceNumber":25,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"You are on a VFR cross-country navigation exercise and have turned overhead what you thought was your turning point, 10 minutes later nothing you see matches up with the line you have drawn on your map, You are unsure of your position, Which of the following options would you consider as your first actions? NOTE: This is an example question and has not been reported as having been seen in this form in an exam.","options":{"A":"Immediately turn through 180 degrees and try and find the position you turned over again","B":"Continue on your heading until the time you would expect to be at your next turning point and then turn onto the heading after that","C":"Note the time, speak to air traffic control if you can and consider tuning in a nearby VOR/ DME to ascertain your position.","D":"Fly a zigzag course left and right 30 degrees and try and find a line feature to follow"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Khi chưa chắc vị trí: ghi giờ, giữ kiểm soát máy bay và khoảng cách địa hình, thông báo/request assistance với ATC; dùng VOR/DME hoặc nguồn fix độc lập phù hợp. Không tiếp tục đoán một turning point rồi đổi hướng nhiều lần làm mất dấu DR.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":334,"uid":"GNAV-02-026","sourceNumber":26,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft is flying a low-level VFR route over a mountainous area, which is covered by snow,in high latitudes. Concerning power lines, they may be....?","options":{"A":"easily identified, as they are always marked on maps, and can therefore be safely avoided.","B":"dangerous if they are situated along a ridge, but pose less of a risk if they are crossing a valley","C":"safely overflown due to their small vertical extent.","D":"dangerous,especially if they cross valleys,but pose less of a risk if they are situated along a ridge."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Dây điện vắt qua thung lũng khó thấy và có thể nằm trên đường bay cắt ngang. Dây theo sống núi vẫn nguy hiểm nhưng dễ được giữ dưới/ngoài khoảng cách địa hình hơn; không hiểu đáp án là cho phép bay sát dây.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":335,"uid":"GNAV-02-027","sourceNumber":27,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Contour lines on aeronautical maps and charts connect points...?","options":{"A":"having the same longitude.","B":"of equal latitude.","C":"having the same elevation.","D":"with the same variation."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Contour nối các điểm có cùng cao độ. Khoảng đường đồng mức càng sít trên cùng chart thì địa hình càng dốc; spot height chỉ cao độ tại một điểm.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"
