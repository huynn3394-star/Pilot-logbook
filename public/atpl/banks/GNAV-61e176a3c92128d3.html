025","sourceNumber":25,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Variation at an NDB is 9W. Variation at the aircraft is 11W. The True Track of the great circle to the NDB from the aircraft, at the aircraft, is 101.5. The magnetic bearing of the NDB from the aircraft is:","options":{"A":"108.5","B":"112.5","C":"110.5","D":"114.5"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Magnetic bearing NDB từ máy bay=101,5°T−VAR(−11°)=112,5°M. Dùng variation tại máy bay vì đây là bearing đo ở máy bay; không dùng 9°W tại trạm.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":474,"uid":"GNAV-04-026","sourceNumber":26,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"The constant of cone of a Lambert conformal conic chart is quoted as 0.3955. At what latitude on the chart is earth convergency correctly represented?","options":{"A":"21°35'","B":"66°42'","C":"23°18'","D":"68°25'"},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Chart convergence=nΔλ bằng Earth convergence≈Δλ sinφ khi sinφ=n=0.3955. φ=asin(0.3955)=23.2972°≈23°17.8′. Không lấy atan hoặc acos.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map P ":"On a Mercator chart, the distance between positions A and B, located on the same parallel and 10° longitude apart, is 6 cm. The scale at the parallel is 1:9 260 000.What is the latitude of A and B?","options":{"A":"45° N or S","B":"0°","C":"60° N or S","D":"30° N or S"},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"6 cm với scale 1:9.260.000 tương ứng 555,6 km=300 NM. Với Δλ 10°, cosφ=300/(10 × 60)=0,5 nên |φ|=60°.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":477,"uid":"GNAV-04-029","sourceNumber":29,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Polar Stereographic chart showing the South Pole, a straight line joins position A (70°S, 065°E) to position B (70°S, 025°W). What is the approximate true track on departure from position A?","options":{"A":"315°","B":"225°","C":"135°","D":"250°"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Cùng 70°S và Δλ 90° đi tây. Trên polar chart, initial=270−90/2=225°T; final=315°T. Đây là đường thẳng của chart, không phải bearing GC chính xác của cầu.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resour ator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":485,"uid":"GNAV-04-037","sourceNumber":37,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"How does the chart convergency change with latitude in a Lambert Conformal projection?","options":{"A":"It changes with sine of latitude.","B":"It changes with cosine of latitude.","C":"It increases with increase of latitude.","D":"It is constant and does not change with latitude"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Trên một Lambert chart đã chọn, n cố định nên góc giữa hai kinh tuyến=nΔλ và không đổi theo vĩ độ. Earth convergence mới thay đổi với sinφ; không đánh đồng hai đại lượng.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":486,"uid":"GNAV-04-038","sourceNumber":38,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Given a Lambert chart, with standard parallels at 31°N and 47°N, calculate the approximate value of the constant of the cone \"n\".","options":{"A":"0.21","B":"0.63","C":"0.78","D":"0.98"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Để xấp xỉ cone constant, lấy vĩ tuyến gốc gần trung bình hai chuẩn: (31°+47°)/2=39°. n≈sin(39°)=0.629. Đây là xấp xỉ của đề; công thức Lambert secant chính xác dùng log ar it của hai vĩ tuyến.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":487,"uid":"GNAV-04-039","sourceNumber":39,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"An aircraft is maintaining a heading of 255° M. At 1256 it is on the 360° Radial of a VOR. At 1300 it is on the 330° Radial of the same VOR. Assuming still air, its distance from the VOR at 1300 is:","options":{"A":"Cloiser than at 1256","B":"Further away than at 1256","C":"Insufficient data available to decide","D":"The same as at 1256"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Hai radial 360° và 330° tạo góc 30°. Track 255° đối xứng quanh trục radial 345° (vuông góc chord), nên tam giác giữa hai vị trí và VOR có hai cạnh range bằng nhau. Khoảng cách tới VOR ở hai lần bằng nhau nếu track giữ không đổi.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":488,"uid":"GNAV-04-040","sourceNumber":40,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Where is the parallel of origin for a Direct Mercator projection?","options":{"A":"Along any meridian.","B":"The Equator","C":"The Greenwich Meridian.","D":"Where the convergency factor is zero."},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Direct Mercator có trụ tiếp xúc tại Xích đạo trong cấu hình cơ bản, nên parallel of origin=Equator. Trong cách ghi hệ số hội tụ, n=0 là giới hạn của phép chiếu nón.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":489,"uid":"GNAV-04-041","sourceNumber":41,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"What is the convergency factor on a Direct Mercator projection?","options":{"A":"It varies as it is dependent on the latitude.","B":"The convergency factor is infinite.","C":"1","D":"0"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Kinh tuyến Direct Mercator song song nên chart convergence=0. Hệ số hội tụ bằng 0, dù Earthconvergence trên mặt đất không bằng 0 ở vĩ độ khác 0.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":490,"uid":"GNAV-04-042","sourceNumber":42,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Two locations A and B have the same latitude and are located on a meridian and its anti- meridian. On Lambert's conical projection map, the angle between these two meridians is 156°. What is the parallet of the origin of this map? Give your answer to the nearest whole degree. Only enter the number.","options":{"A":"60degree","B":"90 degrees","C":"120 degrees","D":"45 degrees"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Hai kinh tuyến đối nhau chênh 180°. Chart angle 156° nên n=156/180=0,86667; φ origin=asin(n)≈60,07°, gần 60°N hoặc S. Không lấy 156° làm vĩ độ.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/ed ctions","review":{"vi":"Mức 1% là giới hạn sai khác scale mà bộ đề gắn với yêu cầu chart đường dài giữa hai standard parallels. Đây không phải định luật bắtbuộc của mọi cấu hình Lambert; phải kiểm tra tiêu chuẩn áp dụng cho loại chart.","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Không xác nhận toàn bộ chuẩn Annex 4 hiện hành chỉ từ tính chất hình học của Lambert.","missingFigure":true,"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":true},{"id":514,"uid":"GNAV-04-066","sourceNumber":66,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Given: Direct Mercator chart with a scale of 1: 200 000 at equator; Chart length from 'A' to 'B', in the vicinity of the equator, 11 cm. What is the approximate distance from 'A' to 'B'?","options":{"A":"14 NM","B":"21 NM","C":"22 NM","D":"12 NM"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Quãng đường thật=11 cm× 200,000=22,000 m=22.00 km=11.88 NM. Đổi 100 cm=1 m; chọn đơn vị mà câu hỏi yêu cầu.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":515,"uid":"GNAV-04-067","sourceNumber":67,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Direct Mercator projection, at latitude 45° North, a certain length represents 70 NM. At latitude 30° North, the same length represents approximately...","options":{"A":"70 NM.","B":"86 NM.","C":"81 NM.","D":"57 NM."},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Cùng một chiều dài giấy trên Mercator: D₂/D₁=cosφ ₂/cosφ ₁. D₂=70 ×cos(30°)/cos(45°)=85.73 NM. Scale mẫu số cũng tỷ lệ cos vĩ độ.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":516,"uid":"GNAV-04-068","sourceNumber":68,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Which one of the following describes the appearance of rhumb lines, except meridians, on a Polar Stereographic chart?","options":{"A":"Straight lines","B":"Curves concave to the Pole","C":"Curves convex to the Pole","D":"Ellipses around the Pole"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"RL giữ góc không đổi với các kinh tuyến tỏa quanh cực, nên trừ kinh tuyến nó thành đường cong có bề lõm về cực. Chặng đông–tây dọc parallel thành cung tròn quanh cực.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":517,"uid":"GNAV-04-069","sourceNumber":69,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"If an aircraft flies along a VOR radial it will follow a...","options":{"A":"line of constant bearing.","B":"great circle track.","C":"rhumb line track.","D":"constant magnetic heading."},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Trong mô hình thi lý thuyết, VOR radial định nghĩa phương vị từ một trạm và máy bay theo radial đi trên greatcircle phát từ trạm. Thực tế propagation, magnetic alignment và tolerance cho giới hạn; không coi là rhumb line giữ magnetic heading hằng.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.m cle and rhumb line are to the south","C":"Great circle is to the north, the rhumb line is to the south.","D":"Rhumb line is to the north, the great circle is to the south."},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Parallel of origin xấp xỉ 51°N, tuyến A 49°N→B 48°Nở phía nam. Do quan hệ curvature Lambert, greatcircle và rhumb line ở phía nam đường thẳng chart trong tình huống này. Không mặc định đường thẳng chart luôn trùng GC.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":520,"uid":"GNAV-04-072","sourceNumber":72,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"An aircraft overflies Waypoint 1 at 10:34 UTC and is overhead Waypoint 2 at 10:49 UTC. The measured distance on the chart between the two waypoints is 13.8 cm. If 1 cm on the chart represents 3.1 NM on the Earth, what Ground Speed has been flown between the two waypoints?","options":{"A":"192 kt","B":"171 kt","C":"182 kt","D":"186 kt"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Chart distance 13,8 cm× 3,1 NM/cm=42,78 NM. Time 15 min=0,25 h. GS 42,78/0,25=171,12 kt≈171 kt.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":521,"uid":"GNAV-04-073","sourceNumber":73,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"At what approximate latitude will the actual scale on a Lambert's chart be at a minimum, if the standard parallels are at 63°00'N and 37°00'N and the chart edges at 74°00'N and24°00'N?","options":{"A":"76°00'N and 24°00'N","B":"50°00' N","C":"63°00'N and 37°00'N","D":"49°00'N"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Scale Lambert hai chuẩn nhỏ nhất gần vĩ tuyến gốc, xấp xỉ giữa 37°N và 63°N: (37+63)/2=50°N. Rìa chart 74°/24° không dùng tính trung bình này.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":522,"uid":"GNAV-04-074","sourceNumber":74,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"At 60°N the scale o nal-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":524,"uid":"GNAV-04-076","sourceNumber":76,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"At what latitude(s) will the actual scale on a Lambert's chart be equal to the quoted scale, if the standard parallels are at 45°00'N and 58°00'N and the chart edges are at 39°00'N and 62°00'N?","options":{"A":"50°30'N","B":"45°00' N and 58°00'N","C":"51°30'N","D":"39°00'N and 62°00'N"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Quoted scale Lambert secant đúng tại hai standard parallels. Trong câu có 45°N và 58°N, chọn chính hai vĩ tuyến này; rìa chart không phải các đường scale chuẩn.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":525,"uid":"GNAV-04-077","sourceNumber":77,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"What is the approximate scale at 22°00'N on a Direct Mercator chart if the scale at 35°00'N is 1:200 000?","options":{"A":"1:306 000","B":"1:131 000","C":"1:177 000","D":"1:226 000"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Mẫu số scale Mercator N₂=N₁ cosφ ₂/cosφ ₁=200,000 ×cos(22°)/cos(35°)≈226,376. Đi về cực làm scale lớn hơn nhưng mẫu số nhỏ hơn.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":526,"uid":"GNAV-04-078","sourceNumber":78,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"(Refer to the Annex or to chart E(LO)2 from the Jeppesen GSPRM 2017). An aircraft is en-route from position A (N55°43', W004°17') to position B (N54°53′ W002°53′). Using this information, determine the initial track from position A to position B and also the distance from position A to the point of crossing latitude N55°00'","options":{"A":"Track: 139°(T); Distance: 68 NM","B":"Track: 136°( T),Distance: 58 NM","C":"Track: 133°(M); Distance: 58 NM","D":"Track: 139°(M); Distance: 68 NM"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Vẽ đường nối hai điểm trên đúng chart được chỉ định. Đo track ban đầu tại kinh tuyến điểm đi, đổi magnetic bằng variation nếu đề yêu cầu; đo distance với scale vĩ độ địa phương. Nếu đến giới hạn kinh/vĩ tuyến, đo dọc đường tới giao điểm, không đo toàn bộ leg. Đáp án được đánh dấu trong Word: Track: 136°( T), Distance: 58 NM.","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Bản Word chỉ có chart được trích hoặc không có annex đủ để xác nhận mọi giá trị; key nguồn không thay cho thông tin AIP hiện hành.","referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":["b78479002b956af6344a1dc2f2fe85acf49343fe469f65d31903e26ed96a914e.webp"],"sourceScreenshots":["c414f04d8081a7af2688a0d9315c824ca0e513edff873ba318db2c7d5a32dec2.webp"],"figureBlocked":false},{"id":527,"uid":"GNAV-04-079","sourceNumber":79,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Mercator chart, a distance of 6.2 cm equals 248 NM on the Equator. At a latitude of 42°N. 6.2 cm equals a real distance of.?","options":{"A":"341 km","B":"459 km.","C":"184 km","D":"307 km."},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Cùng một chiều dài giấy trên Mercator: D₂/D₁=cosφ ₂/cosφ ₁. D₂=248 ×cos(42°)/cos(0°)=184.30 NM=341.3 km. Scale mẫu số cũng tỷ lệ cos vĩ độ.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":528,"uid":"GNAV-04-080","sourceNumber":80,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"The standard parallels of a Lambert's conical projection are 07°40'N and 38°20'N. For this chart, what is the approximate constant of the cone?","options":{"A":"0.39","B":"0.92","C":"0.60","D":"0.42"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Để xấp xỉ cone constant, lấy vĩ tuyến gốc gần trung bình hai chuẩn: (7.667°+38.33°)/2=23°. n≈sin(23°)=0.391. Đây là xấp xỉ của đề; công thức Lambert secant chính xác dùng log ar it của hai vĩ tuyến.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":529,"uid":"GNAV-04-081","sourceNumber":81,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Please refer to the annex or to chart E(LO)2 from the Jeppesen GSPRM 2017. The Lambert chart in the annex has standard parallels at 37°N and 65°N. An aircraft flying with a magnetic heading of 136° is over the dead reckoning position (N55°00.0', W011°00.0'). In this position, the relative bearing obtained of Donegal NDB (CFN) (N55° 02.6', W008° 20.4') is 318°. What is the true bearing of the position line to be plotted from the NDB?","options":{"A":"272° (T)","B":"268° (T)","C":"270°( T)","D":"266° (T)"},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Bearing aircraft→NDB=magnetic heading+relativebearing modulo 360°. Đổi True bằng variation tại máy bay, đảo chiều và chuyển đến kinh tuyến trạm bằng chart convergence để plot position line. Đáp án được đánh dấu trong Word: 270°( T).","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Bản Word chỉ có chart được trích hoặc không có annex đủ để xác nhận mọi giá trị; key nguồn không thay cho thông tin AIP hiện hành.","referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":["3a1adbcd55c2391f602b11da0f66c26d047fe4eb01294d6d8f7eede869222481.webp"],"sourceScreenshots":["87ba59a615f3f9eab97a3eb3677ffab6059092e7cf329aaeb6b5ba18ab5a04f2.webp"],"figureBlocked":false},{"id":530,"uid":"GNAV-04-082","sourceNumber":82,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Given a Lambert chart, with standard parallels at 31°N and 47°N, calculate the approximate value of the constant of the cone \"n\".","options":{"A":"0.21","B":"0.63","C":"0.78","D":"0.98"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Để xấp xỉ cone constant, lấy vĩ tuyến gốc gần trung bình hai chuẩn: (31°+47°)/2=39°. n≈sin(39°)=0.629. Đây là xấp xỉ của đề; công thức Lambert secant chính xác dùng log ar it của hai vĩ tuyến.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":531,"uid":"GNAV-04-083","sourceNumber":83,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"What is the chart distance between longitudes 179°E and 175°W on a direct Mercator chart with a scale of 1: 5 000 000 at the Equator?","options":{"A":"106 mm","B":"72 mm","C":"167 mm","D":"133 mm"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Δλ ngắn 179°E→175°W=6°. Ground distance equator=360 NM=666.720 m. Chart length 666.720/5.000.000 m=0,133344 m≈133 mm.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"imported USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":534,"uid":"GNAV-04-086","sourceNumber":86,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Given: Position NDB (55°10'N, 012°55′E) DR Position (54°53'N, 009°58′E) NDB on the RMI reads 090°Magnetic variation: 10°W The position line has to be plotted on a Lamberts conformal chart with standard parallels at 40°N and 48°N. Calculate the direction (T) of the bearing to be plotted from the NDB.","options":{"A":"272°","B":"262°","C":"265°","D":"258°"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"RMI 090°M→bearing True 080°tại máy bay với VAR 10°W. Đảo chiều 260°T, tính chuyển kinh tuyến bằng Lambert chart C≈(12°55′−9°58′)sin 44°≈2,05°. Bearing plot from NDB≈262°T.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":535,"uid":"GNAV-04-087","sourceNumber":87,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"If the chart scale is 1:500 000, what earth distance would be represented by 7 cm on the chart?","options":{"A":"35 NM","B":"0.35 km","C":"3.5 km","D":"35 000 m"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Quãng đường thật=7 cm× 500,000=35,000 m=35.00 km=18.90 NM. Đổi 100 cm=1 m; chọn đơn vị mà câu hỏi yêu cầu.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":536,"uid":"GNAV-04-088","sourceNumber":88,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"For flight planning purposes, you use a navigation chart with a Lambert conformal conic projection. The constant of the cone for this chart is 0.83. From your current position (50°N,175°E) you draw a straight line on the map to your destination. At your current position, the track to the destination is 073°(T). At your destination the course is 078°(T). What is the longitude of your destination?","options":{"A":"169°E","B":"001°W","C":"179°W","D":"181°E"},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Track tăng 5°; n 0,83 nên Δλ=5/0,83≈6,024°. Đi đông từ 175°E tới 181,024°E=178,976°W≈179°W.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":537,"uid":"GNAV-04-089","sourceNumber":89,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a chart a straight line is drawn between two points and has a length of 4.63 cm. What is the chart scale if the line represents 150 NM?","options":{"A":"1:1000 000","B":"1:3 000 000","C":"1:5 000 000","D":"1:6000 000"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Đổi quãng đường thật sang cm: 150 NM× 185.200=27,780,000 cm. Scale=1:(27,780,000/4.63)≈1:6,000,000. Cùng đơn vị trước khi lập tỷ số.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":538,"uid":"GNAV-04-090","sourceNumber":90,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a chart, the distance along a Meridian between latitudes 45°N and 46°N is 6 cm. The scale of the chart is approximately:","options":{"A":"1:1 000 000","B":"1:18 500 000","C":"1: 185 000","D":"1:1850 000"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Đổi quãng đường thật sang cm: 60 NM× 185.200=11,112,000 cm. Scale=1:(11,112,000/6)≈1:1,852,000. Cùng đơn vị trước khi lập tỷ số.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":539,"uid":"GNAV-04-091","sourceNumber":91,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Polar Stereographic chart, the initial great circle course from 70°N, 060°W to 70°N, 060°E is approximately..?","options":{"A":"330° (T).","B":"030° ( T).","C":"210° (T).","D":"150° (T)."},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Trên Polar Stereographic, cùng 70°N và Δλ 120°đông, track tại điểm giữa 090°; initial=90−120/2=30°T. Đó là hướng đường thẳng chart, không phải GC cầu chính xác.","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Stem nói great-circle trên polar chart; kết quả 030° là xấp xỉ đường thẳng chart, GC cầu cho gi urceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"An aeronautical chart has a published scale of 1 inch = 15 NM. An aircraft is flying on a true heading of 089° with a groundspeed of 150 kt. Calculate the chart distance covered by the aircraft in 25 minutes.","options":{"A":"4.2 cm","B":"5.7 cm","C":"7.7 cm","D":"10.6 cm"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"D=150 × 25/60=62,5 NM. Với 15 NM/inch, chart length=62,5/15 × 2,54=10,583 cm≈10,6 cm; heading 089°không ảnh hưởng quãng đường đã biết GS.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":542,"uid":"GNAV-04-094","sourceNumber":94,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"An aircraft is flying a track of 255°(M). At 22:54 UTC, it crosses radial 360° from a VOR station. At 23:00 UTC, it crosses radial 330° from the same station. What is the distance between the aircraft and the station at 23:00 UTC?","options":{"A":"Less than it was at 22:54 UTC.","B":"Greater than it was at 22:54 UTC.","C":"The same as it was at 22:54 UTC","D":"Randomly different to what it was at 22:54 UTC."},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Hai radial 360° và 330° tạo góc 30°. Track 255° đối xứng quanh trục radial 345° (vuông góc chord), nên tam giác gi :","options":{"A":"Sunrise will be later at A than it is at B and sunset will be earlier at A than it is at B","B":"Sunrise will be earlier at A than it is at B and sunset will be earlier at A than it is at B","C":"Sunrise will be earlier at A than it is at B and sunset will be later at A than it is at B.","D":"Sunrise and sunset will be at the same time at A and B."},"answer":"A","valid":true,"red":false,"topic":"Time","review":{"vi":"Ngày 27/11 thuộc mùa đông Bắc bán cầu và mùa hè Nam bán cầu. Cùng kinh độ nên A ở 50°N có ngày ngắn hơn B ở 50°S: mọc muộn, lặn sớm.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":568,"uid":"GNAV-05-005","sourceNumber":5,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"Which of the following statements is correct when crossing the International Date Line?","options":{"A":"The date will always be the same.","B":"The date will remain the same when crossing from a westerly longitude to an easterly longitude.","C":"The date will increase when crossing on a westerly heading.","D":"The date will increase when crossing on an easterly heading."},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"Qua đường đổi ngày theo hướng tây thì cộng một ngày lịch; hướng đông thì trừ một ngày. Giờ UTC vẫn liên tục, chỉ ngày địa phương được điều chỉnh.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":569,"uid":"GNAV-05-006","sourceNumber":6,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"At (54°N, 020°W) the sun rises on November 28th at 09:01 UTC. At (44°N, 020°W) the sun will rise...?","options":{"A":"at 07:41 LMT.","B":"later since the latter position lies further south.","C":"earlier since the latter position lies further south.","D":"also at 09:01 UTC since both positions are situated on the same meridian."},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"Cuối tháng 11, địa điểm Bắc bán cầu gần Xích đạo hơn có ngày dài hơn. Hai điểm cùng kinh độ 20°W nên ở 44°N Mặt Trời mọc sớm hơn ở 54°N.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":570,"uid":"GNAV-05-007","sourceNumber":7,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"Which statement about ST is true?","options":{"A":"In all cases the standard times at Western longitudes are slow on and at Eastern longitudes fast on UTC.","B":"Standard time is the time that is determined by division of the longitude by 15 and rounding off the answer to the nearest integer.","C":"Standard time is determined by the government of the appropriate state and does not necessarily follow the borders of 15° wide longitude zones","D":"The standard time at 125° W is UTC - 8h20m"},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"ST là giờ pháp định do quốc gia quy định. Biên giới múi giờ và DST có thể lệch khỏi các dải kinh độ 15°, nên không suy ST chỉ bằng kinh độ.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":571,"uid":"GNAV-05-008","sourceNumber":8,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"An aircraft is in Tokyo (35°39'N, 139°50'E) and plans to fly to Anchorage (61°13\"N, 149°52′W). What is the arc-to-time difference between Tokyo and Anchorage?","options":{"A":"9 hours 59 minutes","B":"19 hours 19 minutes","C":"4 hours 41 minutes","D":"9 hours 19 minutes"},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"Khoảng kinh độ ngắn qua 180° là 360°−139°50′−149°52′=70°18′. Đổi 15°/giờ: 70°18′/15=4 giờ 41 phút 12 giây, gần 4 giờ 41 phút.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":572,"uid":"GNAV-05-009","sourceNumber":9,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"Which statement about the duration of daylight is true?","options":{"A":"On September 10th the duration of daylight is longer on the Southern Hemisphere than on the Northern Hemisphere.","B":"Close to the equinoxes the influence of latitude on the duration of daylight is at its smallest.","C":"In summer the length of the period of daylight decreases with increasing latitude.","D":"Close to the solstices the influence of latitude on the duration of daylight is at its smallest."},"answer":"B","valid":true,"red":false,"topic":"Time","review":{"vi":"Gần xuân phân và thu phân, xích vĩ Mặt Trời gần 0° nên độ dài ngày ở nhiều vĩ độ gần 12 giờ. Khi đó ảnh hưởng của vĩ độ nhỏ hơn ở các chí điểm.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":573,"uid":"GNAV-05-010","sourceNumber":10,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"An aircraft departs position A on the 170°00'E meridian at 01:30 Local Mean Time (LMT) on 11 February on an easterly course. It arrives at position B on the 160°00'W meridian 3:00 hours later. What is the LMT and local date of arrival at position B?","options":{"A":"01:30, 10th February","B":"07:30, 11th February","C":"06:30,10th February","D":"02:30, 11th February"},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"170°E tương ứng UTC+11 giờ 20 phút: khởi hành 14:10 UTC ngày 10/2. Cộng 3 giờ được 17:10 UTC; tại 160°W trừ 10 giờ 40 phút, ra 06:30 LMT ngày 10/2.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":574,"uid":"GNAV-05-011","sourceNumber":11,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"Morning Civil twilight begins when the.?","options":{"A":"centre of the Sun is 6° below the celestial horizon","B":"centre of the Sun is 18° below the celestial horizon.","C":"centre of the Sun is 12° below the celestial horizon.","D":"Sun's upper edge is tangential to the celestial horizon."},"answer":"A","valid":true,"red":false,"topic":"Time","review":{"vi":"Rạng đông dân dụng bắt đầu khi tâm Mặt Trời ở 6° dưới chân trời. 12° và 18° là các giới hạn của chạng vạng hàng hải và thiên văn.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":575,"uid":"GNAV-05-012","sourceNumber":12,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"Which statement is true?","options":{"A":"Civil twilight at the Equator lasts longer than at 60°N or 60°S because the radius of the Equator is larger than the radius of the 60° parallel.","B":"The duration of the civil twilight on 21st of March and on 23rd of September is equal at all places on Earth independent of latitude.","C":"The declination of the Sun and the latitude of the observer will affect the duration of civil twilight","D":"Only the declination of the Sun will affect the duration of civil twilight."},"answer":"C","valid":true,"red":false,"topic":"Time","review":{"vi":"Thời gian Mặt Trời đi từ chân trời đến −6° phụ thuộc góc cắt chân trời. Góc này thay đổi theo vĩ độ và xích vĩ, nên chạng vạng không cố định 12 phút ở mọi nơi.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Naval Observatory · Equation of Time","url":"https://aa.usno.navy.mil/faq/eqtime","section":"Apparent and mean solar time","checkedAt":"2026-11-22"},{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":576,"uid":"GNAV-05-013","sourceNumber":13,"section":5,"sourceFile":"GNAV-05 TIME (37).docx","question":"When the time is 14:00 LMT at 90° west, it is.?","options":{"A":"12:00 LMT at 120° west","B":"10:00 LMT at 060° west.","C":"14:00 LMT at 090° east.","D":"06:00 LMT at the prime meridian."},"answer":"A","valid":true,"red":false,"topic":"Time","review":{"vi":"120°W nằm về tây 30° so với 90°W, tương đương chậm hơn 2 giờ LMT. Do đó 14:00 tại 90°W là 12:00 tại 120°W.","references":["USNO-TIME","USNO-TWILIGHT"],"status":"derived","method":"au
