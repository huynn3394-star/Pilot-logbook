<script>/* ATPL state engine. The bank's original answer key is never silently changed. */
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;if(root)root.ATPLQuizEngine=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const SUBJECT=globalThis.ATPL_SUBJECT||'POF';
const KEY='atpl_'+SUBJECT.toLowerCase()+'_v2_state';
const BACKUP_FORMAT='atpl-'+SUBJECT.toLowerCase()+'-backup';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const plain=o=>Boolean(o&&typeof o==='object'&&!Array.isArray(o));
const clone=o=>JSON.parse(JSON.stringify(o));
const unique=a=>[...new Set(a)];
const choices=['A','B','C','D','E','F','G','H'];
function defaultState(){return {version:2,progress:{},wrong:[],bookmarks:[],examHistory:[],study:null,exam:null,settings:{theme:'system',language:'both'},updatedAt:null};}
function valid(bank){return bank.filter(q=>q&&q.valid&&choices.includes(q.answer)&&plain(q.options));}
function shuffle(items,rng=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.min(i,Math.max(0,Math.floor(rng()*(i+1))));[out[i],out[j]]=[out[j],out[i]];}return out;}
function filter(bank,state,opts={}){return valid(bank).filter(q=>{
 if(opts.topic&&q.topic!==opts.topic)return false;
 if(opts.filter==='red'&&!q.red)return false;
 if(opts.filter==='wrong'&&!state.wrong.includes(q.id))return false;
 if(opts.filter==='bookmarks'&&!state.bookmarks.includes(q.id))return false;
 if(opts.filter==='unanswered'&&own(state.progress,q.id))return false;
 if(opts.filter==='review'&&!['limited','conflict'].includes(q.review?.status))return false;
 if(opts.search){const term=String(opts.search).trim().toLowerCase();if(/^\d+$/.test(term))return q.id===Number(term);return (q.question+' '+q.topic+' '+(q.uid||'')).toLowerCase().includes(term);}
 return true;
});}
function examPool(bank){return valid(bank).filter(q=>!q.figureBlocked&&!['limited','conflict'].includes(q.review?.status));}
function openStudy(state,ids,qid,mode='study'){const s=clone(state);const pool=unique(ids.filter(Number.isInteger));if(!pool.includes(qid))throw new Error('Câu hỏi không có trong phiên.');s.study={ids:pool,qid,mode,answers:{},resumeQid:qid,finished:false};s.updatedAt=Date.now();return s;}
function moveStudy(state,qid){const s=clone(state);if(!s.study||!s.study.ids.includes(qid))throw new Error('Câu hỏi không có trong phiên.');s.study.qid=qid;s.study.finished=false;s.study.resumeQid=qid;
 if(own(s.study.answers,qid)){const i=s.study.ids.indexOf(qid);s.study.resumeQid=s.study.ids[i+1]??null;s.study.finished=s.study.resumeQid===null;}
 s.updatedAt=Date.now();return s;}
function resumeStudy(state,bank){const st=state.study;if(!st||st.finished||st.resumeQid==null)return null;const allowed=new Set(valid(bank).map(q=>q.id));const ids=st.ids.filter(id=>allowed.has(id));let id=st.resumeQid;
 if(!ids.includes(id)){const oldIndex=st.ids.indexOf(id);id=st.ids.slice(Math.max(0,oldIndex)).find(i=>allowed.has(i));}
 if(id==null)return null;return {qid:id,ids,mode:st.mode};}
function record(state,q,selected){const id=q.id;const old=state.progress[id]||{attempts:0,correct:0};const correct=selected===q.answer;
 state.progress[id]={attempts:old.attempts+1,correct:old.correct+(correct?1:0),lastSelected:selected??null,lastAt:Date.now()};
 state.wrong=state.wrong.filter(x=>x!==id);if(!correct)state.wrong.push(id);return state;}
function answerStudy(state,qid,selected,bank){if(!choices.includes(selected))throw new Error('Đáp án không hợp lệ.');if(!state.study||state.study.qid!==qid)throw new Error('Không phải câu đang mở.');if(own(state.study.answers,qid))return state;
 const q=valid(bank).find(q=>q.id===qid);if(!q)throw new Error('Không tìm thấy câu hỏi.');if(!own(q.options,selected))throw new Error('Lựa chọn không có trong câu này.');const s=clone(state);s.study.answers[qid]=selected;record(s,q,selected);const i=s.study.ids.indexOf(qid);s.study.resumeQid=s.study.ids[i+1]??null;s.study.finished=s.study.resumeQid===null;s.updatedAt=Date.now();return s;}
function toggleBookmark(state,id){const s=clone(state);s.bookmarks=s.bookmarks.includes(id)?s.bookmarks.filter(x=>x!==id):[...s.bookmarks,id];s.updatedAt=Date.now();return s;}
function startExam(state,ids){const s=clone(state);s.exam={ids:unique(ids),qid:ids[0]??null,answers:{},submitted:false,startedAt:Date.now()};return s;}
function answerExam(state,id,selected){if(!choices.includes(selected))throw new Error('Đáp án không hợp lệ.');if(!state.exam||state.exam.submitted||!state.exam.ids.includes(id))throw new Error('Không có bài thi đang làm.');const s=clone(state);s.exam.answers[id]=selected;s.updatedAt=Date.now();return s;}
function moveExam(state,id){const s=clone(state);if(!s.exam||!s.exam.ids.includes(id))throw new Error('Câu ngoài bài thi.');s.exam.qid=id;return s;}
function submitExam(state,bank){if(!state.exam||state.exam.submitted)return state;const s=clone(state);const byId=new Map(valid(bank).map(q=>[q.id,q]));const results=s.exam.ids.filter(id=>byId.has(id)).map(id=>{const q=byId.get(id),selected=s.exam.answers[id]??null;record(s,q,selected);return {id,selected,answer:q.answer,correct:selected===q.answer};});
 const correct=results.filter(r=>r.correct).length;const report={at:Date.now(),size:results.length,correct,percent:results.length?Math.round(correct/results.length*100):0,results};s.examHistory.push(report);s.exam.submitted=true;s.exam.report=report;s.updatedAt=Date.now();return s;}
function exportBackup(state){return JSON.stringify({format:BACKUP_FORMAT,subject:SUBJECT,version:2,exportedAt:new Date().toISOString(),state},null,2);}
function checkState(input,bank,strict=true){if(!plain(input)||input.version!==2||!plain(input.progress)||!Array.isArray(input.wrong)||!Array.isArray(input.bookmarks)||!Array.isArray(input.examHistory)||!plain(input.settings))throw new Error('Cấu trúc tiến độ không hợp lệ.');const s=defaultState(),allowed=new Set(valid(bank).map(q=>q.id));
 function idArray(a){if(!Array.isArray(a)||a.some(i=>!Number.isInteger(i)||!allowed.has(i)))throw new Error('Danh sách số câu không hợp lệ.');return unique(a);}
 for(const [key,value]of Object.entries(input.progress)){const id=Number(key);if(!allowed.has(id)||!plain(value)||!Number.isInteger(value.attempts)||value.attempts<1||!Number.isInteger(value.correct)||value.correct<0||value.correct>value.attempts||!(value.lastSelected==null||choices.includes(value.lastSelected)))throw new Error('Lượt làm hoặc đáp án lưu không hợp lệ.');s.progress[id]={attempts:value.attempts,correct:value.correct,lastSelected:value.lastSelected??null,lastAt:value.lastAt??null};}
 s.wrong=idArray(input.wrong);s.bookmarks=idArray(input.bookmarks);
 if(!['light','dark','system'].includes(input.settings.theme)||!['vi','en','both'].includes(input.settings.language))throw new Error('Tùy chọn hiển thị không hợp lệ.');s.settings={theme:input.settings.theme,language:input.settings.language};
 function checkedAnswers(a,ids){if(!plain(a))throw new Error('Đáp án phiên học bị lỗi.');const out={};for(const[k,v]of Object.entries(a)){if(!ids.includes(Number(k))||!choices.includes(v))throw new Error('Đáp án phiên học không hợp lệ.');out[Number(k)]=v;}return out;}
 if(input.study!=null){const t=input.study;if(!plain(t))throw new Error('Phiên học bị lỗi.');const ids=idArray(t.ids);if(!ids.length||!ids.includes(t.qid)||!(t.resumeQid===null||ids.includes(t.resumeQid))||typeof t.finished!=='boolean')throw new Error('Vị trí tiếp tục không hợp lệ.');s.study={ids,qid:t.qid,mode:typeof t.mode==='string'?t.mode:'study',answers:checkedAnswers(t.answers,ids),resumeQid:t.resumeQid,finished:t.finished};}
 function checkedReport(t){if(!plain(t)||!Number.isInteger(t.size)||t.size<0||!Number.isInteger(t.correct)||t.correct<0||t.correct>t.size)throw new Error('Lịch sử bài thi không hợp lệ.');const out={at:t.at??null,size:t.size,correct:t.correct,percent:t.size?Math.round(t.correct/t.size*100):0};if(t.results!=null){if(!Array.isArray(t.results)||t.results.length!==t.size)throw new Error('Kết quả bài thi thiếu câu.');const seen=new Set();out.results=t.results.map(r=>{if(!plain(r)||!allowed.has(r.id)||seen.has(r.id)||!(r.selected==null||choices.includes(r.selected))||!choices.includes(r.answer))throw new Error('Kết quả câu thi không hợp lệ.');seen.add(r.id);return {id:r.id,selected:r.selected??null,answer:r.answer,correct:r.selected===r.answer};});out.correct=out.results.filter(r=>r.correct).length;out.percent=t.size?Math.round(out.correct/t.size*100):0;}return out;}
 s.examHistory=input.examHistory.map(checkedReport);
 if(input.exam!=null){const t=input.exam;if(!plain(t))throw new Error('Bài thi đang làm bị lỗi.');const ids=idArray(t.ids);if(!ids.length||!ids.includes(t.qid)||typeof t.submitted!=='boolean')throw new Error('Bài thi không hợp lệ.');s.exam={ids,qid:t.qid,answers:checkedAnswers(t.answers,ids),submitted:t.submitted,startedAt:t.startedAt??null};if(t.report)s.exam.report=checkedReport(t.report);}
 s.updatedAt=input.updatedAt??null;return s;}
function importBackup(text,bank){if(typeof text!=='string'||text.length>10000000)throw new Error('Tệp sao lưu không hợp lệ hoặc quá lớn.');let p;try{p=JSON.parse(text);}catch(_){throw new Error('Tệp không phải JSON hợp lệ.');}if(!plain(p)||p.format!==BACKUP_FORMAT||p.version!==2)throw new Error('Không đúng định dạng sao lưu ATPL phiên bản2.');return checkState(p.state,bank);}
function load(storage,bank){if(!storage)return {state:defaultState(),warning:'Không thể lưu trên trình duyệt này. Hãy xuất tiến độ trước khi đóng.'};try{const next=storage.getItem(KEY);if(next!=null)return {state:checkState(JSON.parse(next),bank),warning:''};const state=defaultState();
 if(SUBJECT!=='POF')return {state,warning:''};
 const p=storage.getItem('atpl_pof_v1_progress'),w=storage.getItem('atpl_pof_v1_wrong'),b=storage.getItem('atpl_pof_v1_bookmarks'),h=storage.getItem('atpl_pof_v1_exam_history'),theme=storage.getItem('atpl_pof_v1_theme');
 if(p)state.progress=JSON.parse(p);if(w)state.wrong=JSON.parse(w);if(b)state.bookmarks=JSON.parse(b);if(h)state.examHistory=JSON.parse(h);if(['light','dark'].includes(theme))state.settings.theme=theme;
 const clean=checkState(state,bank);const ordered=valid(bank).map(q=>q.id);const entries=Object.entries(clean.progress);if(entries.length){const stamp=x=>typeof x==='number'?x:(Date.parse(x)||0);entries.sort((a,b)=>stamp(b[1].lastAt)-stamp(a[1].lastAt));const id=Number(entries[0][0]);const i=ordered.indexOf(id);clean.study={ids:ordered,qid:id,mode:'study',answers:{},resumeQid:ordered[i+1]??null,finished:i===ordered.length-1};}
 return {state:clean,warning:p?'Đã đọc tiến độ bản cũ. Vị trí tiếp tục được suy ra từ lượt trả lời gần nhất.':''};
 }catch(_){return {state:defaultState(),warning:'Dữ liệu lưu bị lỗi hoặc không đọc được. Bản gốc vẫn được giữ; hãy xuất dữ liệu gốc trước khi ghi đè.',readError:true};}}
function save(storage,state){if(!storage)return false;try{storage.setItem(KEY,JSON.stringify(state));return true;}catch(_){return false;}}
return {KEY,defaultState,valid,shuffle,filter,examPool,openStudy,moveStudy,resumeStudy,answerStudy,toggleBookmark,startExam,answerExam,moveExam,submitExam,exportBackup,importBackup,checkState,load,save};
});

C":"1R -295 kt","D":"1R -205 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 035° thành véc-tơ thổi tới 215°. Cộng véc-tơ TAS 250 kt theo heading 029° với gió 45 kt: track=27.7°T, GS=205.3 kt; drift=1.3° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":250,"heading":29,"windFrom":35,"windSpeed":45,"track":27.687,"GS":205.3,"driftRight":-1.313},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":16,"uid":"GNAV-01-016","sourceNumber":16,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A flight is being prepared by a pilot. According to the electronic navigation charts, the total ground distance is 350 NM. Calculate the air distance to be used for fuel calculations, using the following data: Average TT: 240° Average TAS: 180 kt, Average W/V: 270°/25 kt.","options":{"A":"305 NAM","B":"312 NAM","C":"393 NAM","D":"401 NAM"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 240°T với TAS 180 kt và gió 270°/25 kt. WCA=asin[25 sin(270−240)/180]=+4.0°; heading=244.0°T. GS=TAS cos(WCA)−W cos(Δ)=157.9 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":180,"track":240,"windFrom":270,"windSpeed":25,"heading":243.982,"GS":157.915},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":17,"uid":"GNAV-01-017","sourceNumber":17,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 170 kt, HDG(T) = 100°, W/V = 350/30kt. Calculate the Track (°T) and GS?","options":{"A":"103 - 178 kt","B":"091 - 183 kt","C":"098 - 178 kt","D":"109 -182 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 350° thành véc-tơ thổi tới 170°. Cộng véc-tơ TAS 170 kt theo heading 100° với gió 30 kt: track=108.9°T, GS=182.5 kt; drift=8.9° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":170,"heading":100,"windFrom":350,"windSpeed":30,"track":108.888,"GS":182.452,"driftRight":8.888},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":18,"uid":"GNAV-01-018","sourceNumber":18,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the approximate Rate Of Descent for an aircraft with the following data? Average TAS: 125 kt, Average HWC: 30 kt, Ground distance to go during the descent: 20 NM, Descent: from FL180 to pressure altitude 4500 ft.","options":{"A":"1750 ft/min","B":"1400 ft/min","C":"1450 ft/min","D":"1050 ft/ min"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Phải mất độ cao 13,500 ft trong 20 NM. GS=95 kt nên t=60 × 20/95=12.63 phút. ROD tối thiểu=13,500/12.63=1069 ft/min; dùng mức phù /min."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Phải mất độ cao 24,000 ft trong 100 NM. GS=335 kt nên t=60 × 100/335=17.91 phút. ROD tối thiểu=24,000/17.91=1340 ft/min; dùng mức phù hợp gần đáp án.","status":"derived","method":"descent-calculation","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":21,"uid":"GNAV-01-021","sourceNumber":21,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: FL250, OAT -15 °C, TAS 250 kt. Calculate the Mach No.?","options":{"A":"0.39","B":"0.4","C":"0.42","D":"0.44"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại OAT -15.0°C, LSS=38,97√(258.15)=626.1 kt. Mach=TAS/LSS=250/626.1=0.399; FL chỉ dùng xác định OAT khi đề cho ISA deviation.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":22,"uid":"GNAV-01-022","sourceNumber":22,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A pilot is using conventional navigation to fly on a non-RNAV airway defined by the fixes ASMIK-SEVAN-PEMAN, with a published course of 104°(T). To fly the centre line of the airway he/she maintains a heading of 099°(T). After having overflown waypoint SEVAN and hav docx","question":"The circumference of the Earth is approximately...?","options":{"A":"5400 NM.","B":"10800 NM.","C":"21600 NM.","D":"43200 NM."},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Theo mô hình cầu hàng hải: 360°× 60 NM/°=21.600 NM. Đây là xấp xỉ chu vi Trái Đất, không phải chu vi mọi vĩ tuyến.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":34,"uid":"GNAV-01-034","sourceNumber":34,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A nautical mile is equivalent to:","options":{"A":"1852 m","B":"1609 m","C":"1012 m","D":"1500 m"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Một nautical mile quốc tế được định nghĩa chính xác bằng 1.852 m. Khi đổi sang km nhân 1,852; khi đổi từ km sang NM chia 1,852.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":35,"uid":"GNAV-01-035","sourceNumber":35,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 375 kt, True HDG = 124°, W/V = 130°(T)/55kt. Calculate the True Track and GS?","options":{"A":"125-322 kt","B":"126-320 kt","C":"125-318 kt","D":"123- 320 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 130° thành véc-tơ thổi tới 310°. Cộng véc-tơ TAS 375 kt theo heading 124° với gió 55 kt: track=123.0°T, GS=320.4 kt; drift=1.0° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":375,"heading":124,"windFrom":130,"windSpeed":55,"track":122.972,"GS":320.353,"driftRight":-1.028},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":36,"uid":"GNAV-01-036","sourceNumber":36,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At a specific location, the value of magnetic variation.?","options":{"A":"varies slowly over time","B":"depends on the magnetic heading.","C":"depends on the type of compass installed.","D":"depends on the true heading."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Từ trường Trái Đất biến đổi chậm theo thời gian do chuyển động vật chất dẫn điện trong lõi. Vì vậy isogonic lines và variation có năm chuẩn cùng mức thay đổi; phải dùng bản đồ còn hiệu lực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":37,"uid":"GNAV-01-037","sourceNumber":37,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information and a mechanical computer, what is the TAS? CAS: 160 kt. Cruising level: FL260. Temperature: ISA + 18°C","options":{"A":"250 kt","B":"243 kt","C":"231 kt","D":"218 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"CAS=160 kt; áp suất ISA tại 26000 ft, OAT=-18.5°C. Đổi CAS sang Mach từ áp suất va rồi TAS=M× 38,97√(273,15+OAT)≈249.2 kt. Tính bằng flight computer có thể chênh vài kt do làm tròn.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":38,"uid":"GNAV-01-038","sourceNumber":38,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the time from A to B: GS: 345 kt Distance from A to B: 3560 NM","options":{"A":"11 hours 02 minutes","B":"11 hours 00 minutes","C":"10 hours 05 minutes","D":"10 hours 19 minutes"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 3560/345 × 60=619.13 phút, tức 10 giờ 19 phút 8 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":39,"uid":"GNAV-01-039","sourceNumber":39,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Calculate the ground distance for a climb from pressure altitude 2500 ft to FL140, given the information below: Average TAS: 125 kt, Average Headwind Component: 20 kt, Rate of climb: 675 ft/min.","options":{"A":"41.1 NM","B":"29.8 NM","C":"36.3 NM","D":"35.4 NM"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Height gain=14.000−2.500=11.500 ft. Time=11.500/675=17,037 phút. GS=125−20=105 kt, distance=105 × 17,037/60=29,81 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":40,"uid":"GNAV-01-040","sourceNumber":40,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following, calculate the climb gradient (%): Rate Of Climb: 740 ft/min TAS: 200 kt. Headwind: 15 kt","options":{"A":"3.4%","B":"3.7%","C":"4 %","D":"2.5%"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"GS=TAS−HWC=185 kt. Gradient=100 × 740/(185 × 6076,1/60)=3.95%. Không lấy ft/min chia thẳng cho kt vì phải đổi đơn vị.","status":"derived","method":"rate-gradient","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":41,"uid":"GNAV-01-041","source apter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":45,"uid":"GNAV-01-045","sourceNumber":45,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Heading 090T°, TAS 200 kt, W/V 220°/30 kt. Calculate the GS?","options":{"A":"220 kt","B":"230 kt","C":"180 kt","D":"200 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 220° thành véc-tơ thổi tới 040°. Cộng véc-tơ TAS 200 kt theo heading 090° với gió 30 kt: track=84.0°T, GS=220.5 kt; drift=6.0° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":200,"heading":90,"windFrom":220,"windSpeed":30,"track":84.017,"GS":220.485,"driftRight":-5.983},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":46,"uid":"GNAV-01-046","sourceNumber":46,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What can be stated about the distance between geodetic parallels of latitude on the surface of the WGS-84 ellipsoid? The distance between the parallels...?","options":{"A":"remains constant with changing latitude.","B":"decreases with increasing latitude.","C":"increases with increasing latitude.","D":"increase then decreases with increasing latitude."},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Ellipsoid WGS-84 dẹt ở hai cực nên bán kính cong kinh tuyến tăng theo vĩ độ. Với cùng 1° chênh vĩ độ, cung kinh tuyến gần cực dài hơn gần Xích đạo.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":47,"uid":"GNAV-01-047","sourceNumber":47,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what would be the approximate ground speed during a climb from MSL (QNH 1013) to FL270? Climb speed: 280 kt CAS, Average ISA, deviation: +5°C. Climb track: 045°(T), MSL W/V: 275°(T)/10 kt, 5000 ft W/V 280°(T)/20 kt ; 10000 ft W/V: 300°(T)/20 kt, ; 15000 ft W/V: 310°(T)/45 kt ; 20000 ft W/V: 310°(T)/45 kt ; 25000 ft W/V: 330°(T)/55 kt ; 30000 ft W/V: 330°(T)/55 kt,","options":{"A":"382 kt","B":"280 kt","C":"355 kt","D":"371 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Độ cao đại diện leo=⅔× 27.000=18.000 ft. ISA+5°C tại đây khoảng −15,7°C; CAS 280 đổi TAS khoảng 367 kt. Nội suy gió gần 310°/45 kt rồi giải tam giác gió track 045° cho GS xấp xỉ 371 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Đây là phép xấp xỉ DR dùng độ cao hai phần ba; AFM có thể cho tích phân thời gian khác.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{ f Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":50,"uid":"GNAV-01-050","sourceNumber":50,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 472 kt, True HDG = 005°, W/V = 110°(T)/50kt. Calculate the drift angle and GS?","options":{"A":"6°L/402 kt","B":"6°R/490 kt","C":"6°R/462 kt","D":"6°L/ 490 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 110° thành véc-tơ thổi tới 290°. Cộng véc-tơ TAS 472 kt theo heading 005° với gió 50 kt: track=359.3°T, GS=487.3 kt; drift=5.7° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":472,"heading":5,"windFrom":110,"windSpeed":50,"track":359.313,"GS":487.34,"driftRight":-5.687},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":51,"uid":"GNAV-01-051","sourceNumber":51,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the relationship between air distance and ground distance with a headwind?","options":{"A":"Ground distance is greater than air distance.","B":"Air distance is greater than ground distance","C":"Air distance and ground distance are equal.","D":"Ground distance and air distance are independent of wind."},"answer":"B","valid":true,"red":false,"topic":"Basic n iven the following information, calculate the approximate Wind Correction Angle (WCA). Crosswind component: 20 kt from right to left. Track: 340°(T); TAS: 90 kt","options":{"A":"+ 13°","B":"-13°","C":"-4.5°","D":"+4.5°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gió từ phải sang trái: heading phải lớn hơn track. WCA=asin(20/90)=12,84°≈+13°; track 340° thì heading≈353°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":54,"uid":"GNAV-01-054","sourceNumber":54,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A definition of a Magnetic Track angle is:","options":{"A":"The direction of a line referenced to Magnetic North","B":"The direction of the longitudinal axis of an aircraft referenced to Compass North.","C":"The direction of the longitudinal axis of an aircraft referenced to Magnetic North.","D":"The direction of a line referenced to the isogonic line to the Magnetic North pole. Compass North."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Magnetic track là hướng đường đi trên mặt đất đo thuận chiều kim đồng hồ từ Magnetic North. Heading là hướng mũi; có gió ngang thì heading và track khác nhau.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"impor m tra DR.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":59,"uid":"GNAV-01-059","sourceNumber":59,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What scenario will give the greatest difference between nautical air miles and ground miles?","options":{"A":"Headwind at high altitude","B":"Tailwind at low altitude","C":"Tailwind at high altitude","D":"Headwind at low altitude"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cùng một thời gian, air distance=TAS×t và ground distance=GS×t. Gió ngược làm GS nhỏ hơn TAS; với cùng gió và TAS thấp hơn, tỷ số TAS/GS và sai khác tương đối lớn hơn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":60,"uid":"GNAV-01-060","sourceNumber":60,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, at what approximate distance from threshold can you expect to capture the GP? Aircraft height: 2500 ft ILS GP angle: 3°","options":{"A":"8.2 NM","B":"14.5 NM","C":"13.1 NM","D":"7.0 NM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Distance=2.500/tan 3°/6.076,1≈7,85 NM.","status":"limi °E+2°W=6°. Distance dọc 51°N=6 × 60 cos 51°=226,56 NM≈227 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":63,"uid":"GNAV-01-063","sourceNumber":63,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At 04:22 UTC an aircraft is at a range of 185 NM tracking towards VOR/DME 'X' at FL370, GS 320 kt. If the aircraft is required to cross VOR/DME 'X' at FL80, what will be the latest time at which to commence descent, with a mean rate of descent of 1800 ft/min at a mean GS of 232 kt?","options":{"A":"04:54 UTC","B":"04:51 UTC","C":"04:45 UTC","D":"04:48 UTC"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cần hạ 29.000 ft: t descent=29.000/1.800=16,11 phút. Cự ly hạ=232 × 16,11/60=62,30 NM. Cruise còn 185−62,30=122,70 NM tại 320 kt mất 23,01 phút; TOD≈04:45 UTC.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":64,"uid":"GNAV-01-064","sourceNumber":64,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the approximate difference in longitude between two positions 949 NM apart on the 53° parallel?","options":{"A":"9°31'","B":"15°49'","C":"26°17","D":"19°48'"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Δλ=distance/(60 cosφ)=949/(60 cos 53°)=26,28°≈26°17′. Không bỏ hệ số cos 53°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":65,"uid":"GNAV-01-065","sourceNumber":65,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the correct definition of geodetic longitude?","options":{"A":"The distance between the plane of the meridian that passes through a point on the surface of the ellipsoid and the plane of the prime meridian.","B":"The distance between the plane of the meridian that passes through a point on the surface of the ellipsoid and the plane of the anti-meridian.","C":"The angle between the plane of the meridian that passes through a point on the surface of the ellipsoid and the plane of the prime meridian.","D":"The angle between the plane of the meridian that passes through a point on the surface of the ellipsoid and the plane of the anti-meridian."},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Kinh độ trắc địa là góc giữa mặt phẳng kinh tuyến qua điểm và mặt phẳng kinh tuyến gốc Greenwich. Giá trị chạy đông hoặc tây từ 0° tới 180°.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":66,"uid":"GNAV-01-066","sourceNumber":66,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The groundspeed of an aircraft is 269 kt. What is the time needed to fly 5 NM?","options":{"A":"1 minute 7 seconds","B":"1 minute 20 seconds","C":"1 minute 30 seconds","D":"1 minute 52 seconds"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 5/269 × 60=1.12 phút, tức 0 giờ 1 phút 7 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":67,"uid":"GNAV-01-067","sourceNumber":67,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the Mach number: TAS: 487 kt FL 330 Temperature: ISA +15°.","options":{"A":"0.84","B":"0.81","C":"0.76","D":"0.78"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại OAT -35.4°C, LSS=38,97√(237.77)=600.9 kt. Mach=TAS/LSS=487/600.9=0.810; FL chỉ dùng xác định OAT khi đề cho ISA deviation.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":68,"uid":"GNAV-01-068","sourceNumber":68,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is departing from an airport which has an elevation of 2000 ft and the QNH is 1023 hPa. The TAS is 100 kt, the head wind component is 20 kt and the rate of climb is 1000 ft/min. Top of climb is FL 100.At what distance from the airport will this be achieved?","options":{"A":"16.6 NM","B":"10.3 NM","C":"11.1 NM","D":"13.3 NM"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi sân bay elevation 2.000 ft sang pressure altitude: PA=2.000+(1.013−1023)× 30=1700 ft. Height gain tới FL=8300 ft; t=8300/1000=8.30 min. GS=100−20=80 kt nên distance=11.07 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":69,"uid":"GNAV-01-069","sourceNumber":69,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 95 kt, HDG (T) = 075°, W/V = 310/20kt. Calculate the drift and GS?","options":{"A":"104 kts -5R","B":"105 kts -10L","C":"104 kts -5L","D":"108 kts - 9R"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 310° thành véc-tơ thổi tới 130°. Cộng véc-tơ TAS 95 kt theo heading 075° với gió 20 kt: track=83.7°T, GS=107.7 kt; drift=8.7° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":95,"heading":75,"windFrom":310,"windSpeed":20,"track":83.748,"GS":107.725,"driftRight":8.748},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":70,"uid":"GNAV-01-070","sourceNumber":70,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At 16:12 UTC a pilot turns overhead KOK VOR/DME onto a heading 327°(M) to track the 320° radial at a TAS of 140 kt and a calculated ground speed of 158 kt. The pilot takes a fix from KOK at 16:42. If the aircraft has been flown on the selected heading and speed, and given the following information, what is the probable reason for the difference between the DR position and the fix at 16:42? Forecast wind: 100°(T)/25 kt, Variation: 0°, VOR radial at 16:42 UTC: 323°. DME range at 16:42 UTC: 79.5 NM.","options":{"A":"Much smaller tailwind component than forecast.","B":"Less crosswind component than forecast.","C":"Much larger tailwind component than forecast.","D":"More crosswind component than forecast."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Sau 30 phút, planned distance=158 × 0,5=79 NM; fix 79,5 NM gần đúng dọc đường nhưng radial 323° nằm lệch phải so với 320°. Heading 327° đã bù quá nhiều về phía gió; crosswind thực nhỏ hơn dự báo.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":71,"uid":"GNAV-01-071","sourceNumber":71,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What will be the revised ETA (to the nearest minute) overhead turning point B in the following situation? Assume that all other conditions remain unchanged. Planned ETA over turning point B: 14:14. Planned distance from turning point A to turning point B: 43NM. Planned distance from turning point A to check feature X: 10 NM. Actual time overhead check feature X: 1 minute 15 seconds late.","options":{"A":"14:18","B":"14:15","C":"14:19","D":"14:26"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Chậm 1,25 phút sau 10 NM; nếu GS tiếp tục như cũ, chậm ở 43 NM=1,25 × 43/10=5,375 phút. ETA 14:14+5,375≈14:19; không chỉ cộng 1:15 tại điểm giữa.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":72,"uid":"GNAV-01-072","sourceNumber":72,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: GS = 120 kt. Distance from A to B = 84 NM. What is the time from A to B?","options":{"A":"00 HR 42 MIN","B":"00 HR 43 MIN","C":"00 HR 45 MIN","D":"00 HR 44 MIN"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 84/120 × 60=42.00 phút, tức 0 giờ 42 phút 0 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":73,"uid":"GNAV-01-073","sourceNumber":73,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: True HDG = 307°, TAS = 230 kt, Track (T) = 313°, GS = 210 kt. Calculate the W/V?","options":{"A":"265/30kt","B":"255/25kt","C":"257/35kt","D":"260/ 30kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 230 kt/307°, GS 210.0 kt/313°. Hiệu véc-tơ cho gió thổi từ 260.9°T, tốc độ 30.5 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":230,"heading":307,"track":313,"GS":210,"windFrom":260.936,"windSpeed":30.483},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":74,"uid":"GNAV-01-074","sourceNumber":74,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 130 kt, Track (T) = 0030, W/V = 190/40kt. Calculate the HDG (°T) and GS?","options":{"A":"001 - 170 kt","B":"002-173 kt","C":"357-168 kt","D":"359-166 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 003°T với TAS 130 kt và gió 190°/40 kt. WCA=asin[40 sin(190−3)/130]=-2.1°; heading=0.9°T. GS=TAS cos(WCA)−W cos(Δ)=169.6 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":130,"track":3,"windFrom":190,"windSpeed":40,"heading":0.851,"GS":169.61},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":75,"uid":"GNAV-01-075","sourceNumber":75,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 270 kt, Track (T) = 260°, W/V = 275/30kt. Calculate the HDG (°T) and GS?","options":{"A":"264-241 kt","B":"262- 241 kt","C":"264-237 kt","D":"262-237 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 260°T với TAS 270 kt và gió 275°/30 kt. WCA=asin[30 sin(275−260)/270]=+1.6°; heading=261.6°T. GS=TAS cos(WCA)−W cos(Δ)=240.9 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":270,"track":260,"windFrom":275,"windSpeed":30,"heading":261.648,"GS":240.911},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":76,"uid":"GNAV-01-076","sourceNumber":76,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the shortest distance between A(53° 30'N 001° 30'W) and B(27° 35'S 001° 30'W)?","options":{"A":"9010km","B":"1550NM","C":"4685NM","D":"2870km"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cùng kinh tuyến, Δφ=53°30′+27°35′=81°05′=4.865 NM. Đổi km:4.865 × 1,852=9.010 km.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":77,"uid":"GNAV-01-077","sourceNumber":77,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the difference in latitude between A (36° 42'37'N, 110° 05'53\"E) and B (27° 48'05\"N, 102° 12'21'E)?","options":{"A":"07°53'32\"","B":"09°06'32\"","C":"8°54'32\"","D":"64°54'32\""},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"36°42′37″−27°48′05″=8°54′32″. Hai điểm cùng Bắc bán cầu nên lấy hiệu vĩ độ, không cộng.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":78,"uid":"GNAV-01-078","sourceNumber":78,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft passes point A at 14.37 UTC and point B at 14.49 UTC. The distance between A and B on the chart is 11.4 cm and the scale of the chart is such that 1cm equals 3.2 NM. What is the Ground speed?","options":{"A":"185","B":"177","C":"182","D":"190"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Distance=11,4 × 3,2=36,48 NM. Time=12 phút=0,2 h. GS=36,48/0,2=182,4 kt≈182 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/s  Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":96,"uid":"GNAV-01-096","sourceNumber":96,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Consider two different locations in the Northern Hemisphere. The difference in duration between day and night is due to the...","options":{"A":"inclination of the Earth's spin axis and the difference in longitude of the two locations.","B":"declination of the Sun and the difference in latitude of the two locations.","C":"date and the difference in longitude of the two locations.","D":"location of the Moon orbiting the Earth and the difference in longitude of the two locations"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Mặt Trời qua thiên đỉnh chỉ trong dải chí tuyến khoảng 23,5°N–23,5°S. Độ dài ngày còn phụ thuộc xích vĩ Mặt Trời và vĩ độ người quan sát, không chỉ kinh độ.","status":"derived","method":"authored","references":["USNO-TWILIGHT"],"referenceRecords":[{"title":"US Naval Observatory · Rise, Set, and Twilight Definitions","url":"https://aa.usno.navy.mil/faq/RST_defs","section":"Sunrise, sunset and civil twilight","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":97,"uid":"GNAV-01-097","sourceNumber":97,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"For a given track the: Wind component = +45 kt. Drift angle = 15° left. TAS = 240 kt. What is the wind component on the reverse track?","options":{"A":"-45 kt","B":"-35 kt","C":"-55 kt","D":"- 65 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Drift 15° nên GS out=TAS+45=285 kt nhưng thành phần TAS dọc track chỉ 240 cos 15°=231,82 kt. Tailwind thực dọc track=53,18 kt; trên chặng ngược GS≈231,82−53,18=178,64 kt, WC=178,64−240≈−61 kt; phương án−65 kt dùng xấp xỉ làm tròn.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Không đơn giản đảo dấu+45 thành−45 khi có drift lớn; kết quả phụ thuộc định nghĩa wind component của bộ đề.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":98,"uid":"GNAV-01-098","sourceNumber":98,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: True HDG = 233°, TAS = 480 kt, Track (T) = 240°, GS = 523 kt. Calculate the W/V?","options":{"A":"105/75kt","B":"115/70kt","C":"110/ 75kt","D":"110/80kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 480 kt/233°, GS 523.0 kt/240°. Hiệu véc-tơ cho gió thổi từ 111.5°T, tốc độ 74.8 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":480,"heading":233,"track":240,"GS":523,"windFrom":111.472,"windSpeed":74.776},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":99,"uid":"GNAV-01-099","sourceNumber":99,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft at FL370, M0.86, OAT -44° C, headwind component 110 kt, is required to reduce speed in order to cross a reporting point 5 MIN later than planned. If the speed reduction were to be made 420 NM from the reporting point, what Mach Number is required?","options":{"A":"M0.75","B":"M0.81","C":"M0.73","D":"M0.79"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"LSS ở−44°C≈590 kt. TAS old≈0,86 × 590=507 kt, GS≈397 kt. t new=420/397+5/60 h, GS new≈368 kt, TAS new≈478 kt, M new≈0,81.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":100,"uid":"GNAV-01-100","sourceNumber":100,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At 10:15 the reading from a VOR/DME station is 211/90 NM, at 10:20 the reading from the same VOR/DME station is 2110/120 NM. Compass Heading = 200° Variation in the area = 31°W Deviation = +1° TAS = 390 kt. The wind vector (T) is approximately:","options":{"A":"110°/ 70 kt","B":"100°/60 kt","C":"120°/50 kt","D":"110°/40 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"DME tăng 30 NM trong 5 phút →GS 360 kt outbound. CH 200°+dev 1°+var−31°=TH 170°T; radial 211°M đổi true 180°T nếu variation trạm cũng 31°W. Trừ véc-tơ GS 360/180°−TAS 390/170° cho gió khoảng 110°T/70 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Giả định variation tại trạm bằng variation khu vực ghi trong đề.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":101,"uid":"GNAV-01-101","sourceNumber":101,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the wind velocity: True track: 239° True heading: 229° TAS: 555 kt Groundspeed: 577 kt","options":{"A":"310°(т)/100 к","B":"300°(T)/100 kt","C":"165°(T)/100 kt","D":"130°( T)/00 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 555 kt/229°, GS 577.0 kt/239°. Hiệu véc-tơ cho gió thổi từ 131.5°T, tốc độ 101.1 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"limited","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":555,"heading":229,"track":239,"GS":577,"windFrom":131.476,"windSpeed":101.065},"noteVi":"Phương án key D ghi 00 kt; phép trừ véc-tơ cho khoảng 101 kt. Có dấu hiệu mất chữ số 1 trong Word, không tự sửa lựa chọn.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":102,"uid":"GNAV-01-102","sourceNumber":102,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The charted values of magnetic variation on Earth normally changes annually due to...","options":{"A":"an increasing field strength causing numerical values at all locations to increase.","B":"magnetic pole movement causing numerical values at all locations to increase.","C":"magnetic pole movement causing numerical values at all locations to increase or decrease.","D":"a reducing field strength causing numerical values at all locations to decrease."},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Từ trường Trái Đất biến đổi chậm theo thời gian do chuyển động vật chất dẫn điện trong lõi. Vì vậy isogonic lines và variation có năm chuẩn cùng mức thay đổi; phải dùng bản đồ còn hiệu lực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":103,"uid":"GNAV-01-103","sourceNumber":103,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is climbing at a TAS of 220 kt with a headwind of 40 kt. The rate of climb is 1300 feet per minute. What climb gradient is achieved?","options":{"A":"4.30%","B":"7.10%","C":"4.90%","D":"3.00%"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"GS=TAS−HWC=180 kt. Gradient=100 × 1300/(180 × 6076,1/60)=7.13%. Không lấy ft/min chia thẳng cho kt vì phải đổi đơn vị.","status":"derived","method":"rate-gradient","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":104,"uid":"GNAV-01-104","sourceNumber":104,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"You are climbing to FL 280 in ISA conditions, maintaining a constant CAS of 250 kt. At the beginning of the climb your cross-check of the instruments shows TAS at 336kt and Mach 0.55. You check the instruments again at some point during the climb: which option contains reading that you would expect to see?","options":{"A":"TAS as 357 kt and the Mach as 0.51","B":"TAS as 357 kt and the Mach as 0.59","C":"TAS as 316 kt and the Mach as 0.51","D":"TAS as 316 kt and the Mach as 0.59"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Leo ở CAS không đổi làm TAS tăng do mật độ giảm. Trong ISA nhiệt độ giảm nên LSS cũng giảm, Mach tăng; vì vậy cặp TAS 357 kt/M 0,59 có xu hướng hợp lý so với 336 kt/M 0,55.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":105,"uid":"GNAV-01-105","sourceNumber":105,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Using Mental Dead Reckoning (MDR) and the clock code technique, calculate the crosswind component (to the nearest whole knot) for the following situation. Runway: 32. Surface wind (from the tower): 005/20 kt (wind from the tower is magnetic) Variation: 15° E","options":{"A":"10 kt","B":"20 kt","C":"15 kt","D":"5 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Runway 32≈320°M; tower wind 005°M, góc nhỏ 45°. XWC=20 sin 45°=14,14 kt. Clock-code làm tròn khoảng 15 kt. Không áp thêm variation 15°E vì cả hai đã magnetic.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":106,"uid":"GNAV-01-106","sourceNumber":106,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Calculate the W/V if: True heading: 090°TAS: 180 kt GS: 180 kt Drift: 5° right.","options":{"A":"190° (T)/75 kt","B":"005° ( T)/15 kt","C":"185° (T)/15 kt","D":"355° (T)/15 kt"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 180 kt/090°, GS 180.0 kt/095°. Hiệu véc-tơ cho gió thổi từ 2.5°T, tốc độ 15.7 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":180,"heading":90,"track":95,"GS":180,"windFrom":2.5,"windSpeed":15.703},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":107,"uid":"GNAV-01-107","sourceNumber":107,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the actual magnetic track of the aircraft. Planned track: 283°(T), Heading flown: 289°(T), Actual in-flight drift: 7 right, Variation: 12°W.","options":{"A":"308°( M)","B":"294°(M)","C":"284°(M)","D":"302° (M)"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"TT=TH+drift=289°+7°=296°T. Variation 12°W: MT=296−(−12)=308°M; planned track 283° không phải actual track.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":108,"uid":"GNAV-01-108","sourceNumber":108,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is departing from an airport which has an elevation of 2000 ft and the QNH is 1003 hPa. The TAS is 100 kt, the head wind component is 20 kt and the rate of climb is 1000 ft/min. Top of climb is FL 050. At what distance from the airport will this be achived?","options":{"A":"5.4 NM","B":"4.4 NMs","C":"3.6 NM","D":"4.0 NM"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi sân bay elevation 2.000 ft sang pressure altitude: PA=2.000+(1.013−1003)× 30=2300 ft. Height gain tới FL=2700 ft; t=2700/1000=2.70 min. GS=100−20=80 kt nên distance=3.60 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":109,"uid":"GNAV-01-109","sourceNumber":109,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The main reason for the Earth's seasons is the...","options":{"A":"distance between the Sun and the Earth.","B":"length of the day, as stated by Kepler's second law.","C":"elliptical orbit of the Earth around the Sun.","D":"inclination of the Earth's polar axis to the plane of the ecliptic"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Trục quay Trái Đất nghiêng khoảng 23,5° so với pháp tuyến của mặt phẳng quỹ đạo, tương đương góc giữa mặt phẳng xích đạo và hoàng đạo. Hai bán cầu nhận bức xạ và độ dài ngày trái mùa; tháng 7 là mùa hè Bắc bán cầu, tháng 1 là mùa hè Nam bán cầu.","status":"derived","method":"authored","references":["USNO-SEASONS"],"referenceRecords":[{"title":"US Naval Observatory · Earth's Seasons","url":"https://aa.usno.navy.mil/faq/rs_solstices","section":"Equinoxes and solstices","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":110,"uid":"GNAV-01-110","sourceNumber":110,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the correct definition of geodetic latitude? The angle between a...","options":{"A":"great circle at a point on the surface of the ellipsoid with its vertex at the centre and the equatorial plane.","B":"line parallel to the equatorial plane from a point on the surface of the ellipsoid and the spin axis.","C":"line perpendicular from a point on the surface of the ellipsoid and the equatorial plane","D":"line tangential to the equatorial plane from a point on the surface of the ellipsoid and the spin axis."},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Vĩ độ trắc địa dùng pháp tuyến vuông góc bề mặt ellipsoid và mặt phẳng xích đạo. Đường nối tâm tới điểm xác định vĩ độ địa tâm; hai loại không hoàn toàn bằng nhau trên WGS-84.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":111,"uid":"GNAV-01-111","sourceNumber":111,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 132 kt, HDG (T) = 0530, W/V = 205/15kt. Calculate the Track (°T) and GS?","options":{"A":"050 - 145 kt","B":"052 -143 kt","C":"051 -144 kt","D":"057 -144 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 205° thành véc-tơ thổi tới 025°. Cộng véc-tơ TAS 132 kt theo heading 053° với gió 15 kt: track=50.2°T, GS=145.4 kt; drift=2.8° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":132,"heading":53,"windFrom":205,"windSpeed":15,"track":50.224,"GS":145.415,"driftRight":-2.776},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":112,"uid":"GNAV-01-112","sourceNumber":112,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Two aircraft set off at 1020 UTC from 87N, 000E/W at different groundspeeds. The aircraft heading west was flying at 160 Knots and the aircraft heading east was flying at 120 Knots. What time would they meet?","options":{"A":"1522","B":"1442","C":"1422","D":"1542"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Chu vi vĩ tuyến 87°N≈21.600 cos 87°=1.130,46 NM. Hai máy bay ngược chiều có tốc độ tương đối 280 kt: t=4,037 h=4 h 02 min, gặp khoảng 14:22.","status":"conflict","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Key 14:42 không khớp phép tính vĩ tuyến 87°N và 160+120 kt; không tự đổi key.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":113,"uid":"GNAV-01-113","sourceNumber":113,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A pilot is flying on a track of 270° (T) towards ZVR VOR. At 10:20 UTC they plot the position and determines the aircraft is on-course. At 10:32 UTC, after having travelled for 60 NM, the pilot plots the position to be 10 NM off- track towards the south. Given the following information, calculate the average drift from 10:20 UTC to 10:32 UTC. TAS: 280 kt; Forecast W/V: 150°/30 kt","options":{"A":"5° left","B":"10° right","C":"5° right","D":"10° left"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đã đi 60 NM và lệch 10 NM về nam so với track 270°: track error≈60 × 10/60=10° trái. Đây là drift nếu heading thực giữ track dự định; đề không nêu heading đã bù gió nên cần phân biệt hai khái niệm.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Track error xác định được từ hình học; drift chính xác còn cần actual heading.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":114,"uid":"GNAV-01-114","sourceNumber":114,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":  ATC instructions are to turn left 30 degrees to avoid conflicting traffic. After two minutes they advise,'You are now two miles left of your original track, turn right to regain track in 30 miles. What is the heading change required to comply with the ATC instructions?","options":{"A":"044°","B":"034°","C":"037°","D":"030°"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Sau turn trái 30°, muốn quay về song song track cần turn phải 30°. Closing angle=60 × 2/30=4° thêm về phía đường, tổng turn phải 34°; không dùng riêng 4° làm toàn bộ lệnh đổi heading.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":126,"uid":"GNAV-01-126","sourceNumber":126,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the actual track of the aircraft. Planned track: 031°(T). Pre-flight wind correction angle calculation: 6° right. Actual in-flight drift: 4° left.","options":{"A":"027°(T)","B":"029°(T)","C":"037°(T)","D":"033°( T)"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Heading dự kiến=31°+6°=37°T. Drift thực 4°trái: track=37−4=33°T.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScr
