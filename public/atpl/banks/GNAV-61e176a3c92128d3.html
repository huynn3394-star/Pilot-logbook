uthored","references":["USNO-SEASONS"],"referenceRecords":[{"title":"US Naval Observatory · Earth's Seasons","url":"https://aa.usno.navy.mil/faq/rs_solstices","section":"Equinoxes and solstices","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":129,"uid":"GNAV-01-129","sourceNumber":129,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The rate of descent required to maintain a 3.25° glide slope at a groundspeed of 140 kt is approximately:","options":{"A":"670 ft/min","B":"850 ft/min","C":"760 ft/ min","D":"700 ft/min"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"ROD=GS× 6076,1/60 ×tan(góc). Với GS 140 kt và góc 3.25°, ROD≈805 ft/min. Dùng GS đã cộng/trừ gió, không lấy TAS trực tiếp.","status":"derived","method":"slope-rate","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":130,"uid":"GNAV-01-130","sourceNumber":130,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the latitude change from A (50°50'47\"N, 004° 21'09\"E) to B (34° 24'36\"N, 004°21'09\"E)?","options":{"A":"16°26'11\"N","B":"85°15'23\"N","C":"85°15'23\"S","D":"16°26'11\"S"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"B ở nam A:50°50′47″−34°24′36″=16°26′11″ về nam. Dấu hướng phải đi cùng độ lớn.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":131,"uid":"GNAV-01-131","sourceNumber":131,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft flies from Point A at N50° W008°30.0' to Point B at N50° W134°36.0'. What approximate ground distance has it covered?","options":{"A":"4683 NM","B":"8600 KM","C":"5390 SM","D":"9006 KM"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Δλ=134°36′−8°30′=126°06′. Rhumb distance dọc 50°N=126,1 × 60 cos 50°≈4.863 NM≈9.006 km.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Đề không nói rõ RL hay GC; key này là đường dọc vĩ tuyến, không phải cự ly ngắn nhất.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":132,"uid":"GNAV-01-132","sourceNumber":132,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Having turned over an accurate fix at 12:15, a pilot maintains a steady heading of 235° towards the next turning point 80 NM away.  At 12:27, the pilot passes over a railway line at 90° to the track, 40 NM from the last turning point. At 12:33, the intended track should be 1 NM to the right of another railway line, but actually the aircraft is 3 NM to the left of it. What is the heading to reach the next turning point, and at what time will it be passed?","options":{"A":"Heading: 243°, ETA: 12:39.","B":"Heading: 251°,ETA: 12:39","C":"Heading: 241°, ETA: 12:51.","D":"Heading: 247°, ETA: 12:51."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đã bay 40 NM trong 12 min→GS 200 kt. Sau 18 min đã đi 60 NM, lệch tổng 4 NM (đường dự định 1 NM phải rail, máy bay 3 NM trái rail). Track error≈4°, closing≈12° cho 20 NM còn lại: heading 235+16=251°, ETA 12:39.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":133,"uid":"GNAV-01-133","sourceNumber":133,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"You are departing from an airport which has an elevation of 1500 ft. The QNH is 1003 hPa.15 NM away there is a waypoint you are required to pass at an altitude of 7500 ft. Given a groundspeed of 120 kt, what is the minimum rate of climb?","options":{"A":"730 ft/min","B":"870 ft/min","C":"800 ft/ min","D":"530 ft/min"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cả elevation và đích là altitude QNH nên không cần đổi chuẩn áp suất: Δh=7.500−1.500=6.000 ft. Time=15/120 × 60=7,5 min; ROC=6.000/7,5=800 ft/min.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":134,"uid":"GNAV-01-134","sourceNumber":134,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is departing from an airport which has an elevation of 2000 ft and the QNH is 1003 hPa. The TAS is 100 kt, the head wind component is 20 kt and the rate of climb is 1000 ft/min. Top of climb is FL 100. At what distance from the airport will this be achieved?","options":{"A":"10.3 NM","B":"11.1 NM","C":"13.3 NM","D":"15.4 NM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi sân bay elevation 2.000 ft sang pressure altitude: PA=2.000+(1.013−1003)× 30=2300 ft. Height gain tới FL=7700 ft; t=7700/1000=7.70 min. GS=100−20=80 kt nên distance=10.27 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":135,"uid":"GNAV-01-135","sourceNumber":135,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A pilot is instructed by ATC to arrive 5 minutes later than scheduled in the flight plan. Calculate the revised GS using the following flight plan data before the ATC instruction. Distance: 206 NM. Cruising altitude: FL100. CAS: 137 kt. OAT: ISA +10°C. Headwind component: 20 kt","options":{"A":"153 kt","B":"129 kt","C":"169 kt","D":"134 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Dùng CAS 137 tại FL 100/ISA+10 đổi TAS khoảng 165 kt; GS old≈145 kt. t new=206/145+5/60 h; GS new≈137 kt, gần 134 kt tùy flight-computer/giả định CAS.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Kết quả phụ thuộc hiệu chỉnh CAS và làm tròn; phương pháp là tăng thời gian rồi tính lại GS, không giảm tốc theo tỷ lệ thời gian trực tiếp.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":136,"uid":"GNAV-01-136","sourceNumber":136,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: GS = 510 kt. Distance A to B = 43 NM. What is the time (MIN) from A to B?","options":{"A":"5","B":"6","C":"4","D":"7"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 43/510 × 60=5.06 phút, tức 0 giờ 5 phút 4 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":137,"uid":"GNAV-01-137","sourceNumber":137,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The track from A(44N 26E) to B(46N 24E) forms an angle of 35 degrees with longitude 26E. Variation at point A is 3E. What is the magnetic track from A to B?","options":{"A":"328M","B":"038M","C":"032M","D":"322M"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"A→B tây bắc, nên TT=360−35=325°T. Variation 3°E: MT=325−3=322°M.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":138,"uid":"GNAV-01-138","sourceNumber":138,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft at FL290 is required to commence descent when 50 NM from a VOR and to cross that VOR at FL80.Mean GS during descent is 271 kt. What is the minimum rate of descent required?","options":{"A":"2000 ft/min","B":"1800 ft/min","C":"1900 ft/ min","D":"1700 ft/min"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Phải mất độ cao 21,000 ft trong 50 NM. GS=271 kt nên t=60 × 50/271=11.07 phút. ROD tối thiểu=21,000/11.07=1897 ft/min; dùng mức phù hợp gần đáp án.","status":"derived","method":"descent-calculation","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":139,"uid":"GNAV-01-139","sourceNumber":139,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At 1400 UTC an aircraft 550 NM from point B is requested to reach point B at 1525 UTC. Present cruise conditions are FL290, OAT -44 degrees C, wind component -70kt. What is required Mach Number to comply with specified time?","options":{"A":"0.68","B":"0.85","C":"0.77","D":"0.57"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian 14:00→15:25=85 min. GS needed=550 × 60/85=388,24 kt; TAS=388,24+70=458,24 kt. LSS ở−44°C≈590 kt; M≈0,777, gần 0,77.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":140,"uid":"GNAV-01-140","sourceNumber":140,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Deviation on the standby compass is...","options":{"A":"zero on the magnetic Equator.","B":"dependent on the heading of the aircraft","C":"independent of the latitude of the aircraft's position.","D":"positive if the Compass North is to the west of Magnetic North."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Deviation là góc giữa Magnetic North và Compass North do từ trường máy bay, thiết bị và ảnh hưởng cảm ứng. Nó thay đổi theo heading; đọc bảng compass swing cho đúng hướng đang bay.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":141,"uid":"GNAV-01-141","sourceNumber":141,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 485 kt, True HDG = 226°, W/V = 110°(T)/95kt. Calculate the drift angle and GS?","options":{"A":"9°R -533 kt","B":"8°L - 435 kt","C":"7°R - 531 kt","D":"9°R - 433 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 110° thành véc-tơ thổi tới 290°. Cộng véc-tơ TAS 485 kt theo heading 226° với gió 95 kt: track=235.2°T, GS=533.5 kt; drift=9.2° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":485,"heading":226,"windFrom":110,"windSpeed":95,"track":235.209,"GS":533.522,"driftRight":9.209},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":142,"uid":"GNAV-01-142","sourceNumber":142,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Please refer to the annex. What result is achieved when vector A is added to vector B?","options":{"A":"Vector 1","B":"Vector 2","C":"Vector 3","D":"Vector 4"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Cộng véc-tơ bằng cách đặt đuôi B vào đầu A rồi nối đuôi A tới đầu B; không cộng độ dài khi hai véc-tơ không song song. Đề Word không chứa hình annex nên không xác nhận độc lập nhãn Vector 4.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Thiếu hình annex trong tệp Word của câu này.","missingFigure":true,"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":true},{"id":143,"uid":"GNAV-01-143","sourceNumber":143,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the track error angle. Planned track: 197°(T); Actual heading: 213°(T); Actual in-flight drift: 12° left","options":{"A":"12° left","B":"4° right","C":"4° left","D":"16° right"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Actual track=heading 213°−drift trái 12°=201°T. So với planned 197° là lệch 4° về phải.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":144,"uid":"GNAV-01-144","sourceNumber":144,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The flight log gives the following data: True track, Drift, True heading, Magnetic variation, Magnetic heading, Compass deviation, Compass heading Which option lists the correct numbers in the same order as in the flight log?","options":{"A":"119°,3°L, 122°, 2°E, 120°, +4°, 116°","B":"125°, 2°R, 123°, 2°W, 121°, -4°, 117°.","C":"115°, 5°R, 120°, 3°W, 123°, +2°, 121°.","D":"117°, 4°L, 121°, 1°E, 122°, -3°, 119°."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"TT 119°, drift trái 3°→TH 122°. Variation 2°E: MH 120°. Deviation+4°E: CH 116°. Kiểm tra ngược 116+4+2−3=119° để tránh nhầm dấu.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":145,"uid":"GNAV-01-145","sourceNumber":145,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the True Heading (TH) and TAS. True Track: 119°. Groundspeed: 195 kt; W/V: 181°(T)/41 kt","options":{"A":"TH: 107°, TAS: 179 kt","B":"TH: 124°, TAS: 205 kt","C":"TH: 113°, TAS: 188 kt","D":"TH: 129°,TAS: 217 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ TAS=GS−wind-to. GS 195 kt theo 119° và gió từ 181°/41 kt cho TAS≈217 kt, TH≈129°T. Gió từ phải đòi heading phải track.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":146,"uid":"GNAV-01-146","sourceNumber":146,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: GS = 95 kt. Distance from A to B = 480 NM. What is the time from A to B?","options":{"A":"5 HR 08 MIN","B":"5 HR 00 MIN","C":"5 HR 03 MIN","D":"4 HR 59 MIN"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 480/95 × 60=303.16 phút, tức 5 giờ 3 phút 9 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":147,"uid":"GNAV-01-147","sourceNumber":147,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, which wind vector should be used to plan the climb? An aircraft has to climb from an airport at Mean Sea Level to an altitude of 21000 ft. The reported surface wind is 030°/15 kt and it is in ISA conditions. The upper winds are: FL050: 050°/25 kt, FL100: 070°/30 kt, FL180: 090/40 kt, FL240: 110/50 kt.","options":{"A":"080°/ 35 kt","B":"100°/45 kt","C":"065°/30 kt","D":"090°/40 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Độ cao đại diện leo=⅔× 21.000=14.000 ft. Nội suy giữa FL 100070°/30 kt và FL 180090°/40 kt cho khoảng 080°/35 kt; không trung bình góc trực tiếp khi vượt 360°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":148,"uid":"GNAV-01-148","sourceNumber":148,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"You are flying from point A to point B, a distance of 75NM,on a heading of 288°. After 45NM you have diverged 4° right of track. What heading correction should be made to reach position B?","options":{"A":"Left 8° onto 280°","B":"Left 10° onto 278°","C":"Left 4° onto 284°","D":"Left 6° onto 282°"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Lệch 4° sau 45 NM →cross-track≈45 × 4/60=3 NM. Còn 30 NM nên closing angle=60 × 3/30=6°. Tổng sửa trái 4+6=10°, heading 288−10=278°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":149,"uid":"GNAV-01-149","sourceNumber":149,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The accuracy of the, manually calculated, DR-position of an aircraft is, among other things, affected by","options":{"A":"The accuracy of the forecasted wind","B":"The accuracy of the adjustment of the position lines for the motion of the aircraft between the last and the new DR-position.","C":"The accuracy of the actual wind.","D":"The accuracy of the adjustment of the position lines for the motion of the aircraft between the last fix and the DR-position."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"DR lấy fix đã biết làm gốc, cộng quãng đường và hướng suy từ TAS, heading và gió trong khoảng thời gian đã qua. Sai số vị trí gốc, sai số gió/TAS/heading và thời gian tích lũy đều ảnh hưởng; fix mới là phép xác định vị trí độc lập để kiểm tra DR.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":150,"uid":"GNAV-01-150","sourceNumber":150,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft departs a point 04°00'N, 030°00'W and flies 600 NM south, followed by 600 NM east, then 600 NM north, then 600 NM west. What is its final position?","options":{"A":"04°00'N, 030°02'W","B":"04°00'N, 029°58' W","C":"03°58'N, 030°02'W","D":"04°00'N, 030°00'W"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"600 NM=10°vĩ độ. Từ 4°N đi nam tới 6°S; đi đông 600 NM ở 6°S đổi≈10,055°. Lên 4°N rồi đi tây 600 NM đổi≈10,024°. Kết quả kinh độ tăng≈0,031°=1,8′ về đông:029°58′W.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":151,"uid":"GNAV-01-151","sourceNumber":151,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 270 kt, True HDG = 270°, Actual wind 205°(T)/30kt. Calculate the drift angle and GS?","options":{"A":"6L-256kt","B":"8R-259kt","C":"6R-251kt","D":"6R- 259kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 205° thành véc-tơ thổi tới 025°. Cộng véc-tơ TAS 270 kt theo heading 270° với gió 30 kt: track=276.0°T, GS=258.8 kt; drift=6.0° phải. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":270,"heading":270,"windFrom":205,"windSpeed":30,"track":276.032,"GS":258.754,"driftRight":6.032},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":152,"uid":"GNAV-01-152","sourceNumber":152,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aeroplane is circling the Earth following parallel of latitude 60°N at a ground speed of 480 kt. To circle the Earth along the equator in the same amount of time, it should fly at a ground speed of.?","options":{"A":"960 kt.","B":"240 kt.","C":"480 kt.","D":"550 kt."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Chu vi vĩ tuyến 60°=cos 60°=½ chu vi Xích đạo. Muốn cùng thời gian, GS Xích đạo gấp đôi 480 kt, tức 960 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":153,"uid":"GNAV-01-153","sourceNumber":153,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is maintaining a true heading of 052° and overflies two fixes 34 NM apart from each other 13minutes apart. The average true direction from the first fix to the second fix is 047° and the TAS of the aircraft is 130 kts. Calculate the average wind (W/V)","options":{"A":"220°/28 KTS","B":"218°/30 KTS","C":"203° /30 KTS","D":"246°/28 KTS"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 130 kt/052°, GS 156.9 kt/047°. Hiệu véc-tơ cho gió thổi từ 204.5°T, tốc độ 29.7 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":130,"heading":52,"track":47,"GS":156.92307692307693,"windFrom":204.547,"windSpeed":29.667},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":154,"uid":"GNAV-01-154","sourceNumber":154,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The accuracy of the manually calculated DR-position of an aircraft is, among other things, affected by","options":{"A":"The accuracy of the adjustment of the position lines for the motion of the aircraft between the last and the new DR-position.","B":"The flight time since the last position update","C":"The accuracy of the adjustment of the position lines for the motion of the aircraft between the last fix and the DR-position.","D":"The accuracy of the actual wind."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"DR lấy fix đã biết làm gốc, cộng quãng đường và hướng suy từ TAS, heading và gió trong khoảng thời gian đã qua. Sai số vị trí gốc, sai số gió/TAS/heading và thời gian tích lũy đều ảnh hưởng; fix mới là phép xác định vị trí độc lập để kiểm tra DR.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":155,"uid":"GNAV-01-155","sourceNumber":155,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 440 kt, HDG (T) = 349°, W/V = 040/40kt. Calculate the drift and GS?","options":{"A":"2L-420 kt","B":"6L-395 kt","C":"5L-385 kt","D":"4L -415 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 040° thành véc-tơ thổi tới 220°. Cộng véc-tơ TAS 440 kt theo heading 349° với gió 40 kt: track=344.7°T, GS=416.0 kt; drift=4.3° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":440,"heading":349,"windFrom":40,"windSpeed":40,"track":344.714,"GS":415.99,"driftRight":-4.286},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":156,"uid":"GNAV-01-156","sourceNumber":156,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the actual magnetic track of the aircraft. Planned track: 350° (T) Heading: 004°(T). Actual in-flight drift: 12° left. Variation: 23° W","options":{"A":"15° ( M)","B":"239° (M)","C":"001° (M)","D":"039° (M)"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"TH 004°−drift trái 12°=TT 352°T. Variation 23°W: MT=352+23=375°, chuẩn hóa 015°M.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":157,"uid":"GNAV-01-157","sourceNumber":157,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the approximate rate of descent: TAS: 197 kt True course: 240°(T) W/V: 180/30 kt Descent is initiated at FL 220 and completed at FL 40. Distance to be covered during descent: 39 NM","options":{"A":"800 ft/min","B":"950 ft/min","C":"1400 ft/ min","D":"1500 ft/min"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Track 240°, gió 180°/30 kt có headwind 15 kt và crosswind 26 kt. GS≈sqrt(197²−26²)−15≈180 kt. Δh 18.000 ft, t=39/180 × 60≈13 min→ROD≈1.385 ft/min, gần 1.400.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":158,"uid":"GNAV-01-158","sourceNumber":158,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The outer marker of an ILS with a 3° glide slope is located 4.6 NM from the threshold. Assuming a glide slope height of 50 ft above the threshold, the approximate height of an aircraft passing the outer marker is...","options":{"A":"1450 ft.","B":"1300 ft.","C":"1330 ft.","D":"1380 ft."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Height=threshold crossing 50 ft+4,6 × 6.076,1 ×tan 3°≈1.515 ft.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Key 1.450 ft tương ứng quy tắc 300 ft/NM; hình học 3° cho khoảng 1.515 ft. Giữ key nhưng đánh dấu xấp xỉ.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"i cx","question":"An aircraft is flying a 3° glide path and experiences a reduction in groundspeed from 150 kt at the outer marker to 120 kt over the threshold. The effect of this change in groundspeed on the aircraft's rate of descent will be a decrease of approximately...","options":{"A":"150 ft/ min.","B":"100 ft/min.","C":"250 ft/min.","D":"50 ft/min."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"3° path: ΔROD=ΔGS× 6.076,1/60 ×tan 3°=30 × 5,31≈159 ft/min. Quy tắc GS× 5 cho giảm 150 ft/min, phù hợp đáp án xấp xỉ.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":173,"uid":"GNAV-01-173","sourceNumber":173,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft at FL310, M0.83, temperature -30° C, is required to reduce speed in order to cross a reporting point five minutes later than planned. Assuming that a zero wind component remains unchanged, when 360 NM from the reporting point Mach Number should be reduced to:","options":{"A":"M0.76","B":"MO.74","C":"M0.78","D":"M0.80"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"OAT−30°C: LSS≈607,6 kt, TAS old≈504,3 kt. t new=360/504,3+5/60 h; TAS new≈451,5 kt; M new≈0,743, chọn 0,74.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"not s/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":176,"uid":"GNAV-01-176","sourceNumber":176,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is departing from an airport which has an elevation of 2000 ft and the QNH is 1003 hPa. The TAS is 100 kt, the head wind component is 20 kt and the rate of climb is 500 ft/min. Top of climb is FL 050. At what distance from the airport will this be achived?","options":{"A":"7.2 NM","B":"6.6 NM","C":"8.8 NM","D":"10.8 NM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi sân bay elevation 2.000 ft sang pressure altitude: PA=2.000+(1.013−1003)× 30=2300 ft. Height gain tới FL=2700 ft; t=2700/500=5.40 min. GS=100−20=80 kt nên distance=7.20 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":177,"uid":"GNAV-01-177","sourceNumber":177,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what is the TAS? Pressure altitude: 9000 ft OAT: -32°C CAS: 200 kt","options":{"A":"216 kt","B":"212 kt","C":"200 kt","D":"210 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"CAS=200 kt; áp suất ISA tại 9000 ft, OAT=-32.0°C. Đổi CAS sang Mach từ áp suất va rồi TAS=M× 38,97√(273,15+OAT)≈215.5 kt. Tính bằng flight computer có thể chênh vài kt do làm tròn.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":178,"uid":"GNAV-01-178","sourceNumber":178,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate the time from A to B: GS: 435 kt Distance from A to B: 1920 NM","options":{"A":"3 hours 25 minutes","B":"4 hours 10 minutes","C":"3 hours 26 minutes","D":"4 hours 25 minutes"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 1920/435 × 60=264.83 phút, tức 4 giờ 24 phút 50 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":179,"uid":"GNAV-01-179","sourceNumber":179,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is on final approach to runway 32R (QDM 322°). Calculate the aircraft's heading in order to maintain the centreline, given the following information: TAS: 95 kt W/V reported by the tower: 350/20 kt","options":{"A":"316°(M)","B":"326°(M)","C":"328°( M)","D":"322°(M)"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tower wind 350°M/20 kt so với runway 322°M: XWC=20 sin 28°=9,39 kt từ phải. WCA=asin(9,39/95)=5,67°; heading≈327,7°M≈328°M.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":180,"uid":"GNAV-01-180","sourceNumber":180,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the track error angle. Planned track: 252°(T). Actual heading: 252°(T). Actual in-flight drift: 3° right","options":{"A":"3° left","B":"0","C":"6° right","D":"3° right"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Heading 252° bằng planned track nhưng drift phải 3° làm actual track 255°. Track error=255−252=3°phải.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":181,"uid":"GNAV-01-181","sourceNumber":181,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, convert the ground distance to air distance. Ground distance: 120 NM. TAS: 165 kt; IAS: 140 kt; GS: 150 kt","options":{"A":"132 NAM","B":"109 NAM","C":"147 NAM","D":"172 NAM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"NAM=ground distance×TAS/GS=120 × 165/150=132 NAM. Gió ngược làm quãng đường trong khối khí lớn hơn quãng đường trên mặt đất.","status":"derived","method":"air-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":182,"uid":"GNAV-01-182","sourceNumber":182,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft has a TAS of 491 kt and a GS of 441 kt. The aircraft is estimated to cross a meridian at 21:00 UTC. At 20:10 UTC, ATC requests a speed reduction to cross the meridian at 21:05 UTC. What is the approximate reduction in TAS required?","options":{"A":"60","B":"90 kt","C":"40 kt","D":"75 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại 20:10 còn 50 phút theo plan: distance=441 × 50/60=367,5 NM. New time 55 min→GS 400,9 kt. Gió không đổi nên TAS giảm 441−400,9≈40,1 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":183,"uid":"GNAV-01-183","sourceNumber":183,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"A standard instrument departure maintaining the runway heading requires a climb gradient of 6%. From the options below, what is the minimum vertical speed (ft/min) to comply with the departure procedure climb requirements, considering the following information? TAS: 190 kt.; Headwind: 15 kt.","options":{"A":"1300 ft/min","B":"1200 ft/min","C":"1100 ft/ min","D":"900 ft/min"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Gradient 6% nghĩa là tăng/giảm 6 ft trên 100 ft ngang. Với GS 175 kt: VS=6/100 × 175 × 6076,1/60≈1063 ft/min; làm tròn theo yêu cầu tối thiểu.","status":"derived","method":"gradient-rate","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":184,"uid":"GNAV-01-184","sourceNumber":184,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, determine the aircraft's true airspeed (ignore the error of non-alignment of the heading/TAS and the track/GS vectors). Groundspeed: 485 kt; Cruise level: FL340; Outside air temperature: ISA -15°C; Wind component: 35 kt tailwind.","options":{"A":"520 kt","B":"291 kt","C":"326 kt","D":"450 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Bỏ sai lệch heading/track như đề yêu cầu: GS=TAS+TWC nên TAS=485−35=450 kt. OAT và FL không cần khi đã biết GS và wind component.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":185,"uid":"GNAV-01-185","sourceNumber":185,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft travels 100 statute miles in 20 MIN, how long does it take to travel 215 NM?","options":{"A":"50 MIN","B":"100 MIN","C":"90 MIN","D":"80 MIN"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"100 statute miles=86,90 NM trong 20 min→GS 260,7 kt. Time 215 NM=215/260,7 × 60=49,48 min≈50 min.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":186,"uid":"GNAV-01-186","sourceNumber":186,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The wind is blowing 45° from the left of your track at 50kt. Using Mental Dead Reckoning, what is the drift and Wind Correction Angle (WCA) if the TAS is 180 kt?","options":{"A":"12.5° right and the WCA is - 12.5°","B":"14° left and the WCA is +14°","C":"12.5° left and the WCA is +12.5°","D":"14° right and the WCA is -14°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Crosswind=50 sin 45°=35,36 kt. Quy tắc MDR: drift≈60 × 35,36/180≈11,8°, gần 12,5° theo làm tròn của đề. Gió từ trái gây drift phải; WCA chống gió về trái.","status":"limited","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Drift và WCA không hoàn toàn bằng về độ lớn khi có thành phần gió dọc đáng kể; đáp án là xấp xỉ MDR.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":187,"uid":"GNAV-01-187","sourceNumber":187,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: GS = 122 kt. Distance from A to B = 985 NM. What is the time from A to B?","options":{"A":"8 HR 10 MIN","B":"7 HR 49 MIN","C":"7 HR 48 MIN","D":"8 HR 04 MIN"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Thời gian=quãng đường/GS. 985/122 × 60=484.43 phút, tức 8 giờ 4 phút 26 giây. Làm tròn một lần ở kết quả cuối.","status":"derived","method":"time-distance","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":188,"uid":"GNAV-01-188","sourceNumber":188,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: True HDG = 074°, TAS = 230 kt, Track (T) = 066°, GS = 242 kt. Calculate the W/V?","options":{"A":"180/ 35kt","B":"180/30kt","C":"185/35kt","D":"180/40kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Véc-tơ gió=GS−TAS, với cùng mốc True: TAS 230 kt/074°, GS 242.0 kt/066°. Hiệu véc-tơ cho gió thổi từ 180.0°T, tốc độ 35.0 kt; làm tròn theo lựa chọn. Không lấy GS−TAS làm toàn bộ tốc độ gió khi có drift.","status":"derived","method":"vector-subtraction","references":["FAA-NAV"],"calculation":{"TAS":230,"heading":74,"track":66,"GS":242,"windFrom":179.98,"windSpeed":35.034},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":189,"uid":"GNAV-01-189","sourceNumber":189,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, which wind vector should be used to plan the climb? An aircraft has to climb from an airport at an elevation of 3000 ft to a cruising altitude of 30000 ft. The reported surface wind is 2000/20 kt and it is in ISA conditions.The upper winds are: FLO50: 210/25 kt, FL100: 230°/30 kt, FL180: 260/50 kt, FL240: 290°/70 kt, FL300: 320/80 kt, FL340: 345°/90 kt.","options":{"A":"270°/60 kt","B":"260/50 kt","C":"275°/ 60 kt","D":"320°/80 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Độ cao đại diện leo=3.000+⅔(30.000−3.000)=21.000 ft. Nội suy FL 180260°/50 kt và FL 240290°/70 kt cho≈275°/60 kt. Dòng surface 2000 là lỗi chữ số trong nguồn.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":190,"uid":"GNAV-01-190","sourceNumber":190,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given this deviation table of a Direct Reading Compass. To fly 000 030 060 090 120 150 180 210 240 270 300 330 Steer 359 030 061 092 121 150 178 209 242 272 298 331. The Direct Reading Compass indicates a heading 242°. The variation in the area is 22°E. What is the True Heading of the aircraft?","options":{"A":"262°","B":"258°","C":"214°","D":"218°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Trong bảng, CH 242° tương ứng MH 240°, không phải MH 242°. Cộng variation 22°E: TH=240+22=262°T.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":191,"uid":"GNAV-01-191","sourceNumber":191,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Which of these statements best defines the term \"True North\"?","options":{"A":"The direction along the surface of the earth towards the geographic North Pole along the meridian on which you are located","B":"The heading of the aircraft at the time.","C":"The datum from which the aircraft heading is measured.","D":"The direction related to Polaris, the North Star."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"True North là hướng dọc kinh tuyến địa phương về cực Bắc địa lý. Không nhầm cực địa lý với cực từ hoặc hướng kim la bàn bị ảnh hưởng bởi máy bay.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":192,"uid":"GNAV-01-192","sourceNumber":192,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The TT is 215°. TAS is 90 kt. W/V is 260/20 kt. The TH and GS are:","options":{"A":"224° and 75 kt","B":"206° and 103 kt","C":"206° and 75 kt","D":"224° and 103 kt"},"answe ,"question":"The following information is for an aircraft in the cruise. What will be the ground speed? Cruise level: FL410, OAT: ISA +10° C, Mach No.: 0.86, Wind component: 25 kt tailwind.","options":{"A":"504 kt","B":"517 kt","C":"529 kt","D":"479 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"LSS=38,97√(273,15-46.5)=586.7 kt. TAS=0.86 ×LSS=504.5 kt; GS=TAS+25=529.5 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":206,"uid":"GNAV-01-206","sourceNumber":206,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The circumference of the parallel of latitude at 60°N is approximately...","options":{"A":"20000 NM.","B":"34641 NM.","C":"18706 NM.","D":"10800 NM."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Chu vi vĩ tuyến 60°=21.600 cos 60°=10.800 NM. Chu vi Xích đạo là 21.600 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":207,"uid":"GNAV-01-207","sourceNumber":207,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the Rate of Descent (ROD) for the final approach segment of the destination airport, considering the fol s://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":209,"uid":"GNAV-01-209","sourceNumber":209,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"The following information is for an aircraft in the cruise. What will be the ground speed? Cruise level: FL410, OAT: ISA +10° C, Mach No.: 0.86, Wind component: -25 kt","options":{"A":"504 kt","B":"529 kt","C":"479 kt","D":"467 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"LSS=38,97√(273,15-46.5)=586.7 kt. TAS=0.86 ×LSS=504.5 kt; GS=TAS-25=479.5 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":210,"uid":"GNAV-01-210","sourceNumber":210,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Magnetic Heading = 255°, VAR = 40°W, GS = 375 kt, W/V = 235°(T) /120 kt, Calculate the drift angle?","options":{"A":"6° right","B":"6° left","C":"9° left","D":"3° left"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"MH 255°+VAR−40°→TH 215°T. GS 375 kt và gió từ 235°/120 kt: lấy véc-tơ TAS=GS−wind; giải hướng track để heading air vector 215° cho drift khoảng−6°, tức 6°trái.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":211,"uid":"GNAV-01-211","sourceNumber":211,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Half way between two reporting points the navigation log gives the following information: TAS: 360 kt; W/V: 330°(T)/80 kt; Compass heading: 237°; Deviation on this heading: -5°; Variation: 19°W; What is the average ground speed for this leg?","options":{"A":"360 kt","B":"373 kt","C":"403 kt","D":"354 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"CH 237°+dev−5°+VAR−19°=TH 213°T. Cộng véc-tơ TAS 360 kt/213° với gió thổi tới 150°/80 kt cho GS khoảng 403 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":212,"uid":"GNAV-01-212","sourceNumber":212,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What is the great circle distance from (65°30'N, 020°00'W) to (73°29'N, 160°00'E)?","options":{"A":"2461 NM","B":"3782 NM","C":"479 NM","D":"8339 NM"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Hai kinh tuyến chênh 180° nên GC qua cực Bắc. Arc=(90−65°30′)+(90−73°29′)=41°01′=2.461 NM.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":213,"uid":"GNAV-01-213","sourceNumber":213,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what would be the approximate ground speed during a descent from FL200 to an aerodrome (elevation 2000 ft, QNH 1013)?; Descent speed: 200 kt CAS; Average ISA deviation: -7° C; Descent track: 165° (T); 2000 ft W/V: 030° (T)/30 kt; 20 000 ft W/V 090° (T)/60 kt","options":{"A":"242 kt","B":"208 kt","C":"250 kt","D":"234 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Độ cao trung bình hạ=(20.000+2.000)/2=11.000 ft. CAS 200/ISA−7→TAS≈233 kt. Nội suy gió giữa 030°/30 kt và 090°/60 kt rồi giải track 165° cho GS xấp xỉ 242 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"noteVi":"Đề dùng nội suy gió đại diện; tích phân theo từng lớp cho kết quả hơi khác.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":214,"uid":"GNAV-01-214","sourceNumber":214,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"For descent performance calculations, which altitude is used as a reference to calculate the average TAS through the descent?","options":{"A":"two thirds of the way between the cruise altitude and final descent altitude.","B":"the final descent altitude.","C":"one third of the way between the cruise altitude and final descent altitude.","D":"half way between the cruise altitude and final descent altitude"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Để lấy TAS trung bình khi hạ, quy tắc tính DR của bộ đề dùng độ cao ở giữa mức bắt đầu và kết thúc. Quy đổi CAS→TAS tại áp suất/nhiệt độ đại diện đó; gió phải lấy phù hợp với chặng hạ.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":215,"uid":"GNAV-01-215","sourceNumber":215,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"What approximate descent angle is required for an aircraft to descend 13 500 ft over ground distance of 45 NM?","options":{"A":"3°","B":"3.4°","C":"3.3°","D":"5°"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"tanγ=13.500/(45 × 6.076,1)=0,04938; γ=atan(0,04938)=2,83°, gần 3°. Không nhầm tỷ số 4,94% với góc 4,94°.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":216,"uid":"GNAV-01-216","sourceNumber":216,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"At mid- and high latitudes, the inclination of the Earth's spin axis in relation to the plane of rotation around the Sun is the cause of the variable amount of (1)____and the changing duration of (2)___ throughout the year.","options":{"A":"(1) insolation; (2) an apparent solar day.","B":"(1) insolation;( 2) daylight","C":"(1) variation; (2) daylight.","D":"(1) variation; (2) an apparent solar day."},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Trục quay Trái Đất nghiêng khoảng 23,5° so với pháp tuyến của mặt phẳng quỹ đạo, tương đương góc giữa mặt phẳng xích đạo và hoàng đạo. Hai bán cầu nhận bức xạ và độ dài ngày trái mùa; tháng 7 là mùa hè Bắc bán cầu, tháng 1 là mùa hè Nam bán cầu.","status":"derived","method":"authored","references":["USNO-SEASONS"],"referenceRecords":[{"title":"US Naval Observatory · Earth's Seasons","url":"https://aa.usno.navy.mil/faq/rs_solstices","section":"Equinoxes and solstices","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":217,"uid":"GNAV-01-217","sourceNumber":217,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information from the Flight Log what was the average Ground Speed experienced between WARIC and GRAVE? HURLY to WARIC Distance 10 NM; Time over HURLY 18:05 ; Time over WARIC 18:09; WARIC to GRISBY Distance 17NM ; Time over GRISBY 18:16; GRISBY to GRAVE Distance 22 NM ; Time over GRAVE 18:26","options":{"A":"140 kt","B":"146 kt","C":"138 kt","D":"130 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"WARIC→GRAVE distance=17+22=39 NM. Time 18:09→18:26=17 min. GS=39/17 × 60=137,65 kt≈138 kt; không dùng thời gian từ HURLY.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":218,"uid":"GNAV-01-218","sourceNumber":218,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft is planned to fly from position 'A' to position 'B', distance 250 NM at an average GS of 115 kt. It departs 'A' at 0900 UTC. After flying 75 NM along track from 'A', the aircraft is 1.5 MIN behind planned time. Using the actual GS experienced, what is the revised ETA at 'B'?","options":{"A":"1110 UTC","B":"1115 UTC","C":"1044 UTC","D":"1050 UTC"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Plan 75 NM mất 39,13 min; actual 40,63 min→GS≈110,75 kt. Total 250 NM mất 135,44 min từ 09:00→11:15. Chậm 1,5 min phải nhân theo tỷ lệ 250/75.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":219,"uid":"GNAV-01-219","sourceNumber":219,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: True Heading = 180°, TAS = 500 kt, W/V 225°/100 kt, Calculate the GS?","options":{"A":"535 kt","B":"450 kt","C":"435 kt","D":"600 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đổi gió khí tượng từ 225° thành véc-tơ thổi tới 045°. Cộng véc-tơ TAS 500 kt theo heading 180° với gió 100 kt: track=170.6°T, GS=435.1 kt; drift=9.4° trái. Cộng các thành phần đông/bắc, không cộng tốc độ gió vô hướng.","status":"derived","method":"vector-calculation","references":["FAA-NAV"],"calculation":{"TAS":500,"heading":180,"windFrom":225,"windSpeed":100,"track":170.646,"GS":435.074,"driftRi t độ cao 24,000 ft trong 120 NM. GS=288 kt nên t=60 × 120/288=25.00 phút. ROD tối thiểu=24,000/25.00=960 ft/min; dùng mức phù hợp gần đáp án.","status":"derived","method":"descent-calculation","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":222,"uid":"GNAV-01-222","sourceNumber":222,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: Compass Heading = 233°, True Track= 256°, Drift Angle10°R, Deviation= -3° What is the variation?","options":{"A":"36°E","B":"16°E","C":"10°W","D":"20°W"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Compass 233°+deviation−3°=MH 230°. Track 256°−drift phải 10°=TH 246°. Variation=TH−MH=16°E.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":223,"uid":"GNAV-01-223","sourceNumber":223,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Seasons are due to the....?","options":{"A":"Earth's rotation on its polar axis.","B":"Earth's elliptical orbit around the Sun.","C":"variable distance between the Earth and the Sun.","D":"inclination of the polar axis with the ecliptic plane."},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Trục quay Trái Đất nghiê ection":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Using trigonometry, calculate the headwind component, to the nearest full knot, for the following situation. Runway: 31; Surface wind (from ATIS): 265/32 kt; Variation: 18°E","options":{"A":"23 kt","B":"32 kt","C":"29 kt","D":"15 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Runway 31≈310°M. Với AT IS 265°M theo quy ước bộ đề, góc 45°. HWC=32 cos 45°=22,63 kt≈23 kt. Không đổi riêng gió bằng variation 18°E khi đã cùng magnetic.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":256,"uid":"GNAV-01-256","sourceNumber":256,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Using a mechanical computer, calculate the ground speed for the following situation. Track: 264° (T); TAS: 480 kt; Wind velocity: 190° (T)/50 kt","options":{"A":"469 kt","B":"453 kt","C":"463 kt","D":"473 kts"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 264°T với TAS 480 kt và gió 190°/50 kt. WCA=asin[50 sin(190−264)/480]=-5.7°; heading=258.3°T. GS=TAS cos(WCA)−W cos(Δ)=463.8 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":480,"track":264,"windFrom":190,"windSpeed":50,"heading":258.253,"GS":463.806},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning edAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":259,"uid":"GNAV-01-259","sourceNumber":259,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aerodrome is located at Mean Sea Level and its traffic pattern altitude is at 1500 ft. Given the following information, to reach downwind at the traffic pattern altitude, a 3° path descent must be initiated at (1)___ prior to downwind, and it will last for (2)__. Cruise altitude: 4500 ft; Average rate of descent for a 3° path: 850 ft/min","options":{"A":"(1) 25 NM; (2) 5 minutes 30 seconds","B":"( 1) 10 NM;( 2) 3 minutes 30 seconds","C":"(1) 15 NM; (2) 5 minutes 30 seconds","D":"(1) 17 NM; (2) 3 minutes 30 seconds"},"answer":"B","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Height loss=4.500−1.500=3.000 ft. Theo 3°: distance≈3.000/(6.076 tan 3°)=9,42 NM, xấp xỉ 10 NM theo 300 ft/NM. Time=3.000/850=3,53 min≈3 min 30 s.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":260,"uid":"GNAV-01-260","sourceNumber":260,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what groundspeed must be maintained from the fix in order to achieve planned ETA at 'B'? Distance 'A' to 'B': 325 NM Planned groundspeed: 315 kt ATD: 11:30 UTC 12:05 UTC: fix obtained 165 NM along track","options":{"A":"355 kt","B":"395 kt","C":"335 kt","D":"375 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Plan arrival=11:30+325/315 h=12:31:54. Tại 12:05 còn 160 NM, time 26,90 min; GS needed=160 × 60/26,90≈356,9 kt, gần 355 kt.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":261,"uid":"GNAV-01-261","sourceNumber":261,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"An aircraft at latitude 10° North flies south at a groundspeed of 445 km/h. What will be its latitude after 3 hours?","options":{"A":"22°00'S","B":"03°50'S","C":"12°15'S","D":"02°00'S"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Distance=445 × 3=1.335 km≈720,8 NM≈12°vĩ độ. Từ 10°N đi nam 12° tới 02°S.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":262,"uid":"GNAV-01-262","sourceNumber":262,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given: TAS = 227 kt, Track (T) = 3160, W/V = 205/15kt. Calculate the HDG (T) and GS?","options":{"A":"311- 230 kt","B":"310 - 233 kt","C":"313 - 235 kt","D":"312- 232 kt"},"answer":"D","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 316°T với TAS 227 kt và gió 205°/15 kt. WCA=asin[15 sin(205−316)/227]=-3.5°; heading=312.5°T. GS=TAS cos(WCA)−W cos(Δ)=231.9 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":227,"track":316,"windFrom":205,"windSpeed":15,"heading":312.463,"GS":231.943},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":263,"uid":"GNAV-01-263","sourceNumber":263,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, calculate (1) the heading required and (2) the groundspeed. Required track: 230°(T). Wind velocity: 315°(T)/45 kt. TAS: 320 kt","options":{"A":"(1) 222°(T); (2) 334 kt","B":"(1) 238°(T); (2) 320 kt","C":"(1 ) 238°(T); ( 2) 312 kt","D":"(1) 222°(T); (2) 324 kt"},"answer":"C","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Giữ track 230°T với TAS 320 kt và gió 315°/45 kt. WCA=asin[45 sin(315−230)/320]=+8.1°; heading=238.1°T. GS=TAS cos(WCA)−W cos(Δ)=312.9 kt; t=60 D/GS nếu đề hỏi thời gian.","status":"derived","method":"wind-triangle","references":["FAA-NAV"],"calculation":{"TAS":320,"track":230,"windFrom":315,"windSpeed":45,"heading":238.053,"GS":312.922},"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":264,"uid":"GNAV-01-264","sourceNumber":264,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"For climb performance calculations, which altitude is used as a reference to calculate the average TAS through the climb? The altitude that is...","options":{"A":"two thirds of the climb between take-off and cruise altitudes.","B":"one third of the climb between take-off and cruise altitudes.","C":"half of the climb between take-off and cruise altitudes.","D":"the final cruising altitude."},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Đối với leo, quy tắc DR trong bộ đề lấy độ cao đại diện tại hai phần ba độ cao tăng được kể từ sân bay: hr ef=he le v+⅔(h cruise−he le v). Đây là xấp xỉ lập kế hoạch, không thay cho climb table của AFM.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":265,"uid":"GNAV-01-265","sourceNumber":265,"section":1,"sourceFile":"GNAV-01 BASIC NAV (308) - Có Hình.docx","question":"Given the following information, what is the change in TAS if the CAS of an aircraft is reduced from 130 kt to 105 kt? Altitude: FL70; OAT: +25° C","options":{"A":"29 kt","B":"27 kt","C":"22 kt","D":"31 kt"},"answer":"A","valid":true,"red":false,"topic":"Basic navigation","review":{"vi":"Tại FL 70/OAT 25°C dùng cùng áp suất cho CAS 130 và 105. Đổi CAS→TAS từng mức rồi trừ; tính flight computer cho khoảng 29 kt. Không lấy CAS chênh 25 kt làm TAS chênh vì mật độ khác mực nước biển.","status":"derived","method":"worked-steps","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight plann
