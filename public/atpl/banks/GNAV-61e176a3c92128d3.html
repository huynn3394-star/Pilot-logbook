imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":336,"uid":"GNAV-02-028","sourceNumber":28,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following statements most accurately describes the appearance of parallels of latitude on a polar stereographic chart? Parallels of latitude appear as....?","options":{"A":"curves convex to straight lines on the chart.","B":"straight lines intersecting with meridians at 90°.","C":"curves concave to the equator.","D":"concentric circles around the pole."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên Polar Stereographic, các vĩ tuyến là các vòng tròn đồng tâm quanh cực; kinh tuyến là các đường thẳng tỏa ra từ cực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":337,"uid":"GNAV-02-029","sourceNumber":29,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The distance measured between two points on a navigation map is 42 mm (millimetres). The scale of the chart is 1:1 600 000. The actual distance between these two point is approximately:","options":{"A":"67.20 NM","B":"370.00 NM","C":"3.69 NM","D":"36.30 NM"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"42 mm× 1.600.000=67.200.000 mm=67,2 km. Đổi NM:67,2/1,852=36,29 NM≈36,30 NM.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":338,"uid":"GNAV-02-030","sourceNumber":30,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A chart has the scale 1: 1 000 000. From A to B on the chart measures 3.8 cm, the distance from A to B in NM is:","options":{"A":"70.4","B":"20.5","C":"205","D":"38"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"3,8 cm× 1.000.000=38 km. Distance NM=38/1,852=20,52 NM≈20,5 NM.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":339,"uid":"GNAV-02-031","sourceNumber":31,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Lambert conformal conic chart, the distance between parallels of latitude spaced the same number of degrees apart:","options":{"A":"is smaller between the standard parallels than outside them.","B":"is larger between the standard parallels and is smaller outside them","C":"is constant throughout the chart","D":"is constant between the standard parallels and is greater outside them"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Lambert hai vĩ tuyến chuẩn có scale đúng trên hai vĩ tuyến đó, nhỏ hơn nominal ở giữa và lớn hơn ở ngoài. Vì vậy khoảng cách các vĩ tuyến bằng nhau có thể gần nhau hơn ở dải giữa chuẩn; không chỉ so độ lớn vĩ độ.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":340,"uid":"GNAV-02-032","sourceNumber":32,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"According to ICAO Annex 4 Aeronautical charts (Appendix 3 Colour Guide) what colour is recommended for depicting contours","options":{"A":"Blue","B":"Brown","C":"Green","D":"Yellow"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Theo quy ước chart ICAO của bộ đề, contour địa hình dùng màu nâu. Phải đọc legend thực tế vì các loại đường, ranh giới và lớp màu có ký hiệu riêng.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":341,"uid":"GNAV-02-033","sourceNumber":33,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"How does the scale vary on a Direct Mercator chart?","options":{"A":"The scale is constant.","B":"The scale decreases with increasing distance from the Equator.","C":"The scale increases south of the Equator and decreases north of the Equator.","D":"The scale increases with increasing distance from the equator"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Mercator có local scale factor tỷ lệ sec φ=1/cosφ. Xa Xích đạo, cosφ giảm và scale phóng lớn; ở cực nó tiến vô hạn, không thể biểu diễn cực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":342,"uid":"GNAV-02-034","sourceNumber":34,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The chart that is generally used for navigation in polar areas is based on a:","options":{"A":"Stereographical Projection","B":"Direct Mercator projection","C":"Lambert conformal projection","D":"Gnomonic projection"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Polar Stereographic được dùng cho vùng cực vì có thể biểu diễn cực và giữ góc địa phương. Mercator trực tiếp không chứa được cực do scale vô hạn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":343,"uid":"GNAV-02-035","sourceNumber":35,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Where on a Direct Mercator projection is the chart convergency correct compared to the Earth convergency?","options":{"A":"All over the chart.","B":"At the Equator","C":"At the poles.","D":"At the two parallels of tangency."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Mercator có chart convergence 0 ở mọi nơi. Earthconvergence≈Δλ sinφ chỉ bằng 0 tại Xích đạo, do đó chỉ ở đó hai hội tụ trùng nhau.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":344,"uid":"GNAV-02-036","sourceNumber":36,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following statements describes the appearance of a great circle route on a Direct Mercator chart?","options":{"A":"curve concave to the nearest pole.","B":"straight line.","C":"curve concave to the equator","D":"rhumb line."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên Mercator, GC không phải kinh tuyến/Xích đạo là đường cong uốn về phía cực, nghĩa lõm về Xích đạo. Không nhầm với rhumb line thẳng.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":345,"uid":"GNAV-02-037","sourceNumber":37,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What advantage is there in keeping a VFR chart oriented to track direction while navigating visually in-flight?","options":{"A":"The chart can be folded and stored more easily in-flight.","B":"Aeronautical and topographical information can be easily read.","C":"Visualisation of the surrounding terrain may be easier","D":"Estimation of track direction while diverting is simpler."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Xoay chart theo track làm hướng các địa vật trên giấy gần khớp cảnh nhìn phía trước, dễ liên hệ địa hình và trái/phải. Đổi lại chữ có thể khó đọc hơn hướng North-up.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":346,"uid":"GNAV-02-038","sourceNumber":38,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"(For this question use the image or VFR chart ED-4 from the Jeppesen GSPRM 2017). A pilot is planning a VFR flight from aerodrome Arnbruck (EDNB) (N49°08', E012°59') to aerodrome Hohenfels (ETIH) (N49°13', E011°50'), departing at midday. What option describes the best means of checking the groundspeed?","options":{"A":"The parallel river running through the town of Nittenau (N49°12'E012°18\").","B":"The road A93, which crosses the track","C":"Passing abeam (opposite) the lighted mast at N49°03', E012°10'.","D":"Passing abeam Griesau aerodrome (EDPG) (N48°57', E012*25\")."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Đường A 93 cắt track rõ ràng cho mốc giờ đi qua, phù hợp kiểm tra GS với một mốc trước đã biết. Địa vật song song route phù hợp hơn cho sai lệch ngang; đọc đúng vị trí cắt trên ảnh chart.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":["05cc6422db96939de39eb11ee090d24ebc9a3f07184b5365acbc4c189dbdebda.webp"],"sourceScreenshots":["042ace8660554fc00d8834d0bcb70d4bd8ff167404b80dc13f75729f9ff96534.webp"],"figureBlocked":false},{"id":347,"uid":"GNAV-02-039","sourceNumber":39,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What is the only advantage in keeping a VFR chart orientated to True North while navigating visually in-flight?","options":{"A":"Visualisation of the surrounding terrain may be easier.","B":"Line features can be identified and followed more easily.","C":"Aeronautical and topographical labels can be easily read","D":"The chart can be folded and stored more easily in-flight."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"North-up giữ chữ và nhãn chart dễ đọc vì cùng hướng in. Track-up thường trực quan địa hình hơn; câu hỏi chỉ tìm ưu điểm đọc nhãn của North-up.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":348,"uid":"GNAV-02-040","sourceNumber":40,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"(See Image). A pilot has planned a flight from aerodrome Strunkovice (LKSR) (N49°05', E014°04') to aerodrome Hohenfels (ETIH) (N49°13', E011°50') using the route shown on the annex. The pilot has been looking out while the aircraft has been drifting to the right of track. NOT looking at the stop watch, he/she mistakes EDNF (N48°50', E013°22') for EDMV (N48°38', E013°12') and turns right for the next leg. Seeing the mast, with elevation 3754 ft (N48°49', E013°13'), there are doubts about the aircraft's position. What is the best option to follow in order to re-establish the aircraft's position?","options":{"A":"Circle to establish the aircraft's exact position.","B":"Continue on the present heading in order to reach the next waypoint","C":"Climb to a higher level, reverse track back to aerodrome Strunkovice, and re-route from there.","D":"Tune in the RODING ( RDG) VOR/ DME to confirm the aircraft's position and re-route accordingly."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Khi đã nhận nhầm EDNF thành EDMV, phải lấy fix độc lập thay vì tiếp tục bám route đã sai. RDG VOR/DME cho radial và range để xác định vị trí rồi lập đường mới; vẫn phải giữ an toàn bay và VMC.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":["ebc2eba6bc56ad26e8e73f03683c9cbe7569bffd870c09dfd2a1762966e74741.webp"],"sourceScreenshots":["04d354f97665cacba72629e021b421b29744c074c72af635966905fbd6ad40cd.webp"],"figureBlocked":false},{"id":349,"uid":"GNAV-02-041","sourceNumber":41,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is planning a VFR flight close to controlled airspace. Due to airspace restrictions, part of the flight will be flown at low level. Compared to flying at a greater height above the ground, which of the following is a problem of navigation at low level that should be considered when planning the flight?","options":{"A":"Features with great vertical extent are harder to see.","B":"The feeling that you are flying more slowly over the ground changes how you perceive distance.","C":"Navigation features can be noticed more easily, but are more difficult to identify.","D":"Visual range to the horizon is restricted at low level."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Ở thấp, chân trời hình học gần hơn và địa vật che khuất nhau nhiều hơn. Thời gian nhận dạng landmark ngắn hơn, nên cần checkpoint rõ và chuẩn bị trước.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":350,"uid":"GNAV-02-042","sourceNumber":42,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"You are planing a VFR flight in the day. Due to weather delays you must now undertake the flight at night in clear weather. What hazard could pose the greatest threat to your flight?","options":{"A":"Reduced visibility to identify features planned for navigation in the day","B":"Difficulty recognising towns (including well lit ones).","C":"Tall masts or other well lit obstacles.","D":"Difficulty recognising the aerodrome beacon."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Các checkpoint chọn cho ban ngày có thể không nhận ra bang đêm dù không mây. Phải lập lại kế hoạch với cue đêm, địa hình/chướng ngại, ánh sáng và sân bay phù hợp; không chỉ giữ nguyên route ban ngày.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":351,"uid":"GNAV-02-043","sourceNumber":43,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The pilot is in radio contact with an Air Traffic Control unit, but has become unsure of the aircraft's position. What should be the pilot's initial action(s) if fuel is NOT critical?","options":{"A":"Change frequency to 121.5 MHz and make an urgency (PAN) call.","B":"Turn back towards the aircraft's last confirmed position.","C":"Note the time and request assistance from the ATC unit","D":"Continue to fly on the current heading until position is established."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Khi chưa chắc vị trí: ghi giờ, giữ kiểm soát máy bay và khoảng cách địa hình, thông báo/request assistance với ATC; dùng VOR/DME hoặc nguồn fix độc lập phù hợp. Không tiếp tục đoán một turning point rồi đổi hướng nhiều lần làm mất dấu DR.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":352,"uid":"GNAV-02-044","sourceNumber":44,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"When a chart meets the ICAO recommendations for conformity, what does this mean when using this chart for navigational purposes?","options":{"A":"For two same sized squares drawn on the chart at different locations, the underlying ground area on Earth will have the same surface size.","B":"A straight line drawn on the chart will approximate a great Circle","C":"Meridians are printed as vertical lines perpendicular to the edges of the chart.","D":"A straight line on the chart between two points does NOT necessarily represent the shortest ground distance between those two points."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Conformal nghĩa giữ góc/shape địa phương, không tự động bảo đảm mọi đường thẳng là GC. KeyB có ý nghĩa xấp xỉ trên chart đường dài thích hợp, nhưng không phải định nghĩa tổng quát của conformal it y.","status":"limited","method":"authored","references":["FAA-NAV"],"noteVi":"Một Mercator vẫn conformal nhưng đường thẳng là RL; không coi lựa chọn B là định nghĩa phổ quát.","missingFigure":true,"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":true},{"id":353,"uid":"GNAV-02-045","sourceNumber":45,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which one of the following statements is correct concerning the appearance of great circles, with the exception of meridians, on a Polar Stereographic chart?","options":{"A":"The higher the latitude,the closer they approximate to a straight line.","B":"Any straight line is a great circle.","C":"They are curves convex to the Pole.","D":"They are complex curves that can be convex and/or concave to the Pole."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Stereographic biểu diễn GC không qua cực thành đường cong; ở vùng vĩ độ cao chúng gần đường thẳng hơn. Kinh tuyến đi qua cực là đường thẳng chính xác.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":354,"uid":"GNAV-02-046","sourceNumber":46,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A Lambert conformal conic chart has a constant of the cone of 0.80. A straight line course drawn on this chart from A (53°N 004°W) to B is 080° at A; course at B is 092°(T). What is the longitude of B?","options":{"A":"009°36'E","B":"019°E","C":"011°E","D":"008°E"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Chart convergence=92−80=12°. Với n 0,80: Δλ=12/0,8=15°. Đi đông từ 004°W 15°tới 011°E.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":355,"uid":"GNAV-02-047","sourceNumber":47,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A straight line from A (53°N, 155°W) to B (53°N, 170°E) is drawn on a Lambert cles appear as being further away than they actually are, giving the impression that there is adequate avoidance time."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Lệch route nhất là ban đêm có thể đưa máy bay vào vùng chướng ngại chưa được rà soát, khó thấy cả khi visibility tốt. Vì vậy route đã được chuẩn bị là phần quan trọng của an toàn bay.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":359,"uid":"GNAV-02-051","sourceNumber":51,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Direct Mercator, rhumb lines are..?","options":{"A":"curves concave to the Equator.","B":"straight lines.","C":"ellipses.","D":"curves convex to the Equator."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Mercator làm mọi rhumb line thành đường thẳng vì giữ góc với các kinh tuyến song song. GC thường là đường cong, ngoại trừ kinh tuyến và Xích đạo.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":360,"uid":"GNAV-02-052","sourceNumber":52,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The standard parallels o ved","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":367,"uid":"GNAV-02-059","sourceNumber":59,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The long-term periodic change in the Earth's magnetic field...","options":{"A":"is caused by the westerly movement of the geographic North Pole.","B":"is reflected in the slow movement of the magnetic poles","C":"is caused by sunspot activity.","D":"mainly affects compass deviation."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Biến đổi từ trường dài hạn thể hiện bằng dịch chuyển cực từ và isogonic lines. Nó khác nhiễu loạn ngắn hạn do bão từ hoặc từ trường máy bay.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":368,"uid":"GNAV-02-060","sourceNumber":60,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What is the latitude change from A (50°50'47\"N, 004°21'09\"E) to B (34°24′36′′N, 004°21'09\"E)?","options":{"A":"85°15'23\"S","B":"16°26'11\"N","C":"16°26'11\"S","D":"85°15'23\"N"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"50°50′47″N−34°24′36″N=16°26′11″về nam. Cùng kinh tuyến nên không cần đổi chênh kinh độ.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":369,"uid":"GNAV-02-061","sourceNumber":61,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"When descending on a 3° path with an average rate of descent of 1600 ft/min from 10000 ft to 2000 ft, you will cover a distance of (1)______,in (2)_______","options":{"A":"(1 ) 27 NM; ( 2) 5 minutes","B":"(1) 33 NM; (2) 6 minutes 15 seconds","C":"(1) 56 NM; (2) 6 minutes 15 seconds","D":"(1) 44 NM; (2) 5 minutes"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Δh=10.000−2.000=8.000 ft; t=8.000/1.600=5 min. Dist an theo công thức 3°≈25,1 NM; quy tắc 300 ft/NM cho 26,7 NM≈27 NM như key.","status":"limited","method":"authored","references":["FAA-NAV"],"noteVi":"Khoảng 27 NM là xấp xỉ 300 ft/NM, không phải tan(3°) chính xác.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":370,"uid":"GNAV-02-062","sourceNumber":62,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft is flying at FL300. The approach to the aerodrome is being prepared by the crew. Calculate the TAS at FL180 with the following data: Constant CAS during descent: 180 kt, Descent: from FL300 to FL50, Average headwind component: 35 kt, Outside Air Temperature: ISA -10° C.","options":{"A":"238 kt","B":"234 kt","C":"222 kt","D":"199 kt"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Dùng đúng mức FL 180 đề hỏi, không phải mức cruise FL 300. ISA ở 18.000 ft≈−20,7°C; ISA−10→OAT≈−30,7°C. Đổi CAS 180 qua áp suất ISA cho TAS≈234 kt; headwind không đổi TAS.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":371,"uid":"GNAV-02-063","sourceNumber":63,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Given the following information, calculate the current in-flight true (°(T)) wind velocity. Cruise Level: FL410 M: 0.82 OAT: ISA -10°C, Wind Component: +25 kt; Heading: 130°(M), Variation: 40°W; Track: 122°(M)","options":{"A":"237°/70 kt","B":"197°/ 70 kt","C":"277°/70 kt","D":"154°/70 kt"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"FL 410 ISA−10→OAT−66,5°C; LSS≈560 kt, TAS≈459 kt. Heading 130°M−40°=090°T; track 122°M−40°=082°T; GS≈484 kt. Hiệu véc-tơ GS−TAS cho gió khoảng 197°T/70 kt.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":372,"uid":"GNAV-02-064","sourceNumber":64,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following variables affect deviation?1-Magnetic latitude ;2-Aircraft heading;3-Aircraft altitude;4-Aircraft electronic equipment","options":{"A":"2 and 3 only","B":"1,2, and 4","C":"3 and 4 only","D":"1, 2, and 3"},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Deviation phụ thuộc heading và từ trường máy bay/thiết bị. Cảm ứng từ cũng thay đổi theo vĩ độ từ, nên chọn 1,2,4; độ cao không phải yếu tố chính trong câu hỏi.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":373,"uid":"GNAV-02-065","sourceNumber":65,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Please refer to the annex. On the contour map, the steepest terrain slope is indicated by...?","options":{"A":"number 1.","B":"number 4.","C":"number 3.","D":"number 2."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên cùng chart, contour spacing nhỏ nhất cho biết dốc lớn nhất vì cùng height interval diễn ra trên cự ly ngắn. Word không đính kèm hình annex để xác nhận nhãn 4.","status":"limited","method":"authored","references":["FAA-NAV"],"noteVi":"Thiếu hình annex trong nguồn Word.","referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":["b2b9c49386cd673d4ddc56888a36c9170ba8ee7055235fe6ac18296867f7f769.webp"],"sourceScreenshots":["04c675f63a8e8b1d9af127886a8b5145262990315e83c5ab8e833618689780b0.webp"],"figureBlocked":false},{"id":374,"uid":"GNAV-02-066","sourceNumber":66,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following visual checkpoints are suitable for a VFR navigation flight when the underlying terrain is fully covered by fresh snow? 1. Farm land and vegetation; 2. Roads, 3. Railroads, 4. Large waterways, 5. Vertical checkpoints (e.g. broadcast antennas), 6. Coastlines.","options":{"A":"1,4, and 6","B":"2, 3, and 4","C":"4,5, and 6","D":"1, 2, 3, and 5"},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Tuyết che lấp màu sắc cánh đồng, đường nhỏ và đường sắt. Vùng nước lớn, checkpoint thẳng đứng và bờ biển có khả năng còn nhận dạng hơn:4,5,6; vẫn cần xét băng tuyết thực tế.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":375,"uid":"GNAV-02-067","sourceNumber":67,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is on a VFR navigation flight from A (50°N, 005°E) to B (51°N, 005°E). The track is presented by a straight line on their map. Which of the following visual landmarks is/are suitable to determine a small deviation off the planned track?","options":{"A":"A railroad crossing the track from East to West.","B":"Four windmills on the horizon, with one located at each of the cardinal points (North, South, East and West)","C":"A big city, some 15 NM West of the planned track.","D":"A large waterway running from North to South along the track."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Track A→B ở cùng kinh tuyến là bắc–nam. Tuyến nước lớn chạy bắc–nam dọc track giúp nhận ngay máy bay ở trái/phải đường; không cần tuyến dọc để đo GS.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":376,"uid":"GNAV-02-068","sourceNumber":68,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Which of the following situations is most likely to increase the possibility of Controlled Flight Into Terrain (CFIT) during a VFR flight?","options":{"A":"High humidity and unstable air","B":"Significant thermal turbulence","C":"Flying overwater with a strong surface wind","D":"Overcast sky and snow-covered terrain."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trời overcast cộng địa hình tuyết làm mất contrast và chân trời, giảm cues độ cao dễ dẫn đến CFIT. Visibility ngang danh nghĩa không loại bỏ whiteout.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":377,"uid":"GNAV-02-069","sourceNumber":69,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot is planning a VFR flight across steep, mountainous terrain. Due to airspace restrictions, the flight will be relatively low above the terrain. Restrictions in VFR navigation in such circumstances can include...","options":{"A":"a shorter visual range for navigation features that are down slope, compared to the visual range for similar features situated on flat land.","B":"poor visibility in the valleys when the flight is taking place at mid-day.","C":"a shorter time to see navigation features on the near side of valleys,compared to when flying over a flat landscape.","D":"difficulty in identifying navigation features that are situated on ridges."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Núi che khuất landmark ởt hung lũng tới khi máy bay gần tới, cho thời gian nhận dạng ngắn hơn địa hình phẳng. Chọn checkpoint trước và đường bay giữ terrain clearance không phụ thuộc vào nhận dạng muộn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":378,"uid":"GNAV-02-070","sourceNumber":70,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A pilot has prepared for a VFR flight in daytime. The flight is delayed, and the pilot decides to carry out the flight late at night, with clear weather and good visibility forecast. Which of the following is the most significant hazard that the pilot should consider when re-planning for the night flight?","options":{"A":"Limited visibility of settlements, including well-lit towns.","B":"Greater hazard associated with lit obstacles such tall masts at night, compared to during the day.","C":"Limited visibility of navigation features that were selected for the original plan","D":"Difficulty in identifying airfields by their beacons."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Các checkpoint chọn cho ban ngày có thể không nhận ra bang đêm dù không mây. Phải lập lại kế hoạch với cue đêm, địa hình/chướng ngại, ánh sáng và sân bay phù hợp; không chỉ giữ nguyên route ban ngày.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":379,"uid":"GNAV-02-071","sourceNumber":71,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What will be the risk if a night VFR flight navigates out of the studied route?","options":{"A":"Obstacles may be present in an area not studied before the flight","B":"Obstacles seem to be closer.","C":"Airports may be difficult to identify due to their lighting.","D":"Obstacles marked on the chart in red may not be seen if you are using a red wavelength light/torch."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Khi rời route đã khảo sát ban đêm, có thể gặp địa hình hoặc vật cản chưa được đánh giá và khó thấy. Không dùng trời quang/full moon như bảo đảm địa hình and toàn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":380,"uid":"GNAV-02-072","sourceNumber":72,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"During a visual flight, a useful method for a pilot to resolve any uncertainty in the aircraft's position is to maintain visual contact with the ground and....?","options":{"A":"fly reverse headings and associated timings until the point of departure is regained.","B":"fly expanding circles until a pinpoint is obtained.","C":"fly the reverse of the heading being flown prior to becoming uncertain until a pinpoint is obtained.","D":"set the heading towards a line feature such as a coastline,motorway,river or railway."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Tuyến lớn như bờ biển, s ô ng, motorway hoặc railway có thể làm catching feature để khôi phục vị trí, với giả định vẫn giữ visual ground contact và terrain clearance. Không đuổi theo địa vật nếu vi phạm khoảng cách an toàn.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":381,"uid":"GNAV-02-073","sourceNumber":73,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The feature in the annex is used as a departure and arrival waypoint when leaving the training sector for a navigation flight. On a winter day, during a special VFR flight with low clouds, reduced visibility, and a snowy surface, this waypoint...","options":{"A":"is easily noticeable because it is much larger than the surrounding terrain.","B":"will be undetectable because it has a limited vertical extent, compared to the surrounding terrain.","C":"is easily noticeable because it has a distinct rectangular shape.","D":"might disappear in the grey- white landscape."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Ảnh nguồn là công trình màu sáng trên nền tuyết/xám; khi mây thấp và contrast kém nó có thể hòa vào nền. Một địa vật tốt ngày thường không bảo đảm tốt trong mọi thời tiết.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":["c7911d8e44b94bbbac11e9614e3c8a5b70a3ba5667838d436882a061b8250acd.webp"],"sourceScreenshots":["498ec1aa990b72df1cd00930ef35bb667c4d83e24fa3c1366cc12ff3b377570d.webp"],"figureBlocked":false},{"id":382,"uid":"GNAV-02-074","sourceNumber":74,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"You are flying VFR on a cloudless night with a full moon, what factor has to be considered when planning the route.","options":{"A":"Roads (even when well-lit) will be difficult to identify.","B":"Small rivers will be easy to see.","C":"Visibility will be reduced when flying towards the moon.","D":"Colours will be difficult to identify"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Thị giác đêm dùng que võng mạc nhiều hơn, nên phân biệt màu kém. Moon light có thể giúp thấy hình dạng nhưng không khôi phụ ct hoàn khả năng nhận màu ban ngày.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":383,"uid":"GNAV-02-075","sourceNumber":75,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What is correct as regards the properties of a Great Circle?","options":{"A":"The lattitudes of both vertices are of different values, the longitudes are equal although respectvely East and West.","B":"The interception point of a great circle and the Equator are named \"the vertices\", which are positioned 180° apart in longitude.","C":"Both vertices of a great circle are positioned at the same latitude and 180° apart in longitude on the same hemisphere.","D":"Both vertices of a great circle are situated at the same distance respectively North and South of the Equator and 180° apart in longitude"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Hai đỉnh của GC đối xứng qua xích đạo, cùng độ lớn vĩ độ và lệch nhau 180°kinh độ. Đỉnh Bắc là điểm tối cao, bên kia cầu là đỉnh Nam.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":384,"uid":"GNAV-02-076","sourceNumber":76,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Parallels of latitude, except the equator, are:","options":{"A":"Rhumb Lines","B":"Great Circles","C":"Both Rhumb Lines and Great Circles","D":"Neither Rhumb Lines nor Great Circles"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Dọc vĩ tuyến là giữ hướng đông/tây 090°/270°tại mọi kinh tuyến, tức RL. Chỉ Xích đạo đồng thời là GC; các vĩ tuyến khác là small circles.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":385,"uid":"GNAV-02-077","sourceNumber":77,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"What is the only true great circle on the surface of the WGS-84 ellipsoid?","options":{"A":"The prime meridian.","B":"The great circle that is co- incident with the Equator","C":"The track along any meridian from pole to pole.","D":"The great circle that crosses the Equator at 045°(T)."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên ellipsoid tròn xoay WGS-84, Xích đạo là tiết diện tròn qua tâm; tiết diện kinh tuyến là ellipse. Đề dùng nghĩa chặt chẽ của greatcircle khác mô hình Trái Đất cầu thông thường.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":386,"uid":"GNAV-02-078","sourceNumber":78,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Your destination aerodrome on the Northern Hemisphere has a higher latitude that the departure aerodrome of your flight. To determine the shortest ground distance, you plot a straight line between the departure and destination aerodrome. You plan to navigate the flight exactly over the plotted line approximating the great circle. Your destination is in a westerly direction. Which of the following statements is correct with respect to this flight?","options":{"A":"Due to Earth convergence,the track direction will continuously decrease during the flight.","B":"Convergence decreases with increasing latitude.","C":"Due to the increase in latitude, the final track angle at the destination will be higher than at the departure.","D":"As great circle tracks are plotted as straight lines, they do NOT have a changing track direction."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Ở Bắc bán cầu trên GC đi tây, track True giảm dần do kinh tuyến hội tụ. Không thể giữ TH/TT không đổi mà vẫn theo GC trong tình huống này.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":387,"uid":"GNAV-02-079","sourceNumber":79,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft is in the position (86°N, 020°E). When following a Rhumb Line Track of 085°(T) it will:","options":{"A":"Follow a small circle which lies to the North of the parallel of 86°N.","B":"Fly via a spiral to the North Pole","C":"Fly to the north via an arbitrary line.","D":"Follow a line which lies at first to the North of the parallel of 86°N but after having passed a DL of 180° to the South of it."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"RL 085°luôn có thành phần bắc nhỏ. Gần 86°N, các kinh tuyến hội tụ nhanh khiến tuyến xoắn dần tới cực Bắc; không phải vĩ tuyến 85°/86°cố định.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":388,"uid":"GNAV-02-080","sourceNumber":80,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft is following the 45°N parallel of latitude. The track followed is a:","options":{"A":"great circle","B":"constant-drift track","C":"constant-heading track","D":"rhumb line"},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Dọc vĩ tuyến là giữ hướng đông/tây 090°/270°tại mọi kinh tuyến, tức RL. Chỉ Xích đạo đồng thời là GC; các vĩ tuyến khác là small circles.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":389,"uid":"GNAV-02-081","sourceNumber":81,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"An aircraft follows a great circle in the Northern Hemisphere. As the aircraft continues beyond the point where the track is 270°(T), the great circle track angle will..?","options":{"A":"decrease and the latitude will increase.","B":"decrease and the latitude will decrease.","C":"increase and the latitude will decrease.","D":"increase and the latitude will increase."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Track 270°trên GC đi tây Bắc bán cầu xảy ra ở đỉnh Bắc. Sau đỉnh máy bay đi nam và track giảm dưới 270°.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":390,"uid":"GNAV-02-082","sourceNumber":82,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Lambert conformal conic chart, with two standard parallels, the quoted scale is correct:","options":{"A":"along the two standard parallels","B":"along the parallel of origin.","C":"along the prime meridian.","D":"in the area between the standard parallels."},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Lambert secant có hai vĩ tuyến chuẩn, where nominal scale chính xác. Giữa hai chuẩn scale nhỏ hơn, ngoài hai chuẩn scale lớn hơn; parallel of origin không nhất thiết trùng standardparallel.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":391,"uid":"GNAV-02-083","sourceNumber":83,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Lambert Conformal Conic chart earth convergency is most accurately represented at the:","options":{"A":"parallel of origin","B":"north and south limits of the chart","C":"standard parallels","D":"Equator"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Chart convergence=nΔλ. Nó trùng Earthconvergence≈Δλ sinφ tại φ origin với n=sinφ origin; ngoài vĩ độ đó có khác biệt.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":392,"uid":"GNAV-02-084","sourceNumber":84,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"The nominal scale of a Lambert conformal conic chart is the","options":{"A":"Scale at the Standard Parallels","B":"Mean scale between the parallels of the secant cone","C":"Mean scale between pole and equator","D":"Scale at the equator"},"answer":"A","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Lambert secant có hai vĩ tuyến chuẩn, where nominal scale chính xác. Giữa hai chuẩn scale nhỏ hơn, ngoài hai chuẩn scale lớn hơn; parallel of origin không nhất thiết trùng standardparallel.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":393,"uid":"GNAV-02-085","sourceNumber":85,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"On a Lambert Conformal Conic chart great circles that are not meridians are:","options":{"A":"straight lines regardless of distance.","B":"curves concave to the parallel of origin","C":"curves concave to the pole of projection.","D":"straight lines within the standard parallels."},"answer":"B","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên Lambert, GC thường cong rất nhẹ với bề lõm hướng về vĩ tuyến gốc; kinh tuyến là đường thẳng. Không biến đặc điểm “xấp xỉ thẳng” thành “luôn thẳng chính xác”.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":394,"uid":"GNAV-02-086","sourceNumber":86,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"A rhumb line on a Direct Mercator chart appears as a...?","options":{"A":"complex curve.","B":"curve convex to the nearer pole.","C":"straight line.","D":"small circle concave to the nearer pole."},"answer":"C","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Mercator làm mọi rhumb line thành đường thẳng vì giữ góc với các kinh tuyến song song. GC thường là đường cong, ngoại trừ kinh tuyến và Xích đạo.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":395,"uid":"GNAV-02-087","sourceNumber":87,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGHT RULES NAVIGATION (93) - Có Hình.docx","question":"Two positions at the same latitude are marked on a Polar Stereographic chart and the meridians at those positions converge with an angle of 30°. The effect of this convergence is that the true track of....?","options":{"A":"the rhumb line and great circle route between those two positions will differ by 30° at either position.","B":"the great circle route between those two positions will change by 30°.","C":"the rhumb line route between those two positions will change by 30°.","D":"a straight line drawn between those two positions will change by 30°."},"answer":"D","valid":true,"red":false,"topic":"Visual navigation","review":{"vi":"Trên Polar Stereographic, hệ số hội tụ bằng 1 nên chart convergence=Δλ=30°. Với đường thẳng nối hai điểm, track True thay đổi 30°do vòng kinh tuyến xung quanh cực.","status":"derived","method":"authored","references":["FAA-NAV"],"referenceRecords":[{"title":"FAA · Pilot’s Handbook of Aeronautical Knowledge, Chapter 16: Navigation","url":"https://www.faa.gov/sites/faa.gov/files/18_phak_ch16.pdf","section":"Pilotage, dead reckoning, wind triangle, flight planning","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":396,"uid":"GNAV-02-088","sourceNumber":88,"section":2,"sourceFile":"GNAV-02 VISUAL FLIGH tted on a Lambert chart.","B":"the great circle route.","C":"the constant average drift route.","D":"a rhumb line track."},"answer":"D","valid":true,"red":false,"topic":"Great circles and rhumb lines","review":{"vi":"Giữ true course không đổi nghĩa là cắt mọi kinh tuyến theo một góc cố định, tức RL. GC giữa hai điểm này thường phải đổi true course dọc đường.","references":["USAF-NAV","USGS-PROJECTIONS"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"},{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":446,"uid":"GNAV-03-045","sourceNumber":45,"section":3,"sourceFile":"GNAV-03 GREAT CIRCLE AND RHUMB LINES (47) - Có Hình.docx","question":"Consider any two positions with a difference in longitude of 7°. The proportional difference between the rhumb line distance and the great circle distance between the two positions increases with.?","options":{"A":"increasing latitude","B":"increasing altitude.","C":"decreasing latitude.","D":"decreasing convergence."},"answer":"A","valid":true,"red":false,"topic":"Great circles and rhumb lines","review":{"vi":"Với cùng chênh kinh độ 7°, lên vĩ độ cao làm hội tụ và độ tách GC–RL tăng. Độ cao bay không làm thay đổi tính chất tuyến trên bề mặt cầu trong mô hình này.","references":["USAF-NAV","USGS-PROJECTIONS"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"},{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":447,"uid":"GNAV-03-046","sourceNumber":46,"section":3,"sourceFile":"GNAV-03 GREAT CIRCLE AND RHUMB LINES (47) - Có Hình.docx","question":"A semi great circle on the Earth running from the North Pole to the South Pole is called a...?","options":{"A":"parallel of latitude.","B":"longitude.","C":"meridian.","D":"difference of longitude."},"answer":"C","valid":true,"red":false,"topic":"Great circles and rhumb lines","review":{"vi":"Nửa great circle nối hai cực là một kinh tuyến. Longitude là giá trị góc của vị trí, không phải tên đường hình học đó.","references":["USAF-NAV","USGS-PROJECTIONS"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"},{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":448,"uid":"GNAV-03-047","sourceNumber":47,"section":3,"sourceFile":"GNAV-03 GREAT CIRCLE AND RHUMB LINES (47) - Có Hình.docx","question":"In the Northern Hemisphere the rhumb line track from position A to B is 230°, the convergency is 6° and the difference in longitude is 10°. What is the initial rhumb line track from B to A?","options":{"A":"050°","B":"047°","C":"056°","D":"053°"},"answer":"A","valid":true,"red":false,"topic":"Great circles and rhumb lines","review":{"vi":"RL có hướng không đổi; hướng ngược chỉ cần cộng hoặc trừ 180°. 230°−180°=050°, không cộng hội tụ 6°.","references":["USAF-NAV","USGS-PROJECTIONS"],"status":"derived","method":"authored","referenceRecords":[{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"},{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":449,"uid":"GNAV-04-001","sourceNumber":1,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"The two standard parallels of a Lambert conformal conic projection are at 10°40'N and 41°20'N. The constant of the cone for this chart is approximately....?","options":{"A":"0.18.","B":"0.90.","C":"0.66.","D":"0.44."},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Để xấp xỉ cone constant, lấy vĩ tuyến gốc gần trung bình hai chuẩn: (10.67°+41.33°)/2=26°. n≈sin(26°)=0.438. Đây là xấp xỉ của đề; công thức Lambert secant chính xác dùng log ar it của hai vĩ tuyến.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":450,"uid":"GNAV-04-002","sourceNumber":2,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Direct Mercator chart, a certain chart length along 45°N represents a distance of 90 NM on the surface of the Earth. The same length on a chart along latitude 30°N will represent a distance on the Earth of...?","options":{"A":"45 NM.","B":"78 NM.","C":"110 NM.","D":"73.5 NM."},"answer":"C","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Cùng một chiều dài giấy trên Mercator: D₂/D₁=cosφ ₂/cosφ ₁. D₂=90 ×cos(30°)/cos(45°)=110.23 NM. Scale mẫu số cũng tỷ lệ cos vĩ độ.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":451,"uid":"GNAV-04-003","sourceNumber":3,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"At what approximate latitude will the actual scale on a Lambert's chart be at a minimum, if the standard parallels are at 63°00'N and 37°00'N and the chart edges at 74°00'N and 24°00'N?","options":{"A":"50°00'N","B":"63°00'N and 37°00'N","C":"49°00'N","D":"76°00'N and 24°00'N"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Scale Lambert hai chuẩn nhỏ nhất gần vĩ tuyến gốc, xấp xỉ giữa 37°N và 63°N: (37+63)/2=50°N. Rìa chart 74°/24° không dùng tính trung bình này.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":452,"uid":"GNAV-04-004","sourceNumber":4,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"On a Direct Mercator chart at latitude 15°S, a certain length represents a distance of 120 NM on the earth. The same length on the chart will represent on the earth, at latitude 10°N, a distance of:","options":{"A":"122.3 NM","B":"117.7 NM","C":"118.2 NM","D":"124.2 NM"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Cùng một chiều dài giấy trên Mercator: D₂/D₁=cosφ ₂/cosφ ₁. D₂=120 ×cos(10°)/cos(-15°)=122.35 NM. Scale mẫu số cũng tỷ lệ cos vĩ độ.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":453,"uid":"GNAV-04-005","sourceNumber":5,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"What is the value of the convergence factor on a Polar Stereographic chart?","options":{"A":"0.866","B":"1.0","C":"0.0","D":"0.5"},"answer":"B","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Kinh tuyến trên polar stereographic tỏa ra với đúng góc Δkinh độ: chart convergence=Δλ. Vì vậy convergence factor=1, không phải sin một vĩ độ giữa chart.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":454,"uid":"GNAV-04-006","sourceNumber":6,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"Refer to Jeppesen GSPRM chart E(LO)2. You are on a bearing of 301°(M) from POL VOR/DME (53°44.6'N 002°06.2'W) and on a bearing of 001°(M) from WAL VOR/DME (53°23.5'N 003°8.1'W). What is your position?","options":{"A":"54°03'N 003°01'W","B":"54°00'N 003°09'W","C":"54°10'N 003°10'W","D":"54°06'N 003°09W"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Vẽ hai tia radial 301°M từ POL và 001°M từ WAL, đổi variation đúng tại từng trạm rồi lấy giao điểm. Đọc latitude/longitude ở giao điểm; không dùng bearing TO thay radial FROM. Đáp án được đánh dấu trong Word: 54°06'N 003°09 W.","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Bản Word chỉ có chart được trích hoặc không có annex đủ để xác nhận mọi giá trị; key nguồn không thay cho thông tin AIP hiện hành.","referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":["c7145f824146a2f5b49b48256300077224742308a95c907f81c5f12d4a49b20c.webp"],"sourceScreenshots":["bd47878d422afb4f5a1ef2ec9d32e677b6508873b48ee93f6d21ce409daa0a03.webp"],"figureBlocked":false},{"id":455,"uid":"GNAV-04-007","sourceNumber":7,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"(Refer to Annex). Which aeronautical chart symbol indicates the boundary of advisory airspace?","options":{"A":"4","B":"2","C":"3","D":"5"},"answer":"D","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Đối chiếu đúng ký hiệu được hỏi với legend ICAO trên hình, phân biệt chấm rỗng/đặc, fly-by/fly-over, địa hình và đèn mặt đất. Số thứ tự là nhãn riêng của annex, không phải mã phổ quát. Đáp án được đánh dấu trong Word: 5.","status":"limited","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"noteVi":"Bản Word chỉ có chart được trích hoặc không có annex đủ để xác nhận mọi giá trị; key nguồn không thay cho thông tin AIP hiện hành.","referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"lesson":"imported"},"importedDOCX":true,"importedFigures":["28b2d29f1244240926f21936a8c61e939a024222aeb81773a08e9a9f7ad1e4e5.webp"],"sourceScreenshots":["b4444fe502a73c7f3fb454b6df27a0d90e2ba4b2fb9654f4efb0ee2eeaef1b21.webp"],"figureBlocked":false},{"id":456,"uid":"GNAV-04-008","sourceNumber":8,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"The positions A (30°00'N, 017°30'E) and B at longitude (30°00'N, 023°30'E) are plotted on a Lambert chart with a constant of the cone of 0.5. A and B are connected by a straight line. The True Track measured at A is 088.5°. What is the True Track measured at B?","options":{"A":"091.5°","B":"085.5°","C":"094.5°","D":"082.5°"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Δλ=23°30′−17°30′=6°. Chart convergence=nΔλ=0,5 × 6=3°. Chặng đi đông Bắc bán cầu: track đến=88,5°+3°=91,5°.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":457,"uid":"GNAV-04-009","sourceNumber":9,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"A Lambert conformal conic chart has a constant of the cone of 0.75.A straight line track is drawn from A (40°N, 050°W) to B. The initial track at A is 043°(T) and the final track at B is 055°(T). What is the longitude of B?","options":{"A":"034°W","B":"041°W","C":"036°W","D":"038°W"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Δtrack=55−43=12°. Δλ=12/0,75=16°. Chặng đi đông từ 050°W 16° tới 034°W.","status":"derived","method":"authored","references":["USGS-PROJECTIONS","USAF-NAV"],"referenceRecords":[{"title":"US Geological Survey · Map Projections: A Working Manual","url":"https://www.usgs.gov/educational-resources/map-projections-working-manual","section":"Conformal projections, Mercator, Lambert and stereographic geometry","checkedAt":"2026-11-22"},{"title":"US Air Force · Air Navigation, AFPAM 11-216","url":"https://static.e-publishing.af.mil/etc/AFPAM11-216.pdf","section":"Navigation training reference; publisher may restrict access","checkedAt":"2026-11-22"}],"noteVi":"","lesson":"imported"},"importedDOCX":true,"importedFigures":[],"sourceScreenshots":[],"figureBlocked":false},{"id":458,"uid":"GNAV-04-010","sourceNumber":10,"section":4,"sourceFile":"GNAV-04 CHARTS (115) - Có Hình.docx","question":"What is the final track direction of a straight line on a Polar Stereographic chart when flying from position A (85°S, 030°E) to position B (85°S, 050°W)?","options":{"A":"310°( T)","B":"270°(T)","C":"190°(T)","D":"230°(T)"},"answer":"A","valid":true,"red":false,"topic":"Charts and projections","review":{"vi":"Hai điểm cùng 85°S, đi tây 80° kinh độ. Trên polar chart, hướng tại trung điểm là 270°; tại điểm đến ở phía tây 40° nữa nên track=270+40=310°T. Dấu hội tụ đảo so Bắc bán cầu.","sta
