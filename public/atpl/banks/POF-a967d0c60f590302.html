lculation","vi":"60 kt đã là Vs ở bank 15°, không phải Vs 1 g. Vì vậy Vs 45 = 60 × √(cos 15°/cos 45°) ≈ 70,1 kt.","en":"The given 60 kt is already the 15°-bank stall speed, not the 1 g speed. Therefore Vs 45 = 60 × √(cos 15°/cos 45°) ≈ 70.1 kt.","noteVi":"","noteEn":"","formula":"Vs45 = 60√(cos15°/cos45°) = 70.1 kt"},"topic":"Stalling","uid":"POF-247"},{"id":248,"question":"The frontal area of a body, placed in a certain airstream is increased by a factor 3. If the shape does not alter, the form drag will increase by a factor of:","options":{"A":"1.5","B":"9","C":"6","D":"3"},"answer":"D","valid":true,"red":false,"review":{"lesson":"parasitic","status":"calculation","vi":"Vì hình dạng không đổi, giữ CD và q. D₂/D₁ = S₂/S₁ = 3.","en":"Shape is unchanged, so CD and q are fixed. D₂/D₁ = S₂/S₁ = 3.","noteVi":"","noteEn":"","formula":"D₂/D₁ = S₂/S₁ = 3"},"topic":"Lift","uid":"POF-248"},{"id":249,"question":"The Mach number is 0.8 and the TAS is 400 kts. What is the speed of sound?","options":{"A":"480 kts","B":"320 kts","C":"500 kts","D":"600 kts"},"answer":"C","valid":true,"red":false,"review":{"lesson":"mach","status":"calculation","vi":"a = TAS/M = 400/0,8 = 500 kt. Mach là tỷ số không có đơn vị; phải giữ cùng đơn vị tốc độ cho TAS và a.","en":"a = TAS/M = 400/0.8 = 500 kt. Mach is dimensionless, so TAS and a must use the same speed units.","noteVi":"","noteEn":"","formula":"a = 400 / 0.8 = 500 kt"},"topic":"High Speed Flight","uid":"POF-249"},{"id":250,"question":"The value of the manoeuvre stability of an aeroplane is 150 N/g. The stick force required to achieve a load factor of 25 from steady level trimmed flight is:","options":{"A":"150 N","B":"375 N","C":"450 N","D":"225 N"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"conflict","vi":"DOCX thật ghi “25”, không phải lỗi trích xuất của app. Với n=25, lực phải là 150×(25−1)=3600 N, không khớp 225 N.225 N chỉ đúng nếu đề định viết 2,5 g:150×1,5=225 N. App giữ nguyên 25 và keyD, đồng thời nêu mâu thuẫn thay vì tự sửa đề.","en":"The original DOCX actually states “25”; this is not an app extraction error. For n=25, force is 150×(25−1)=3600 N, not 225 N.225 N is obtained only if 2.5 g was intended:150×1.5=225 N. The app preserves 25 and keyD and identifies the discrepancy instead of silently rewriting the stem.","noteVi":"Dữ kiện 25 g không khớp đáp án 225 N; có thể thiếu dấu thập phân trong đề gốc.","noteEn":"The stated 25 g conflicts with the 225 N key; the source stem may be missing a decimal point.","bookAnswer":"No matching option with n=25","formula":"Stated n=25 → 3,600 N; possible intended n=2.5 → 225 N"},"topic":"Stability and Control","uid":"POF-250"},{"id":251,"question":"If a stick force of 20 lbs is required to pull 4g from the position of trim, the stick force gradient is:","options":{"A":"6.6 lbs/g","B":"5 lbs/g","C":"20 lbs/g","D":"60 lbs/g"},"answer":"A","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"calculation","vi":"Từ vị trí trim 1 g tới 4 g là tăng 3 g. Gradient=20/(4−1)=6,67 lb/g, gần 6,6.","en":"From 1 g trim to 4 g is a 3 g increment. Gradient=20/(4−1)=6.67 lb/g, nearest 6.6.","noteVi":"","noteEn":"","formula":"K = 20/(4−1) ≈ 6.67 lb/g"},"topic":"Stability and Control","uid":"POF-251"},{"id":252,"question":"An aeroplane flying at 200 kts in straight and level flight is subjected to a disturbance that suddenly increases the speed by 60 kts. Assuming the angle of attack remains constant, the load factor will initially:","options":{"A":"increase to 1.3.","B":"increase to 1.6.","C":"increase to 1.69.","D":"remain unchanged since the angle of attack does not change."},"answer":"C","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"Tốc độ đổi từ 200 sang 260 kt. Bình phương tỷ số tốc độ cho n = 1.69; đây là load factor mới, không phải phần tăng Δn.","en":"Speed changes from 200 to 260 kt. Squaring the speed ratio gives n = 1.69; this is the new total load factor, not its increment Δn.","noteVi":"","noteEn":"","formula":"n₂ = (260/200)² = 1.69"},"topic":"Lift","uid":"POF-252"},{"id":253,"question":"If an aeroplane performs a steady co-ordinated horizontal turn at a TAS of 200 kts and a turn radius of 2000 m, the load factor (n) will be approximately:","options":{"A":"2.0","B":"1.4","C":"1.1","D":"1.8"},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"Đổi 200 kt≈102,9m/s. tanφ =V²/(rg)≈0,540. Dùng n=√(1+tan²φ) được n≈1,136, gần 1,1.","en":"Convert 200 kt to approximately 102.9 m/s. tanφ = V²/(rg)≈0.540. Then n=√(1+tan²φ)≈1.136, nearest to 1.1.","noteVi":"","noteEn":"","formula":"V ≈ 102.9 m/s; tanφ = V²/(2,000×9.81); n ≈ 1.14 ≈ 1.1"},"topic":"Flight Mechanics","uid":"POF-253"},{"id":254,"question":"By what percentage does the lift increase in a steady level turn at 45° angle of bank, compared to straight and level flight?","options":{"A":"41%","B":"19%","C":"31%","D":"52%"},"answer":"A","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"Phần tăng so với bay thẳng bằng là (1/cos 45°−1) ×100 = 41.4%. Phải trừ 1 trước khi đổi ra phần trăm tăng.","en":"The increase over straight and level flight is (1/cos 45°−1) ×100 = 41.4%. Subtract one before expressing the increment as a percentage.","noteVi":"","noteEn":"","formula":"ΔL/L = (1/cos45° − 1) × 100 ≈ 41.4%"},"topic":"Flight Mechanics","uid":"POF-254"},{"id":255,"question":"\"Given: Aeroplane mass: 50000 kg, Lift/Drag ratio: 12, Thrust per engine: 30000 N. Assumed g: 10 m/s². For a straight, steady, wings level climb of a three-engine aeroplane, the all engines climb gradient will be:\"","options":{"A":"2.9%","B":"9.7%","C":"8.0%","D":"8.5%"},"answer":"B","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 3 động cơ tạo thrust: T=3×30,000=90,000 N. D≈500 000/12≈41,667 N; gradient≈(90,000−41,667)/500 000×100=9.67%.","en":"W=50,000×10=500,000 N. There are 3 thrust-producing engines: T=3×30,000=90,000 N. D≈500,000/12≈41,667 N, so gradient≈(90,000−41,667)/500,000×100=9.67%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 90,000 N; gradient ≈ 9.67%"},"topic":"Flight Mechanics","uid":"POF-255"},{"id":256,"question":"What is the heading change after 10 seconds of an aeroplane performing a rate one turn?","options":{"A":"90°","B":"30°","C":"180°","D":"10°"},"answer":"B","valid":true,"red":false,"review":{"lesson":"rateone","status":"calculation","vi":"Sau 10 giây, heading đổi 3×10=30°.","en":"After 10 seconds, the heading changes by 3×10=30°.","noteVi":"","noteEn":"","formula":"Δheading = 3°/s × 10 s = 30°"},"topic":"Flight Mechanics","uid":"POF-256"},{"id":257,"question":"\"Given: Aeroplane mass: 50 000 kg, Lift/Drag ratio: 10, Thrust per engine: 20 000 N.Assumed g: 10m/s². For a straight, steady, wings level climb of a four-engine aeroplane, the all engines climb gradient will be:\"","options":{"A":"8.5%","B":"4.3%","C":"7.7%","D":"6.0%"},"answer":"D","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 4 động cơ tạo thrust: T=4×20,000=80,000 N. D≈500 000/10≈50,000 N; gradient≈(80,000−50,000)/500 000×100=6.00%.","en":"W=50,000×10=500,000 N. There are 4 thrust-producing engines: T=4×20,000=80,000 N. D≈500,000/10≈50,000 N, so gradient≈(80,000−50,000)/500,000×100=6.00%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 50,000 N; T = 80,000 N; gradient ≈ 6.00%"},"topic":"Flight Mechanics","uid":"POF-257"},{"id":258,"question":"\"Given: Aeroplane mass: 50 000 kg, Lift/Drag ratio: 12, Thrust per engine: 28 000 N. Assumed g: 10 m/s². For a straight, steady, wings level climb of a three-engine aeroplane, the all-engines climb gradient is:\"","options":{"A":"9.7%","B":"8.0%","C":"8.5%","D":"2.9%"},"answer":"C","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 3 động cơ tạo thrust: T=3×28,000=84,000 N. D≈500 000/12≈41,667 N; gradient≈(84,000−41,667)/500 000×100=8.47%.","en":"W=50,000×10=500,000 N. There are 3 thrust-producing engines: T=3×28,000=84,000 N. D≈500,000/12≈41,667 N, so gradient≈(84,000−41,667)/500,000×100=8.47%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 84,000 N; gradient ≈ 8.47%"},"topic":"Flight Mechanics","uid":"POF-258"},{"id":259,"question":"\"Given: Aeroplane mass: 50 000 kg, Lift/Drag ratio: 12, Thrust per engine: 60 000 N. Assumed g: 10 m/s². For a straight, steady, wings level climb of a twin engine aeroplane, the one-engine-inoperative climb gradient will be:\"","options":{"A":"3.7%","B":"15.7%","C":"14%","D":"11 .7%"},"answer":"A","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 1 động cơ tạo thrust: T=1×60,000=60,000 N. D≈500 000/12≈41,667 N; gradient≈(60,000−41,667)/500 000×100=3.67%.","en":"W=50,000×10=500,000 N. There are 1 thrust-producing engines: T=1×60,000=60,000 N. D≈500,000/12≈41,667 N, so gradient≈(60,000−41,667)/500,000×100=3.67%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 60,000 N; gradient ≈ 3.67%"},"topic":"Flight Mechanics","uid":"POF-259"},{"id":260,"question":"At a true airspeed of 300 kts and in a 45° bank level turn, the radius of turn would be (assume a value of 1 0 m/sec² for g):","options":{"A":"2381 m","B":"4743 m","C":"3354 m","D":"23780 m"},"answer":"A","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"Đổi 300 kt≈154,3m/s. Theo giả thiết g=10m/s² và tan 45°=1: r≈154,3²/10≈2 381m. Không đưa đơn vịkt trực tiếp vào công thức SI.","en":"Convert 300 kt to approximately 154.3 m/s. With the stated g=10 m/s² and tan 45°=1, r≈154.3²/10≈2,381 m. Do not insert knots directly into the SI formula.","noteVi":"","noteEn":"","formula":"r = (300 × 1852/3600)²/(10 × tan45°) ≈ 2,382 m"},"topic":"Flight Mechanics","uid":"POF-260"},{"id":261,"question":"What is the approximate value of the lift of an aeroplane at a gross weight of 50 000 N, in a horizontal coordinated 45° banked turn?","options":{"A":"50 000 N","B":"60 000 N","C":"70 000 N","D":"80 000 N"},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"L = W/cos 45° =50 000/0,7071 =70 711 N. Phương án gần đúng là 70 000 N, không phải 50 000 N vì lift đã nghiêng.","en":"L = W/cos 45° = 50,000/0.7071 = 70,711 N. The approximate option is 70,000 N, not 50,000 N, because the lift vector is tilted.","noteVi":"","noteEn":"","formula":"L = 50,000 / cos45° ≈ 70,711 N ≈ 70,000 N"},"topic":"Flight Mechanics","uid":"POF-261"},{"id":262,"question":"With a L/D ratio of 9:1 and flying at 12000 ft the glide range in still air would be approximately:","options":{"A":"15 NM","B":"20 NM","C":"14 NM","D":"18 NM"},"answer":"D","valid":true,"red":false,"review":{"lesson":"glide","status":"calculation","vi":"Horizontal range =12 000×9=108 000 ft. Dùng 1NM≈6080 ft: range≈17,8NM, làm tròn 18NM.","en":"Horizontal range =12,000×9=108,000 ft. With 1 NM≈6080 ft, the range is about 17.8 NM, rounded to 18 NM.","noteVi":"Quy đổi 1NM≈6080 ft theo cách làm tròn của giáo trình, trang 12.","noteEn":"Uses the textbook rounding 1 NM≈6080 ft on page 12.","formula":"Range = 12,000 ft × 9 / 6,080 ft/NM ≈ 17.8 NM"},"topic":"Flight Mechanics","uid":"POF-262"},{"id":263,"question":"\"Given: Aeroplane mass: 50 000 kg, Lift/Drag ratio: 12, Thrust per engine: 50 000 N. Assumed g: 10 m/s². For a straight, steady, wings level climb of a twin engine aeroplane, the all engines climb gradient will be:\"","options":{"A":"15.7%","B":"3.7%","C":"14%","D":"11.7%"},"answer":"D","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 2 động cơ tạo thrust: T=2×50,000=100,000 N. D≈500 000/12≈41,667 N; gradient≈(100,000−41,667)/500 000×100=11.67%.","en":"W=50,000×10=500,000 N. There are 2 thrust-producing engines: T=2×50,000=100,000 N. D≈500,000/12≈41,667 N, so gradient≈(100,000−41,667)/500,000×100=11.67%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 100,000 N; gradient ≈ 11.67%"},"topic":"Flight Mechanics","uid":"POF-263"},{"id":264,"question":"\"Given: Aeroplane mass: 50 000 kg, lift/Drag ratio: 12, Thrust per engine: 28 000 N. Assumed g: 10 m/s². For a straight, steady, wings level climb of a four-engine aeroplane. the one-engine-inoperative climb gradient will be:\"","options":{"A":"8.5%","B":"8.0%","C":"9.7%","D":"2.9%"},"answer":"A","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 3 động cơ tạo thrust: T=3×28,000=84,000 N. D≈500 000/12≈41,667 N; gradient≈(84,000−41,667)/500 000×100=8.47%.","en":"W=50,000×10=500,000 N. There are 3 thrust-producing engines: T=3×28,000=84,000 N. D≈500,000/12≈41,667 N, so gradient≈(84,000−41,667)/500,000×100=8.47%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 84,000 N; gradient ≈ 8.47%"},"topic":"Flight Mechanics","uid":"POF-264"},{"id":265,"question":"By what percentage does the lift increase in a steady level turn at 30° angle of bank, compared to straight and level flight?","options":{"A":"41%","B":"15%","C":"50%","D":"10%"},"answer":"B","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"Phần tăng so với bay thẳng bằng là (1/cos 30°−1) ×100 = 15.47%. Phải trừ 1 trước khi đổi ra phần trăm tăng.","en":"The increase over straight and level flight is (1/cos 30°−1) ×100 = 15.47%. Subtract one before expressing the increment as a percentage.","noteVi":"","noteEn":"","formula":"ΔL/L = (1/cos30° − 1) × 100 ≈ 15.47%"},"topic":"Flight Mechanics","uid":"POF-265"},{"id":266,"question":"All gust lines in the gust load diagram originate from a point where the:","options":{"A":"speed = 0, load factor = 0.","B":"speed = VS, load factor = 0.","C":"speed = 0, load factor = +1.","D":"speed = VB, load factor = +1."},"answer":"C","valid":true,"red":false,"review":{"lesson":"roughair","status":"derived","vi":"Ở V =0, mô hình gust line cho Δn =0; mốc ban đầu của đồ thị là bay 1 g. Vì vậy các đường đi từ (V=0,n=+1), chứ không phải (0,0). Đây là giao điểm của mô hình đồ thị, không nói máy bay bay được ở tốc độ 0.","en":"At V = 0 the gust-line model gives Δn = 0; its baseline is 1 g flight. The lines therefore originate at (V=0,n=+1), not (0,0). This is the graph-model intercept, not a claim that the aircraft can fly at zero speed.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-266"},{"id":267,"question":"An aeroplane flying at 200 kts in straight and level flight is subjected to a disturbance that suddenly increases the speed by 40 kts. Assuming the angle of attack remains constant, the load factor will initially:","options":{"A":"increase to 1.20.","B":"increase to 1.21.","C":"increase to 1.44.","D":"remain unchanged, since the angle of attack does not change."},"answer":"C","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"Tốc độ đổi từ 200 sang 240 kt. Bình phương tỷ số tốc độ cho n = 1.44; đây là load factor mới, không phải phần tăng Δn.","en":"Speed changes from 200 to 240 kt. Squaring the speed ratio gives n = 1.44; this is the new total load factor, not its increment Δn.","noteVi":"","noteEn":"","formula":"n₂ = (240/200)² = 1.44"},"topic":"Lift","uid":"POF-267"},{"id":268,"question":"Which of the following phenomena is counteracted by the use of differential ailerons?","options":{"A":"Adverse yaw.","B":"Turn co-ordination.","C":"Sensitivity to spiral dive.","D":"Aileron reversal."},"answer":"A","valid":true,"red":false,"review":{"lesson":"adverse","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-268"},{"id":269,"question":"Which kind of tab is commonly used in case of manual reversion of fully powered flight controls?","options":{"A":"Balance tab.","B":"Spring tab.","C":"Servo tab.","D":"Anti-balance tab."},"answer":"C","valid":true,"red":false,"review":{"lesson":"tabs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-269"},{"id":270,"question":"Approximately how long does it take to fly a complete circle during a horizontal steady coordinated turn with a bank angle of 45° and a TAS of 200 kts?","options":{"A":"65 seconds","B":"95 seconds","C":"125 seconds","D":"650 seconds"},"answer":"A","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"V=200 kt≈102,9m/s. Chu kỳ một vòng =2π/ω =2πV/(g tan 45°)≈65,9s; gần nhất 65s.","en":"V=200 kt≈102.9 m/s. One full turn takes 2π/ω =2πV/(g tan 45°)≈65.9 seconds, nearest to 65 seconds.","noteVi":"","noteEn":"","formula":"t = 2π × 102.9/(9.81 × tan45°) ≈ 65.9 s"},"topic":"Flight Mechanics","uid":"POF-270"},{"id":271,"question":"An aircraft is in straight, level flight has a CL of 0.42, and a 1° increase in angle of attack would increase the CL by 0.1 . Following a gust that increases the angle of attack by 3°, what load factor would the aircraft be subject to?","options":{"A":"0.7","B":"1.7","C":"1.4","D":"2.4"},"answer":"B","valid":true,"red":false,"review":{"lesson":"verticalgustcalc","status":"calculation","vi":"ΔCL = 0.1 × 3 = 0.3; CL₂ = 0.42 + 0.3 = 0.72. Chia cho CL₁ được n = 1.71; không cộng thêm 1 lần nữa.","en":"ΔCL = 0.1 × 3 = 0.3; CL₂ = 0.42 + 0.3 = 0.72. Dividing by the initial CL gives n = 1.71; do not add one again.","noteVi":"","noteEn":"","formula":"n = (0.42 + 0.1 × 3)/0.42 = 1.71"},"topic":"Limitations","uid":"POF-271"},{"id":272,"question":"What is the percentage increase in lift if the angle of attack increased by 4o due to a vertical gust. The straight and level coefficient of lift is 0.52, and for each 10 change in angle of attack the coefficient of lift changes by 0.07.","options":{"A":"18%","B":"85%","C":"54%","D":"24%"},"answer":"C","valid":true,"red":false,"review":{"lesson":"verticalgustcalc","status":"calculation","vi":"Trong DOCX, số 0 được viết superscript sau 1 để chỉ 1°; bản text cũ làm nó thành “10”. Với độ dốc 0,07/độ và gust 4°: ΔCL =0,28, phần tăng lift =0,28/0,52 =53,85%≈54%.","en":"In the DOCX, a superscript zero after 1 denotes 1°; the earlier plain-text extraction flattened it to “10”. Using a slope of 0.07 per degree and a 4° gust, ΔCL = 0.28 and the lift increase is 0.28/0.52 = 53.85%, approximately 54%.","noteVi":"Đã phục hồi ký hiệu độ từ định dạng gốc DOCX, không đổi trị số đề.","noteEn":"Degree symbols were restored from the original DOCX formatting, without changing the stated values.","formula":"ΔL/L × 100 = (4 × 0.07)/0.52 × 100 ≈ 54%"},"topic":"Limitations","displayQuestion":"What is the percentage increase in lift if the angle of attack increased by 4° due to a vertical gust. The straight and level coefficient of lift is 0.52, and for each 1° change in angle of attack the coefficient of lift changes by 0.07.","uid":"POF-272"},{"id":273,"question":"An aeroplane is in a steady horizontal turn at a TAS of 194 kts. The turn radius is 1 000 m. The bank angle is (assume g = 10 m/s²)?","options":{"A":"45°","B":"30°","C":"50°","D":"60°"},"answer":"A","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"194 kt≈99,8m/s. tanφ =99,8²/(1000×10)≈0,996 nên φ≈44,9°≈45°.","en":"194 kt is approximately 99.8 m/s. tanφ =99.8²/(1000×10)≈0.996, giving φ≈44.9°, approximately 45°.","noteVi":"","noteEn":"","formula":"φ = atan[(194×1852/3600)²/(1,000×10)] ≈ 45°"},"topic":"Flight Mechanics","uid":"POF-273"},{"id":274,"question":"The manoeuvre stability of a large jet transport aeroplane is 280 N/g. What stick force is required, if the aeroplane is pulled to the limit manoeuvring load factor from a trimmed horizontal straight and steady flight (cruise configuration)?","options":{"A":"1050 N","B":"770N","C":"630N","D":"420N"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"calculation","vi":"Large jet transport cruise configuration dùng giới hạn 2,5 g. F=280×1,5=420 N.","en":"The large jet transport cruise-configuration limit is 2.5 g. F=280×1.5=420 N.","noteVi":"","noteEn":"","formula":"F = 280 × (2.5−1) = 420 N"},"topic":"Stability and Control","uid":"POF-274"},{"id":275,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-275"},{"id":276,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-276"},{"id":277,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-277"},{"id":278,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-278"},{"id":279,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-279"},{"id":280,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-280"},{"id":281,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-281"},{"id":282,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-282"},{"id":283,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-283"},{"id":284,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-284"},{"id":285,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-285"},{"id":286,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-286"},{"id":287,"question":"An aeroplane has a stalling speed of 100 kts in a steady level flight. When the aeroplane is flying a level turn with a load factor of 1.5 the stalling speed is:","options":{"A":"141 kts","B":"122 kts","C":"82 kts","D":"150 kts"},"answer":"B","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Vs mới = 100 × √1.5 = 122.5 kt; chọn giá trị làm tròn gần nhất trong đề.","en":"New Vs = 100 × √1.5 = 122.5 kt; use the nearest rounded option.","noteVi":"","noteEn":"","formula":"Vs₂ = Vs₁√n = 122.5 kt"},"topic":"Stalling","uid":"POF-287"},{"id":288,"question":"Whilst maintaining straight and level flight with a lift coefficient CL = 1 what will be the new approximate value of CL after the speed is increased by 30%?","options":{"A":"0.30","B":"0.25","C":"0.60","D":"0.50"},"answer":"C","valid":true,"red":false,"review":{"lesson":"constantliftcalc","status":"calculation","vi":"Tốc độ mới bằng 1,3 lần ban đầu. CL₂ = 1/1,3² = 0,592; phương án gần nhất là 0,60.","en":"The new speed is 1.3 times the initial speed. CL₂ = 1/1.3² = 0.592; the nearest option is 0.60.","noteVi":"","noteEn":"","formula":"CL₂ = 1 / 1.3² ≈ 0.60"},"topic":"Lift","uid":"POF-288"},{"id":289,"question":"An aeroplane has a stall speed of 78 kts at its mass of 6850 kg. What is the stall speed when the mass is 5000 kg?","options":{"A":"91 kts","B":"78 kts","C":"57 kts","D":"67 kts"},"answer":"D","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Vs mới = 78 × √(5000/6850) ≈ 66,6 kt, tức khoảng 67 kt. Giữ cấu hình và CLmax như ban đầu.","en":"New Vs = 78 × √(5000/6850) ≈ 66.6 kt, or about 67 kt, with configuration and CLmax unchanged.","noteVi":"","noteEn":"","formula":"Vs₂ = 78√(5000/6850) ≈ 67 kt"},"topic":"Stalling","uid":"POF-289"},{"id":290,"question":"An aircraft maintains a 50° bank angle during a constant altitude turn. Compared to straight and level flight the stall speed will be greater by a factor of:","options":{"A":"1.6","B":"1.41","C":"1.25","D":"2.0"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Hệ số tốc độ = √(1/cos 50°) ≈ 1,247, làm tròn 1,25.","en":"The speed multiplier is √(1/cos 50°) ≈ 1.247, rounded to 1.25.","noteVi":"","noteEn":"","formula":"Vs₂/Vs₁ = 1/√cos50° ≈ 1.25"},"topic":"Stalling","uid":"POF-290"},{"id":291,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the mass decreases, the gust load factor decreases. 2) When the altitude decreases, the gust load factor decreases.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect.","D":"1) is correct, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-291"},{"id":292,"question":"What is the approximate diameter of a steady, level, co-ordinated turn with a bank angle of 30° and a speed (TAS) of 500 kts?","options":{"A":"13 km","B":"17 km","C":"23 km","D":"7 km"},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"500 kt≈257,2m/s. Radius≈V²/(9,81tan 30°)=11,68km. Đề hỏi diameter nên nhân 2:≈23,36km→23km.","en":"500 kt≈257.2 m/s. The radius is V²/(9.81tan 30°)≈11.68 km. The requested diameter is twice this, approximately 23.36 km, giving 23 km.","noteVi":"","noteEn":"","formula":"Diameter = 2 × (257.2)²/(9.81tan30°) ≈ 23.4 km"},"topic":"Flight Mechanics","uid":"POF-292"},{"id":293,"question":"If the airspeed is increased from 90 kts to 135 kts during a level 45° banked turn. the load factor will:","options":{"A":"decrease and the stall speed will increase.","B":"remain the same but the radius of turn will increase.","C":"increase as well as the stall speed.","D":"increase and the radius of turn will increase."},"answer":"B","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-293"},{"id":294,"question":"A light twin is in a turn at 30° bank and 180 kts TAS. A heavier aeroplane at the same bank and the same speed will:","options":{"A":"turn at a smaller turn radius.","B":"turn at a bigger turn radius.","C":"turn at the same turn radius.","D":"turn at a higher turn rate."},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-294"},{"id":295,"question":"\"Which of these statements about VMCG determination are correct or incorrect? 1) During VMCG determination, nose wheel steering may be used. 2) During VMCG determination, the CG should be on the aft limit.”","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is incorrect, 2) is correct","C":"1) is correct, 2) is incorrect","D":"1) is correct, 2) is correct"},"answer":"B","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-295"},{"id":296,"question":"\"Which of the following statements is correct? 1) VMCL is the minimum control speed in the landing configuration. 2) The speed VMCL is always limited by maximum rudder deflection.\"","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is correct","C":"1) is incorrect, 2) is correct","D":"1) is correct, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-296"},{"id":297,"question":"An aeroplane climbs to cruising level with a constant pitch attitude and maximum climb thrust (assume no supercharger). How do the following variables change during the climb? (gamma = flight path angle)","options":{"A":"gamma decreases, angle of attack increases, lAS remains constant.","B":"gamma decreases, angle of attack increases, lAS decreases.","C":"gamma decreases, angle of attack remains constant, lAS decreases.","D":"gamma remains constant, angle of attack remains constant, lAS decreases."},"answer":"B","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"derived","vi":"Không supercharger, thrust khả dụng giảm khi lên cao nên climb angleγ giảm. Với pitchθ giữ nguyên và incidence cố định, α=θ−γ tăng; CL tăng nên IAS cần để duy trì lift giảm. Đây là chuỗi suy luận quasi-steady, không phải dữ liệu performance riêng một loại máy bay.","en":"Without supercharging, available thrust falls during the climb, reducing climb angleγ. With pitchθ and incidence fixed, α=θ−γ increases; higher CL requires lower IAS for the lift needed. This is a quasi-steady deduction, not type-specific performance data.","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-297"},{"id":298,"question":"In a co-ordinated horizontal turn, the magnitude of the centripetal force at 45° of bank:","options":{"A":"is equal to the lift of the aeroplane.","B":"has a vertical component.","C":"is equal to the weight of the aeroplane.","D":"is greater than the lift of the aeroplane."},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"Lực hướng tâm Fc =Wtanφ. Tại 45°, tan 45°=1 nên Fc=W; total lift lúc đó bằng√2W, không bằngW.","en":"Centripetal force Fc=Wtanφ. At 45°, tan 45°=1, so Fc=W; total lift is √2W, not W.","noteVi":"","noteEn":"","formula":"Fc = W tan45° = W"},"topic":"Flight Mechanics","uid":"POF-298"},{"id":299,"question":"What effect, if any, does altitude have on VMC for an aeroplane with unsupercharged engines?","options":{"A":"Remains constant to full throttle height and then decreases.","B":"Increases with increasing altitude.","C":"Altitude has no effect.","D":"Decreases with increasing altitude."},"answer":"D","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"Với unsupercharged engines, altitude tăng làm thrust live engine giảm; yaw moment cần rudder chống lại nhỏ hơn nên VMC giảm. Không áp dụng tự động cho động cơ giữ thrust bằng tăng áp.","en":"With unsupercharged engines, increasing altitude reduces operating-engine thrust and the yawing moment to be opposed. VMC therefore decreases. Do not automatically apply this to engines that maintain thrust through supercharging.","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-299"},{"id":300,"question":"\"Which of these statements about the limiting value of 5° bank angle dunng VMCA determination are correct or incorrect? 1) When the bank angle is decreased from 5° to 0°, the value of VMCA will remain approximately constant. 2) When the bank angle is increased beyond 5°, there is a increasing risk of fin stall.\"","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vmc","status":"limited","vi":"Sách hỗ trợ vế 1 sai: giảm bank hỗ trợ từ 5° về 0° làm mất thành phần lift giúp cân bằng sideforce nên VMCA tăng. Nhưng phần tài liệu đã kiểm tra giải thích giới hạn bank bằng ảnh hưởng vertical lift/drag, chưa đủ để xác nhận vế 2 “tăng nguy cơ fin stall” là nguyên nhân được sách nêu.","en":"The source supports statement 1 being false: reducing helpful bank from 5° to 0° removes the lift component assisting sideforce balance and increases VMCA. The checked text explains the bank limitation through vertical-lift and drag considerations; it does not sufficiently establish statement 2, increased fin-stall risk, as the stated explanation.","noteVi":"KeyC được giữ; chưa đủ đoạn nguồn xác nhận riêng vế 2.","noteEn":"KeyC retained; a sufficient source for statement 2 has not been established."},"topic":"Flight Mechanics","uid":"POF-300"},{"id":301,"question":"1. An aeroplane in straight and level flight at 100 kts is subjected to a sudden disturbance in speed. Assuming the angle of attack remains constant initially and the load factor reaches a value of 1.96:","options":{"A":"The speed will have increased by 40 kts.","B":"The speed will have decreased by 40 kts.","C":"The speed will have increased by 20 kts.","D":"The speed will have decreased by 20 kts."},"answer":"A","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"V₂ = 100√1.96 = 140 kt. Đề hỏi phần tăng nên đáp số là 40 kt, không phải tốc độ cuối.","en":"V₂ = 100√1.96 = 140 kt. The question asks for the increase, so the answer is 40 kt rather than the final speed.","noteVi":"","noteEn":"","formula":"V₂ = 100√1.96 = 140 kt; ΔV = 40 kt"},"topic":"Lift","uid":"POF-301"},{"id":302,"question":"Which of the following is a correct design gust value factor applied in certification under EASA CS-25?","options":{"A":"25 ft/sec at VB.","B":"66 ft/sec at VB.","C":"50 ft/sec at VD.","D":"55 ft/sec at VD."},"answer":"B","valid":true,"red":false,"review":{"lesson":"designgust","status":"reviewed","vi":"","en":"","noteVi":"Theo bảng và mô hình giáo trình 2014; chưa xác minh quy định hiện hành.","noteEn":"Based on the 2014 textbook table and model; current regulations have not been verified."},"topic":"Limitations","uid":"POF-302"},{"id":303,"question":"Which of the following is a correct design gust value factor applied in certification under EASA CS-25?","options":{"A":"55 ft/sec at VC.","B":"66 ft/sec at VD.","C":"50 ft/sec at VC.","D":"25 ft/sec at VB."},"answer":"C","valid":true,"red":false,"review":{"lesson":"designgust","status":"reviewed","vi":"","en":"","noteVi":"Theo bảng và mô hình giáo trình 2014; chưa xác minh quy định hiện hành.","noteEn":"Based on the 2014 textbook table and model; current regulations have not been verified."},"topic":"Limitations","uid":"POF-303"},{"id":304,"question":"What is the limit load factor of a large transport aeroplane?","options":{"A":"6","B":"4.4","C":"3.75","D":"2.5"},"answer":"D","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"reviewed","vi":"","en":"","noteVi":"Giá trị theo phân loại và giáo trình 2014, không thay flight manual của loại máy bay.","noteEn":"Values follow the categories in the 2014 text and do not replace the aircraft flight manual."},"topic":"Limitations","uid":"POF-304"},{"id":305,"question":"An aircraft is flown at 20% below its normal mass. Because of this, VA will be:","options":{"A":"10% lower.","B":"20% higher.","C":"10% higher.","D":"20% lower."},"answer":"A","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"calculation","vi":"Weight mới=0,80 weight cũ. VA₂/VA₁≈√0,8=0,8944 nên giảm 10,56%, gần 10%.","en":"New weight is 0.80 of old weight. VA₂/VA₁≈√0.8=0.8944, a 10.56% reduction, approximately 10%.","noteVi":"","noteEn":"","formula":"VA₂/VA₁ ≈ √0.80 = 0.8944 → 10.56% lower"},"topic":"Limitations","uid":"POF-305"},{"id":306,"question":"An aeroplane flying at 200 kts in straight and level flight is subjected to a disturbance that suddenly increases the speed by 10 kts. Assuming the angle of attack remains constant, how will the load factor be?","options":{"A":"increase to 1.10","B":"increase to 1.20","C":"increase to 1.05","D":"increase to 1.30"},"answer":"A","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"Tốc độ đổi từ 200 sang 210 kt. Bình phương tỷ số tốc độ cho n = 1.103; đây là load factor mới, không phải phần tăng Δn.","en":"Speed changes from 200 to 210 kt. Squaring the speed ratio gives n = 1.103; this is the new total load factor, not its increment Δn.","noteVi":"","noteEn":"","formula":"n₂ = (210/200)² = 1.103"},"topic":"Lift","uid":"POF-306"},{"id":307,"question":"The stick force per g of a normal category aeroplane is 300 N/g. What stick force is required, if the aeroplane is pulled to the limit manoeuvring load factor from a trimmed horizontal straight and steady flight?","options":{"A":"450 N","B":"750 N","C":"1125 N","D":"840 N"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"limited","vi":"Đáp án 840 N dùng nlimit=3,8: F=300×(3,8−1)=840 N. Tuy nhiên sách nêu normal category có giới hạn từ 2,5 tới 3,8 tùy điều kiện thiết kế; chỉ chữ “normal category” trong đề chưa đủ để xác định 3,8.","en":"The keyed 840 N assumes nlimit=3.8: F=300×(3.8−1)=840 N. The book states a normal-category limit range of 2.5 to 3.8 depending on design conditions, however, so “normal category” alone does not uniquely establish 3.8.","noteVi":"Giữ keyD; kết quả cần giả thiết giới hạn 3,8 g chưa ghi rõ trong đề.","noteEn":"KeyD retained; the result requires the unstated 3.8 g limit assumption.","formula":"Assuming nlimit=3.8: F = 300 × 2.8 = 840 N"},"topic":"Stability and Control","uid":"POF-307"},{"id":308,"question":"An aeroplane is flying straight and level with a coefficient of lift of 0.55. The coefficient of lift increase by 0.08 per degree increase in angle of attack. If a vertical gust increases the angle of attack by 3o, what is the increase in load factor?","options":{"A":"0.44","B":"0.52","C":"0.36","D":"0.60"},"answer":"A","valid":true,"red":false,"review":{"lesson":"verticalgustcalc","status":"calculation","vi":"Đề hỏi phần tăng Δn: ΔCL = 0,08 ×3 =0,24, nên Δn =0,24/0,55 =0,436≈0,44. Load factor cuối cùng là 1,44; đó không phải đại lượng được hỏi.","en":"The question asks for the increment Δn: ΔCL = 0.08 × 3 = 0.24, so Δn = 0.24/0.55 = 0.436 ≈ 0.44. The final load factor is about 1.44, which is not the requested quantity.","noteVi":"","noteEn":"","formula":"Δn = (0.08 × 3)/0.55 ≈ 0.44; n₂ ≈ 1.44"},"topic":"Limitations","displayQuestion":"An aeroplane is flying straight and level with a coefficient of lift of 0.55. The coefficient of lift increase by 0.08 per degree increase in angle of attack. If a vertical gust increases the angle of attack by 3°, what is the increase in load factor?","uid":"POF-308"},{"id":309,"question":"Taper ratio is the ratio of:","options":{"A":"the root thickness to the root chord.","B":"the span to the root chord.","C":"the tip chord to the root chord.","D":"the span to the mean chord."},"answer":"C","valid":true,"red":false,"review":{"lesson":"geometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-309"},{"id":310,"question":"Regarding the lift formula, if density doubles, lift will:","options":{"A":"also double.","B":"remain the same.","C":"be 4 times greater.","D":"halve."},"answer":"A","valid":true,"red":false,"review":{"lesson":"lift","status":"calculation","vi":"Khi V, S và CL không đổi, L tỷ lệ trực tiếp với ρ. Mật độ gấp đôi → lift gấp đôi.","en":"With V, S and CL unchanged, L is directly proportional to ρ. Twice the density gives twice the lift.","noteVi":"","noteEn":"","formula":"L₂/L₁ = ρ₂/ρ₁ = 2"},"topic":"Lift","uid":"POF-310"},{"id":311,"question":"Which line in the diagram represents an aeroplane with static longitudinal instability at all angles of attack?","options":{"A":"Line 2.","B":"Line 4.","C":"Line 3.","D":"Line 1."},"answer":"D","valid":true,"red":false,"review":{"lesson":"cmslope","status":"reviewed","vi":"Line 1 dốc lên trên toàn miền α vẽ trong hình: α tăng làm CM tăng, nên nhiễu được khuếch đại. Đây là line unstable ở tất cả góc thể hiện.","en":"Line 1 slopes upward throughout the plotted α range: increasing α increases CM and reinforces the disturbance. It is the line unstable throughout the illustrated range.","noteVi":"","noteEn":""},"topic":"Stability and Control","figure":"q311","uid":"POF-311"},{"id":312,"question":"Which of these statements about the pitching moment coefficient versus angle of attack lines in the annex is correct?","options":{"A":"The CG position is further aft at line 4 when compared with line 1.","B":"The CG position is further forward at line 4 when compared with line 1.","C":"Static longitudinal stability is greater at line 3 when compared with line 4 at low and moderate angles of attack.","D":"In its curved part line 2 illustrates a decreasing static longitudinal stability at high angles of attack."},"answer":"B","valid":true,"red":false,"review":{"lesson":"cmslope","status":"reviewed","vi":"Line 4 có độ dốc âm lớn nhất; đó là CG trước hơn so với line 1 theo sơ đồ mômen của đề.","en":"Line 4 has the strongest negative slope, indicating a more forward CG than line 1 in the supplied diagram.","noteVi":"","noteEn":""},"topic":"Stability and Control","figure":"q312","uid":"POF-312"},{"id":313,"question":"The Correct sequence of cross-sections representing propeller blade twist is:","options":{"A":"Sequence 1","B":"Sequence 2","C":"Sequence 3","D":"Sequence 4"},"answer":"C","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"Sequence 3 giảm blade angle từ x ở gốc tới z ở tip, đúng hướng twist cần thiết vì tốc độ tiếp tuyến tăng ra ngoài.","en":"Sequence 3 decreases blade angle from root section x to tip section z, matching the twist needed as tangential velocity increases outward.","noteVi":"","noteEn":""},"topic":"Propellers","figure":"q313","uid":"POF-313"},{"id":314,"question":"Which of these statements about the pitching moment coefficient versus angle of attack lines in the annex is correct?","options":{"A":"The horizontal part of line 2 illustrates static longitudinal instability.","B":"Static longitudinal stability is greater at line 3 when compared with line 4 at low and moderate angles of attack.","C":"In its curved part at high angles of attack line 2 illustrates increasing static longitudinal stability.","D":"The CG position is further aft at line 4 when compared with line 1."},"answer":"C","valid":true,"red":false,"review":{"lesson":"cmslope","status":"reviewed","vi":"Phần uốn xuống của line 2 ở α cao làm dCM/dα ngày càng âm: tăng độ ổn định tĩnh dọc.","en":"The downward-curving part of line 2 at high α has an increasingly negative dCM/dα, so static longitudinal stability increases.","noteVi":"","noteEn":""},"topic":"Stability and Control","figure":"q314","uid":"POF-314"},{"id":315,"question":"Assuming all bodies have the same cross-sectional area and are in motion, which body will have the highest pressure drag?","options":{"A":"Semi circle","B":"Rectangle","C":"Oval","D":"Circle"},"answer":"B","valid":true,"red":false,"review":{"lesson":"dragtypes","status":"derived","vi":"Hình đề cho các vật có cùng tiết diện. Vật chữ nhật có mặt cản tù và vùng wake/tách dòng lớn hơn dạng oval thuôn, nên pressure drag lớn nhất trong bốn hình. Đây là đánh giá về hình dạng, không phải chỉ về diện tích.","en":"The pictured bodies have the same cross-sectional area. The blunt rectangular shape produces a stronger separated wake than the streamlined oval and the highest pressure drag among the four shown. Shape, not just area, is the deciding factor.","noteVi":"","noteEn":""},"topic":"Drag","figure":"q315","uid":"POF-315"},{"id":316,"question":"Where on the curve in the diagram does the aeroplane exhibit static longitudinal instability?","options":{"A":"The whole curve.","B":"Point 2.","C":"Part 1.","D":"Part 3."},"answer":"D","valid":true,"red":false,"review":{"lesson":"cmslope","status":"reviewed","vi":"Part 3 là nhánh đi lên của đường CM–α. Độ dốc dương, không phải độ cao của nhánh so với trục ngang, là dấu hiệu instability.","en":"Part 3 is the upward-sloping branch. The positive slope, not its height relative to the horizontal axis, identifies instability.","noteVi":"","noteEn":""},"topic":"Stability and Control","figure":"q316","uid":"POF-316"},{"id":317,"question":"What kind of horizontal control surface is shown in the figure?","options":{"A":"Canard.","B":"All-flying tail.","C":"Elevator.","D":"Frise type control."},"answer":"B","valid":true,"red":false,"review":{"lesson":"alltail","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","figure":"q317","uid":"POF-317"},{"id":318,"question":"Which type of flap is shown in the picture 4?","options":{"A":"Plain flap","B":"Split flap","C":"Fowler flap","D":"Double slotted flap"},"answer":"C","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","figure":"q318","uid":"POF-318"},{"id":319,"question":"Which type of flap is shown in the picture 3?","options":{"A":"Plain flap","B":"Split flap","C":"Fowler flap","D":"Double slotted flap"},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","figure":"q319","uid":"POF-319"},{"id":320,"question":"An aeroplane performs a straight and level horizontal flight at the same angle of attack at two different altitudes. (all other factors of importance being constant, assume ISA conditions and no compressibility effects)","options":{"A":"the TAS at the higher altitude is higher","B":"the TAS at the higher altitude is lower","C":"the TAS at the higher altitude cannot be determined","D":"the TAS at both altitudes is the same"},"answer":"A","valid":true,"red":false,"review":{"lesson":"ias","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-320"},{"id":321,"question":"Compared with level flight prior to the stall, the lift (1) and drag (2) in the stall change as follows:","options":{"A":"(1) decreases (2) decreases","B":"(1) increases (2) increases","C":"(1) decreases (2) increases","D":"(1) increases (2) decreases"},"answer":"C","valid":true,"red":false,"review":{"lesson":"stall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-321"},{"id":322,"question":"A boundary layer fence on a swept wing will:","options":{"A":"improve the low speed characteristics","B":"improve the high speed characteristics","C":"increase the critical Mach Number","D":"improve the lift coefficient of the trailing edge flap"},"answer":"A","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-322"},{"id":323,"question":"The formula for the Mach Number is: (a= speed of sound)","options":{"A":"M= a / TAS","B":"M= IAS / a","C":"M= TAS*a","D":"M= TAS / a"},"answer":"D","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-323"},{"id":324,"question":"When the Mach number is slowly increased in straight and level flight the first shockwaves will occur:","options":{"A":"on the lower surface of the wing.","B":"on the upper surface at the wing root.","C":"somewhere on the horizontal tail.","D":"somewhere on the fin."},"answer":"B","valid":true,"red":false,"review":{"lesson":"mcrit","status":"derived","vi":"Đáp án về upper-surface/root phù hợp ví dụ swept-back wing ở trang 311, nơi shock hình thành gần gốc. Tuy nhiên chỉ điều kiện straight-and-level của đề chưa xác định planform/profile; không nên coi root là vị trí đầu tiên cho mọi cánh.","en":"The upper-surface/root answer matches the swept-back-wing example on page 311. The stem only specifies straight and level flight, however, without a planform or section, so root-first formation should not be generalized to every wing.","noteVi":"Áp dụng cho ví dụ swept-back wing trong sách, không phải kết luận mọi thiết kế.","noteEn":"Applies to the textbook swept-back-wing example rather than every design."},"topic":"High Speed Flight","uid":"POF-324"},{"id":325,"question":"In what flight phase are the outboard ailerons (if present) not operated ?","options":{"A":"During a landing with strong and gusty crosswind to avoid overcontrolling the aeroplane.","B":"During take-off, until lift-off.","C":"During cruise flight.","D":"In the approach phase, before landing."},"answer":"C","valid":true,"red":false,"review":{"lesson":"aileronlock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-325"},{"id":326,"question":"Given an aeroplane in steady, straight and level flight at low speed and considering the effects of CG location and thrust, the lowest value of wing lift occurs at:","options":{"A":"aft CG and idle thrust.","B":"aft CG and take-off thrust.","C":"forward CG and take-off thrust.","D":"forward CG and idle thrust."},"answer":"B","valid":true,"red":false,"review":{"lesson":"winglift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-326"},{"id":327,"question":"\"Flutter\" may be caused by a:","options":{"A":"combination of bending and torsion of the structure.","B":"combination of fuselage bending and wing torsion.","C":"high airspeed aerodynamic wing stall.","D":"combination roll control reversal and low speed stall."},"answer":"A","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-327"},{"id":328,"question":"An aeroplane accelerates from 80 kts to 160 kts at a load factor equal to 1. By what factors will the induced drag coefficient (i) and the induced drag (ii) change?","options":{"A":"(i) 1; ii) 1/2.","B":"(i) 1/4; ii) 2.","C":"(i) 1/2; ii) 1/16.","D":"(i) 1/16; ii) 1/4."},"answer":"D","valid":true,"red":false,"review":{"lesson":"induced","status":"calculation","vi":"Tốc độ gấp đôi → dynamic pressure gấp 4. Để giữ n = 1, CL còn 1/4. Vì CDi ∝ CL², CDi còn 1/16; Di = qSCDi nên còn 4 × 1/16 = 1/4. Phải phân biệt hệ số CDi và lực Di.","en":"Doubling speed quadruples dynamic pressure. Maintaining n = 1 reduces CL to one quarter. CDi ∝ CL² therefore falls to 1/16, while Di = qSCDi becomes 4 × 1/16 = 1/4. The coefficient CDi and force Di change by different factors.","noteVi":"","noteEn":"","formula":"V ×2 → q ×4 → CL ×¼ → CDi ×¹⁄₁₆ → Di ×¼"},"topic":"Lift","uid":"POF-328"},{"id":329,"question":"What is the effect of winglets on the drag of the wing?","options":{"A":"Increase friction drag, decrease form drag.","B":"Increase parasite drag, decrease induced drag.","C":"Increase induced drag, decrease friction drag.","D":"Increase induced drag, decrease interference drag."},"answer":"B","valid":true,"red":false,"review":{"lesson":"tipdevices","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-329"},{"id":330,"question":"The vane of a stall warning system with a flapper switch is activated by the change of the:","options":{"A":"point of lowest pressure.","B":"stagnation point.","C":"centre of gravity.","D":"centre of pressure."},"answer":"B","valid":true,"red":false,"review":{"lesson":"stallwarning","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-330"},{"id":331,"question":"Which of the following wing planforms produces the lowest induced drag? (assume zero wing twist)","options":{"A":"Rectangular.","B":"Elliptical.","C":"Tapered.","D":"Circular."},"answer":"B","valid":true,"red":false,"review":{"lesson":"elliptic","status":"limited","vi":"","en":"","noteVi":"Chưa đủ đoạn nguồn trực tiếp cho tính chất phân bố lift elip.","noteEn":"A direct source for the particular elliptical-loading property is not established."},"topic":"Lift","uid":"POF-331"},{"id":332,"question":"Which of the following provides a positive contribution to static directional stability?","options":{"A":"Moving the centre of gravity aft.","B":"A forward swept wing.","C":"A low wing as compared with a high wing.","D":"A dorsal fin."},"answer":"D","valid":true,"red":false,"review":{"lesson":"fins","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-332"},{"id":333,"question":"Spoilers mounted on the wing upper surface can be used to:","options":{"A":"prevent aeroplane yaw following engine failure.","B":"assist the ailerons.","C":"increase lift and drag.","D":"assist the elevators."},"answer":"B","valid":true,"red":false,"review":{"lesson":"spoilers","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-333"},{"id":334,"question":"The positive manoeuvring limit load factor for a large jet transport aeroplane with flaps extended is:","options":{"A":"1,5","B":"2,5","C":"3,75","D":"2"},"answer":"D","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"reviewed","vi":"","en":"","noteVi":"Giá trị theo phân loại và giáo trình 2014, không thay flight manual của loại máy bay.","noteEn":"Values follow the categories in the 2014 text and do not replace the aircraft flight manual."},"topic":"Limitations","uid":"POF-334"},{"id":335,"question":"If the RPM lever of a constant speed propeller is moved forward during a glide with idle power and whilst maintaining constant airspeed, the propeller pitch will:","options":{"A":"decrease and the rate of descent will decrease.","B":"increase and the rate of descent will decrease.","C":"increase and the rate of descent will increase.","D":"decrease and the rate of descent will increase."},"answer":"D","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-335"},{"id":336,"question":"The greatest drag produced by the variable pitch propeller on a piston engine will occur when the propeller is:","options":{"A":"used during a powered glide.","B":"stopped in fine pitch.","C":"stopped in coarse pitch.","D":"windmilling."},"answer":"D","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-336"},{"id":337,"question":"Which statement is correct? 1) A propeller with a small blade angle is referred to as being in coarse pitch. 2) A propeller with a large blade angle is referred to as being in fine pitch.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-337"},{"id":338,"question":"If the chord of the propeller blades is increased, with everything else remaining constant:","options":{"A":"the power absorbed will increase and the efficiency will increase","B":"the power absorbed will increase and the efficiency will decrease","C":"the power absorbed will decrease and the efficiency will increase","D":"the power absorbed will increase and the efficiency will remain constant"},"answer":"B","valid":true,"red":false,"review":{"lesson":"solidity","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-338"},{"id":339,"question":"Given an aeroplane with a propeller turning clockwise as seen from behind, the torque effect during the take-off run will tend to:","options":{"A":"roll the aeroplane to the right.","B":"pitch the aeroplane nose down.","C":"roll the aeroplane to the left.","D":"pitch the aeroplane nose up."},"answer":"C","valid":true,"red":false,"review":{"lesson":"torque","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-339"},{"id":340,"question":"The phugoid motion is a long term oscillation around the:","options":{"A":"vertical axis.","B":"normal axis.","C":"lateral axis.","D":"longitudinal axis."},"answer":"C","valid":true,"red":false,"review":{"lesson":"phugoid","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-340"},{"id":341,"question":"Vortex generators mounted on the upper wing surface will:","options":{"A":"increase the effectiveness of the spoiler due to increase in parasite drag.","B":"decrease the interference drag of the trailing edge flaps.","C":"decrease the shock wave induced separation.","D":"decrease the stalling speed by increase of the tangential velocity of the swept wing."},"answer":"C","valid":true,"red":false,"review":{"lesson":"vortexgen","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-341"},{"id":342,"question":"If pressure is kept constant and temperature increases, the density:","options":{"A":"increases.","B":"decreases.","C":"has no effect.","D":"remains constant."},"answer":"B","valid":true,"red":false,"review":{"lesson":"density","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-342"},{"id":343,"question":"Consider an aerofoil with a certain camber and a positive angle of attack. At which location will the highest flow velocities occur?","options":{"A":"At the trailing edge.","B":"Upper side.","C":"In front of the stagnation point.","D":"Lower side."},"answer":"B","valid":true,"red":false,"review":{"lesson":"pressureflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-343"},{"id":344,"question":"Ignoring downwash effects on the tailplane, extension of Fowler-type flaps, will produce:","options":{"A":"a nose-up pitching moment.","B":"no pitching moment.","C":"a nose-down pitching moment.","D":"a force which reduces drag."},"answer":"C","valid":true,"red":false,"review":{"lesson":"flappitch","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-344"},{"id":345,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the throat is the same as in the undisturbed airflow. 2) The total pressure in the throat is lower than in the undisturbed airflow.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect."},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-345"},{"id":346,"question":"Decreasing the aspect ratio of a wing:","options":{"A":"decreases induced drag.","B":"increases gust load.","C":"decreases stall speed.","D":"increases induced drag."},"answer":"D","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-346"},{"id":347,"question":"Drag is acting in the direction of ___. Lift is perpendicular to the ___.","options":{"A":"relative wind (airflow)","B":"horizon","C":"chord line","D":"longitudinal axis"},"answer":"A","valid":true,"red":false,"review":{"lesson":"directionforces","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-347"},{"id":348,"question":"On a symmetrical aerofoil, the pitching moment for which CL = 0 is:","options":{"A":"negative (pitch-down)","B":"positive (pitch-up)","C":"zero","D":"equal to the moment coefficient for stabilized angle of attack"},"answer":"C","valid":true,"red":false,"review":{"lesson":"symmetrical","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-348"},{"id":349,"question":"If the continuity equation is applicable, what will happen to the air density (rho) if the cross sectional area of a tube changes? (low speed, subsonic and incompressible flow)","options":{"A":"rho1 > rho2","B":"The density depends on the change of the tube area","C":"rho1 < rho2","D":"rho1 = rho2"},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-349"},{"id":350,"question":"Which of the following wing planforms produces the lowest induced drag? (all other relevant factors constant)","options":{"A":"Rectangular","B":"Elliptical","C":"Tapered","D":"Circular"},"answer":"B","valid":true,"red":false,"review":{"lesson":"elliptic","status":"limited","vi":"","en":"","noteVi":"Chưa đủ đoạn nguồn trực tiếp cho tính chất phân bố lift elip.","noteEn":"A direct source for the particular elliptical-loading property is not established."},"topic":"Lift","uid":"POF-350"},{"id":351,"question":"If an aeroplane flies in the ground effect","options":{"A":"the induced angle of attack is increased","B":"the lift is increased and the drag is decreased","C":"drag and lift are reduced","D":"the effective angle of attack is decreased"},"answer":"B","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-351"},{"id":352,"question":"The pitch up effect of an aeroplane with swept wing in a stall is due to the","options":{"A":"aft movement of the centre of gravity","B":"forward movement of the centre of gravity","C":"wing root stalling first","D":"wing tip stalling first"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-352"},{"id":353,"question":"During the take-off roll with a strong crosswind from the left, a four engine jet aeroplane with wing mounted engines experiences an engine failure above V1. Which engine causes the greatest control problem?","options":{"A":"The right outboard engine","B":"The left outboard engine","C":"The right inboard engine","D":"The left inboard engine"},"answer":"B","valid":true,"red":false,"review":{"lesson":"engineoutroll","status":"derived","vi":"Gió từ trái gây weathercock sang trái; hỏng left outboard cũng gây yaw trái và có arm lớn hơn left inboard. Hai tác dụng cộng nhau nên left outboard gây bài toán điều khiển khó nhất trong các lựa chọn. Đây là suy luận từ moment arms và weathercock tendency, không phải thao tác xử lý tình huống sauV1.","en":"Wind from the left creates a left weathercock tendency. Failure of the left outboard engine also yaws left and has a longer arm than the left inboard. The effects add, making the left outboard the most difficult listed case. This follows from moment arms and weathercock tendency and is not a procedure for handling a post-V1 event.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-353"},{"id":354,"question":"Differential aileron deflection:","options":{"A":"increases the CLmax","B":"is required to achieve the required roll-rate","C":"equals the drag of the right and left aileron","D":"is required to keep the total lift constant when ailerons are deflected"},"answer":"C","valid":true,"red":false,"review":{"lesson":"adverse","status":"derived","vi":"Đáp án dùng “equals” để mô tả mục đích cân bằng drag. Sách nói giảm chênh drag giữa hai cánh; không khẳng định mọi cấu hình và tốc độ đều đạt bằng nhau tuyệt đối.","en":"The option uses “equals” to describe the intended drag balancing. The text says the difference is reduced, not that exact equality is guaranteed at every configuration and speed.","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-354"},{"id":355,"question":"How can wing flutter be prevented?","options":{"A":"By increasing the aspect ratio of the wing","B":"By installing the fuel tanks in the fuselage","C":"By mounting the engines on the fuselage","D":"By locating mass in front of the torsion axis of the wing"},"answer":"D","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-355"},{"id":356,"question":"The positive manoeuvring limit load factor for a light aeroplane in the utility category in the clean configuration is:","options":{"A":"2.5","B":"4.4","C":"6.0","D":"3.8"},"answer":"B","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"reviewed","vi":"","en":"","noteVi":"Giá trị theo phân loại và giáo trình 2014, không thay flight manual của loại máy bay.","noteEn":"Values follow the categories in the 2014 text and do not replace the aircraft flight manual."},"topic":"Limitations","uid":"POF-356"},{"id":357,"question":"Constant-speed propellers provide a better performance than fixed-pitch propellers because they:","options":{"A":"have more blade surface area than a fixed-pitch propeller.","B":"produce a greater maximum thrust than a fixed-pitch propeller.","C":"have a higher maximum efficiency than a fixed-pitch propeller.","D":"produce an almost maximum efficiency over a wider speed range."},"answer":"D","valid":true,"red":false,"review":{"lesson":"propaoa","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-357"},{"id":358,"question":"If you push forward the RPM lever of a constant speed propeller during a glide with idle power and constant speed, the propeller pitch will:","options":{"A":"increase and the rate of descent will increase.","B":"increase and the rate of descent will decrease.","C":"decrease and the rate of descent will decrease.","D":"decrease and the rate of descent will increase."},"answer":"D","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-358"},{"id":359,"question":"An aeroplane performs a continuous descent with 160 KT IAS and 1000 fpm vertical speed. In this condition:","options":{"A":"lift is equal to weight","B":"lift is less than drag","C":"drag is less than the combined forces that move the aeroplane forward","D":"weight is greater than lift"},"answer":"D","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"derived","vi":"Trong descent đều, thành phần weight vuông góc flight path làWcosγ và được lift cân bằng. Vì cosγ<1 nên L<W. Vertical speed không đổi không đòi hỏi L=W, vì lift không hướng thẳng đứng trong descent.","en":"In a steady descent, lift balances the component of weight perpendicular to the flight path, Wcosγ. Because cosγ<1, L<W. A constant vertical speed does not require L=W because lift is not vertical in the descent.","noteVi":"","noteEn":"","formula":"L = W cosγ < W (γ ≠ 0)"},"topic":"Flight Mechanics","uid":"POF-359"},{"id":360,"question":"What factors determine the distance travelled over the ground of an aeroplane in a glide ?","options":{"A":"The wind and the lift/drag ratio, which changes with angle of attack","B":"The wind and the aeroplane's mass","C":"The wind and CLmax","D":"The wind and weight together with power loading, which is the ratio of power output to the weight"},"answer":"A","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-360"},{"id":361,"question":"The lift to drag ratio determines the","options":{"A":"maximum rate of climb","B":"horizontal distance in the climb up to a given altitude","C":"endurance speed","D":"horizontal glide distance from a given altitude at zero wind and zero thrust"},"answer":"D","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-361"},{"id":362,"question":"An aeroplane, being manually flown in the speed unstable region, experiences a disturbance that causes a speed reduction. If the altitude is maintained and thrust remains constant, the aeroplane speed will:","options":{"A":"initially increase and thereafter decrease.","B":"further decrease.","C":"increase.","D":"initially further decrease and thereafter increase."},"answer":"B","valid":true,"red":false,"review":{"lesson":"speedunstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-362"},{"id":363,"question":"What is the correct relationship between the true airspeed for (i) minimum sink rate and (ii) minimum glide angle, at a given altitude?","options":{"A":"(i) is equal to (ii)","B":"(i) is less than (ii)","C":"(i) can be greater than or less than (ii) depending on the type of aeroplane","D":"(i) is greater than (ii)"},"answer":"B","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-363"},{"id":364,"question":"The lift coefficient Cl versus angle of attack curve of a positively cambered aerofoil section intersects the horizontal axis of the graph:","options":{"A":"nowhere.","B":"to the left of the origin.","C":"at the origin.","D":"to the right of the origin."},"answer":"B","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-364"},{"id":365,"question":"Static pressure acts:","options":{"A":"only in direction of the flow","B":"only perpendicular to the direction of the flow","C":"in all directions","D":"only in the direction of the total pressure"},"answer":"C","valid":true,"red":false,"review":{"lesson":"pressure","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-365"},{"id":366,"question":"What is the effect of high aspect ratio of an aeroplane's wing on induced drag?","options":{"A":"It is increased because high aspect ratio produces greater downwash","B":"It is reduced because the effect of wing-tip vortices is reduced","C":"It is unaffected because there is no relation between aspect ratio and induced drag","D":"It is increased because high aspect ratio has greater frontal area"},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-366"},{"id":367,"question":"Dangerous stall characteristics, in large transport aeroplanes that require stick pushers to be installed, include:","options":{"A":"distinct aerodynamic buffet","B":"pitch down and yaw","C":"pitch down and increase in speed","D":"excessive wing drop and deep stall"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stallwarning","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-367"},{"id":368,"question":"The stall speed increases, when: (all other factors of importance being constant)","options":{"A":"weight decreases","B":"minor altitude changes occur e.g. 0-10000'","C":"spoilers are retracted","D":"pulling out of a dive"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-368"},{"id":369,"question":"Rotation around the normal axis is called:","options":{"A":"pitching.","B":"yawing.","C":"rolling.","D":"slipping."},"answer":"B","valid":true,"red":false,"review":{"lesson":"axes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-369"},{"id":370,"question":"A \"slat\" is:","options":{"A":"a leading edge high lift device, hinged at its forward edge, which increases the camber and leading edge radius of the main aerofoil when deployed.","B":"a trailing edge device which is automatically deployed by movement of the stagnation point at high angles of attack.","C":"a fixed slot in the leading edge of some older types of aircraft.","D":"an auxiliary, cambered aerofoil positioned forward of the main aerofoil so as to form a slot."},"answer":"D","valid":true,"red":false,"review":{"lesson":"slats","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-370"},{"id":371,"question":"CL varies with:","options":{"A":"density.","B":"angle of attack.","C":"velocity.","D":"pressure."},"answer":"B","valid":true,"red":false,"review":{"lesson":"lift","status":"reviewed","vi":"Trong các điều kiện khí động của câu, CL thay đổi theo góc tấn, không phải chỉ do vận tốc tăng. Đừng nhầm CL với lực nâng L.","en":"Under the aerodynamic conditions of this question, CL varies with angle of attack, rather than simply with an increase in speed. Do not confuse CL with lift force L.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-371"},{"id":372,"question":"If the trailing edge flaps are lowered (fully extended), in order to maintain constant IAS and level flight:","options":{"A":"the nose must be lowered and thrust increased.","B":"attitude and thrust must be kept constant.","C":"attitude must be increased and thrust increased.","D":"the nose must be raised and thrust increased."},"answer":"A","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-372"},{"id":373,"question":"Which statement is correct? I. Propeller gyroscopic effect occurs during aeroplane yaw changes. II. Propeller gyroscopic effect is most noticeable during low speed flight at high propeller RPM.","options":{"A":"I is correct, II is incorrect.","B":"I is incorrect, II is incorrect.","C":"I is incorrect, II is correct.","D":"I is correct, II is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"gyro","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-373"},{"id":374,"question":"Which statement is correct? I. Stall speeds are determined with the CG at the aft limit. II. Minimum control speeds are determined with the CG at the forward limit.","options":{"A":"I is incorrect, II is correct.","B":"I is correct, II is correct.","C":"I is incorrect, II is incorrect.","D":"I is correct, II is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"vmc","status":"derived","vi":"Stall-speed determination dùng CG bất lợi cho stall speed: forward CG cần tail download lớn hơn nên Vs cao hơn. Minimum-control determination dùng CG bất lợi cho rudder moment arm: aft CG. Vì vậy cả hai phát biểu trong đề đều đảo ngược điều kiện.","en":"Stall-speed determination uses the unfavorable CG for stall speed: forward CG requires more tail downforce and raises Vs. Minimum-control determination uses the unfavorable rudder-arm condition: aft CG. Thus both statements reverse the relevant conditions.","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-374"},{"id":375,"question":"Which statement is correct at the speed for minimum drag (subsonic) ?","options":{"A":"Induced drag is greater than the parasite drag.","B":"The gliding angle is minimum (assume zero thrust).","C":"The CL/CD ratio is minimum (assume zero thrust).","D":"Propeller aeroplanes fly at that speed at max. endurance."},"answer":"B","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-375"},{"id":376,"question":"The effects of very heavy rain (tropical rain) on the aerodynamic characteristics of an aeroplane are:","options":{"A":"decrease of CLmax and increase of drag","B":"increase of CLmax and increase of drag","C":"increase of CLmax and decrease of drag","D":"decrease of CLmax and decrease of drag"},"answer":"A","valid":true,"red":false,"review":{"lesson":"ice","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-376"},{"id":377,"question":"In a stationary subsonic streamline flow pattern, if the streamlines converge, in this part of the pattern, the static pressure (I) will ...and the velocity (II) will ...:","options":{"A":"(I) increase, (II) decrease.","B":"(I) increase, (II) increase.","C":"(I) decrease, (II) decrease.","D":"(I) decrease, (II) increase."},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-377"},{"id":378,"question":"The true airspeed (TAS) is:","options":{"A":"lower than the indicated airspeed (IAS) at ISA conditions and altitudes below sea level","B":"higher than the speed of the undisturbed airstream about the aeroplane","C":"lower than the speed of the undisturbed airstream about the aeroplane","D":"equal to the IAS, multiplied by the air density at sea level"},"answer":"A","valid":true,"red":false,"review":{"lesson":"ias","status":"derived","vi":"Dưới mực biển trong ISA, mật độ cao hơn ρ₀. Cùng dynamic pressure, TAS = EAS√(ρ₀/ρ) thấp hơn EAS; với các sai số bỏ qua trong câu, IAS cao hơn TAS.","en":"Below sea level in ISA, density exceeds ρ₀. For the same dynamic pressure, TAS = EAS√(ρ₀/ρ) is below EAS; with the errors neglected here, IAS exceeds TAS.","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-378"},{"id":379,"question":"What is the SI unit of measurement for power?","options":{"A":"kgm/s2","B":"Pa/m2","C":"Nm/s","D":"N/m"},"answer":"C","valid":true,"red":false,"review":{"lesson":"mass","status":"reviewed","vi":"N·m/s là một watt. N·m riêng lẻ là công hoặc mômen tùy ngữ cảnh, chưa phải công suất.","en":"N·m/s is one watt. N·m alone describes work or a moment, depending on context, rather than power.","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-379"},{"id":380,"question":"On an asymmetrical, single curve aerofoil, in subsonic airflow, at low angle of attack, when the angle of attack is increased, the centre of pressure will (assume a conventional transport aeroplane):","options":{"A":"move forward","B":"remain matching the airfoil aerodynamic centre","C":"move aft","D":"remain unaffected"},"answer":"A","valid":true,"red":false,"review":{"lesson":"cp","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-380"},{"id":381,"question":"The frontal area of a body, placed in a certain airstream is increased by a factor 3. The shape will not alter. The aerodynamic drag will increase with a factor:","options":{"A":"9","B":"3","C":"1.5","D":"6"},"answer":"B","valid":true,"red":false,"review":{"lesson":"parasitic","status":"calculation","vi":"Vì hình dạng không đổi, giữ CD và q. D₂/D₁ = S₂/S₁ = 3.","en":"Shape is unchanged, so CD and q are fixed. D₂/D₁ = S₂/S₁ = 3.","noteVi":"","noteEn":"","formula":"D₂/D₁ = S₂/S₁ = 3"},"topic":"Lift","uid":"POF-381"},{"id":382,"question":"Which of the following will reduce induced drag?","options":{"A":"Low aspect ratio","B":"Flying at high angles of attack","C":"Extending the flaps","D":"Elliptical lift distribution"},"answer":"D","valid":true,"red":false,"review":{"lesson":"elliptic","status":"limited","vi":"","en":"","noteVi":"Chưa đủ đoạn nguồn trực tiếp cho tính chất phân bố lift elip.","noteEn":"A direct source for the particular elliptical-loading property is not established."},"topic":"Lift","uid":"POF-382"},{"id":383,"question":"Which of the following aeroplane parts affect induced drag most?","options":{"A":"Landing gear","B":"Wing tip","C":"Wing root junction","D":"Engine cowling"},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-383"},{"id":384,"question":"After take-off the slats (when installed) are always retracted later than the flaps. Why?","options":{"A":"Because FLAPS EXTENDED gives a large decrease in stall speed with relatively less drag","B":"Because SLATS EXTENDED provides a better view from the cockpit than FLAPS EXTENDED","C":"Because VMCA with SLATS EXTENDED is more favourable compared to the FLAPS EXTENDED situation","D":"Because SLATS EXTENDED gives a large decrease in stall speed with relatively less drag"},"answer":"D","valid":true,"red":false,"review":{"lesson":"slats","status":"limited","vi":"Biên stall tốt với drag tương đối nhỏ giải thích vì sao một trình tự thu có thể giữ slat lâu hơn flap. Chữ “always” trong đề không phải quy tắc thao tác cho mọi loại máy bay; trình tự thực tế do thiết kế và Flight Manual quy định.","en":"The useful stall margin at relatively low drag explains why a retraction sequence may retain slats after flaps. “Always” in the stem is not a universal operating rule for every aircraft; the actual sequence is design- and Flight-Manual-specific.","noteVi":"Nguyên lý được sách hỗ trợ; phát biểu “always” quá tuyệt đối.","noteEn":"The principle is supported, but the word “always” is too absolute."},"topic":"Hi
