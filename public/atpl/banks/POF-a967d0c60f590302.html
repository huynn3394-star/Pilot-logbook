upper and lower surfaces symmetric about the chord. At α = 0, net lift and moment about AC are zero, and its CL–α curve passes through the origin. A negatively cambered section shifts the lift relationship in the opposite direction to positive camber: CL is negative at α = 0 and a positive α is needed for zero lift.","images":[]},"lift":{"id":"lift","title":"Lift equation and constant-lift flight","chapter":"Lift","pages":[73,74,75,76],"vi":"L = ½ρV²SCL. Để giữ bay bằng ở cùng trọng lượng, tổng lift cần thiết không đổi. Khi tốc độ giảm mà ρ và S không đổi, CL phải tăng; trong vùng trước stall, tăng CL bằng cách tăng góc tấn. Nếu tốc độ tăng thì CL cần giảm theo nghịch đảo V². Chỉ khi CL, ρ và S không đổi mới có thể nói lift tăng theo V².","en":"L = ½ρV²SCL. To maintain level flight at the same weight, the required total lift is unchanged. If speed falls with density and area fixed, CL must increase; before stall this is achieved by increasing angle of attack. If speed rises, required CL decreases in inverse proportion to V². Lift itself varies with V² only when CL, density and area are held fixed.","images":[75]},"ias":{"id":"ias","title":"IAS, TAS, density and height","chapter":"The Atmosphere","pages":[30,31,32,33,75],"vi":"Ở cùng cấu hình và AoA, CL không đổi. Để duy trì cùng lift khi ρ giảm ở độ cao lớn hơn, TAS phải tăng để ½ρV² giữ nguyên. Trong giả thiết không có sai số nén được của đề, IAS đại diện dynamic pressure nên IAS vẫn như cũ. Đây là lý do cùng IAS có thể tương ứng TAS khác nhau ở các độ cao khác nhau.","en":"At the same configuration and angle of attack, CL is unchanged. To retain the same lift as density decreases with altitude, TAS must increase so that ½ρV² remains constant. Under the stated no-compressibility-error assumption, IAS represents dynamic pressure and remains the same. Thus the same IAS can correspond to different TAS at different altitudes.","images":[]},"directionforces":{"id":"directionforces","title":"Lift and drag directions","chapter":"Overview and Definitions","pages":[53,80,111],"vi":"Lift được định nghĩa vuông góc với relative airflow; drag song song và cùng chiều relative airflow, tức ngược chiều chuyển động của máy bay so với không khí. Vì góc tấn có thể khác 0, hai lực này không được định nghĩa theo chord line hay trục dọc thân máy bay.","en":"Lift is defined perpendicular to the relative airflow. Drag acts parallel to and in the same direction as the relative airflow, opposite the aircraft motion through the air. Because angle of attack may be non-zero, these directions are not defined by the chord or the aircraft longitudinal axis.","images":[]},"boundary":{"id":"boundary","title":"Laminar and turbulent boundary layers","chapter":"Drag","pages":[112,113,114,587],"vi":"Lớp biên là vùng dòng khí sát bề mặt chịu ảnh hưởng của độ nhớt. Laminar flow có các lớp dòng trượt đều, không có chuyển động trộn vuông góc bề mặt như turbulent flow. Tại transition point, lớp biên chuyển từ laminar sang turbulent. Lớp turbulent có trao đổi động lượng và năng lượng gần bề mặt tốt hơn nên chống adverse pressure gradient, chậm tách dòng hơn; đổi lại skin-friction drag lớn hơn. Transition không phải separation.","en":"The boundary layer is the near-surface flow affected by viscosity. Laminar flow has orderly layers without the cross-surface mixing of turbulent flow. At the transition point it changes from laminar to turbulent. Turbulent mixing brings more momentum and kinetic energy near the surface, improving resistance to an adverse pressure gradient and delaying separation, but increasing skin-friction drag. Transition is not separation.","images":[112,113]},"dragtypes":{"id":"dragtypes","title":"Components of aerodynamic drag","chapter":"Drag","pages":[111,114,115],"vi":"Tổng drag được chia thành parasite drag và induced drag. Parasite drag gồm skin friction, form/pressure drag và interference drag. Skin friction do độ nhớt và gradient vận tốc sát bề mặt; form drag do chênh áp trước/sau vật; interference drag do các trường dòng khí tương tác ở chỗ nối các bộ phận. Skin friction và form drag hợp thành profile drag.","en":"Total drag is divided into parasite and induced drag. Parasite drag comprises skin friction, form/pressure drag and interference drag. Skin friction results from viscosity and the near-wall velocity gradient; form drag from pressure differences across the body; interference drag from interacting flow fields at component junctions. Skin friction plus form drag is profile drag.","images":[]},"induced":{"id":"induced","title":"Induced drag, CL, mass and aspect ratio","chapter":"Lift","pages":[86,87,118,119,121],"vi":"Chênh áp mặt dưới/mặt trên tạo dòng theo sải và xoáy đầu cánh. Downwash làm vectơ lực nâng nghiêng về sau; thành phần về sau đó là induced drag. Với cùng AR và điều kiện khí động, CDi tỷ lệ CL². Khi lift giữ nguyên, tăng tốc làm CL giảm và Di giảm theo 1/V². Ở cùng tốc độ, tăng khối lượng hoặc load factor làm lift cần thiết tăng, nên Di tăng theo bình phương lift. AR lớn làm giảm ảnh hưởng tương đối của xoáy đầu cánh và giảm CDi.","en":"The lower-to-upper pressure difference generates spanwise flow and wingtip vortices. Downwash tilts the lift vector rearward, producing induced drag. For fixed aspect ratio and aerodynamic conditions, CDi is proportional to CL². With lift fixed, higher speed lowers CL and Di varies inversely with V². At fixed speed, greater mass or load factor requires more lift and increases Di with the square of lift. Higher AR reduces the relative wingtip-vortex influence and lowers CDi.","images":[87,119,121]},"spanflow":{"id":"spanflow","title":"Spanwise flow and wingtip vortices","chapter":"Lift","pages":[86,87,118],"vi":"Với cánh đang tạo lift dương, áp suất mặt dưới cao hơn mặt trên. Dòng mặt dưới có thành phần ra đầu cánh; vòng qua đầu cánh rồi dòng mặt trên có thành phần vào gốc. Ở cùng kiểu cánh, góc tấn lớn hơn làm chênh áp và xoáy mạnh hơn. Sải/AR có ảnh hưởng đến hệ xoáy, nên không thể nói vortex strength độc lập với AR trong mô hình của sách.","en":"For positive wing lift, pressure below the wing exceeds pressure above it. Lower-surface flow has an outward spanwise component; it curls around the tip, and upper-surface flow has an inward component. For the same wing, greater angle of attack strengthens the pressure difference and vortices. Span/aspect ratio affects the vortex system, so its influence cannot be dismissed in the textbook model.","images":[86]},"tipdevices":{"id":"tipdevices","title":"Winglets, tip tanks and induced drag","chapter":"Drag","pages":[122],"vi":"End plates, tip tanks và winglets cản bớt dòng vòng qua đầu cánh hoặc làm suy yếu hệ xoáy, nhờ đó giảm induced drag. Tuy nhiên các bộ phận gắn thêm cũng có diện tích ướt và lực cản riêng, làm tăng parasite drag. Vì hai thành phần thay đổi trái chiều, không được suy ra total drag luôn giảm ở mọi tốc độ chỉ từ việc có winglet hoặc tip tank.","en":"End plates, tip tanks and winglets restrict tip flow or weaken the vortex system, reducing induced drag. Added surfaces also have wetted area and their own resistance, increasing parasite drag. Because the two components change in opposite directions, adding such a device does not by itself prove total drag decreases at every speed.","images":[122]},"parasitic":{"id":"parasitic","title":"Parasite drag and the drag equation","chapter":"Lift","pages":[80,115,123,124],"vi":"D = qSCD, trong đó q = ½ρV². Với hình dạng và CD không đổi, tăng diện tích tham chiếu ba lần làm drag ba lần. Trong bay bằng, total drag cần phân biệt với parasite drag: tăng tốc làm parasite drag tăng nhưng induced drag giảm. Trên VMD, sự tăng parasite drag chiếm ưu thế nên total drag tăng.","en":"D = qSCD, where q = ½ρV². With shape and CD unchanged, tripling reference area triples drag. In level flight, total drag must be distinguished from parasite drag: higher speed increases parasite drag but decreases induced drag. Above VMD, the parasite-drag increase dominates, so total drag rises.","images":[]},"polar":{"id":"polar","title":"Drag polar and maximum L/D","chapter":"Drag","pages":[123,124,125],"vi":"Drag polar biểu diễn CL theo CD. Độ dốc của đường nối gốc tọa độ với một điểm trên polar là CL/CD; đường tiếp tuyến từ gốc cho tỷ số L/D lớn nhất. Trên polar parabol CD = CD0 + kCL², CD0 là giao điểm tại CL = 0. Trong mô hình bay bằng của sách, minimum total drag xảy ra khi parasite drag bằng induced drag; đây cũng là L/Dmax.","en":"A drag polar plots CL against CD. The slope of a line from the origin to a point is CL/CD; the tangent from the origin gives maximum L/D. For the parabolic polar CD = CD0 + kCL², CD0 is the intercept at CL = 0. In the textbook level-flight model, minimum total drag occurs when parasite and induced drag are equal and corresponds to L/Dmax.","images":[124,125]},"speedunstable":{"id":"speedunstable","title":"Flight below minimum-drag speed","chapter":"Drag","pages":[128,129],"vi":"Trong vùng dưới VMD, giảm tốc nhưng vẫn giữ độ cao buộc CL tăng và induced drag tăng. Nếu không tăng thrust, drag vượt thrust làm máy bay giảm tốc thêm. Đây là speed instability trong điều kiện giữ độ cao và thrust không đổi, không phải định nghĩa static pitch instability.","en":"Below VMD, slowing while holding altitude requires a higher CL and increases induced drag. If thrust is not increased, drag exceeds thrust and the aircraft slows further. This is speed instability under the specified altitude/thrust conditions, not the definition of static pitch instability.","images":[128]},"ground":{"id":"ground","title":"Ground effect: keep the stated variables fixed","chapter":"Lift","pages":[91,92,93],"vi":"Gần mặt đất, hệ xoáy đầu cánh bị hạn chế; downwash và induced angle of attack giảm. Vì vậy, ở cùng góc tấn hình học và cùng dynamic pressure, góc tấn hiệu dụng lớn hơn, CL tăng và lực cản cảm ứng giảm. Khi ra khỏi ground effect, các thay đổi đảo chiều: CL giảm và CDi tăng ở cùng góc tấn. Không nên nhầm trường hợp giữ góc tấn này với bay bằng được phi công điều chỉnh lại để giữ lift bằng weight.","en":"Near the ground, the trailing-vortex system is restricted, reducing downwash and induced angle of attack. At unchanged geometric angle of attack and dynamic pressure, effective angle of attack and CL increase while induced drag decreases. Leaving ground effect reverses those changes: CL falls and CDi rises at the same geometric angle. This fixed-angle comparison must be distinguished from level flight in which the pilot adjusts the controls to keep lift equal to weight.","images":[91,92]},"stall":{"id":"stall","title":"Stall: the critical angle, not a universal speed","chapter":"Stalling","pages":[145,146,147,187,57],"vi":"Trong mô hình cận âm thấp, stall xảy ra khi vượt góc tấn tới hạn của cấu hình đang xét. Góc tấn lớn làm adverse pressure gradient tăng; lớp biên không còn đủ động năng để bám mặt trên và tách dòng lan rộng. CL giảm, drag tăng. Vì lực nâng cần thiết thay đổi theo weight và load factor, một cánh có thể đạt góc tới hạn ở nhiều tốc độ khác nhau; kéo lên khi ra khỏi bổ nhào hoặc tăng g có thể gây accelerated stall ở tốc độ cao hơn Vs 1 g.","en":"In the low-subsonic model, a stall occurs when the critical angle of attack for the configuration is exceeded. The increasing adverse pressure gradient causes extensive upper-surface boundary-layer separation; CL falls and drag rises. Since the lift required changes with weight and load factor, the critical angle can be reached at different speeds. A pull-out or an increase in g can cause an accelerated stall above the 1 g stall speed.","images":[146]},"stallshape":{"id":"stallshape","title":"Wing planform and the progression of the stall","chapter":"Stalling","pages":[155,156,157,160,161],"vi":"Cánh chữ nhật không xoắn thường có local CL lớn nhất ở gốc và stall từ gốc ra ngoài. Phần ngoài còn bám dòng giúp aileron duy trì tác dụng. Cánh tapered hoặc swept có thể stall đầu cánh trước. Với cánh swept-back, vùng đầu cánh nằm về sau: mất lift ở đó làm CP toàn cánh tiến lên và có thể gây pitch-up. Washout giảm incidence ở đầu cánh để trì hoãn stall vùng ngoài; wing fence hạn chế dòng ngang theo sải và cải thiện đặc tính tốc độ thấp.","en":"An untwisted rectangular wing typically reaches its highest local CL at the root, so the stall starts inboard and spreads outward while outboard aileron effectiveness is retained. Tapered or swept wings may stall near the tips first. On a swept-back wing the tips are aft: losing their lift moves the resultant CP forward and can cause pitch-up. Washout reduces tip incidence to delay outboard stall. A boundary-layer fence restricts spanwise flow and improves low-speed characteristics.","images":[156,160]},"stallwarning":{"id":"stallwarning","title":"Stall warning and stick-pusher protection","chapter":"Stalling","pages":[151,152,153,166,167],"vi":"Stick shaker báo gần stall; stick pusher là cơ cấu chủ động đẩy cần về trước để giảm góc tấn trước khi đi vào vùng stall nguy hiểm. Do đó warning xuất hiện trước, còn pusher hoạt động ở góc tấn cao hơn ngưỡng shaker. Cảm biến AoA hoặc sự dịch chuyển stagnation point có thể điều khiển hệ báo. Pusher đặc biệt liên quan các kiểu stall có wing drop mạnh hoặc deep stall; không phải cơ cấu giữ một tốc độ IAS cố định cho mọi điều kiện.","en":"A stick shaker warns of an approaching stall; a stick pusher actively drives the column forward to reduce angle of attack before a dangerous stall develops. The warning comes first and the pusher operates at a higher angle than the shaker threshold. Angle-of-attack sensing or stagnation-point movement can trigger stall warning. Pushers are associated with unacceptable stall behaviour such as excessive wing drop or deep stall, not a single fixed IAS for every condition.","images":[152,167]},"deepstall":{"id":"deepstall","title":"Deep stall and spin are different phenomena","chapter":"Stalling","pages":[166,167,183,185,186],"vi":"Deep stall ở cấu hình nhạy cảm swept-wing/T-tail là tình trạng góc tấn rất lớn, trong đó wake cánh che đuôi ngang nên mất khả năng tạo mômen chúc mũi đủ lớn. Đây không đồng nghĩa spin. Spin là chuyển động quay tự duy trì với stall và hai cánh có trạng thái khí động khác nhau. Sách nêu aileron neutral trong trình tự phục hồi spin minh họa; trình tự thực tế phải theo Flight Manual của loại máy bay. CG càng aft càng làm phục hồi stall/spin khó hơn.","en":"A deep stall on a susceptible swept-wing/T-tail layout involves very high angle of attack with the horizontal tail immersed in the wing wake, leaving inadequate nose-down control. It is not synonymous with a spin. A spin is sustained autorotation involving stalled wings with different aerodynamic conditions. The textbook illustrative spin recovery uses neutral ailerons; actual recovery must follow the type-specific Flight Manual. An aft CG makes recovery from a stall or spin more difficult.","images":[166]},"vs":{"id":"vs","title":"Stall speed, weight and load factor","chapter":"Stalling","pages":[168,169,171,172,174,177,178],"vi":"Ở cùng cấu hình, CLmax không đổi trong mô hình cận âm thấp. Tại stall: nW = ½ρVs²SCLmax, nên Vs thay đổi theo căn bậc hai của weight hoặc load factor. Trong vòng lượn bằng phối hợp, n = 1/cosφ. Dịch CG về trước thường đòi hỏi thêm tail download, nên cánh phải nâng nhiều hơn và Vs tăng. Ở cao độ lớn, tăng Mach có thể giảm CLmax, vì thế không được mở rộng quy tắc “Vs IAS không đổi theo cao độ” tới mọi vùng bay tốc độ cao.","en":"For a fixed configuration, CLmax is constant in the low-subsonic model. At the stall, nW = ½ρVs²SCLmax, giving a square-root relationship between stall speed and weight or load factor. In a coordinated level turn, n = 1/cosφ. A forward CG generally requires more tail downforce and hence more wing lift, increasing stall speed. At high altitude, increasing Mach can reduce CLmax, so the low-speed rule of constant indicated stall speed with altitude is not universal.","images":[172,178]},"ice":{"id":"ice","title":"Contamination and loss of CLmax","chapter":"Lift","pages":[82,83,179,180,233,234],"vi":"Ice có thể thay đổi profile mép trước và tạo adverse pressure gradient lớn. Frost tuy mỏng vẫn làm bề mặt nhám, tăng mất năng lượng lớp biên và khiến tách dòng sớm. Kết quả quan trọng là CLmax giảm, drag tăng và stall speed tăng; phần tăng weight do ice không phải tác động khí động chính. Mưa rất lớn cũng có thể làm xấu lớp biên, giảm CLmax và tăng drag theo mô tả của sách.","en":"Ice can distort the leading-edge profile and create strong adverse pressure gradients. Even a thin frost layer increases roughness, drains boundary-layer energy and advances separation. The main aerodynamic effects are reduced CLmax, increased drag and higher stall speed; the added weight of ice is not the dominant effect. Very heavy rain can likewise degrade the boundary layer, reduce CLmax and increase drag as described in the text.","images":[180]},"flaplift":{"id":"flaplift","title":"Trailing-edge flaps and constant-speed flight","chapter":"High Lift Devices","pages":[209,210,211,212,215,224,225,226],"vi":"Trailing-edge flap tăng camber; Fowler còn tăng diện tích cánh khi lùi ra sau. Ở cùng góc tấn, CL tăng khi thả flap và giảm khi thu flap. Nhưng nếu yêu cầu giữ bay bằng cùng IAS và weight, lift cần thiết vẫn bằng weight: phi công phải giảm α khi thả, tăng α khi thu flap. Flap tăng drag nên thường cần tăng thrust để giữ IAS khi thả. Cần phân biệt rõ “cùng α” với “cùng lift trong bay bằng”.","en":"Trailing-edge flaps increase camber; a Fowler flap also increases area as it moves aft. At fixed angle of attack, extending flaps raises CL and retracting them lowers CL. If level flight at unchanged IAS and weight must instead be maintained, required lift remains equal to weight: reduce α during extension and increase it during retraction. Extra flap drag also calls for more thrust to maintain IAS. Fixed α and fixed lift are different conditions.","images":[225,226]},"flaptypes":{"id":"flaptypes","title":"Flap types and the limits of their benefits","chapter":"High Lift Devices","pages":[209,210,211,212,214],"vi":"Plain flap tăng camber bằng cách bẻ phần sau của profile. Split flap chỉ bẻ phần mặt dưới, mặt trên không đổi. Fowler flap trượt ra sau rồi hạ xuống, tăng cả area và camber, cho tăng lift lớn trong các loại được so sánh. Flap làm CLmax tăng nhưng góc stall đo theo chord cơ bản thường giảm. Tuy lift tăng, drag tăng theo tỷ lệ lớn hơn nên L/Dmax giảm và glide angle xấu hơn.","en":"A plain flap changes camber by deflecting the rear part of the section. A split flap deflects only the lower surface while the upper contour remains fixed. A Fowler flap moves aft and then down, increasing both area and camber and giving a large lift increment among the compared types. Flaps increase CLmax but generally reduce the stall angle measured against the original chord. Drag rises proportionally more than lift, so maximum L/D decreases and the glide angle becomes steeper.","images":[210,211]},"flappitch":{"id":"flappitch","title":"Separate wing moment from tail downwash","chapter":"High Lift Devices","pages":[214,215],"vi":"Thả flap mép sau làm CP cánh lùi về sau và tạo mômen nose-down; Fowler lùi ra sau làm hiệu ứng này lớn hơn. Tuy nhiên flap cũng tăng downwash tới đuôi thấp, giảm góc tấn hiệu dụng của đuôi và tạo mômen nose-up. Hai tác dụng đối nghịch. Nếu đề yêu cầu bỏ qua downwash, chọn nose-down; nếu chỉ xét downwash, chọn nose-up. Mômen tổng của máy bay còn phụ thuộc bố trí cánh và đuôi.","en":"Extending a trailing-edge flap moves wing CP aft and creates a nose-down moment; the aft travel of a Fowler flap increases this effect. Flaps can also increase downwash at a low tail, reducing its effective angle of attack and producing a nose-up moment. The two contributions oppose each other. Ignoring downwash leaves the nose-down effect; considering downwash alone gives nose-up. The complete aircraft response depends on wing and tail arrangement.","images":[215]},"slats":{"id":"slats","title":"Slats, slots and Krueger flaps","chapter":"High Lift Devices","pages":[216,218,219,220],"vi":"Slat là một profile nhỏ phía trước cánh; khi mở, nó tạo slot dẫn dòng khí năng lượng cao lên mặt trên. Tác dụng chính là giúp lớp biên chịu adverse pressure gradient tốt hơn, trì hoãn tách dòng và tăng góc tấn đạt CLmax. Trong mô hình Krueger được sách minh họa, tấm ở mặt dưới mép trước xoay ra trước mà không tạo slot như slat. Slat có thể giữ biên stall tốt với mức tăng drag nhỏ hơn trailing-edge flap.","en":"A slat is a small auxiliary aerofoil ahead of the wing. When deployed it opens a slot that feeds high-energy air over the upper surface, helping the boundary layer resist the adverse pressure gradient. Separation is delayed and CLmax is reached at a higher angle of attack. In the illustrated Krueger arrangement, a lower leading-edge panel rotates forward without forming the same slat-type slot. Slats provide stall margin with a smaller drag penalty than trailing-edge flaps.","images":[216,218]},"elliptic":{"id":"elliptic","title":"Elliptical loading and induced drag","chapter":"Lift","pages":[118,119,120],"vi":"Các trang Drag đã đối chiếu xác nhận induced drag liên quan lift, aspect ratio và downwash. Tuy nhiên chưa tìm được trong các đoạn này phần thiết lập điều kiện phân bố lift elip cho induced drag tối thiểu hoặc downwash đều theo sải. Vì vậy chỉ giữ đáp án của đề như đáp án ôn tập; không ghi kết luận đó là lời giải đã được chứng minh trực tiếp bằng những trang này.","en":"The checked Drag pages establish the roles of lift, aspect ratio and downwash in induced drag. They do not establish the elliptical-loading condition for minimum induced drag or uniform spanwise downwash. The bank answer is retained for study, but that specific conclusion is not presented as directly proved by these passages.","images":[]},"longstable":{"id":"longstable","title":"CG position, longitudinal stability and controllability","chapter":"Stability and Control","pages":[248,259,261,265,270,273,275,276,281],"vi":"Khi CG tiến về trước, mômen phục hồi của đuôi so với phần mất ổn định của cánh tăng: độ ổn định dọc lớn hơn, nhưng cần lực cần lái lớn hơn và khả năng cơ động dọc giảm. CG dịch aft làm đáp ứng elevator mạnh hơn cho cùng độ lệch nhưng giảm stability và stick force per g. Giới hạn CG trước thường do đủ khả năng điều khiển; giới hạn sau do đủ độ ổn định. Đuôi ngang là bộ phận đóng góp ổn định dọc lớn nhất; đóng góp riêng của cánh phụ thuộc vị trí AC so với CG.","en":"A forward CG increases the restoring contribution of the tail relative to the destabilizing wing contribution. Longitudinal stability and required control force increase, while manoeuvrability decreases. Moving CG aft gives a larger response to a given elevator displacement but reduces stability and stick force per g. The forward CG limit is generally a controllability limit; the aft limit is a stability limit. The horizontal tail provides the largest stabilizing contribution, while the wing contribution depends on AC relative to CG.","images":[248,265]},"cmslope":{"id":"cmslope","title":"Read stability from the local slope of CM versus α","chapter":"Stability and Control","pages":[257,258,265],"vi":"Đọc độ ổn định từ độ dốc, không phải chỉ từ dấu của giá trị CM. Nếu tăng α tạo CM âm hơn (mômen chúc mũi), đường dCM/dα âm và có xu hướng phục hồi: stable. Độ dốc bằng 0 là neutral; dương là unstable. Khi đường cong, phải xét tiếp tuyến tại phần được hỏi. CG tiến trước thường làm độ dốc âm mạnh hơn.","en":"Read stability from the slope, not just the sign of CM. If increasing α makes CM more negative, the resulting nose-down moment restores the disturbance: dCM/dα is negative and the aircraft is statically stable. Zero slope means neutral stability; positive slope means instability. On a curved graph, assess the local tangent in the region asked about. A forward CG generally makes the negative slope steeper.","images":[258]},"staticdynamic":{"id":"staticdynamic","title":"Static tendency versus dynamic motion","chapter":"Stability and Control","pages":[243,282,283,284,285],"vi":"Static stability chỉ xét xu hướng ban đầu sau nhiễu. Dynamic stability xét biên độ chuyển động theo thời gian. Một máy bay ban đầu hướng về vị trí cân bằng vẫn có thể vượt quá vị trí ấy, rồi dao động tắt dần, giữ nguyên hoặc tăng dần. Vì vậy positive static stability không bảo đảm positive dynamic stability; cần damping để tiêu tán năng lượng dao động.","en":"Static stability describes the initial tendency after a disturbance. Dynamic stability describes the time history of the motion. An aircraft initially tending toward equilibrium can overshoot and then show decaying, constant-amplitude or growing oscillations. Positive static stability therefore does not guarantee positive dynamic stability; damping is needed to dissipate oscillation energy.","images":[283,284]},"phugoid":{"id":"phugoid","title":"Phugoid and short-period motion","chapter":"Stability and Control","pages":[286,287,288],"vi":"Phugoid là dao động dọc chu kỳ dài: altitude, airspeed và pitch attitude biến thiên rõ, còn α gần như không đổi. Có sự trao đổi giữa thế năng và động năng. Short-period là dao động pitch nhanh, α và load factor thay đổi đáng kể, trong thời gian ngắn altitude và speed gần như không đổi. Cả hai thuộc chuyển động dọc, với thành phần quay quanh trục ngang.","en":"The phugoid is a long-period longitudinal oscillation with substantial variations in altitude, airspeed and pitch attitude while α stays nearly constant: potential and kinetic energy are exchanged. Short-period motion is a rapid pitch oscillation with significant changes in α and load factor, while altitude and speed remain approximately constant over the short interval. Both are longitudinal modes with rotation about the lateral axis.","images":[287,288]},"damping":{"id":"damping","title":"Altitude and aerodynamic damping","chapter":"Stability and Control","pages":[274,275,276,311,342],"vi":"Damping khí động chống tốc độ quay, khác lực/mômen phục hồi do độ lệch tĩnh. Cùng vận tốc quay của đuôi hoặc đầu cánh, khi TAS cao hơn thì thành phần chuyển động quay tạo góc thay đổi dòng khí nhỏ hơn. Ở cùng EAS/IAS, lên cao làm TAS tăng nên damping giảm. Đó cũng là lý do thành phần pitch damping và stick force per g có thể giảm theo cao độ.","en":"Aerodynamic damping opposes angular motion, unlike the restoring moment due to static displacement. For the same tail or wingtip rotational velocity, higher TAS produces a smaller change in effective airflow angle. At constant EAS/IAS, increasing altitude raises TAS and reduces damping. This also explains why the pitch-damping contribution and stick force per g can decrease with altitude.","images":[]},"dihedral":{"id":"dihedral","title":"Sideslip, dihedral and lateral restoring moment","chapter":"Stability and Control","pages":[291,292,302,304,308],"vi":"β là góc giữa hướng vận tốc tương đối và mặt phẳng đối xứng máy bay; β dương khi relative wind đến từ bên phải. Với positive lateral stability, gió từ phải tạo mômen roll trái, nâng cánh phải. Positive directional stability đồng thời làm mũi quay về phải, hướng vào gió. Tăng geometric dihedral làm mômen roll do cùng sideslip lớn hơn; muốn giữ nguyên β phải dùng lực điều khiển lateral lớn hơn để chống mômen đó.","en":"β is the angle between the relative-velocity direction and the aircraft plane of symmetry; positive β means relative wind from the right. Positive lateral stability then produces left roll, raising the right wing, while positive directional stability yaws the nose right into the wind. Increasing geometric dihedral strengthens the rolling moment from a given sideslip. Holding that same β requires greater lateral control force to oppose it.","images":[302,304]},"dutchroll":{"id":"dutchroll","title":"Coupled roll–yaw motion and the yaw damper","chapter":"Stability and Control","pages":[309,310,317],"vi":"Roll và yaw liên kết qua sideslip. Dihedral effect mạnh so với directional stability làm tăng khuynh hướng Dutch roll: dao động ghép roll/yaw. Yaw damper dùng tín hiệu tốc độ yaw để điều khiển rudder nhỏ tự động và giảm dao động. Ngược lại, directional stability quá mạnh so với lateral stability làm tăng xu hướng spiral divergence. Hai loại mất ổn định này không được hoán đổi.","en":"Roll and yaw are coupled through sideslip. Strong dihedral effect relative to directional stability increases the tendency to Dutch roll, a coupled roll–yaw oscillation. A yaw damper uses yaw-rate information to command small automatic rudder inputs and damp the motion. Conversely, directional stability dominant over lateral stability promotes spiral divergence. These two tendencies are not interchangeable.","images":[309]},"fins":{"id":"fins","title":"Dorsal and ventral fins","chapter":"Stability and Control","pages":[296,297,298,300,307],"vi":"Các keel surface đặt sau CG hỗ trợ directional stability. Dorsal fin đặc biệt giúp ở sideslip lớn vì làm chậm suy giảm hiệu quả khi fin chính gần stall. Lực ngang trên bề mặt phía trên CG có thể góp roll ổn định nhỏ; ventral fin nằm dưới CG cho mômen roll ngược lại, tức góp lateral stability âm. Vì vậy cả dorsal và ventral đều giúp directional stability nhưng không cùng dấu đối với lateral stability.","en":"Keel surfaces aft of the CG support directional stability. A dorsal fin is especially useful at large sideslip, delaying the deterioration that occurs as the main fin approaches its stall. Side force acting above the CG can provide a small stabilizing roll contribution; a ventral fin acts below the CG and gives the opposite, destabilizing lateral contribution. Both can aid directional stability without having the same effect on lateral stability.","images":[307]},"adverse":{"id":"adverse","title":"Adverse yaw and differential ailerons","chapter":"Controls","pages":[342,343],"vi":"Khi aileron tạo roll, cánh đi lên có lift lớn hơn và induced drag lớn hơn; cánh đi xuống có lift/induced drag nhỏ hơn. Sự chênh drag kéo mũi lệch ngược hướng roll: adverse yaw. Differential ailerons cho bề mặt đi lên lệch lớn hơn bề mặt đi xuống, tăng drag phía up-aileron và giảm chênh drag. Khi roll phải: aileron trái xuống, aileron phải lên với góc lớn hơn.","en":"During an aileron-induced roll, the rising wing produces more lift and induced drag, while the descending wing produces less. The drag difference yaws the nose opposite the roll: adverse yaw. Differential ailerons use greater upward than downward deflection to add drag on the up-aileron side and reduce the imbalance. For right roll, the left aileron goes down and the right aileron goes up through a larger angle.","images":[343]},"yawroll":{"id":"yawroll","title":"Secondary roll due to yaw","chapter":"Controls","pages":[348,350],"vi":"Rudder trái tạo yaw trái quanh normal axis. Khi máy bay đang yaw trái, cánh phải đi nhanh hơn và tạo thêm lift nên có secondary roll trái quanh longitudinal axis. Sách cũng nêu một mômen roll nhỏ theo chiều ngược do lực rudder ở trên CG; ở máy bay thông thường hiệu ứng này nhỏ. Câu hỏi đang xét đáp ứng thứ cấp roll cùng chiều yaw, không phải chỉ riêng mômen tức thời của fin.","en":"Left rudder produces left yaw about the normal axis. During left yaw, the right wing moves faster and gains lift, producing secondary left roll about the longitudinal axis. The text also notes a small opposite rolling moment from rudder side force above the CG, usually minor on a conventional aircraft. These questions concern the secondary roll accompanying yaw, not the isolated instantaneous fin moment.","images":[]},"aileronlock":{"id":"aileronlock","title":"Aeroelastic aileron reversal and lockout","chapter":"Controls","pages":[344,345],"vi":"Aileron ngoài có cánh tay đòn roll lớn nhưng cũng dễ xoắn đầu cánh. Ở IAS lớn, aileron xuống có thể làm cánh xoắn giảm incidence đủ mạnh để mất, rồi đảo chiều hiệu quả roll. Vì thế loại máy bay có hai bộ aileron thường khóa outboard khi flap thu hoặc ở tốc độ cao và giữ inboard hoạt động. Đây là giới hạn biến dạng đàn hồi, không phải đảo chiều lệnh điều khiển trong cockpit.","en":"An outboard aileron has a large rolling lever arm but can also twist the wingtip. At high IAS, a down aileron can twist the wing toward reduced incidence enough to cancel and then reverse the intended lift change. Aircraft with two aileron sets therefore commonly lock out the outboard set with flaps retracted or at high speed, leaving inboard ailerons active. This is an aeroelastic effect, not a reversal of cockpit command wiring.","images":[344]},"spoilers":{"id":"spoilers","title":"Wing spoilers versus ideal speed brakes","chapter":"Controls","pages":[334,345,346],"vi":"Wing spoiler nhô lên mặt trên làm mất lift và tăng drag. Dùng để trợ roll: spoiler cánh hạ xuống nhô lên, cùng phía up-aileron. Dùng làm speedbrake: hai bên hoạt động đối xứng để tăng drag; lệnh roll được trộn bằng độ lệch bất đối xứng quanh mức speedbrake đã chọn. Sách phân biệt với fuselage speedbrake lý tưởng, vốn có thể tăng drag mà ít đổi lift; không được áp đặc tính ấy cho mọi wing spoiler.","en":"A wing spoiler projects into the upper-surface flow, reducing lift and increasing drag. For roll assistance, the spoiler rises on the down-going wing with the up aileron. For speedbraking, the surfaces deploy symmetrically to add drag, with roll commands mixed asymmetrically around that setting. The text distinguishes this from an ideal fuselage speed brake, which can increase drag with little lift change; that property cannot be assigned to every wing spoiler.","images":[345,346]},"trim":{"id":"trim","title":"Trim tab and trimmable stabilizer","chapter":"Stability and Control","pages":[269,271,351,352,353,354],"vi":"Trim loại bỏ lực phải giữ trên control khi máy bay ở cân bằng; không có nghĩa mọi bề mặt đều phải bằng 0°. Trim tab lệch ngược main surface để cân bằng hinge moment. Khi bay chậm hơn trong ví dụ conventional, cần thêm up elevator nên tab được trim xuống. Trimmable stabilizer đổi incidence toàn đuôi, tạo khả năng trim mạnh trên dải CG/speed lớn, giảm drag và giữ elevator gần neutral, thay vì tiêu tốn hành trình elevator.","en":"Trim removes the force that must be held on the cockpit control at equilibrium; it does not require every surface to be at zero deflection. A trim tab moves opposite the main surface to balance its hinge moment. Slower flight in the conventional example requires more up elevator and a downward trim-tab setting. A trimmable stabilizer changes the incidence of the whole tail, providing powerful trim over a wide CG/speed range, lower drag and an approximately neutral elevator.","images":[352,353]},"landingcontrol":{"id":"landingcontrol","title":"Landing pitch authority","chapter":"Stability and Control","pages":[281,352,353],"vi":"Trang 281 xác định yêu cầu pitch control khi landing khắc nghiệt nhất với CG trước, flap thả hết và power idle. Cấu hình này cần khả năng tạo nose-up lớn; ground effect còn có thể làm giảm downwash tới đuôi và tăng yêu cầu up elevator. Nếu khả năng trim bị giới hạn, còn ít hành trình elevator hơn để cân bằng và flare.","en":"Page 281 identifies the most demanding landing pitch-control condition as forward CG, fully extended flaps and idle power. This requires strong nose-up control authority; ground effect can further reduce downwash at the tail and increase the required up-elevator deflection. Restricted trim capability leaves less elevator travel available for balancing and the flare.","images":[]},"tabs":{"id":"tabs","title":"Aerodynamic balancing and servo/spring tabs","chapter":"Controls","pages":[334,335,336,337,339,354],"vi":"Aerodynamic balance giảm hinge moment mà pilot phải thắng. Horn balance đưa một phần diện tích trước hinge; internal balance dùng chênh áp tác dụng lên panel; servo tab do pilot điều khiển rồi lực khí động trên tab kéo main surface đi ngược chiều tab. Spring tab cho trợ lực nhiều hơn ở IAS cao, khi lò xo bị nén và hoạt động gần như servo tab. Đây khác mass balance chống flutter, không nên gộp hai cơ chế.","en":"Aerodynamic balancing reduces the hinge moment the pilot must overcome. A horn places area ahead of the hinge, an internal balance uses pressure difference on a panel, and a pilot-operated servo tab generates the aerodynamic force that moves the main surface opposite the tab. A spring tab provides greatest assistance at high IAS, when its spring compresses and it behaves like a servo tab. This is distinct from mass balancing used against flutter.","images":[337,354]},"alltail":{"id":"alltail","title":"All-moving tailplane","chapter":"Controls","pages":[334],"vi":"All-flying tail hoặc slab tail là cả mặt đuôi ngang đổi incidence, không chỉ elevator ở phía sau. Kéo cần về sau cần nose-up: giảm incidence đuôi để tạo lực hướng xuống lớn hơn hoặc lực hướng lên nhỏ hơn, từ đó tạo mômen ngóc quanh CG. Hình câu 317 cho thấy cả bề mặt xoay quanh hinge của nó.","en":"An all-flying or slab tail changes the incidence of the whole horizontal surface rather than only a trailing elevator. An aft-column command requires nose-up pitch: reducing tail incidence increases downforce or decreases upward force, producing a nose-up moment about the CG. The supplied figure in question 317 shows the complete surface pivoting about its hinge.","images":[334]},"thrustpitch":{"id":"thrustpitch","title":"Thrust-line moment about CG","chapter":"Stability and Control","pages":[266],"vi":"Khi đường tác dụng thrust nằm dưới CG, tăng thrust tạo mômen nose-up. Đó là tác dụng trực tiếp của cánh tay đòn giữa thrust line và CG, không phải công thức về propeller hay flutter. Hiệu ứng trim đáng kể ở power cao, tốc độ thấp. Vì đề nói engines trên pylon dưới low wing, đáp án tăng thrust phù hợp cơ chế này.","en":"When the thrust line lies below the CG, increasing thrust creates a nose-up moment. This is the direct moment from the offset between the thrust line and CG, not a propeller or flutter effect. Power effects are most significant at high power and low speed. The increased-thrust option for podded engines below a low wing matches this mechanism.","images":[266]},"winglift":{"id":"winglift","title":"Wing lift is not always total aircraft lift","chapter":"Stalling","pages":[174,175,176,366],"vi":"Trong bay bằng, tổng các thành phần lực thẳng đứng phải cân bằng weight. Nếu đuôi tạo lực xuống, cánh phải tạo lift bằng weight cộng tail download, trừ đi thành phần thrust hướng lên. CG trước thường cần tail download lớn hơn; power/thrust cao có thể góp một phần lực nâng thẳng đứng. Vì thế wing lift lớn hơn với CG trước và idle, nhỏ hơn với CG aft và thrust cao, theo mô hình so sánh trong đề.","en":"In level flight, the sum of vertical force components must balance weight. When the tail carries downforce, wing lift must support weight plus tail downforce, less any upward thrust component. A forward CG generally needs greater tail downforce; high thrust can supply an upward component. Thus the comparison gives higher wing lift with forward CG and idle, and lower wing lift with aft CG and high thrust.","images":[]},"mach":{"id":"mach","title":"Mach number, temperature and altitude","chapter":"High Speed Flight","pages":[407,408,409,410],"vi":"M = TAS/a, với a là tốc độ âm thanh của không khí tại chỗ và a ∝ √T tuyệt đối. Climb ở IAS không đổi làm TAS tăng; trong tầng đối lưu ISA a còn giảm nên Mach tăng và có thể chạm MMO. Ở lớp đẳng nhiệt phía trên tropopause trong mô hình ISA của sách, constant Mach đồng nghĩa constant TAS; IAS giảm khi climb, tăng khi descent. Khi descend vào không khí ấm hơn ở Mach cố định, TAS tăng theo a.","en":"M = TAS/a, where a is the local speed of sound and is proportional to the square root of absolute temperature. Climbing at constant IAS increases TAS; in the ISA troposphere a also decreases, so Mach rises and can reach MMO. In the textbook ISA isothermal layer above the tropopause, constant Mach means constant TAS; IAS falls in a climb and rises in a descent. Descending into warmer air at fixed Mach increases TAS as a increases.","images":[409]},"mcrit":{"id":"mcrit","title":"Critical Mach is the first local sonic point","chapter":"High Speed Flight","pages":[411,414,415,311,425],"vi":"Mcrit là free-stream Mach tại đó một điểm cục bộ trên máy bay lần đầu đạt M = 1. Máy bay chưa cần bay M = 1 vì dòng trên cánh đã được gia tốc. Tại chính Mcrit chưa có vùng siêu âm và sách nhấn mạnh chưa có shock wave. Chỉ tăng hơn Mcrit mới có vùng supersonic cục bộ kết thúc bằng shock, thường xuất hiện trước ở mặt trên. Profile dày hơn hoặc α lớn hơn làm gia tốc cục bộ mạnh hơn và Mcrit thấp hơn.","en":"Mcrit is the free-stream Mach number at which the first local point on the aircraft reaches M = 1. The aircraft itself need not be at Mach 1 because wing flow has already accelerated. At Mcrit there is no supersonic region and the text explicitly states there is no shock wave. Just above it, local supersonic flow appears and terminates in a shock, usually first on the upper surface. Greater section thickness or α increases local acceleration and lowers Mcrit.","images":[414,415]},"transonic":{"id":"transonic","title":"Flow regimes: local flow versus aircraft Mach","chapter":"High Speed Flight","pages":[411,415],"vi":"Transonic là vùng trong đó có đồng thời local flow cận âm và siêu âm. Nó bắt đầu quanh Mcrit, dưới free-stream M=1, và kéo dài tới phía trên M=1 trong sơ đồ gần đúng của sách. Số ranh giới phụ thuộc thiết kế/α; không phải M=1 là ranh giới duy nhất. Supersonic trong phân loại này là vùng local flow bên ngoài lớp biên đã siêu âm, khác với mixed flow transonic.","en":"Transonic flow contains both subsonic and supersonic local regions. It starts around Mcrit below free-stream Mach 1 and extends above Mach 1 in the textbook approximate classification. The boundaries depend on design and α; Mach 1 alone does not define the entire regime. The supersonic classification refers to supersonic external local flow, unlike the mixed-flow transonic regime.","images":[411]},"shock":{"id":"shock","title":"Across a shock wave","chapter":"High Speed Flight","pages":[418,419,423,448],"vi":"Qua shock nén, velocity/Mach giảm còn static pressure, static temperature và density tăng. Normal shock không đổi hướng dòng và làm dòng sau shock subsonic. Oblique shock đổi hướng dòng; dòng sau shock có thể còn supersonic. Total pressure giảm do quá trình không thuận nghịch; cùng upstream Mach, normal shock gây tổn thất lớn hơn oblique shock được so sánh trong sách. Nhiệt độ tĩnh tăng cũng làm local speed of sound tăng.","en":"Across a compression shock, velocity/Mach decrease while static pressure, static temperature and density increase. A normal shock does not turn the flow and leaves it subsonic. An oblique shock turns the flow and may leave it supersonic. Total pressure falls because the process is irreversible; for the same upstream Mach the normal shock incurs greater loss than the compared oblique shock. The higher static temperature also raises the local speed of sound.","images":[418,448]},"bow":{"id":"bow","title":"Bow shock, Mach cone and sonic boom","chapter":"High Speed Flight","pages":[413,415,443,444,445,447],"vi":"Trong mô tả của sách, bow shock xuất hiện phía trước mép trước khi free-stream speed vừa vượt M=1. Khi máy bay nhanh hơn tốc độ truyền nhiễu nhỏ, các sóng tạo biên nón Mach; sinμ = 1/M nên Mach càng lớn nón càng hẹp. Sonic boom là nhiễu áp suất do hệ shock tới người quan sát, không phải tiếng động riêng của việc kim Mach đi qua số 1 một lần.","en":"In the textbook description, the bow shock appears ahead of the leading edge just above free-stream Mach 1. When the aircraft outruns small pressure disturbances, their envelope forms the Mach cone; sinμ = 1/M, so the cone becomes narrower as Mach increases. A sonic boom is the pressure disturbance from the shock system reaching an observer, not a one-time noise solely from the Mach indication passing through 1.","images":[443,445]},"wave":{"id":"wave","title":"Wave drag, shock stall and buffet","chapter":"High Speed Flight","pages":[420,421,423,427],"vi":"Ở trên Mcrit, drag tăng thêm do shock và tách lớp biên; sách gọi phần tăng đó là wave drag. Shock tạo bước tăng áp suất bất lợi rất mạnh khiến lớp biên dày lên hoặc tách dòng, làm giảm lift và tạo wake dao động. Vì thế Mach buffet liên quan shock-induced separation, không chỉ việc “tốc độ lớn”. Drag-divergence Mach là lúc drag tăng nhanh và cao hơn Mcrit.","en":"Above Mcrit, shocks and boundary-layer separation add drag; the text calls this additional drag wave drag. The abrupt adverse pressure rise through a shock can thicken or separate the boundary layer, reducing lift and creating an unsteady wake. Mach buffet therefore relates to shock-induced separation, not simply to high speed. Drag-divergence Mach marks the rapid drag rise and is higher than Mcrit.","images":[421]},"vortexgen":{"id":"vortexgen","title":"Vortex generators re-energize the boundary layer","chapter":"Stalling","pages":[159,437,423],"vi":"Vortex generators trộn không khí năng lượng cao từ free stream vào lớp biên. Lớp biên nhận thêm động năng nên chịu được adverse pressure gradient tốt hơn và ít tách dòng hơn sau shock hoặc tại bề mặt cong mạnh. Chúng không lấy năng lượng từ vùng đã tách để đưa ngược ra free stream; mục đích là giảm separation và giữ hiệu lực bề mặt điều khiển.","en":"Vortex generators mix high-energy free-stream air into the boundary layer. The added kinetic energy helps it withstand the adverse pressure gradient and reduces separation behind shocks or severe surface contours. They do not transfer energy out of the separated layer into the free stream; they are used to reduce separation and preserve control effectiveness.","images":[437]},"sweep":{"id":"sweep","title":"Sweepback and its aerodynamic trade-offs","chapter":"High Speed Flight","pages":[434,435,436,449],"vi":"Sweepback giảm thành phần vận tốc vuông góc leading edge: Vn = VcosΛ; vì gia tốc/pressure distribution gắn với thành phần này nên Mcrit tăng. Đổi lại CL tại cùng α và CLmax thường nhỏ hơn, lift-curve slope giảm và stall speed tăng. Bớt sweep làm các xu hướng đảo chiều. Điều này vừa giải thích tăng Mcrit/drag-divergence Mach, vừa giải thích bất lợi low-speed của cánh quét.","en":"Sweepback reduces the velocity component normal to the leading edge, Vn = VcosΛ. Since the pressure distribution depends on that component, Mcrit increases. The trade-offs are generally lower CL at the same α, lower CLmax, a lower lift-curve slope and higher stall speed. Reducing sweep reverses those trends. This connects the higher critical/drag-divergence Mach with the low-speed disadvantages.","images":[435,436]},"tuck":{"id":"tuck","title":"Mach tuck and the purpose of Mach trim","chapter":"Stability and Control","pages":[311,424,426,439,427],"vi":"Trong vùng transonic, CP nhìn tổng thể dịch aft; ở ví dụ swept wing, mất lift gần gốc còn làm giảm downwash tại đuôi. Cả hai góp mômen nose-down gọi là Mach tuck. Mach trim điều chỉnh longitudinal trim để duy trì stick-force gradient yêu cầu và tránh xu hướng tự tăng tốc khi nose-down. Không nên nhầm Mach trim với việc cố tình làm mọi stick force nhẹ đi.","en":"In the transonic range the overall CP migration is aft; in the swept-wing example, root lift loss also reduces tail downwash. Both contribute to the nose-down moment called Mach tuck. Mach trim adjusts longitudinal trim to maintain the required stick-force gradient and counter the tendency toward further acceleration. It is not simply a system intended to make every control force lighter.","images":[439]},"supersonicac":{"id":"supersonicac","title":"Aerodynamic-centre shift at supersonic speed","chapter":"High Speed Flight","pages":[60,424,425,453,456],"vi":"Sách xác định AC cận âm thấp gần 25% chord, còn các trang cao tốc được đối chiếu mô tả CP tiến về 50% chord. AC là điểm mômen gần như không đổi khi α đổi; CP là điểm tác dụng của hợp lực lift. Vì vậy một đoạn nói CP=50% không tự chứng minh được câu hỏi về AC. Phần kiến thức dẫn tới key của hai câu này chưa có đoạn chứng minh đầy đủ trong các trang đã đối chiếu.","en":"The text locates the low-subsonic AC near 25% chord; the checked high-speed pages describe CP moving towards 50% chord. AC is the point about which moment is approximately independent ofα, while CP is the lift-resultant location. A statement about CP at 50% does not by itself prove a statement about AC. A complete supporting passage for the keyed AC conclusion has not been established in the checked pages.","images":[]},"arearule":{"id":"arearule","title":"Area rule concerns total area distribution","chapter":"High Speed Flight","pages":[438],"vi":"Area rule làm phân bố tổng diện tích tiết diện của thân+cánh+đuôi dọc trục máy bay thay đổi êm hơn. Eo thân tại vùng cánh bù phần diện tích cánh nhô ra, giảm “hump” đột ngột. Sách trình bày đây là giảm transonic interference/drag rise; trong ngữ cảnh đề, kết quả được gọi là giảm wave drag. Không phải chỉ giảm diện tích mặt trước ở một vị trí bất kỳ.","en":"The area rule smooths the longitudinal distribution of total fuselage-plus-wing-plus-tail cross-sectional area. Waisting the fuselage near the wing compensates for the added wing area and removes an abrupt hump. The text presents this as a reduction in transonic interference and drag rise; the question describes the outcome as reduced wave drag. It is not merely minimizing frontal area at an arbitrary point.","images":[438]},"buffet":{"id":"buffet","title":"Buffet boundaries and incremental g margin","chapter":"High Speed Flight","pages":[427,428,430,431,432],"vi":"Buffet boundary kết hợp giới hạn low-speed stall với high-speed shock buffet. Tăng weight, altitude hoặc load factor làm α cần thiết tăng và thường thu hẹp miền bay không buffet. Margin 0,3 g là phần tăng thêm trên 1 g, tức giới hạn tương ứng 1,3 g, không phải n=0,3. Hạ altitude ở cùng Mach làm dynamic pressure lớn hơn và CL yêu cầu nhỏ hơn, giúp tăng margin theo biểu đồ. Đây là nguyên lý đọc chart; vẫn phải dùng chart đúng máy bay.","en":"The buffet envelope combines the low-speed stall boundary with high-speed shock buffet. Greater weight, altitude or load factor increases required α and generally narrows the buffet-free range. A 0.3 g margin is incremental above 1 g, corresponding to 1.3 g rather than n = 0.3. At the same Mach a lower altitude gives higher dynamic pressure and lower required CL, increasing margin in the chart model. Actual limits require the appropriate aircraft chart.","images":[431,432]},"propgeometry":{"id":"propgeometry","title":"Blade twist, pitch and advance","chapter":"Propellers","pages":[503,504,505],"vi":"Blade angle đo giữa chord của lá và plane of rotation. Small angle là fine pitch, large angle là coarse pitch. Ra gần tip, vận tốc quay tăng nên blade angle phải giảm để các tiết diện làm việc với góc tấn phù hợp tương tự nhau. Geometric pitch là bước lý thuyết mỗi vòng; effective pitch là quãng tiến thực tế; hiệu hai giá trị là slip. Pitch angle không đồng nghĩa angle of attack vì AoA đo tới relative airflow tổng hợp từ chuyển động quay và tiến.","en":"Blade angle is measured between the blade chord and the plane of rotation: small is fine pitch and large is coarse pitch. Rotational velocity increases toward the tip, so blade angle decreases to keep the sections at similar suitable angles of attack. Geometric pitch is the theoretical advance per turn; effective pitch is the actual advance, and their difference is slip. Blade angle is not angle of attack, which is measured to the relative airflow resulting from rotational and forward motion.","images":[503,505]},"propaoa":{"id":"propaoa","title":"Fixed pitch versus constant-speed governing","chapter":"Propellers","pages":[504,505,508,509,510],"vi":"Với fixed blade angle, tăng TAS làm đường relative airflow nghiêng theo hướng giảm blade AoA; tăng RPM có tác dụng ngược lại. Vì vậy giảm RPM ở cùng TAS làm AoA giảm. Constant-speed unit đổi blade angle để giữ RPM được chọn: khi TAS tăng, nếu không đổi pitch RPM có xu hướng tăng; CSU tăng pitch/coarsen để giữ cân bằng. Nhờ vậy hiệu suất tốt trên dải tốc độ rộng hơn fixed pitch, không có nghĩa RPM tăng theo TAS.","en":"With blade angle fixed, increasing TAS changes the relative airflow so blade AoA decreases; increasing RPM has the opposite effect. Therefore reducing RPM at the same TAS reduces blade AoA. A constant-speed unit varies blade angle to maintain selected RPM: as TAS increases, RPM would rise without adjustment, so the CSU coarsens the blades. This maintains good efficiency over a wider speed range than fixed pitch, rather than making RPM rise with TAS.","images":[505,510]},"windmill":{"id":"windmill","title":"Windmilling, coarse pitch and feathering","chapter":"Flight Mechanics","pages":[389,511,512],"vi":"Khi propeller windmill, dòng khí kéo propeller và động cơ thay vì động cơ cấp shaft power để tạo thrust. Drag khi đó lớn hơn propeller đứng yên trong điều kiện so sánh. Trong glide cùng IAS, tăng pitch/coarsen làm drag giảm, L/D tăng và rate of descent giảm; giảm pitch làm ngược lại. Feather gần 90° blade angle làm lá gần song song dòng tới, torque giảm về 0 và drag tối thiểu. Đẩy RPM lever tới trước trong glide làm pitch giảm để cố giữ RPM cao hơn.","en":"A windmilling propeller is driven by the airflow and drives the engine, rather than receiving shaft power to produce thrust. Its drag is higher than that of the stopped propeller in the comparison. In a constant-IAS glide, coarsening pitch reduces drag, increases L/D and reduces sink rate; fining the pitch reverses the effects. Feathering to a blade angle near 90° aligns the blades approximately with the incoming flow, eliminating torque and minimizing drag. Advancing the RPM lever during the glide fines pitch to seek a higher RPM.","images":[389,512]},"solidity":{"id":"solidity","title":"Power absorption, solidity and tip noise","chapter":"Propellers","pages":[513],"vi":"Tăng tổng diện tích lá so với diện tích đĩa propeller làm tăng solidity và khả năng hấp thụ shaft power. Có thể tăng blade chord hoặc tăng số lá. Blade rộng hơn làm aspect ratio giảm nên hiệu suất xấu hơn; quá nhiều lá cũng giảm hiệu suất theo mô hình sách. Tăng tip speed tới vùng compressibility làm thrust giảm, rotational drag tăng và tiếng ồn lớn hơn. Thêm lá cho phép hấp thụ công suất mà không phải tăng tip speed.","en":"Increasing total blade area relative to propeller-disc area increases solidity and shaft-power absorption. This can be achieved by increasing blade chord or blade count. Wider blades reduce aspect ratio and efficiency; excessive blade count also reduces efficiency in the textbook description. High tip speeds approaching compressibility reduce thrust, increase rotational drag and raise noise. Additional blades can absorb power without requiring increased tip speed.","images":[513]},"torque":{"id":"torque","title":"Torque reaction and spiral slipstream","chapter":"Propellers","pages":[514,516],"vi":"Với propeller quay clockwise nhìn từ phía sau, torque reaction tác dụng lên máy bay theo chiều ngược lại, gây roll trái. Trong take-off roll nó còn tăng tải bánh trái và có thể làm yaw trái do rolling resistance. Propeller quay ngược chiều thì torque reaction đảo chiều. Spiral slipstream là cơ chế riêng: luồng xoắn từ propeller clockwise đập vào fin từ bên trái, đẩy đuôi phải và gây yaw trái.","en":"For a clockwise propeller viewed from behind, torque reaction acts oppositely on the aircraft and tends to roll it left. During the take-off run this also loads the left wheel more and can create left yaw through rolling resistance. Opposite propeller rotation reverses torque reaction. Spiral slipstream is a separate mechanism: the clockwise propeller wash strikes the fin from the left, pushing the tail right and yawing the nose left.","images":[516]},"gyro":{"id":"gyro","title":"Gyroscopic precession: define the viewing direction","chapter":"Propellers","pages":[515],"vi":"Gyroscopic effect xuất hiện khi đổi hướng trục propeller qua pitch hoặc yaw, không chỉ vì propeller đang quay trong attitude giữ nguyên. Với clockwise nhìn từ sau, tác dụng được cảm nhận 90° theo chiều quay: pitch-up→yaw-right; yaw-right→pitch-down; pitch-down→yaw-left; yaw-left→pitch-up. Tác dụng dễ nhận thấy khi RPM cao và airspeed thấp, lúc năng lực control khí động nhỏ.","en":"Gyroscopic effect occurs when pitch or yaw changes the propeller-axis direction, not merely because the propeller rotates at constant attitude. For clockwise rotation viewed from behind, the response is 90° onward in the rotation direction: pitch-up gives right yaw; right yaw gives pitch-down; pitch-down gives left yaw; left yaw gives pitch-up. It is most noticeable with high RPM and low airspeed, when aerodynamic control authority is relatively low.","images":[]},"pfactor":{"id":"pfactor","title":"Asymmetric blade effect and the critical engine","chapter":"Flight Mechanics","pages":[386,517],"vi":"Khi trục propeller nghiêng so với relative airflow, lá đi xuống và lá đi lên có điều kiện khí động khác nhau. Với clockwise nhìn từ sau và AoA dương, lá phải đi xuống có effective AoA/thrust lớn hơn; đường thrust dịch phải và gây yaw trái. Hiệu ứng mạnh với power cao, airspeed thấp/α lớn. Với hai propeller cùng clockwise, right-engine thrust có cánh tay đòn lớn hơn nên mất left engine là trường hợp critical.","en":"When the propeller axis is inclined to the relative airflow, the descending and ascending blades operate under different aerodynamic conditions. With clockwise rotation viewed from behind and positive AoA, the right descending blade develops greater effective AoA/thrust; the thrust line shifts right and creates left yaw. The effect is strongest at high power and low airspeed/high α. With two clockwise propellers, the right engine has the longer effective thrust arm, making failure of the left engine critical.","images":[386]},"constantliftcalc":{"id":"constantliftcalc","title":"Constant lift: solve for CL, not for lift","chapter":"Lift","pages":[73,74,75,76],"vi":"Trong straight-and-level flight, tổng lift phải bằng weight. Với weight, density và wing area không đổi, công thức L = ½ρV²SCL cho CL₂/CL₁ = (V₁/V₂)². Ở Vs, hệ số bằng CLmax. Do đó tại k lần Vs, tỷ số CL/CLmax là 1/k². Đây là điều chỉnh góc tấn để giữ L không đổi, khác với bài tăng tốc đột ngột nhưng giữ nguyên góc tấn.","en":"In straight and level flight, lift must equal weight. With weight, density and wing area unchanged, L = ½ρV²SCL gives CL₂/CL₁ = (V₁/V₂)². At Vs the coefficient is CLmax, so at k times Vs the fraction CL/CLmax is 1/k². Angle of attack is adjusted to keep lift constant; this is different from an instantaneous speed change at unchanged angle of attack.","images":[75]},"speedgust":{"id":"speedgust","title":"Instantaneous speed change at unchanged AoA","chapter":"Lift","pages":[73,74,168,461],"vi":"Ban đầu máy bay bay thẳng bằng nên L₁ = W và n₁ =1. Ngay sau nhiễu loạn, nếu AoA chưa đổi thì CL chưa đổi; xét cùng density và wing area, L tỷ lệ V². Vì W giữ nguyên nên n₂ = (V₂/V₁)². Khi đề cho n₂ và hỏi tốc độ, lấy V₂ = V₁√n₂ rồi trừ V₁ để tìm phần tăng. Đây chỉ là đáp ứng ban đầu; không có nghĩa máy bay tiếp tục bay thẳng bằng ở n khác 1.","en":"Initially L₁ = W and n₁ = 1. Immediately after the disturbance, unchanged AoA implies unchanged CL; with density and wing area unchanged, lift varies as V². As weight is unchanged, n₂ = (V₂/V₁)². When n₂ is given, V₂ = V₁√n₂, and subtracting V₁ gives the speed increment. This is the initial response, not a claim that the aircraft remains in steady level flight at a load factor other than one.","images":[]},"verticalgustcalc":{"id":"verticalgustcalc","title":"Vertical gust: distinguish n from Δn","chapter":"Limitations","pages":[468,469],"vi":"Upgust làm tăng góc tấn. Trên phần tuyến tính của lift curve, ΔCL = a × Δα, với a là mức tăng CL trên mỗi độ. Ngay lúc gust tác động, lấy dynamic pressure và weight chưa thay đổi: n₂ = (CL₁ + ΔCL)/CL₁. Nếu đề hỏi “increase in load factor” thì chỉ tính Δn = ΔCL/CL₁; nếu hỏi % tăng lift, tính 100 × ΔCL/CL₁. Mô hình này không áp dụng vượt CLmax/stall.","en":"An upgust increases AoA. In the linear region of the lift curve, ΔCL = a × Δα, with a expressed per degree. Taking dynamic pressure and weight as unchanged at the initial gust response, n₂ = (CL₁ + ΔCL)/CL₁. For the increment in load factor, use Δn = ΔCL/CL₁; for percentage lift increase, use 100 × ΔCL/CL₁. The linear model must not be extrapolated beyond CLmax/stall.","images":[468]},"gustsensitivity":{"id":"gustsensitivity","title":"Gust increment and wing loading","chapter":"Limitations","pages":[468,469,471],"vi":"Độ dốc lift curve a lớn làm cùng một Δα tạo ΔCL lớn hơn. Wing loading W/S cao làm cùng phần tăng lift chỉ chiếm tỷ lệ nhỏ của weight, nên Δn nhỏ hơn. Với cùng vận tốc gust thực w và điều kiện không khí, mô hình gust nhỏ cho Δα≈w/V và Δn≈ρVSa w/(2W); do đó tăng tốc độ làm Δn tăng. So sánh ảnh hưởng altitude phải nói rõ loại tốc độ: giữ EAS/IAS và gust thực không đổi, lên cao TAS tăng nên Δα nhỏ hơn, Δn giảm. Điều này không đồng nhất với giữ nguyên gust EAS trong bài chứng nhận; sách nêu rõ gust angle phụ thuộc TAS của cả máy bay và gust.","en":"A steeper lift-curve slope a produces a larger ΔCL for the same Δα. Higher wing loading W/S makes a given lift increment a smaller fraction of weight and reduces Δn. For the same actual gust velocity w and air conditions, the small-gust model gives Δα≈w/V and Δn≈ρVSa w/(2W), so increasing speed increases Δn. Altitude comparisons require a speed convention: with aircraft EAS/IAS and actual gust velocity unchanged, increasing altitude raises TAS, reducing Δα and Δn. This is not the same as holding design gust EAS constant; the book explicitly relates gust angle to both aircraft and gust TAS.","images":[468,469]},"roughair":{"id":"roughair","title":"Rough air: both stall and structural margins","chapter":"Limitations","pages":[467,469,470,471],"vi":"Gust dương có thể tăng góc tấn tới stall hoặc tăng lift quá giới hạn tải; gust âm giảm lift nên n có thể nhỏ hơn 1, thậm chí âm. Vì vậy không có quy tắc “càng chậm càng an toàn”: tốc độ quá thấp thiếu stall margin, quá cao thiếu strength margin. Sách mô tả rough-air speed được chọn để cân bằng hai nguy cơ, với giá trị vận hành phải phù hợp từng máy bay.","en":"Positive gusts can increase AoA to the stall or lift beyond the structural load limit; negative gusts reduce lift and can produce n below one or even negative. Thus “slower is always safer” is not valid: too little speed reduces stall margin, while excessive speed reduces strength margin. The textbook selects rough-air speed to balance both risks; the operational value is aircraft-specific.","images":[467]},"designgust":{"id":"designgust","title":"Design gust values as presented in the 2014 text","chapter":"Limitations","pages":[467,470,471],"vi":"Giáo trình 2014 dùng design gust 66 ft/s tại VB,50 ft/s tại VC và 25 ft/s tại VD. Đây là các giá trị gust EAS trong mô hình được giảng, không phải tốc độ bay VB/VC/VD. Khi làm bộ đề này, đối chiếu đúng cặp gust–design speed. Trang 471 còn nhắc ảnh hưởng AoA phụ thuộc TAS của gust và máy bay. Không dùng bảng ôn tập này để khẳng định quy định chứng nhận hiện hành.","en":"The 2014 textbook uses design gust values of 66 ft/s at VB, 50 ft/s at VC and 25 ft/s at VD. These are gust EAS values in the model being taught, not the aircraft speeds VB/VC/VD themselves. For this bank, match the gust to the corresponding design speed. Page 471 also notes that the AoA change depends on aircraft and gust TAS. This study table is not a statement of current certification requirements.","images":[467]},"turngeometry":{"id":"turngeometry","title":"Steady coordinated level turns","chapter":"Flight Mechanics","pages":[375,376,377,378,380],"vi":"Trong vòng lượn phối hợp giữ độ cao, Lcosφ=W; thành phần ngang Lsinφ cung cấp lực hướng tâm. Do đó n=L/W=1/cosφ chỉ phụ thuộc bank angle. Bán kính r=V²/(g tanφ) và rate of turn ω=g tanφ/V, với V là TAS theo m/s. Cùng bank mà tăng TAS: radius tăng theo V², rate giảm, n không đổi. Cùng TAS và bank thì máy bay nặng hay nhẹ đều có cùng radius/rate; máy bay nặng chỉ cần lực lift lớn hơn.","en":"In a steady coordinated level turn, Lcosφ=W and horizontal lift Lsinφ supplies centripetal force. Thus n=L/W=1/cosφ depends only on bank angle. Radius r=V²/(g tanφ), and turn rate ω=g tanφ/V, with TAS V in m/s. At unchanged bank, increasing TAS increases radius with V² and reduces turn rate without changing n. Aircraft of different weights have the same radius/rate at the same TAS and bank, although the heavier aircraft needs more lift.","images":[376]},"rateone":{"id":"rateone","title":"Rate-one turn","chapter":"Flight Mechanics","pages":[377],"vi":"Rate 1 là 3°/giây, tương đương 180°/phút hoặc 120 giây cho một vòng 360°. Vì ω=g tanφ/V, muốn giữ cùng rate khi tăng TAS phải tăng tanφ, tức bank lớn hơn. Với rate cố định, r=V/ω nên TAS lớn hơn vẫn cho radius lớn hơn.","en":"A rate-one turn is 3°/second, or 180°/minute and 120 seconds for a full 360°. From ω=g tanφ/V, maintaining the rate at a higher TAS requires a greater tanφ and therefore greater bank. At a fixed rate, r=V/ω, so higher TAS still gives a larger radius.","images":[]},"glide":{"id":"glide","title":"Glide angle, range and sink rate","chapter":"Flight Mechanics","pages":[372,373,374,12],"vi":"Trong straight steady glide không thrust: L=Wcosγ và D=Wsinγ nên tanγ=D/L. Góc lượn nhỏ nhất ứng với L/D lớn nhất, cũng là minimum drag cho weight đó. Still-air horizontal range≈height×L/D; phải thống nhất đơn vị. Tăng weight không đổi L/Dmax nhưng tăng tốc độ cần thiết để đạt nó. Minimum sink rate cần minimum power required tại VMP, thấp hơn VMD cho minimum glide angle. Gió đổi ground range, không tự đổi aerodynamic L/D ở cùng cấu hình/AoA.","en":"In a straight steady glide with zero thrust, L=Wcosγ and D=Wsinγ, hence tanγ=D/L. Minimum glide angle corresponds to maximum L/D and minimum drag for that weight. Still-air horizontal range is height×L/D, with consistent units. More weight does not change L/Dmax but increases the speed needed to achieve it. Minimum sink requires minimum power required at VMP, below VMD for minimum glide angle. Wind changes ground range, not aerodynamic L/D at a given configuration and AoA.","images":[372,374]},"climbcalc":{"id":"climbcalc","title":"Climb gradient from excess thrust","chapter":"Flight Mechanics","pages":[369,370],"vi":"Trong climb đều với thrust gần song song flight path, T−D=Wsinγ. Climb gradient là tanγ; với góc nhỏ dùng tanγ≈sinγ≈(T−D)/W. L=Wcosγ≈W nên D≈W/(L/D). Cần đổi mass thành weight bằng W=mg, rồi cộng thrust của các động cơ còn hoạt động. Các kết quả phần trăm trong bộ đề dùng phép xấp xỉ góc nhỏ này; không coi L=W là đẳng thức tuyệt đối khi climb.","en":"In a steady climb with thrust approximately along the flight path, T−D=Wsinγ. Climb gradient is tanγ; for small angles, tanγ≈sinγ≈(T−D)/W. Since L=Wcosγ≈W, drag is approximately W/(L/D). First convert mass to weight with W=mg, then sum thrust from the operating engines. The bank percentages use this small-angle approximation; L=W is not an exact equality in a climb.","images":[369]},"stickgcalc":{"id":"stickgcalc","title":"Manoeuvring stick force: count the increment from 1g","chapter":"Stability and Control","pages":[275,276,461],"vi":"Trimmed straight-and-level flight bắt đầu tại n=1 và stick force bằng 0. Vì vậy lực kéo để đạt n là F=K(n−1), trong đó K là N/g hoặc lb/g. Nếu đề cho force và hỏi gradient thì K=F/(n−1). Giới hạn gradient cần cả cận dưới để tránh vô tình quá tải lẫn cận trên để phi công còn đủ lực điều khiển. Không dùng K×n, vì như vậy đếm lại 1 g đang có sẵn.","en":"Trimmed straight and level flight starts at n=1 with zero stick force. The pull needed to reach n is therefore F=K(n−1), where K is N/g or lb/g. Conversely K=F/(n−1). Both a lower gradient limit, to avoid inadvertent overstress, and an upper limit, to keep required effort manageable, are needed. Do not use K×n: that counts the existing 1 g again.","images":[276]},"loadlimits":{"id":"loadlimits","title":"Load factors and VA in the textbook","chapter":"Limitations","pages":[461,462,463,473,577,178],"vi":"Giáo trình dùng positive manoeuvring limit 2,5 g cho large transport clean,2,0 g khi flap extended,4,4 g utility và 6,0 g aerobatic. VA là giới hạn tốc độ cho thao tác elevator nose-up đột ngột theo định nghĩa sách; không phải bảo vệ mọi kiểu điều khiển hoặc mọi gust. Xấp xỉ VA∝Vs∝√W khi cấu hình và CLmax giữ nguyên. Sách lưu ý large-aircraft VA thấp hơn giao điểm lý tưởng CLmax–nlimit để bảo vệ tail, và Mach ảnh hưởng CLmax ở altitude cao nên VA IAS cũng có thể phụ thuộc altitude.","en":"The text uses positive manoeuvring limits of 2.5 g for a clean large transport,2.0 g with flaps extended,4.4 g for utility and 6.0 g for aerobatic aircraft. VA is defined for the sudden nose-up elevator manoeuvre described in the text; it is not protection against every control input or gust. Approximately VA∝Vs∝√W with configuration and CLmax unchanged. For large aircraft the book places VA below the ideal CLmax–nlimit intersection to protect the tail, while altitude-related Mach effects on CLmax can also change VA in IAS.","images":[463]},"flutter":{"id":"flutter","title":"Flutter and mass balance","chapter":"Limitations","pages":[474,475,476,477],"vi":"Flutter là dao động có thể phân kỳ do tương tác aerodynamic forces, inertia và độ cứng đàn hồi của kết cấu, thường coupling bending với torsion. Nó không độc lập airspeed: đủ dynamic pressure có thể cung cấp năng lượng tăng biên độ qua mỗi chu kỳ. Mass balance đưa CG/control-surface mass về phía trước hinge/torsional axis giúp tăng biên ổn định. Động cơ vươn trước cánh có thể giúp mass-balance wing. Free play/backlash làm flutter dễ xảy ra ở tốc độ thấp hơn, không nâng tốc độ khởi phát.","en":"Flutter is a potentially divergent oscillation caused by interaction between aerodynamic forces, inertia and structural elasticity, often coupling bending and torsion. It is not independent of airspeed: sufficient dynamic pressure can feed energy into each cycle. Mass balance moves surface/wing mass forward relative to the hinge or torsional axis and improves the margin. Engines extending ahead of the wing can contribute to wing mass balance. Free play or backlash can bring flutter onset to a lower speed rather than raising it.","images":[475,477]},"vmc":{"id":"vmc","title":"Minimum control speeds: distinct tests","chapter":"Flight Mechanics","pages":[174,384,385,389,391,392,393,394,395],"vi":"VMCA liên quan kiểm soát trên không sau hỏng critical engine: các điều kiện sách nêu gồm maximum take-off thrust trên động cơ còn hoạt động, take-off flap, gear up và ground effect không đáng kể. VMCG là kiểm soát trên ground trong take-off run bằng rudder, không dùng nosewheel steering để xác định giá trị. CG aft rút ngắn rudder moment arm nên thường là bất lợi. VMCL dùng approach/landing và go-around condition, không phải take-off minimum; còn có yêu cầu roll response và giới hạn lực, nên không phải lúc nào chỉ bị giới hạn bởi maximum rudder deflection.","en":"VMCA concerns airborne control after critical-engine failure: the textbook conditions include maximum take-off thrust on the operating engines, take-off flap, gear up and negligible ground effect. VMCG concerns control on the take-off run using rudder, without nosewheel steering in its determination. Aft CG shortens the rudder moment arm and is generally unfavorable. VMCL concerns approach/landing and go-around conditions, not the take-off minimum; it also includes roll-response and force requirements, so maximum rudder deflection is not always its limiting factor.","images":[391,393,395]},"engineoutroll":{"id":"engineoutroll","title":"Engine failure: yaw, slipstream and roll","chapter":"Stability and Control","pages":[292,384,386,390],"vi":"Động cơ ở càng xa trục dọc thì mất thrust của nó càng gây yaw moment lớn. Crosswind gây weathercock tendency đưa mũi về phía gió; hỏng động cơ cùng phía có thể cộng thêm yaw theo hướng đó. Với propeller aircraft, bên hỏng máy còn mất slipstream qua cánh, gây bất đối xứng lift và rolling moment; đối với jet không có sự mất propeller slipstream này. Counter-rotation có thể loại bất đối xứng critical-engine do P-factor, nhưng không xóa việc mất lift do slipstream.","en":"An engine farther from the longitudinal axis produces a greater asymmetric yawing moment when its thrust is lost. A crosswind creates a weathercock tendency into wind; failure on the same side can add yaw in that direction. A propeller aircraft also loses slipstream over the failed-engine wing, causing lift asymmetry and a rolling moment absent from the corresponding jet. Counter-rotation can remove the P-factor critical-engine asymmetry but does not remove the loss of slipstream lift.","images":[]},"gearlimits":{"id":"gearlimits","title":"VLE versus VLO","chapter":"Limitations","pages":[472],"vi":"VLE là maximum landing gear extended speed: gear đã down và locked. VLO là maximum landing gear operating speed trong lúc extend/retract, vì doors và cơ cấu chuyển động có giới hạn riêng. Không tráo giới hạn được bay khi gear đã khóa với giới hạn được thao tác gear.","en":"VLE is maximum landing-gear-extended speed, with gear down and locked. VLO is maximum landing-gear-operating speed during extension/retraction, when doors and moving mechanisms have their own limits. Do not interchange the limit for flying with locked gear and the limit for operating it.","images":[]},"directionalsweep":{"id":"directionalsweep","title":"Sweepback and static directional stability","chapter":"Stability and Control","pages":[297,298],"vi":"Trong sideslip, cánh phía trước/hướng vào gió có sweep hiệu dụng nhỏ hơn, sinh thêm lift và induced drag. Chênh lệch drag hai cánh tạo yaw moment đưa mũi về phía relative wind, có xu hướng xóa sideslip. Đó là đóng góp stabilizing đối với directional stability; không nhầm với mômen roll do dihedral effect.","en":"In a sideslip, the forward/into-wind wing has less effective sweep and develops more lift and induced drag. The drag difference creates a yawing moment towards the relative wind, tending to remove sideslip. This is a stabilizing directional contribution, distinct from the rolling moment associated with dihedral effect.","images":[297]}}}}</script>
