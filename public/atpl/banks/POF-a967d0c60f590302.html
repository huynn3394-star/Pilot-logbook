rue,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-110"},{"id":111,"question":"The speed for minimum glide angle occurs at an angle of attack that corresponds to (assume zero thrust):","options":{"A":"(CL/CD²)MAX","B":"CLMAX","C":"(CL/CD)MAX","D":"(CL³/CD²)MAX"},"answer":"C","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-111"},{"id":112,"question":"Which of the following statements about a constant speed propeller is correct?","options":{"A":"The blade angle increases with increasing aeroplane speed.","B":"The propeller system keeps the aeroplane speed constant.","C":"The RPM decreases with increasing aeroplane speed.","D":"The selected RPM is kept constant by the manifold pressure."},"answer":"A","valid":true,"red":true,"review":{"lesson":"propaoa","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-112"},{"id":113,"question":"The lift coefficient CL versus angle of attack curve of a positively cambered aerofoil section intersects the horizontal axis of the graph:","options":{"A":"to the left of the origin.","B":"at the origin.","C":"nowhere.","D":"to the right of the origin."},"answer":"A","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-113"},{"id":114,"question":"Which of the following statements concerning control is correct?","options":{"A":"In general the maximum downward elevator deflection is larger than upward.","B":"On some aeroplanes, the servo tab also serves as a trim tab.","C":"Hydraulically powered control surfaces do not need mass balancing.","D":"In a differential aileron control system the control surfaces have a larger upward than downward maximum deflection."},"answer":"D","valid":true,"red":false,"review":{"lesson":"adverse","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-114"},{"id":115,"question":"Propeller blade twist is the:","options":{"A":"varying of the helix angle from the root to the tip of a propeller blade.","B":"angle between the relative airflow and the propeller blade's angle of attack.","C":"angle between the blade angle and the direction of the flight of the aeroplane.","D":"varying of the blade angle from the root to the tip of a propeller blade."},"answer":"D","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-115"},{"id":116,"question":"Which of these statements about the strength of wing tip vortices are correct or incorrect? 1) Assuming no flow separation, the strength of wing tip vortices increases as the angle of attack decreases. 2) The strength of wing tip vortices increases as the aspect ratio increases.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is correct.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"spanflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-116"},{"id":117,"question":"Which moments or motions interact in a Dutch roll?","options":{"A":"Rolling and yawing.","B":"Pitching and yawing.","C":"Pitching and rolling.","D":"Pitching and adverse yaw."},"answer":"A","valid":true,"red":true,"review":{"lesson":"dutchroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-117"},{"id":118,"question":"The parameters that can be read from the \"parabolic polar'' curve of an aeroplane are the:","options":{"A":"The aspect. rario of the wing and the induced drag coefficient.","B":"The minimum rare of descent and the induced drag.","C":"The induced drag and the parasite drag.","D":"The minimum glide angle and the parasite drag coefficient."},"answer":"D","valid":true,"red":false,"review":{"lesson":"polar","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-118"},{"id":119,"question":"One disadvantage of wing sweep back is:","options":{"A":"that the critical Mach number is significantly lower.","B":"a severe pitch down moment when the centre of pressure shifts forward.","C":"the tendency of the wing root section to stall prior to the wingtip section.","D":"the tendency of the wingtip section to stall prior to the wing root section."},"answer":"D","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-119"},{"id":120,"question":"An aeroplane has static directional stability if, when in a sideslip with the relative airflow coming from the left, initially the:","options":{"A":"right wing tends to go down.","B":"nose of the aeroplane tends to yaw right.","C":"nose of the aeroplane tends to yaw left.","D":"nose of the aeroplane does not move."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-120"},{"id":121,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the undisturbed airflow is lower than in the throat. 2) The total pressure in the undisturbed airflow is higher than in the throat.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is incorrect"},"answer":"C","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-121"},{"id":122,"question":"An aeroplane flying at 200 kts in straight and level flight is subjected to a disturbance that suddenly decreases the speed by 80 kts. Assuming the angle of attack remains constant, the load factor will initially:","options":{"A":"decrease to 0.36.","B":"decrease to 0.50.","C":"decrease to 0.60.","D":"remain unchanged, since the angle of attack does not change."},"answer":"A","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"Tốc độ đổi từ 200 sang 120 kt. Bình phương tỷ số tốc độ cho n = 0.36; đây là load factor mới, không phải phần tăng Δn.","en":"Speed changes from 200 to 120 kt. Squaring the speed ratio gives n = 0.36; this is the new total load factor, not its increment Δn.","noteVi":"","noteEn":"","formula":"n₂ = (120/200)² = 0.36"},"topic":"Lift","uid":"POF-122"},{"id":123,"question":"Which of these statements about wing sweepback are correct or incorrect? 1) Increasing wing sweepback increases MCRIT. 2) Increasing wing sweepback increases the drag divergence Mach number.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"B","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-123"},{"id":124,"question":"When flaps are deployed at constant angle of attack the lift coefficient will:","options":{"A":"remain the same.","B":"decrease.","C":"increase.","D":"vary as the square of IAS."},"answer":"C","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-124"},{"id":125,"question":"Which statement is correct about a spring tab?","options":{"A":"At high IAS it behaves like a fixed extension of the elevator.","B":"Its main purpose is to increase stick force per G.","C":"At high IAS it behaves like a servo tab.","D":"At low IAS it behaves like a servo tab."},"answer":"C","valid":true,"red":false,"review":{"lesson":"tabs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-125"},{"id":126,"question":"During a climb at a constant IAS, the Mach number will:","options":{"A":"remain constant.","B":"decrease initially and increase subsequently.","C":"increase.","D":"increase initially and remain constant subsequently."},"answer":"C","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-126"},{"id":127,"question":"As fuel is consumed during a level flight cruise at high level:","options":{"A":"the angle of attack must be increased.","B":"the stalling speed will increase.","C":"the centre of pressure will move forward.","D":"induced drag will decrease."},"answer":"D","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-127"},{"id":128,"question":"To cover the greatest distance when gliding, the gliding speed must be:","options":{"A":"near to the stalling speed.","B":"as high as possible within V limits.","C":"minimum control speed.","D":"the one that gives the lowest total drag."},"answer":"D","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-128"},{"id":129,"question":"Which statement about an aeroplane entering ground effect is correct? 1) The downwash angle increases. 2) The induced angle of attack increases.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-129"},{"id":130,"question":"An in-flight move of the CG of an aircraft further aft will:","options":{"A":"Increase the angle of attack.","B":"reduce the longitudinal stability.","C":"increase the longitudinal stability.","D":"have no effect on the longitudinal stability."},"answer":"B","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-130"},{"id":131,"question":"Assuming ISA conditions and a climb above the tropopause at constant Mach number and aeroplane mass, the:","options":{"A":"TAS increases.","B":"IAS decreases.","C":"Lift coefficient decreases.","D":"Lift coefficient remains constant."},"answer":"B","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-131"},{"id":132,"question":"The forces of lift and drag on an aerofoil are, respectively, normal and parallel to the:","options":{"A":"relative wind/airflow.","B":"chord line.","C":"longitudinal axis.","D":"horizon."},"answer":"A","valid":true,"red":true,"review":{"lesson":"directionforces","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-132"},{"id":133,"question":"A \"slat\" on a wing is:","options":{"A":"A leading edge flap.","B":"A split flap along the leading edge of the wing.","C":"A leading edge device that causes some of the high energy air to flow over the upper surface of the wing.","D":"Another expression for a Fowler flap."},"answer":"C","valid":true,"red":false,"review":{"lesson":"slats","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-133"},{"id":134,"question":"The aerodynamic centre of a wing is the point relative to which:","options":{"A":"the boundary layer changes from laminar to turbulent.","B":"assuming no flow separation. the pitching moment coefficient does not change with varying angle of attack.","C":"the velocity of the relative airflow is reduced to zero.","D":"the aeroplane becomes longitudinally unstable when the CG is moved beyond it in an aft direction."},"answer":"B","valid":true,"red":false,"review":{"lesson":"ac","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-134"},{"id":135,"question":"The effect of Mach trim on stick forces for power operated controls:","options":{"A":"Is to maintain the required stick force gradient.","B":"Is to decrease the stick force gradient to ensure the pilot can manoeuvre the aircraft adequately when flying at a high transonic Mach number.","C":"Is to decrease the stick force gradient to prevent the possibility of high speed stall.","D":"A Mach trim system is not required If an aircraft has power operated controls."},"answer":"B","valid":true,"red":false,"review":{"lesson":"tuck","status":"conflict","vi":"Key B nói giảm stick-force gradient để cơ động. Trang 311 và 439 lại nêu duy trì gradient yêu cầu để chống speed instability/Mach tuck. Không thể coi mô tả của B là chức năng chung đã được sách xác nhận.","en":"Key B describes decreasing the stick-force gradient for manoeuvring. Pages 311 and 439 instead describe maintaining the required gradient against speed instability/Mach tuck. B is not a verified general description of that function.","noteVi":"Lý do của key B không khớp mục đích Mach trim trong nguồn.","noteEn":"The rationale in key B does not match the source description of Mach trim.","bookAnswer":"Maintain the required stick-force gradient at high Mach."},"topic":"Stability and Control","uid":"POF-135"},{"id":136,"question":"Aileron reversal may be caused by:","options":{"A":"the wing twisting and increasing incidence when the aileron is lowered.","B":"the wing twisting and reducing incidence when the aileron is lowered.","C":"the aileron being pushed in the reverse direction by aileron drag.","D":"the wing twisting and reducing incidence when the aileron is raised."},"answer":"B","valid":true,"red":false,"review":{"lesson":"aileronlock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-136"},{"id":137,"question":"At constant EAS, what is the effect on aerodynamic damping as height increases?","options":{"A":"Damping in all axes is reduced.","B":"Damping in pitch manoeuvres only is reduced.","C":"Damping in roll is increased.","D":"Damping in all axes is increased."},"answer":"A","valid":true,"red":true,"review":{"lesson":"damping","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-137"},{"id":138,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the undisturbed airflow is lower than in the throat. 2) The total pressure in the undisturbed airflow and in the throat is the same.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-138"},{"id":139,"question":"VMCA is the minimum speed at which directional control can be maintained when, amongst others: 1) maximum take-off thrust was set and is maintained on the remaining engines. 2) a sudden engine failure occurs on the most critical engine. 3) flaps are in any position. 4) the gear is either up or down. 5) the aeroplane is either in or out of ground effect. The combination that regroups all of the correct statements is:","options":{"A":"1, 2, 4","B":"2, 3, 5","C":"3, 4, 5","D":"1, 2"},"answer":"D","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-139"},{"id":140,"question":"Just above the critical Mach number the first evidence of a shock wave will appear at the:","options":{"A":"upper side of the wing.","B":"lower side of the wing.","C":"leading edge of the wing.","D":"trailing edge of the wing."},"answer":"A","valid":true,"red":true,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-140"},{"id":141,"question":"Which statement is correct regarding the gyroscopic effect of a clockwise rotating propeller on a single engine aeroplane? 1) Pitch up produces right yaw. 2) Right yaw produces pitch down.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is incorrect.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"A","valid":true,"red":true,"review":{"lesson":"gyro","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-141"},{"id":142,"question":"Flutter of control surfaces is:","options":{"A":"divergent oscillatory motion of a control surface caused by the interaction of aerodynamic, inertia and friction forces.","B":"a divergent oscillatory motion of a control surface caused by the interaction of aerodynamic forces, inertia forces and the stiffness of the structure.","C":"aileron reversal.","D":"the accelerated stall of a wing."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-142"},{"id":143,"question":"Given: Aeroplane mass: 50 000 kg; Lift/Drag ratio: 12; Thrust per engine: 60 000 N; Assumed g: 10 m/s²; For a straight, steady, wings level climb of a twin engine aeroplane, the one engine-inoperative climb gradient will be:","options":{"A":"3.7%","B":"15.7%","C":"14%","D":"11 .7%"},"answer":"A","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 1 động cơ tạo thrust: T=1×60,000=60,000 N. D≈500 000/12≈41,667 N; gradient≈(60,000−41,667)/500 000×100=3.67%.","en":"W=50,000×10=500,000 N. There are 1 thrust-producing engines: T=1×60,000=60,000 N. D≈500,000/12≈41,667 N, so gradient≈(60,000−41,667)/500,000×100=3.67%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 60,000 N; gradient ≈ 3.67%"},"topic":"Flight Mechanics","uid":"POF-143"},{"id":144,"question":"Vortex generators on the upper side of the wing:","options":{"A":"increase critical Mach number.","B":"increase wave drag.","C":"decrease wave drag.","D":"decrease critical Mach number."},"answer":"C","valid":true,"red":false,"review":{"lesson":"vortexgen","status":"derived","vi":"Trang 423 tính phần drag do separation vào wave drag. Do vortex generator giảm shock-induced separation nên có thể giảm thành phần này của wave drag. Không có nghĩa nó loại bỏ mọi shock hoặc luôn giảm total drag ở mọi điều kiện.","en":"Page 423 includes separation drag within wave drag. A vortex generator can reduce that component by reducing shock-induced separation. This does not mean it removes every shock or always reduces total drag under every condition.","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-144"},{"id":145,"question":"As angle of arrack is increased on a conventional low speed aerofoil at low subsonic speeds, flow separation normally starts on the:","options":{"A":"upper surface near the leading edge.","B":"upper surface near the trailing edge.","C":"lower surface near the leading edge.","D":"lower surface near the trailing edge."},"answer":"B","valid":true,"red":false,"review":{"lesson":"stall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-145"},{"id":146,"question":"If angle of attack is increased beyond the critical angle of attack, the lift coefficient _ and the stagnation point moves _ .","options":{"A":"decreases; rearward","B":"increases; rearward","C":"decreases; forward","D":"increases; forward"},"answer":"A","valid":true,"red":false,"review":{"lesson":"stall","status":"derived","vi":"Vượt α tới hạn làm CL giảm. Trong ví dụ profile của sách, điểm stagnation đã chuyển xuống mặt dưới và dịch xa hơn về sau khi α tăng.","en":"Beyond the critical angle CL decreases. In the textbook section example the stagnation point has moved onto the lower surface and moves further aft as α increases.","noteVi":"Vị trí stagnation được đối chiếu thêm với hình phân bố áp suất trang 57.","noteEn":"The stagnation-point motion also uses the pressure-distribution example on page 57."},"topic":"Stalling","uid":"POF-146"},{"id":147,"question":"Assuming standard atmospheric conditions, in order to generate the same amount of lift as altitude is increased, an aeroplane must be flown at:","options":{"A":"a higher TAS for any given angle of attack.","B":"the same TAS regardless of angle of attack.","C":"a lower TAS and a lower angle of attack.","D":"a lower TAS for any given angle of attack."},"answer":"A","valid":true,"red":false,"review":{"lesson":"ias","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-147"},{"id":148,"question":"The lift coefficient CL versus angle of attack curve of a negatively cambered aerofoil section intersects the vertical axis of the graph:","options":{"A":"below the origin.","B":"above the origin.","C":"nowhere.","D":"at the origin."},"answer":"A","valid":true,"red":false,"review":{"lesson":"symmetrical","status":"derived","vi":"","en":"","noteVi":"Suy ra từ quan hệ giữa camber và đường CL–α; không phải số liệu cho một profile cụ thể.","noteEn":"Inferred from the relationship between camber and the lift curve, not numerical data for a particular section."},"topic":"Subsonic Airflow","uid":"POF-148"},{"id":149,"question":"For a given elevator deflection, aeroplane longitudinal manoeuvrability decreases when:","options":{"A":"the CG moves aft.","B":"flaps are retracted at constant IAS.","C":"the CG moves forward.","D":"IAS increases."},"answer":"C","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-149"},{"id":150,"question":"Which of these statements about an oblique shock wave are correct or incorrect? 1) The Mach number behind an oblique shock wave is lower than in front of it. 2) The total pressure behind an oblique shock wave is lower than in front of it.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is incorrect."},"answer":"B","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-150"},{"id":151,"question":"Given: Aeroplane mass: 50 000 kg; Lift/Drag ratio: 12; Thrust per engine: 20 000 N; Assumed g: 10 m/s²; For a straight, steady, wings level climb of a four-engine aeroplane. the all engines climb gradient will be:","options":{"A":"4.3%","B":"7.7%","C":"60%","D":"8.5%"},"answer":"B","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 4 động cơ tạo thrust: T=4×20,000=80,000 N. D≈500 000/12≈41,667 N; gradient≈(80,000−41,667)/500 000×100=7.67%.","en":"W=50,000×10=500,000 N. There are 4 thrust-producing engines: T=4×20,000=80,000 N. D≈500,000/12≈41,667 N, so gradient≈(80,000−41,667)/500,000×100=7.67%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 80,000 N; gradient ≈ 7.67%"},"topic":"Flight Mechanics","uid":"POF-151"},{"id":152,"question":"Stall speed (IAS) varies with:","options":{"A":"altitude (below approximately 10 000 ft)","B":"weight.","C":"density.","D":"temperature."},"answer":"B","valid":true,"red":false,"review":{"lesson":"vs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-152"},{"id":153,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The static pressure in the throat is higher than in the undisturbed airflow. 2) The speed of the airflow in the throat is the same as in the undisturbed airflow.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-153"},{"id":154,"question":"Two identical aeroplanes A and B, with the same mass, are flying steady level coordinated 20° bank turns. If the TAS of A is 130 kts and the TAS of B is 200 kts:","options":{"A":"the turn radius of A is greater than that of B.","B":"the load factor of A is greater than that of B.","C":"the rate of turn of A is greater than that of B.","D":"the lift coefficient of A is less than that of B."},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-154"},{"id":155,"question":"Wing loading is the ratio of:","options":{"A":"lift to wing weight","B":"wing area to wing weight.","C":"lift to aircraft weight","D":"aircraft weight to wing area."},"answer":"D","valid":true,"red":false,"review":{"lesson":"geometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-155"},{"id":156,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The static pressure in the throat is lower than in the undisturbed airflow. 2) The speed of the airflow in the throat is the same as in the undisturbed airflow.","options":{"A":"1) is correct, 2) is correct","B":"1) is incorrect, 2) is correct","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-156"},{"id":157,"question":"What is the effect on an aeroplane's characteristics of extending Fowler flaps to their fully extended position?","options":{"A":"CD remains constant for a given angle of attack.","B":"wing area and camber increase.","C":"wing area remains constant but camber increases.","D":"CLMAX occurs at a higher angle of attack."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-157"},{"id":158,"question":"Which of these statements about the supersonic speed range is correct?","options":{"A":"The airflow everywhere around the aeroplane is supersonic.","B":"The supersonic speed range starts at a Mach number below M = 1 and extends to Mach numbers above M = 1.","C":"The airflow around the aeroplane is transonic.","D":"The supersonic speed range starts at M = 1 and ends at MCRIT."},"answer":"B","valid":true,"red":false,"review":{"lesson":"transonic","status":"conflict","vi":"Nội dung B mô tả vùng transonic, không phải supersonic như câu hỏi viết. Vì thế không thể hợp thức hóa B bằng cách đổi tên vùng một cách âm thầm.","en":"Option B describes the transonic range, not the supersonic range named by the stem. B cannot be justified by silently renaming the regime.","noteVi":"Stem “supersonic” và nội dung đáp án mô tả “transonic” không nhất quán.","noteEn":"The “supersonic” stem is inconsistent with the transonic description in the key.","bookAnswer":"Mô tả của B thuộc transonic / B describes transonic flow."},"topic":"High Speed Flight","uid":"POF-158"},{"id":159,"question":"Which statement is correct?","options":{"A":"During a phugoid altitude varies significantly, but during a short period oscillation it remains approximately constant","B":"During both a phugoid and a short period oscillation altitude remains approximately constant.","C":"During both a phugoid and a short period oscillation altitude varies significantly.","D":"During a phugoid attitude remains approximately constant, but during a short period oscillation it varies significantly."},"answer":"A","valid":true,"red":false,"review":{"lesson":"phugoid","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-159"},{"id":160,"question":"If the increased downwash at the tail plane due to lowering (extending) trailing edge flaps is considered in isolation:","options":{"A":"a nose up pitching moment will be generated.","B":"a nose down pitching moment will be generated.","C":"the direction of the pitch change will depend on the initial direction of the tall load.","D":"tall plane angle of attack will be decreased, causing a nose down pitching moment."},"answer":"A","valid":true,"red":false,"review":{"lesson":"flappitch","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-160"},{"id":161,"question":"Which statement is correct? 1) A stick pusher activates at a higher angle of attack than a stick shaker. 2) A stick pusher prevents the pilot from increasing the angle of attack further.","options":{"A":"1) is correct, 2) is correct","B":"1) is correct, 2) is incorrect","C":"1) is incorrect, 2) is correct","D":"1) is incorrect, 2) is incorrect"},"answer":"A","valid":true,"red":false,"review":{"lesson":"stallwarning","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-161"},{"id":162,"question":"Which of the following statements about static lateral and directional stability is correct?","options":{"A":"The effects of static lateral and static directional stability are completely independent of each other because they take place about different axis.","B":"An aeroplane with an excessive static directional stability in relation to its static lateral stability, will be prone to spiral dive (spiral instability).","C":"An aeroplane with an excessive static directional stability in relation to its static lateral stability, will be prone to Dutch roll.","D":"Static directional stability can be increased by installing more powerful engines."},"answer":"B","valid":true,"red":false,"review":{"lesson":"dutchroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-162"},{"id":163,"question":"Which of the following wing planforms produces the lowest induced drag? (assume zero wing twist)","options":{"A":"Rectangular.","B":"Elliptical.","C":"Tapered.","D":"Circular."},"answer":"B","valid":true,"red":false,"review":{"lesson":"elliptic","status":"limited","vi":"","en":"","noteVi":"Chưa đủ đoạn nguồn trực tiếp cho tính chất phân bố lift elip.","noteEn":"A direct source for the particular elliptical-loading property is not established."},"topic":"Lift","uid":"POF-163"},{"id":164,"question":"An engine failure can result in a windmilling (i) propeller and a non-rotating (ii) propeller. Which statement about propeller drag is correct?","options":{"A":"ii) is larger than i).","B":"i) is equal to ii).","C":"i) is larger than ii).","D":"Impossible to say which one is larger."},"answer":"C","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-164"},{"id":165,"question":"What is the limit load factor of a large transport aeroplane?","options":{"A":"6 g","B":"4.4 g","C":"2.5 g","D":"3.75 g"},"answer":"C","valid":true,"red":true,"review":{"lesson":"loadlimits","status":"reviewed","vi":"","en":"","noteVi":"Giá trị theo phân loại và giáo trình 2014, không thay flight manual của loại máy bay.","noteEn":"Values follow the categories in the 2014 text and do not replace the aircraft flight manual."},"topic":"Limitations","uid":"POF-165"},{"id":166,"question":"Flutter sensitivity of an aeroplane wing is reduced by:","options":{"A":"a high speed (IAS)","B":"locating the engine ahead of the torsional axis of the wing.","C":"empty tanks near the wing tip.","D":"a low torsion stiffness in relation to the bending stiffness."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-166"},{"id":167,"question":"When comparing the properties of laminar and turbulent boundary layers, which of the following statements is correct?","options":{"A":"Separation point will occur earlier in the turbulent layer.","B":"Friction drag will be equal in both types of layers.","C":"Friction drag is lower in the turbulent layer.","D":"Friction drag is lower in the laminar layer."},"answer":"D","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-167"},{"id":168,"question":"Upon extension of a wing spoiler, if the angle of attack remains constant:","options":{"A":"both CL and CD are increased.","B":"CD is increased and CL is decreased.","C":"CL is decreased, while CD remains unaffected.","D":"CD is increased, while CL remains unaffected."},"answer":"B","valid":true,"red":false,"review":{"lesson":"spoilers","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-168"},{"id":169,"question":"For a given aeroplane which two main variables determine the value of VMCG?","options":{"A":"Airport elevation and temperature.","B":"Engine thrust and rudder deflection.","C":"Air density and runway length.","D":"Engine thrust and gear position."},"answer":"B","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-169"},{"id":170,"question":"The total pressure: (note: rho = density)","options":{"A":"can be measured in a small hole in a surface, parallel to the local stream.","B":"is the static pressure plus the dynamic pressure.","C":"is the static pressure minus the dynamic pressure.","D":"is ½ rho V² ."},"answer":"B","valid":true,"red":false,"review":{"lesson":"dynamic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-170"},{"id":171,"question":"Which part of the aeroplane has the largest effect on induced drag?","options":{"A":"Wing root junction.","B":"Engine cowling.","C":"Wingtip.","D":"Landing gear."},"answer":"C","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-171"},{"id":172,"question":"A transonic Mach number is a Mach number:","options":{"A":"between the buffet onset Mach number and the Mach number corresponding to total supersonic flow.","B":"at which only supersonic local speeds occur.","C":"in the range between MCRIT and MMO","D":"which both subsonic and supersonic local speeds occur."},"answer":"D","valid":true,"red":false,"review":{"lesson":"transonic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-172"},{"id":173,"question":"On an aircraft with an all -moving tail plane. backward movement of the control wheel in flight causes:","options":{"A":"an increase in tail plane incidence and a nose up pitch.","B":"an upward movement of the trimming tab and a nose up pitch.","C":"an increase in tail plane incidence and a nose down pitch.","D":"a decrease in tail plane incidence and a nose up pitch."},"answer":"D","valid":true,"red":false,"review":{"lesson":"alltail","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-173"},{"id":174,"question":"Which statement is correct about the gust load on an aeroplane (IAS and all other factors of importance remaining constant)? 1) When the mass decreases, the gust load factor increases. 2) When the altitude increases, the gust load factor increases.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"D","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-174"},{"id":175,"question":"Which of these statements about flutter are correct or incorrect? 1) Aero-elastic coupling does not affect flutter characteristics. 2) The risk of flutter increases as IAS increases.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is correct","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect"},"answer":"B","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-175"},{"id":176,"question":"The main purpose of a boundary-layer fence on a swept wing is to:","options":{"A":"improve the lift coefficient of the trailing edge flaps.","B":"improve the high speed handling characteristics.","C":"improve the low speed handling characteristics.","D":"increase the critical Mach number."},"answer":"C","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-176"},{"id":177,"question":"When the speed over an aerofoil section increases from subsonic to supersonic, its aerodynamic centre:","options":{"A":"moves from approximately 25% to about 50% of the chord.","B":"moves aft by approximately 10% of the chord.","C":"does not move.","D":"moves slightly forward."},"answer":"A","valid":true,"red":true,"review":{"lesson":"supersonicac","status":"limited","vi":"","en":"","noteVi":"Key được giữ nguyên. Không dùng đoạn CP làm bằng chứng thay cho AC.","noteEn":"Original key retained. A CP statement is not substituted as evidence for AC."},"topic":"High Speed Flight","uid":"POF-177"},{"id":178,"question":"Aileron flutter can be caused by:","options":{"A":"aileron reversal.","B":"cyclic deformations generated by aerodynamic, inertial and elastic loads on the wing.","C":"continuous deformations in one direction generated by bending and twisting of the wing.","D":"the elastic centre of the wing section coinciding with the centre of gravity of that wing section."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-178"},{"id":179,"question":"If density is kept constant, the dynamic pressure:","options":{"A":"increases proportionally with velocity.","B":"increases proportionally with static pressure.","C":"changes inversely with the square of the velocity.","D":"increases proportionally with the square of the velocity."},"answer":"D","valid":true,"red":false,"review":{"lesson":"dynamic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-179"},{"id":180,"question":"Which of these statements about \"tuck under\" are correct or incorrect? 1) A contributing factor to \"tuck under\" is a forward movement of the centre of pressure of the wing. 2) A contributing factor to \"tuck under\" is a reduction in the downwash angle at the location of the horizontal stabilizer.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"tuck","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-180"},{"id":181,"question":"The stick force per g of a heavy transport aeroplane is 300 N/g. What stick force is required, if the aeroplane in clean configuration is pulled to the limit manoeuvring load factor from a trimmed horizontal straight and steady flight?","options":{"A":"450 N","B":"750 N","C":"1125 N","D":"825 N"},"answer":"A","valid":true,"red":true,"review":{"lesson":"stickgcalc","status":"calculation","vi":"Large transport clean dùng nlimit=2,5 trong sách. F=300×(2,5−1)=450 N.","en":"The textbook large clean transport limit is n=2.5. F=300×(2.5−1)=450 N.","noteVi":"","noteEn":"","formula":"F = 300 × (2.5−1) = 450 N"},"topic":"Stability and Control","uid":"POF-181"},{"id":182,"question":"Compared to a straight wing of the same airfoil section a wing with a 30° sweep-back should theoretically have an MCRIT _ (i) times the MCRIT of the straight wing. However, in practice the swept wing will gain _ (ii) that increase.","options":{"A":"i) 1.154, ii) half","B":"i) 1.414, ii) twice","C":"i) sine 30, ii) half","D":"i) cosine 30, ii) twice"},"answer":"A","valid":true,"red":false,"review":{"lesson":"sweep","status":"limited","vi":"Mô hình đơn giản cho hệ số 1/cos 30° ≈ 1,1547. Vế “half in practice” trong đáp án là hệ số kinh nghiệm; đoạn sách được đối chiếu chỉ mô tả nguyên lý cosΛ, chưa xác nhận tỷ lệ một nửa cho mọi thiết kế.","en":"The simple model gives 1/cos 30° ≈ 1.1547. The keyed “half in practice” is an empirical qualification; the checked text establishes the cosine principle but not a universal one-half realization factor.","noteVi":"Hệ số lý thuyết đã tính; vế tỷ lệ thực tế chưa có căn cứ trực tiếp.","noteEn":"The theoretical multiplier is calculated; the practical fraction lacks direct support.","formula":"1 / cos30° = 1.1547"},"topic":"High Speed Flight","uid":"POF-182"},{"id":183,"question":"A swept wing compared to the same wing without sweep will provide:","options":{"A":"the same lift at a given angle of attack and a lower CL MAX·","B":"the same lift at a given angle of attack and a higher CL MAX·","C":"less lift at a given angle of attack.","D":"more lift at a given angle of attack."},"answer":"C","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-183"},{"id":184,"question":"The axes of an aircraft by definition must all pass through the:","options":{"A":"flight desk.","B":"aircraft datum.","C":"centre of pressure.","D":"centre of gravity."},"answer":"D","valid":true,"red":false,"review":{"lesson":"axes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-184"},{"id":185,"question":"The lift coefficient CL versus angle of attack curve of a negatively cambered aerofoil section intersects the horizontal axis of the graph:","options":{"A":"to the right of the origin.","B":"at the origin.","C":"to the left of the origin.","D":"nowhere."},"answer":"A","valid":true,"red":false,"review":{"lesson":"symmetrical","status":"derived","vi":"","en":"","noteVi":"Suy ra từ quan hệ giữa camber và đường CL–α; không phải số liệu cho một profile cụ thể.","noteEn":"Inferred from the relationship between camber and the lift curve, not numerical data for a particular section."},"topic":"Subsonic Airflow","uid":"POF-185"},{"id":186,"question":"The lift coefficient (CL) of an aeroplane in steady horizontal flight is 0.42. An increase in angle of attack of 1 degree increases CL by 0.1. A vertical up gust instantly changes the angle of attack by 3°. The load factor will be:","options":{"A":"1.71","B":"1.49","C":"2.49","D":"0.74"},"answer":"A","valid":true,"red":false,"review":{"lesson":"verticalgustcalc","status":"calculation","vi":"ΔCL = 0.1 × 3 = 0.3; CL₂ = 0.42 + 0.3 = 0.72. Chia cho CL₁ được n = 1.71; không cộng thêm 1 lần nữa.","en":"ΔCL = 0.1 × 3 = 0.3; CL₂ = 0.42 + 0.3 = 0.72. Dividing by the initial CL gives n = 1.71; do not add one again.","noteVi":"","noteEn":"","formula":"n = (0.42 + 0.1 × 3)/0.42 = 1.71"},"topic":"Limitations","uid":"POF-186"},{"id":187,"question":"A line connecting the leading and trailing edge midway between the upper and lower surface of an aerofoil. This definition is applicable for:","options":{"A":"the Mean Aerodynamic Chord line.","B":"the chord line.","C":"the camber line.","D":"the upper camber line."},"answer":"C","valid":true,"red":false,"review":{"lesson":"geometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-187"},{"id":188,"question":"If the stall speed of an aeroplane is 60 kts, at what speed will the aeroplane stall if the load factor is 2?","options":{"A":"120 kts.","B":"66 kts.","C":"72 kts.","D":"85 kts."},"answer":"D","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Vs mới = 60 × √2 = 84.9 kt; chọn giá trị làm tròn gần nhất trong đề.","en":"New Vs = 60 × √2 = 84.9 kt; use the nearest rounded option.","noteVi":"","noteEn":"","formula":"Vs₂ = Vs₁√n = 84.9 kt"},"topic":"Stalling","uid":"POF-188"},{"id":189,"question":"Which is one of the disadvantages of excessive increasing of the number of propeller blades (beyond a certain number)?","options":{"A":"Decreased propeller efficiency.","B":"Increased noise.","C":"Less power can be absorbed by the propeller.","D":"Higher tip-speed."},"answer":"A","valid":true,"red":false,"review":{"lesson":"solidity","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-189"},{"id":190,"question":"Assuming no flow separation, which of these statements about the flow around an aerofoil as the angle of attack decreases are correct or incorrect? 1) The stagnation point moves down. 2) The point of lowest static pressure moves aft.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is incorrect","D":"1) is incorrect, 2) is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"pressureflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-190"},{"id":191,"question":"An aeroplane is performing a co-ordinated level turn with a constant 30° bank angle. If the airspeed is increased the rate of turn will _ (i) and the radius of turn will _ (ii).","options":{"A":"i) increase; ii) decrease.","B":"i) decrease; ii) increase.","C":"i) increase; ii) increase.","D":"i) decrease; ii) decrease."},"answer":"B","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-191"},{"id":192,"question":"The manoeuvrability of an aeroplane is best when the:","options":{"A":"CG is on the aft CG limit.","B":"speed is low.","C":"CG position is on the forward CG limit.","D":"flaps are down."},"answer":"A","valid":true,"red":true,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-192"},{"id":193,"question":"An increase in geometric dihedral in a steady sideslip condition at constant speed would:","options":{"A":"decrease the required lateral control force.","B":"increase the required lateral control force.","C":"decrease the stick force per g.","D":"not affect the required lateral control force."},"answer":"B","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-193"},{"id":194,"question":"The regime of flight from the critical Mach number up to approximately M = 1.3 is called the:","options":{"A":"hypersonic range.","B":"supersonic range.","C":"transonic range.","D":"subsonic range."},"answer":"C","valid":true,"red":false,"review":{"lesson":"transonic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-194"},{"id":195,"question":"Which of these statements about a trimmable horizontal stabilizer is correct?","options":{"A":"A trimmed aeroplane with an aft CG requires the stabiliser leading edge to be higher than in the case of a forward CG in the same condition.","B":"A trimmed aeroplane with an aft CG requires the stabilizer leading edge to be lower than in the case of a forward CG in the same condition.","C":"Because cake-off speeds do not vary with CG position, the need for stabilizer adjustment is dependent on flap position only.","D":"At the aft CG limit, stabilizer trim is adjusted fully nose up to obtain maximum elevator authority at rotation during take-off."},"answer":"A","valid":true,"red":false,"review":{"lesson":"trim","status":"derived","vi":"CG aft cần ít tail download hơn so với CG forward trong cùng điều kiện. Đuôi vì thế được trim với leading edge cao hơn, tức incidence lớn hơn so với cấu hình CG trước.","en":"An aft CG requires less tail downforce than a forward CG in the same condition. The stabilizer is consequently trimmed with its leading edge higher, or greater incidence, relative to the forward-CG setting.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-195"},{"id":196,"question":"As the centre of gravity is changed, recovery from a stall becomes progressively:","options":{"A":"more difficult as the centre of gravity moves aft.","B":"more difficult as the centre of gravity moves forward.","C":"less difficult as the centre of gravity moves aft.","D":"is unaffected by centre of gravity position. only by weight."},"answer":"A","valid":true,"red":true,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-196"},{"id":197,"question":"The point, where the aerodynamic lift acts on a wing is:","options":{"A":"the CG location.","B":"the centre of pressure.","C":"the point of maximum thickness of the wing.","D":"the suction point of the wing."},"answer":"B","valid":true,"red":false,"review":{"lesson":"cp","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-197"},{"id":198,"question":"An aeroplane flying at 200 kts in straight and level flight is subjected to a disturbance that suddenly decreases the speed by 40 kt. Assuming the angle of attack remains constant, the load factor will initially:","options":{"A":"decrease to 0.60.","B":"decrease to 0.64.","C":"decrease to 0.80.","D":"remain unchanged, since the angle of attack does not change."},"answer":"B","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"Tốc độ đổi từ 200 sang 160 kt. Bình phương tỷ số tốc độ cho n = 0.64; đây là load factor mới, không phải phần tăng Δn.","en":"Speed changes from 200 to 160 kt. Squaring the speed ratio gives n = 0.64; this is the new total load factor, not its increment Δn.","noteVi":"","noteEn":"","formula":"n₂ = (160/200)² = 0.64"},"topic":"Lift","uid":"POF-198"},{"id":199,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the mass increases, the gust load factor increases. 2) When the altitude increases, the gust load factor increases.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect.","D":"1) is correct, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-199"},{"id":200,"question":"When the blades of a propeller are in the feathered position:","options":{"A":"the wind milling RPM is the maximum.","B":"the propeller produces an optimal windmilling RPM.","C":"the drag of the propeller is then minimal.","D":"the RPM is then just sufficient to lubricate the engine."},"answer":"C","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-200"},{"id":201,"question":"In order to fly a rate one turn at a higher airspeed, the bank angle must be:","options":{"A":"decreased and the turn radius will increase.","B":"increased and the turn radius will decrease.","C":"increased and the turn radius will increase.","D":"decreased and the turn radius will decrease."},"answer":"C","valid":true,"red":false,"review":{"lesson":"rateone","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-201"},{"id":202,"question":"Which statement is correct regarding the gyroscopic effect of a clockwise rotating propeller on a single engine aeroplane? 1) Pitch up produces left yaw. 2) Right yaw produces pitch up.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"gyro","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-202"},{"id":203,"question":"The application of the area rule on aeroplane design will decrease the:","options":{"A":"wave drag.","B":"skin friction drag.","C":"induced drag.","D":"form drag."},"answer":"A","valid":true,"red":true,"review":{"lesson":"arearule","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-203"},{"id":204,"question":"Assuming no compressibility effects, induced drag at constant IAS is affected by:","options":{"A":"engine thrust.","B":"aeroplane mass.","C":"aeroplane wing location.","D":"angle between wing chord and fuselage centre line."},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-204"},{"id":205,"question":"What is the highest speed possible without supersonic flow over the wing?","options":{"A":"Initial Mach buffet speed.","B":"M = 1.","C":"Tuck under speed.","D":"Critical Mach number."},"answer":"D","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-205"},{"id":206,"question":"Increasing the number of propeller blades will:","options":{"A":"decrease the torque in the propeller shaft at maximum power.","B":"increase the propeller efficiency.","C":"increase the noise level at maximum power.","D":"increase the maximum absorption of power."},"answer":"D","valid":true,"red":false,"review":{"lesson":"solidity","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-206"},{"id":207,"question":"Assuming ISA conditions and a descent above the tropopause at constant Mach number and aeroplane mass, the:","options":{"A":"IAS decreases.","B":"TAS remains constant","C":"lift coefficient increases.","D":"lift coefficient remains constant."},"answer":"B","valid":true,"red":true,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-207"},{"id":208,"question":"Comparing the differences between a horizontal trimmable stabiliser and an elevator trim tab, which of these statements are correct or incorrect? 1) A stabiliser trim is more suitable to cope with the large trim changes generated by the high lift devices on most jet transport aeroplanes. 2) A stabiliser trim runaway causes less control difficulty.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is incorrect, 2) is correct."},"answer":"A","valid":true,"red":false,"review":{"lesson":"trim","status":"limited","vi":"Stabilizer có khả năng trim mạnh hơn, phù hợp thay đổi trim lớn. Tuy nhiên nguồn đã đọc không định lượng hay so sánh riêng độ khó giữa trim-tab runaway và stabilizer runaway; vế đó của đáp án chưa được xác minh trực tiếp.","en":"The stabilizer is the more powerful trim device and suits large trim changes. However, the checked passage does not quantify or directly compare control difficulty from trim-tab and stabilizer runaways; that part of the keyed answer remains unverified.","noteVi":"Vế so sánh runaway chưa có đoạn nguồn trực tiếp.","noteEn":"The runaway comparison lacks direct source support."},"topic":"Stability and Control","uid":"POF-208"},{"id":209,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the undisturbed airflow is higher than in the throat. 2) The total pressure in the undisturbed airflow is higher than in the throat.","options":{"A":"1) is correct. 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-209"},{"id":210,"question":"The function of the stick pusher is:","options":{"A":"to activate and push the stick forward at or beyond a certain value of angle of attack.","B":"to activate and push the stick forward prior to stick shaker.","C":"to vibrate the controls.","D":"to pull the stick, to avoid a high speed stall."},"answer":"A","valid":true,"red":false,"review":{"lesson":"stallwarning","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-210"},{"id":211,"question":"Which statement. about an aeroplane leaving ground effect at constant angle of attack, is correct? 1) The lift coefficient CL decreases. 2) The induced drag coefficient CDi remains constant.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is correct."},"answer":"A","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-211"},{"id":212,"question":"Mach buffet occurs:","options":{"A":"directly after exceeding MCRIT·","B":"when the Mach number has increased to MCRIT.","C":"following boundary layer separation due to shock wave formation.","D":"when the stall angle of attack is exceeded."},"answer":"C","valid":true,"red":false,"review":{"lesson":"wave","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-212"},{"id":213,"question":"A jet aeroplane equipped with inboard and outboard ailerons as well as spoilers is cruising at its normal cruise Mach number. In this case:","options":{"A":"outboard ailerons are locked out.","B":"the inboard and outboard ailerons are active.","C":"only the spoilers will be active, not the ailerons.","D":"spoilers are locked out."},"answer":"A","valid":true,"red":false,"review":{"lesson":"aileronlock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-213"},{"id":214,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The static pressure in the undisturbed airflow is the same as in the throat. 2) The speed in the undisturbed airflow is lower than in the throat.","options":{"A":"1) is correct. 2) Is incorrect.","B":"1) is incorrect. 2) is correct.","C":"1) is incorrect. 2) is incorrect","D":"1) is correct. 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-214"},{"id":215,"question":"Which statement about a propeller is correct? 1) Asymmetric blade effect increases when engine power is increased. 2) Asymmetric blade effect reduces when the angle between the propeller axis and the airflow through the propeller disc increases.","options":{"A":"1) is incorrect, 2) is correct","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect","D":"1) is correct, 2) is correct"},"answer":"C","valid":true,"red":false,"review":{"lesson":"pfactor","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-215"},{"id":216,"question":"Given: theta = pitch angle; gamma = flight path angle; alpha = angle of attack; no wind, bank or sideslip. The relationship between these three parameters is:","options":{"A":"theta = gamma - alpha.","B":"gamma = alpha - theta.","C":"theta = gamma + alpha.","D":"alpha = gamma - theta."},"answer":"C","valid":true,"red":false,"review":{"lesson":"angles","status":"limited","vi":"Quan hệ θ = γ + α của đáp án dùng α tính theo trục tham chiếu của máy bay, hoặc giả sử incidence bằng 0. Đề không nói rõ incidence. Nếu α được đo theo chord của cánh và cánh có incidence i, quan hệ phải có hiệu chỉnh i; không nên dùng công thức này mà quên mốc đo.","en":"The keyed relationship θ = γ + α treats α as aircraft-reference angle of attack, or assumes zero incidence. The stem does not specify incidence. If α is wing-chord angle of attack and the wing has incidence i, that incidence must be accounted for; the reference lines matter.","noteVi":"Thiếu quy ước trục dùng để đo α; giữ đáp án C theo đề.","noteEn":"The reference line for α is not explicit; the original key C is retained."},"topic":"Overview and Definitions","uid":"POF-216"},{"id":217,"question":"In straight flight, as speed is reduced, whilst trimming to keep the stick force zero:","options":{"A":"the elevator is deflected further downwards and the trim tab further upwards.","B":"the elevator is deflected further upwards and the trim tab further downwards.","C":"both elevator and trim tab are deflected further upwards.","D":"the elevator and trim tab do not move."},"answer":"B","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-217"},{"id":218,"question":"In a steady, horizontal, co-ordinated turn:","options":{"A":"thrust equals drag, because there is equilibrium of forces along the direction of flight.","B":"thrust is greater than drag, because the centrifugal force reduces the aeroplane speed.","C":"thrust is greater than drag, because the excess thrust also supplies the centripetal force.","D":"thrust equals drag, because drag is the same as in straight and level flight."},"answer":"A","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"derived","vi":"Máy bay có gia tốc hướng tâm nhưng không tăng/giảm tốc dọc flight path. Bởi vậy tổng lực tiếp tuyến bằng 0, T=D. Không được nhầm cân bằng dọc quỹ đạo với không có gia tốc ở mọi hướng.","en":"The aircraft has centripetal acceleration but no tangential acceleration along its flight path. Therefore tangential forces balance and T=D. Tangential equilibrium does not mean zero acceleration in every direction.","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-218"},{"id":219,"question":"Which three aerodynamic means decrease manoeuvring stick forces?","options":{"A":"Servo tab - horn balance - spring tab.","B":"Servo tab - trim tab - balance tab.","C":"Spring tab · trim tab - mass balancing weight","D":"Spring tab - horn balance – bobweight"},"answer":"A","valid":true,"red":true,"review":{"lesson":"tabs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-219"},{"id":220,"question":"Regarding deep stall characteristics, identify whether the following statements are correct or incorrect: 1) The combination of a wing with sweepback and a T-tail make an aeroplane prone to deep stall. 2) A stick pusher system can be fined to an aeroplane that exhibits abnormal stall characteristics.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"A","valid":true,"red":false,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-220"},{"id":221,"question":"Wing flutter can be prevented by:","options":{"A":"ensuring that the wing CG is ahead of its torsional axis.","B":"mounting the engines on the fuselage.","C":"increasing wing elasticity.","D":"increasing the aspect ratio of the wing."},"answer":"A","valid":true,"red":true,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-221"},{"id":222,"question":"The lift coefficient (CL) of an aeroplane in steady horizontal flight is 0.4. Increase of angle of attack of 1° will increase CL by 0.09. A vertical up-gust instantly changes the angle of attack by 5°. The load factor will be:","options":{"A":"3.18","B":"1.09","C":"2.0","D":"2.13"},"answer":"D","valid":true,"red":false,"review":{"lesson":"verticalgustcalc","status":"calculation","vi":"ΔCL = 0.09 × 5 = 0.45; CL₂ = 0.4 + 0.45 = 0.85. Chia cho CL₁ được n = 2.12; không cộng thêm 1 lần nữa.","en":"ΔCL = 0.09 × 5 = 0.45; CL₂ = 0.4 + 0.45 = 0.85. Dividing by the initial CL gives n = 2.12; do not add one again.","noteVi":"","noteEn":"","formula":"n = (0.4 + 0.09 × 5)/0.4 = 2.12"},"topic":"Limitations","uid":"POF-222"},{"id":223,"question":"Which statement is correct? 1) A propeller with a small blade angle is referred to as being in fine pitch. 2) A propeller with significant blade twist is referred to as being in coarse pitch.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"A","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-223"},{"id":224,"question":"Geometric washout (wing twist) means that:","options":{"A":"there is an airflow along the wing chat keeps It clean (prevents ice accumulation in flight).","B":"the tip of the wing has higher angle of attack than the root.","C":"the tip of the wing has lower angle of attack than the root.","D":"the horizontal tail has lower angle of attack than the wing."},"answer":"C","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-224"},{"id":225,"question":"The interference drag is the result of:","options":{"A":"separation of the induced vortex.","B":"the addition of induced and parasite drag.","C":"interaction between aeroplane parts (e.g. wing/fuselage).","D":"downwash behind the wing."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dragtypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-225"},{"id":226,"question":"The lift coefficient CL versus angle of attack curve of a symmetrical aerofoil section Intersects the horizontal axis of the graph:","options":{"A":"at the origin.","B":"to the right of the origin.","C":"nowhere.","D":"to the left of the origin."},"answer":"A","valid":true,"red":false,"review":{"lesson":"symmetrical","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-226"},{"id":227,"question":"Regarding a symmetrical aerofoil section, which statement is correct? 1) The angle of attack has a negative value when the lift coefficient equals zero. 2) A nose up pitching moment exists when the lift coefficient equals zero.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is incorrect, 2) is incorrect.","C":"1) is correct, 2) is incorrect.","D":"1) is correct, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"symmetrical","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-227"},{"id":228,"question":"The dynamic pressure is equal to: (note: p = density, v = speed)","options":{"A":"p x V²","B":"½p x V","C":"½p x V²","D":"½V x density²"},"answer":"C","valid":true,"red":false,"review":{"lesson":"dynamic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-228"},{"id":229,"question":"The additional increase of drag at Mach numbers above the critical Mach number is due to:","options":{"A":"increased angle of attack.","B":"wave drag.","C":"increased interference drag.","D":"increased skin friction."},"answer":"B","valid":true,"red":false,"review":{"lesson":"wave","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-229"},{"id":230,"question":"In a convergent tube with an incompressible sub-sonic airflow. the following pressure changes will occur: Ps = static pressure; PDYN = dynamic pressure; PTOT = total pressure","options":{"A":"Ps decreases, PDYN increases. static temperature increases.","B":"Ps increases. PDYN decreases. PTOT remains constant.","C":"Ps decreases, PDYN increases. PTOT remains constant.","D":"Ps decreases, PTOT increases, static temperature decreases."},"answer":"C","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-230"},{"id":231,"question":"An accumulation of frost on an aircraft's wing will result in:","options":{"A":"a decrease in lift and drag.","B":"an increase in lift and a decrease in drag.","C":"a decrease in lift and an increase in drag.","D":"an increase in lift and drag."},"answer":"C","valid":true,"red":false,"review":{"lesson":"ice","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-231"},{"id":232,"question":"An aeroplane's sideslip angle is defined as the angle between the:","options":{"A":"lateral axis and the horizontal plane.","B":"speed vector and the horizontal plane.","C":"speed vector and normal axis.","D":"speed vector and the plane of symmetry."},"answer":"D","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-232"},{"id":233,"question":"Regarding a positively cambered aerofoil section, which statement is correct? 1) The angle of attack has a negative value when the lift coefficient equals zero. 2) A nose down pitching moment exists when the lift coefficient equals zero.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-233"},{"id":234,"question":"The unit of measurement of pressure is:","options":{"A":"kg/dm²","B":"lb/gal","C":"psi","D":"kg/m³"},"answer":"C","valid":true,"red":false,"review":{"lesson":"pressure","status":"reviewed","vi":"Câu này hỏi đơn vị đo áp suất, không hỏi riêng đơn vị SI. Vì vậy psi phù hợp.","en":"This item asks for a unit of pressure, not specifically its SI unit, so psi is an appropriate answer.","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-234"},{"id":235,"question":"Which statement about an aeroplane entering ground effect is correct? 1) The downwash angle remains constant. 2) The induced angle of attack increases.","options":{"A":"1) is incorrect, 2) is correct","B":"1) is correct, 2) is incorrect","C":"1) is correct, 2) is correct","D":"1) is incorrect, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-235"},{"id":236,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The static pressure in the throat is the same as in the undisturbed airflow. 2) The speed of the airflow in the throat is higher than in the undisturbed airflow.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-236"},{"id":237,"question":"Given a constant load factor, which of these statements about the variation of induced drag with changes of speed and mass are correct or incorrect? 1) When speed decreases, induced drag decreases. 2) When mass decreases. induced drag decreases.","options":{"A":"1) is correct, 2) is incorrect","B":"1) is incorrect, 2) is correct","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is correct"},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-237"},{"id":238,"question":"When flaps are extended whilst maintaining straight and level flight at constant lAS, the lift coefficient will:","options":{"A":"eventually remain the same.","B":"eventually increase.","C":"eventually decrease.","D":"first increase and then decrease."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaplift","status":"conflict","vi":"Đề khóa B “eventually increase”, nhưng sách trang 226 dùng chính điều kiện bay bằng, IAS không đổi và yêu cầu CL giữ nguyên khi α được giảm. Vì vậy không thể gọi B là kết luận đã được sách xác nhận.","en":"The bank keys B, “eventually increase”, but page 226 uses the same constant-IAS, level-flight condition and requires CL to stay constant while α is reduced. B therefore cannot be presented as a textbook-verified conclusion.","noteVi":"Mâu thuẫn giữa đáp án gốc B và mô tả trang 226; giữ key gốc, không dùng câu này trong thi thử mặc định.","noteEn":"Original key B conflicts with page 226; the key is preserved and the item is excluded from the default mock-exam pool.","bookAnswer":"CL không đổi trong mô hình của sách / CL remains constant in the textbook model."},"topic":"High Lift Devices","uid":"POF-238"},{"id":239,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the slope of the lift versus angle of attack curve increases, the gust load factor increases. 2) When the wing loading increases, the gust load factor decreases.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is correct."},"answer":"D","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-239"},{"id":240,"question":"On an aircraft with a differential aileron control system, when the control wheel is turned to the right:","options":{"A":"the right aileron moves up, and the left aileron moves down through a greater angle.","B":"the right aileron moves down and the left aileron moves up through a greater angle.","C":"the left aileron moves down and the right aileron moves up through a greater angle.","D":"the left aileron moves up and the right aileron moves down through a greater angle."},"answer":"C","valid":true,"red":false,"review":{"lesson":"adverse","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-240"},{"id":241,"question":"Which statement is correct? 1) A propeller with a small blade angle is referred to as being in coarse pitch. 2) A propeller with a large blade angle is referred to as being in fine pitch.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect.","D":"1) is correct, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-241"},{"id":242,"question":"The primary purpose of equipping the power assisted flying control systems with trim capability is to:","options":{"A":"allow the pilot to maintain control in case of hydraulic failure.","B":"relieve stresses on the trim tab.","C":"relieve stresses on the hydraulic actuators.","D":"bring the control forces to zero in steady flight."},"answer":"D","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-242"},{"id":243,"question":"An aeroplane maintains straight and level flight while the speed is doubled. The change in lift coefficient will be:","options":{"A":"x 0.25","B":"x 2.0","C":"x 0.5","D":"x 4.0"},"answer":"A","valid":true,"red":false,"review":{"lesson":"constantliftcalc","status":"calculation","vi":"V tăng gấp 2 nhưng L vẫn bằng W, nên CL mới chỉ bằng 1/4 giá trị ban đầu.","en":"Doubling V while maintaining L = W requires CL to become one quarter of its original value.","noteVi":"","noteEn":"","formula":"CL₂/CL₁ = (1/2)² = 0.25"},"topic":"Lift","uid":"POF-243"},{"id":244,"question":"In straight and level flight at a speed of 1.8 Vs, the lift coefficient, expressed as a percentage of its maximum (CLMAX), would be:","options":{"A":"324%","B":"31%","C":"180%","D":"56%"},"answer":"B","valid":true,"red":false,"review":{"lesson":"constantliftcalc","status":"calculation","vi":"Tại 1,8Vs: 1/1,8² = 0,3086 ≈31% CLmax.","en":"At 1.8Vs, 1/1.8² = 0.3086, approximately 31% of CLmax.","noteVi":"","noteEn":"","formula":"CL/CLmax = 1 / 1.8² = 0.3086 ≈ 31%"},"topic":"Lift","uid":"POF-244"},{"id":245,"question":"If the straight and level stall speed is 100 kts, what will be the stall speed in a 1.3 g turn?","options":{"A":"114 kts","B":"130 kts","C":"81 kts","D":"100 kts"},"answer":"A","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Vs mới = 100 × √1.3 = 114.0 kt; chọn giá trị làm tròn gần nhất trong đề.","en":"New Vs = 100 × √1.3 = 114.0 kt; use the nearest rounded option.","noteVi":"","noteEn":"","formula":"Vs₂ = Vs₁√n = 114.0 kt"},"topic":"Stalling","uid":"POF-245"},{"id":246,"question":"Given an initial condition in straight and level flight with a speed of 1.4 Vs. The maximum bank angle attainable without stalling in a steady co-ordinated turn, whilst maintaining speed and altitude, is approximately:","options":{"A":"32°","B":"44°","C":"60°","D":"30°"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vs","status":"calculation","vi":"Ở V = 1,4Vs, g tối đa trước stall là n = 1,4² = 1,96. cosφ = 1/1,96 nên φ ≈ 59,3°, gần đáp án 60°.","en":"At V = 1.4Vs the maximum load factor before stall is n = 1.4² = 1.96. Thus cosφ = 1/1.96 and φ ≈ 59.3°, closest to 60°.","noteVi":"","noteEn":"","formula":"nmax = 1.96; φ = acos(1/1.96) ≈ 59.3°"},"topic":"Stalling","uid":"POF-246"},{"id":247,"question":"Stalling speed in a 15° bank level turn is 60 kts. The stalling speed in a 45° bank level turn will be:","options":{"A":"60 kts","B":"85 kts","C":"70 kts","D":"83 kts"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vs","status":"ca
