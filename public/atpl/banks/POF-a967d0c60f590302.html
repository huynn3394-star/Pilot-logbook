<script>/* ATPL state engine. The bank's original answer key is never silently changed. */
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;if(root)root.ATPLQuizEngine=api;})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const SUBJECT=globalThis.ATPL_SUBJECT||'POF';
const KEY='atpl_'+SUBJECT.toLowerCase()+'_v2_state';
const BACKUP_FORMAT='atpl-'+SUBJECT.toLowerCase()+'-backup';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const plain=o=>Boolean(o&&typeof o==='object'&&!Array.isArray(o));
const clone=o=>JSON.parse(JSON.stringify(o));
const unique=a=>[...new Set(a)];
const choices=['A','B','C','D','E','F','G','H'];
function defaultState(){return {version:2,progress:{},wrong:[],bookmarks:[],examHistory:[],study:null,exam:null,settings:{theme:'system',language:'both'},updatedAt:null};}
function valid(bank){return bank.filter(q=>q&&q.valid&&choices.includes(q.answer)&&plain(q.options));}
function shuffle(items,rng=Math.random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.min(i,Math.max(0,Math.floor(rng()*(i+1))));[out[i],out[j]]=[out[j],out[i]];}return out;}
function filter(bank,state,opts={}){return valid(bank).filter(q=>{
 if(opts.topic&&q.topic!==opts.topic)return false;
 if(opts.filter==='red'&&!q.red)return false;
 if(opts.filter==='wrong'&&!state.wrong.includes(q.id))return false;
 if(opts.filter==='bookmarks'&&!state.bookmarks.includes(q.id))return false;
 if(opts.filter==='unanswered'&&own(state.progress,q.id))return false;
 if(opts.filter==='review'&&!['limited','conflict'].includes(q.review?.status))return false;
 if(opts.search){const term=String(opts.search).trim().toLowerCase();if(/^\d+$/.test(term))return q.id===Number(term);return (q.question+' '+q.topic+' '+(q.uid||'')).toLowerCase().includes(term);}
 return true;
});}
function examPool(bank){return valid(bank).filter(q=>!q.figureBlocked&&!['limited','conflict'].includes(q.review?.status));}
function openStudy(state,ids,qid,mode='study'){const s=clone(state);const pool=unique(ids.filter(Number.isInteger));if(!pool.includes(qid))throw new Error('Câu hỏi không có trong phiên.');s.study={ids:pool,qid,mode,answers:{},resumeQid:qid,finished:false};s.updatedAt=Date.now();return s;}
function moveStudy(state,qid){const s=clone(state);if(!s.study||!s.study.ids.includes(qid))throw new Error('Câu hỏi không có trong phiên.');s.study.qid=qid;s.study.finished=false;s.study.resumeQid=qid;
 if(own(s.study.answers,qid)){const i=s.study.ids.indexOf(qid);s.study.resumeQid=s.study.ids[i+1]??null;s.study.finished=s.study.resumeQid===null;}
 s.updatedAt=Date.now();return s;}
function resumeStudy(state,bank){const st=state.study;if(!st||st.finished||st.resumeQid==null)return null;const allowed=new Set(valid(bank).map(q=>q.id));const ids=st.ids.filter(id=>allowed.has(id));let id=st.resumeQid;
 if(!ids.includes(id)){const oldIndex=st.ids.indexOf(id);id=st.ids.slice(Math.max(0,oldIndex)).find(i=>allowed.has(i));}
 if(id==null)return null;return {qid:id,ids,mode:st.mode};}
function record(state,q,selected){const id=q.id;const old=state.progress[id]||{attempts:0,correct:0};const correct=selected===q.answer;
 state.progress[id]={attempts:old.attempts+1,correct:old.correct+(correct?1:0),lastSelected:selected??null,lastAt:Date.now()};
 state.wrong=state.wrong.filter(x=>x!==id);if(!correct)state.wrong.push(id);return state;}
function answerStudy(state,qid,selected,bank){if(!choices.includes(selected))throw new Error('Đáp án không hợp lệ.');if(!state.study||state.study.qid!==qid)throw new Error('Không phải câu đang mở.');if(own(state.study.answers,qid))return state;
 const q=valid(bank).find(q=>q.id===qid);if(!q)throw new Error('Không tìm thấy câu hỏi.');if(!own(q.options,selected))throw new Error('Lựa chọn không có trong câu này.');const s=clone(state);s.study.answers[qid]=selected;record(s,q,selected);const i=s.study.ids.indexOf(qid);s.study.resumeQid=s.study.ids[i+1]??null;s.study.finished=s.study.resumeQid===null;s.updatedAt=Date.now();return s;}
function toggleBookmark(state,id){const s=clone(state);s.bookmarks=s.bookmarks.includes(id)?s.bookmarks.filter(x=>x!==id):[...s.bookmarks,id];s.updatedAt=Date.now();return s;}
function startExam(state,ids){const s=clone(state);s.exam={ids:unique(ids),qid:ids[0]??null,answers:{},submitted:false,startedAt:Date.now()};return s;}
function answerExam(state,id,selected){if(!choices.includes(selected))throw new Error('Đáp án không hợp lệ.');if(!state.exam||state.exam.submitted||!state.exam.ids.includes(id))throw new Error('Không có bài thi đang làm.');const s=clone(state);s.exam.answers[id]=selected;s.updatedAt=Date.now();return s;}
function moveExam(state,id){const s=clone(state);if(!s.exam||!s.exam.ids.includes(id))throw new Error('Câu ngoài bài thi.');s.exam.qid=id;return s;}
function submitExam(state,bank){if(!state.exam||state.exam.submitted)return state;const s=clone(state);const byId=new Map(valid(bank).map(q=>[q.id,q]));const results=s.exam.ids.filter(id=>byId.has(id)).map(id=>{const q=byId.get(id),selected=s.exam.answers[id]??null;record(s,q,selected);return {id,selected,answer:q.answer,correct:selected===q.answer};});
 const correct=results.filter(r=>r.correct).length;const report={at:Date.now(),size:results.length,correct,percent:results.length?Math.round(correct/results.length*100):0,results};s.examHistory.push(report);s.exam.submitted=true;s.exam.report=report;s.updatedAt=Date.now();return s;}
function exportBackup(state){return JSON.stringify({format:BACKUP_FORMAT,subject:SUBJECT,version:2,exportedAt:new Date().toISOString(),state},null,2);}
function checkState(input,bank,strict=true){if(!plain(input)||input.version!==2||!plain(input.progress)||!Array.isArray(input.wrong)||!Array.isArray(input.bookmarks)||!Array.isArray(input.examHistory)||!plain(input.settings))throw new Error('Cấu trúc tiến độ không hợp lệ.');const s=defaultState(),allowed=new Set(valid(bank).map(q=>q.id));
 function idArray(a){if(!Array.isArray(a)||a.some(i=>!Number.isInteger(i)||!allowed.has(i)))throw new Error('Danh sách số câu không hợp lệ.');return unique(a);}
 for(const [key,value]of Object.entries(input.progress)){const id=Number(key);if(!allowed.has(id)||!plain(value)||!Number.isInteger(value.attempts)||value.attempts<1||!Number.isInteger(value.correct)||value.correct<0||value.correct>value.attempts||!(value.lastSelected==null||choices.includes(value.lastSelected)))throw new Error('Lượt làm hoặc đáp án lưu không hợp lệ.');s.progress[id]={attempts:value.attempts,correct:value.correct,lastSelected:value.lastSelected??null,lastAt:value.lastAt??null};}
 s.wrong=idArray(input.wrong);s.bookmarks=idArray(input.bookmarks);
 if(!['light','dark','system'].includes(input.settings.theme)||!['vi','en','both'].includes(input.settings.language))throw new Error('Tùy chọn hiển thị không hợp lệ.');s.settings={theme:input.settings.theme,language:input.settings.language};
 function checkedAnswers(a,ids){if(!plain(a))throw new Error('Đáp án phiên học bị lỗi.');const out={};for(const[k,v]of Object.entries(a)){if(!ids.includes(Number(k))||!choices.includes(v))throw new Error('Đáp án phiên học không hợp lệ.');out[Number(k)]=v;}return out;}
 if(input.study!=null){const t=input.study;if(!plain(t))throw new Error('Phiên học bị lỗi.');const ids=idArray(t.ids);if(!ids.length||!ids.includes(t.qid)||!(t.resumeQid===null||ids.includes(t.resumeQid))||typeof t.finished!=='boolean')throw new Error('Vị trí tiếp tục không hợp lệ.');s.study={ids,qid:t.qid,mode:typeof t.mode==='string'?t.mode:'study',answers:checkedAnswers(t.answers,ids),resumeQid:t.resumeQid,finished:t.finished};}
 function checkedReport(t){if(!plain(t)||!Number.isInteger(t.size)||t.size<0||!Number.isInteger(t.correct)||t.correct<0||t.correct>t.size)throw new Error('Lịch sử bài thi không hợp lệ.');const out={at:t.at??null,size:t.size,correct:t.correct,percent:t.size?Math.round(t.correct/t.size*100):0};if(t.results!=null){if(!Array.isArray(t.results)||t.results.length!==t.size)throw new Error('Kết quả bài thi thiếu câu.');const seen=new Set();out.results=t.results.map(r=>{if(!plain(r)||!allowed.has(r.id)||seen.has(r.id)||!(r.selected==null||choices.includes(r.selected))||!choices.includes(r.answer))throw new Error('Kết quả câu thi không hợp lệ.');seen.add(r.id);return {id:r.id,selected:r.selected??null,answer:r.answer,correct:r.selected===r.answer};});out.correct=out.results.filter(r=>r.correct).length;out.percent=t.size?Math.round(out.correct/t.size*100):0;}return out;}
 s.examHistory=input.examHistory.map(checkedReport);
 if(input.exam!=null){const t=input.exam;if(!plain(t))throw new Error('Bài thi đang làm bị lỗi.');const ids=idArray(t.ids);if(!ids.length||!ids.includes(t.qid)||typeof t.submitted!=='boolean')throw new Error('Bài thi không hợp lệ.');s.exam={ids,qid:t.qid,answers:checkedAnswers(t.answers,ids),submitted:t.submitted,startedAt:t.startedAt??null};if(t.report)s.exam.report=checkedReport(t.report);}
 s.updatedAt=input.updatedAt??null;return s;}
function importBackup(text,bank){if(typeof text!=='string'||text.length>10000000)throw new Error('Tệp sao lưu không hợp lệ hoặc quá lớn.');let p;try{p=JSON.parse(text);}catch(_){throw new Error('Tệp không phải JSON hợp lệ.');}if(!plain(p)||p.format!==BACKUP_FORMAT||p.version!==2)throw new Error('Không đúng định dạng sao lưu ATPL phiên bản2.');return checkState(p.state,bank);}
function load(storage,bank){if(!storage)return {state:defaultState(),warning:'Không thể lưu trên trình duyệt này. Hãy xuất tiến độ trước khi đóng.'};try{const next=storage.getItem(KEY);if(next!=null)return {state:checkState(JSON.parse(next),bank),warning:''};const state=defaultState();
 if(SUBJECT!=='POF')return {state,warning:''};
 const p=storage.getItem('atpl_pof_v1_progress'),w=storage.getItem('atpl_pof_v1_wrong'),b=storage.getItem('atpl_pof_v1_bookmarks'),h=storage.getItem('atpl_pof_v1_exam_history'),theme=storage.getItem('atpl_pof_v1_theme');
 if(p)state.progress=JSON.parse(p);if(w)state.wrong=JSON.parse(w);if(b)state.bookmarks=JSON.parse(b);if(h)state.examHistory=JSON.parse(h);if(['light','dark'].includes(theme))state.settings.theme=theme;
 const clean=checkState(state,bank);const ordered=valid(bank).map(q=>q.id);const entries=Object.entries(clean.progress);if(entries.length){const stamp=x=>typeof x==='number'?x:(Date.parse(x)||0);entries.sort((a,b)=>stamp(b[1].lastAt)-stamp(a[1].lastAt));const id=Number(entries[0][0]);const i=ordered.indexOf(id);clean.study={ids:ordered,qid:id,mode:'study',answers:{},resumeQid:ordered[i+1]??null,finished:i===ordered.length-1};}
 return {state:clean,warning:p?'Đã đọc tiến độ bản cũ. Vị trí tiếp tục được suy ra từ lượt trả lời gần nhất.':''};
 }catch(_){return {state:defaultState(),warning:'Dữ liệu lưu bị lỗi hoặc không đọc được. Bản gốc vẫn được giữ; hãy xuất dữ liệu gốc trước khi ghi đè.',readError:true};}}
function save(storage,state){if(!storage)return false;try{storage.setItem(KEY,JSON.stringify(state));return true;}catch(_){return false;}}
return {KEY,defaultState,valid,shuffle,filter,examPool,openStudy,moveStudy,resumeStudy,answerStudy,toggleBookmark,startExam,answerExam,moveExam,submitExam,exportBackup,importBackup,checkState,load,save};
});

<script id="bank-data" type="application/json">{"POF":{"info":{"version":"2.1 · 19.09.2026","questionCount":487,"redCount":24,"conflictCount":7,"limitedCount":21,"counts":{"reviewed":356,"calculation":62,"derived":41,"limited":21,"conflict":7},"missing":[275,276,277,278,279,280,281,282,283,284,285,286,477],"source":"CAE Oxford Principles of Flight (2014)","bankSourceSHA256":"673a72aade1a862b429ea92ffcb92d0b40667e77edeae0eb8a261c5d3a582f04","subjectId":"POF","name":"Principles of Flight","nameVi":"Nguyên lý bay","hasExplanations":true},"questions":[{"id":1,"question":"Regarding a positively cambered aerofoil section, which statement is correct? 1) The angle of attack has a negative value when the lift coefficient equals zero. 2) A nose up pitching moment exists when the lift coefficient equals zero.","options":{"A":"1) incorrect, 2) incorrect.","B":"1) correct, 2) correct.","C":"1) incorrect, 2) correct.","D":"1) correct, 2) incorrect."},"answer":"D","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-001"},{"id":2,"question":"When a turn is initiated, adverse yaw is:","options":{"A":"the tendency of an aeroplane to yaw in the same direction of turn due to the different wing speeds.","B":"a momentary yawing motion opposite to the turn due to an incorrect differential aileron movement.","C":"the tendency of an aeroplane to yaw in the opposite direction of turn mainly due to the difference in induced drag on each wing.","D":"the tendency of an aeroplane to yaw in the opposite direction of turn mainly due to the difference in aileron form drag."},"answer":"C","valid":true,"red":false,"review":{"lesson":"adverse","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-002"},{"id":3,"question":"In which phase of the take-off is the aerodynamic effect of ice located on the wing leading edge most critical?","options":{"A":"The take-off run.","B":"The last pan of the rotation.","C":"All phases are equally important.","D":"During climb with all engines operating."},"answer":"B","valid":true,"red":false,"review":{"lesson":"ice","status":"derived","vi":"Cuối rotation là lúc máy bay đang đòi hỏi CL lớn ở tốc độ còn thấp; CLmax bị giảm có thể khiến góc tới hạn bị chạm trước khi đạt lift mong muốn. Đây là cách áp dụng nguyên lý của sách để hiểu đáp án B, không phải câu trích nguyên văn xác định duy nhất pha nguy hiểm.","en":"Near the end of rotation, high CL is demanded while speed is still low; a reduced CLmax can prevent the required lift being reached without stalling. This applies the textbook principle to explain key B; it is not a verbatim textbook ranking of take-off phases.","noteVi":"Sách hỗ trợ cơ chế giảm CLmax; lựa chọn pha “last part of rotation” là áp dụng vào tình huống đề.","noteEn":"The text supports the CLmax mechanism; the named take-off phase is a scenario-specific application."},"topic":"Lift","uid":"POF-003"},{"id":4,"question":"The twisting of a propeller blade from root to tip has been made to:","options":{"A":"ensure its optimum thrust is always achieved at take-off.","B":"prevent excessive stress at the blade tip at high RPM.","C":"provide a constant angle of attack from root to tip.","D":"provide its greatest thrust toward the blade root."},"answer":"C","valid":true,"red":false,"review":{"lesson":"propgeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-004"},{"id":5,"question":"In straight and level flight at a speed of 1.3 Vs, the lift coefficient, expressed as a percentage of its maximum (CLMAX), would be:","options":{"A":"169%","B":"130%","C":"59%","D":"77%"},"answer":"C","valid":true,"red":false,"review":{"lesson":"constantliftcalc","status":"calculation","vi":"Tại 1,3Vs: CL/CLmax = 1/1,3² = 0,5917, tức khoảng 59%. Số 169% là mức tăng V², không phải hệ số lift cần thiết.","en":"At 1.3Vs, CL/CLmax = 1/1.3² = 0.5917, approximately 59%. The 169% figure describes the V² factor, not the required lift coefficient.","noteVi":"","noteEn":"","formula":"CL/CLmax = 1 / 1.3² = 0.5917 ≈ 59%"},"topic":"Lift","uid":"POF-005"},{"id":6,"question":"If the propeller pitch of a wind milling propeller is decreased during a glide at constant IAS the propeller drag in the direction of flight will:","options":{"A":"decrease and the rate of descent will decrease.","B":"increase and the rate of descent will decrease.","C":"increase and the rate of descent will increase.","D":"decrease and the rate of descent will increase."},"answer":"C","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-006"},{"id":7,"question":"Low speed pitch-up can be caused by a significant thrust:","options":{"A":"decrease with engines located on the rear fuselage.","B":"increase with podded engines located beneath a low-mounted wing.","C":"decrease with podded engines located beneath a low-mounted wing.","D":"increase with engines located on the rear fuselage."},"answer":"B","valid":true,"red":false,"review":{"lesson":"thrustpitch","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-007"},{"id":8,"question":"Which statement about propeller noise is correct? 1) Propeller noise increases when the blade tip speed increases. 2) For a given engine and propeller blade shape, a decrease in the number of propeller blades allows for a reduction in propeller noise.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is incorrect"},"answer":"C","valid":true,"red":false,"review":{"lesson":"solidity","status":"derived","vi":"Vế về số lá cần đọc là “allows”: thêm lá có thể cho phép giảm tip speed với cùng yêu cầu hấp thụ công suất, nhờ đó giảm noise. Không phải chỉ gắn thêm lá, giữ mọi tốc độ nguyên như cũ, là đảm bảo noise luôn giảm.","en":"Read the blade-count statement as “allows”: more blades can permit a lower tip speed for a given power-absorption requirement and thereby lower noise. Simply adding blades without changing the operating speeds does not guarantee lower noise.","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-008"},{"id":9,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the throat is the same as in the undisturbed airflow. 2) The total pressure in the throat is higher than in the undisturbed airflow.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-009"},{"id":10,"question":"During the retraction of the flaps at a constant angle of attack the aeroplane starts to: (Note: all other factors of importance being constant)","options":{"A":"bank.","B":"sink suddenly.","C":"climb.","D":"yaw."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-010"},{"id":11,"question":"The stall speed in a 60° banked turn increases by the following factor:","options":{"A":"1.41","B":"1.07","C":"1.30","D":"2.00"},"answer":"A","valid":true,"red":true,"review":{"lesson":"vs","status":"calculation","vi":"Bank 60°: n = 1/cos 60° = 2; hệ số tăng Vs = √2 ≈ 1,41. Không lấy 2 làm hệ số tăng tốc độ: 2 là hệ số tải.","en":"At 60° bank, n = 1/cos 60° = 2; the stall-speed multiplier is √2 ≈ 1.41. Two is the load factor, not the speed multiplier.","noteVi":"","noteEn":"","formula":"n = 2; Vs(turn)/Vs(1g) = √2 ≈ 1.41"},"topic":"Stalling","uid":"POF-011"},{"id":12,"question":"When an aeroplane enters ground effect:","options":{"A":"the effective angle of attack is decreased.","B":"the induced angle of attack is increased.","C":"the lift is increased and the drag is decreased.","D":"drag and lift are both reduced."},"answer":"C","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-012"},{"id":13,"question":"If the aspect ratio of a wing increases whilst all other relevant factors remain constant, the critical angle of attack will:","options":{"A":"remain constant only for a wing consisting of symmetrical aerofoils.","B":"increase.","C":"remain constant","D":"decrease."},"answer":"D","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"Sách trang 119 phân biệt góc tấn hình học của cả cánh với góc tấn hiệu dụng của tiết diện. AR lớn giảm induced angle, làm cùng CL đạt được ở góc tấn cánh nhỏ hơn; CLmax cũng đạt ở góc tấn cánh nhỏ hơn. Đây là góc stall của cánh hữu hạn đang so sánh, không phải tuyên bố rằng profile tiết diện đã thay đổi.","en":"Page 119 distinguishes whole-wing geometric angle from the section effective angle. Higher AR reduces the induced angle, so a given CL—and maximum lift—is reached at a smaller wing angle of attack. This comparison concerns finite-wing stall angle, not a change to the underlying section profile.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-013"},{"id":14,"question":"Asymmetric propeller blade effect is mainly induced by:","options":{"A":"large angles of yaw.","B":"large angles of climb.","C":"the inclination of the propeller axis to the relative airflow.","D":"high speed."},"answer":"C","valid":true,"red":false,"review":{"lesson":"pfactor","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-014"},{"id":15,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the wing area decreases, the gust load factor decreases. 2) When the EAS decreases, the gust load factor decreases.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"C","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-015"},{"id":16,"question":"Regarding the lift formula, if airspeed doubles, lift will:","options":{"A":"be 4 times greater.","B":"also double.","C":"not change.","D":"halve."},"answer":"A","valid":true,"red":false,"review":{"lesson":"lift","status":"calculation","vi":"Giữ ρ, S và CL không đổi: L₂/L₁ = (2V/V)² = 4. Câu không mô tả một thao tác giữ độ cao sau khi tăng tốc.","en":"With density, S and CL unchanged: L₂/L₁ = (2V/V)² = 4. This is not describing the elevator adjustment needed to maintain altitude after acceleration.","noteVi":"","noteEn":"","formula":"L₂/L₁ = (V₂/V₁)² = 2² = 4"},"topic":"Lift","uid":"POF-016"},{"id":17,"question":"In a steady, level, co-ordinated turn:","options":{"A":"the radius of turn depends only upon load factor.","B":"the rate of turn depends upon the TAS and angle of bank.","C":"the radius of turn depends upon the weight and load factor.","D":"the rate of turn depends upon the weight, TAS and angle of bank."},"answer":"B","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-017"},{"id":18,"question":"Which statement is correct? 1) Propeller gyroscopic effect occurs during flight at constant aeroplane attitude. 2) Propeller gyroscopic effect is most noticeable during low speed flight at low propeller RPM.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"gyro","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-018"},{"id":19,"question":"The point where a laminar boundary layer becomes turbulent is called:","options":{"A":"the separation point.","B":"the transition point.","C":"the critical point.","D":"the deflection point."},"answer":"B","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-019"},{"id":20,"question":"The sonic boom of an aeroplane flying at supersonic speed is created by:","options":{"A":"aerodynamic heating.","B":"shock waves around the aeroplane.","C":"the centre of pressure, which is moving aft on the aerofoil.","D":"the expansion flow behind the aeroplane."},"answer":"B","valid":true,"red":false,"review":{"lesson":"bow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-020"},{"id":21,"question":"\"Tuck under\" is caused by _ (i) movement of the centre of pressure (CP) of the wing and _ (ii) change of the downwash angle at the location of the stabilizer.","options":{"A":"i) forward; ii) increasing.","B":"i) forward; ii) decreasing.","C":"i) aft; ii) increasing.","D":"i) aft; ii) decreasing."},"answer":"D","valid":true,"red":false,"review":{"lesson":"tuck","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-021"},{"id":22,"question":"Which of these statements about weight or mass is correct?","options":{"A":"Mass = weight x volume.","B":"In the 51 system the unit of measurement for weight is the kilogram.","C":"The mass of an object is independent of the acceleration due to gravity.","D":"The weight of an object is independent of the acceleration due to gravity."},"answer":"C","valid":true,"red":false,"review":{"lesson":"mass","status":"reviewed","vi":"Đề hỏi mass, không phải weight. Vì thế chọn phát biểu mass độc lập với g.","en":"The question asks about mass, not weight. Therefore the statement that mass is independent of g is the applicable one.","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-022"},{"id":23,"question":"A laminar boundary layer is a layer, in which:","options":{"A":"the vortices are weak.","B":"the velocity is constant.","C":"the temperature varies constantly.","D":"no velocity components exist normal to the surface."},"answer":"D","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-023"},{"id":24,"question":"The centre of gravity moving aft will:","options":{"A":"increase the elevator up effectiveness.","B":"decrease the elevator up effectiveness.","C":"not affect the elevator up or down effectiveness.","D":"increase or decrease the elevator up effectiveness, depending on wing location."},"answer":"A","valid":true,"red":true,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-024"},{"id":25,"question":"An aeroplane in straight and level flight at 100 kts is subjected to a sudden disturbance in speed. Assuming the angle of attack remains constant initially and the load factor reaches a value of 1.44:","options":{"A":"The speed will have decreased by 10 kts.","B":"The speed will have increased by 10 kts.","C":"The speed will have increased by 20 kts.","D":"The speed will have decreased by 20 kts."},"answer":"C","valid":true,"red":false,"review":{"lesson":"speedgust","status":"calculation","vi":"V₂ = 100√1.44 = 120 kt. Đề hỏi phần tăng nên đáp số là 20 kt, không phải tốc độ cuối.","en":"V₂ = 100√1.44 = 120 kt. The question asks for the increase, so the answer is 20 kt rather than the final speed.","noteVi":"","noteEn":"","formula":"V₂ = 100√1.44 = 120 kt; ΔV = 20 kt"},"topic":"Lift","uid":"POF-025"},{"id":26,"question":"Assuming zero wind, an aeroplane in a straight steady glide will achieve the minimum glide angle at:","options":{"A":"the highest altitude.","B":"the lowest mass.","C":"(CL/CD)MAX","D":"(CL/CD)MIN"},"answer":"C","valid":true,"red":false,"review":{"lesson":"glide","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-026"},{"id":27,"question":"Which of the following statements is correct? 1) When the critical engine fails during take-off the speed VMCL can be limiting. 2) The speed VMCL is always limited by maximum rudder deflection.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is correct.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"A","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-027"},{"id":28,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the throat is lower than in the undisturbed airflow. 2) The total pressure in the throat is lower than in the undisturbed airflow.","options":{"A":"1) is correct, 2) is correct","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect","D":"1) is incorrect, 2) is correct"},"answer":"B","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-028"},{"id":29,"question":"What is the approximate value of the lift of an aeroplane at a gross weight of 50 000 N, in a horizontal coordinated 45° banked turn?","options":{"A":"50 000 N","B":"60 000 N","C":"70 000 N","D":"80 000 N"},"answer":"C","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"calculation","vi":"L = W/cos 45° =50 000/0,7071 =70 711 N. Phương án gần đúng là 70 000 N, không phải 50 000 N vì lift đã nghiêng.","en":"L = W/cos 45° = 50,000/0.7071 = 70,711 N. The approximate option is 70,000 N, not 50,000 N, because the lift vector is tilted.","noteVi":"","noteEn":"","formula":"L = 50,000 / cos45° ≈ 70,711 N ≈ 70,000 N"},"topic":"Flight Mechanics","uid":"POF-029"},{"id":30,"question":"Which statement about propeller icing is correct? 1) Propeller icing increases blade element drag and reduces blade element lift. 2) Propeller icing reduces propeller efficiency.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"A","valid":true,"red":false,"review":{"lesson":"ice","status":"derived","vi":"Lá propeller cũng là aerofoil: ice làm blade-section lift giảm và drag tăng, nên hiệu suất chuyển shaft power thành thrust giảm. Đây là áp dụng cơ chế icing của aerofoil vào propeller.","en":"A propeller blade is also an aerofoil: icing reduces section lift and raises section drag, degrading conversion of shaft power into thrust. This applies the documented aerofoil-icing mechanism to the propeller.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-030"},{"id":31,"question":"What happens if CG moves behind the aft limit?","options":{"A":"Stick forces become excessive.","B":"Lateral stability will be decreased.","C":"Insufficient manoeuvre stability.","D":"Longitudinal stability increases."},"answer":"C","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-031"},{"id":32,"question":"One method to compensate adverse yaw is a:","options":{"A":"differential aileron.","B":"balance tab.","C":"anti balance tab.","D":"balance panel."},"answer":"A","valid":true,"red":true,"review":{"lesson":"adverse","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-032"},{"id":33,"question":"If the maximum pull force acceptable is 50 lbs and the design limit load factor of the aircraft is 6g. what stick force/g must be achieved to permit the aircraft to be manoeuvred to its design load factor limit?","options":{"A":"10 lbs/g.","B":"8.33 lbs/g.","C":"6 lbs/g.","D":"5 lbs/g."},"answer":"A","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"calculation","vi":"Từ 1 g lên 6 g là tăng 5 g. Gradient=50 lb/5 g=10 lb/g.","en":"From 1 g to 6 g is a 5 g increment. Gradient=50 lb/5 g=10 lb/g.","noteVi":"","noteEn":"","formula":"K = 50/(6−1) = 10 lb/g"},"topic":"Stability and Control","uid":"POF-033"},{"id":34,"question":"Which of these statements concerning propellers is correct?","options":{"A":"The blade angle of a feathered propeller is approximately 0 degrees.","B":"The blade angle of a feathered propeller is approximately 90 degrees.","C":"A windmilling propeller causes less drag than a feathered propeller.","D":"An unfeathered propeller causes less drag than a feathered propeller."},"answer":"B","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-034"},{"id":35,"question":"Induced drag is the result of:","options":{"A":"propeller slipstream over the wing.","B":"boundary layer separation on the aft portion of the wing.","C":"aerodynamic interaction between aeroplane parts.","D":"downwash generated by tip vortices."},"answer":"D","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-035"},{"id":36,"question":"Which statement about propeller noise is correct? 1) Propeller noise decreases when the blade tip speed increases. 2) For a given engine and propeller blade shape, an increase in the number of propeller blades allows for a reduction in propeller noise.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is correct.","D":"1) is correct, 2) is incorrect."},"answer":"A","valid":true,"red":false,"review":{"lesson":"solidity","status":"derived","vi":"Vế về số lá cần đọc là “allows”: thêm lá có thể cho phép giảm tip speed với cùng yêu cầu hấp thụ công suất, nhờ đó giảm noise. Không phải chỉ gắn thêm lá, giữ mọi tốc độ nguyên như cũ, là đảm bảo noise luôn giảm.","en":"Read the blade-count statement as “allows”: more blades can permit a lower tip speed for a given power-absorption requirement and thereby lower noise. Simply adding blades without changing the operating speeds does not guarantee lower noise.","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-036"},{"id":37,"question":"With increasing altitude and constant IAS the static lateral stability (i) and the dynamic lateral/directional stability (ii) of an aeroplane with swept back wing will:","options":{"A":"i) increase; ii) increase.","B":"i) increase; ii) decrease.","C":"i) decrease; ii) decrease.","D":"i) decrease; ii) increase."},"answer":"B","valid":true,"red":false,"review":{"lesson":"damping","status":"limited","vi":"Phần giảm dynamic stability được giải thích bởi damping giảm. Nhưng kết luận static lateral stability luôn tăng khi lên cao ở cùng IAS cần thêm thông tin Mach/compressibility và loại cánh; các trang được đối chiếu chưa chứng minh mệnh đề này cho mọi swept wing.","en":"Reduced dynamic stability is explained by reduced damping. The claim that static lateral stability necessarily increases with altitude at constant IAS additionally depends on Mach/compressibility and the wing design; the checked pages do not establish that statement universally.","noteVi":"Đã có căn cứ cho damping giảm; chưa đủ căn cứ trực tiếp cho vế static lateral tăng.","noteEn":"Reduced damping is supported; the claimed increase in static lateral stability is not directly established."},"topic":"Stability and Control","uid":"POF-037"},{"id":38,"question":"Which of these statements about wing sweepback are correct or incorrect? 1) Decreasing wing sweepback decreases MCRIT. 2) Decreasing wing sweepback increases the drag divergence Mach number.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"B","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-038"},{"id":39,"question":"The total drag of a three dimensional wing consists of:","options":{"A":"pressure drag, friction drag and parasite drag.","B":"induced drag and interference drag.","C":"induced drag and parasite drag.","D":"parasite drag and pressure drag."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dragtypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-039"},{"id":40,"question":"In a steep turn to the left, when using flight spoilers for roll assistance and at the same time for reducing the airspeed:","options":{"A":"the right aileron will ascend, the left one will descend, the right spoiler will extend and the left one will retract.","B":"the right aileron will descend, the left one will ascend, the right spoiler will extend and the left one will retract.","C":"the right aileron will descend the left one will ascend the right spoiler will retract and the left one will extend.","D":"the right aileron will ascend, the left one will descend, the right spoiler will retract and the left one will extend."},"answer":"C","valid":true,"red":false,"review":{"lesson":"spoilers","status":"derived","vi":"Với lệnh roll trái, aileron trái lên và phải xuống. Phần roll của spoiler làm bên trái mở thêm, bên phải bớt mở. Khi đồng thời speedbrake, “retract” phải hiểu theo phần chênh tương đối; sách không bảo đảm spoiler phải luôn thu sát cánh trong mọi mức speedbrake.","en":"With a left-roll command, the left aileron goes up and right goes down. The roll-spoiler contribution increases deployment on the left and reduces it on the right. With speedbrake already applied, “retract” describes the differential contribution; it does not guarantee a fully flush right spoiler at every speedbrake setting.","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-040"},{"id":41,"question":"In a single engine aircraft with a clockwise rotating propeller (seen from behind), a left yaw is generated due to:","options":{"A":"the torque effect.","B":"the slipstream, striking the fin on the left side.","C":"higher lift on the right wing.","D":"higher helix angle."},"answer":"B","valid":true,"red":false,"review":{"lesson":"torque","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-041"},{"id":42,"question":"In supersonic flight, all disturbances produced by an aeroplane are:","options":{"A":"in front of the aeroplane.","B":"very weak and negligible.","C":"in between a conical area, depending on the Mach number.","D":"outside the conical area depending on the Mach number."},"answer":"C","valid":true,"red":false,"review":{"lesson":"bow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-042"},{"id":43,"question":"The resistance, or skin friction, due to the viscosity of the air as it passes along the surface of the wing is pan of the:","options":{"A":"induced drag.","B":"form drag.","C":"parasite drag.","D":"interference drag."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dragtypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-043"},{"id":44,"question":"Which of these statements about induced drag are correct or incorrect? 1) Induced drag decreases as angle of attack increases. 2) At constant load factor, induced drag increases with increasing aeroplane mass.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"A","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-044"},{"id":45,"question":"Assuming no flow separation, which of these statements about the flow around an aerofoil as the angle of attack increases are correct or incorrect? 1) The stagnation point moves up. 2) The point of lowest static pressure moves forward.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"pressureflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-045"},{"id":46,"question":"With a L/D ratio of 9:1 and flying at 12000 ft the glide range in still air would be approximately:","options":{"A":"15 NM","B":"20 NM","C":"14 NM","D":"18 NM"},"answer":"D","valid":true,"red":false,"review":{"lesson":"glide","status":"calculation","vi":"Horizontal range =12 000×9=108 000 ft. Dùng 1NM≈6080 ft: range≈17,8NM, làm tròn 18NM.","en":"Horizontal range =12,000×9=108,000 ft. With 1 NM≈6080 ft, the range is about 17.8 NM, rounded to 18 NM.","noteVi":"Quy đổi 1NM≈6080 ft theo cách làm tròn của giáo trình, trang 12.","noteEn":"Uses the textbook rounding 1 NM≈6080 ft on page 12.","formula":"Range = 12,000 ft × 9 / 6,080 ft/NM ≈ 17.8 NM"},"topic":"Flight Mechanics","uid":"POF-046"},{"id":47,"question":"Which statement, about the effects on drag of fitting external tip tanks to the wings of an aeroplane, is correct? 1) Parasite drag increases. 2) Induced drag decreases.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"tipdevices","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-047"},{"id":48,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the mass increases, the gust load factor decreases. 2) When the altitude decreases, the gust load factor decreases.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is incorrect, 2) is correct","C":"1) is correct, 2) is correct","D":"1) is correct, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-048"},{"id":49,"question":"Which of these statements concerning flight in turbulence is correct?","options":{"A":"When encountering turbulence during flight, the speed should be adjusted to the design speed for maximum gust intensity VB.","B":"Above VB the aeroplane can never be overstressed by a gust.","C":"The load factor in turbulence may fluctuate above and below 1 and can even become negative.","D":"In severe turbulence. speed should be reduced to approximately 1.2 VS."},"answer":"C","valid":true,"red":false,"review":{"lesson":"roughair","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-049"},{"id":50,"question":"Left rudder pedal input will cause a:","options":{"A":"left yaw about the vertical axis and left roll about the longitudinal axis.","B":"right yaw about the vertical axis and right roll about the longitudinal axis.","C":"left yaw about the vertical axis and right roll about the longitudinal axis.","D":"right yaw about the vertical axis and left roll about the longitudinal axis."},"answer":"A","valid":true,"red":true,"review":{"lesson":"yawroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-050"},{"id":51,"question":"Which of these statements are correct or incorrect regarding a sideslip, with the relative airflow coming from the right, on an aeroplane that exhibits both directional and lateral stability? 1) The initial tendency of the nose of the aeroplane is to move to the right. 2) The initial tendency of the left wing is to move down.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"A","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-051"},{"id":52,"question":"For a fixed-pitch propeller in flight at a given TAS, the blade angle of attack will:","options":{"A":"remain constant if RPM increases.","B":"increase if RPM decreases.","C":"decrease if RPM decreases.","D":"remain constant if RPM decreases."},"answer":"C","valid":true,"red":false,"review":{"lesson":"propaoa","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-052"},{"id":53,"question":"MMO can be exceeded in a climb at a constant IAS because:","options":{"A":"maintaining a constant IAS requires an increase in TAS.","B":"as altitude increases the local speed of sound increases.","C":"at reduced density the Mach meter will under read.","D":"position error increases."},"answer":"A","valid":true,"red":true,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-053"},{"id":54,"question":"What changes in aircraft control must be made to maintain altitude while the airspeed is being decreased?","options":{"A":"Increase the angle of attack to compensate for the decreasing lift","B":"Increase the angle of attack to produce more lift than drag.","C":"Decrease the angle of attack to compensate for the increasing drag.","D":"Maintain a constant angle of attack until the desired airspeed is reached, then increase the angle of attack."},"answer":"A","valid":true,"red":true,"review":{"lesson":"lift","status":"reviewed","vi":"Cần tăng góc tấn để bù dynamic pressure đang giảm; giữ nguyên góc tấn sẽ không giữ được lift cũ.","en":"Angle of attack must rise to compensate for falling dynamic pressure; retaining the old angle would not retain the old lift.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-054"},{"id":55,"question":"Which statement, about an aeroplane leaving ground effect at constant angle of attack, is correct? 1) The lift coefficient CL increases. 2) The induced drag coefficient CDi decreases.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-055"},{"id":56,"question":"Which aeroplane behaviour will be corrected by a yaw damper?","options":{"A":"Spiral dive.","B":"Tuck under.","C":"Dutch roll.","D":"Buffeting."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dutchroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-056"},{"id":57,"question":"Which of these statements about flutter are correct or incorrect? 1) Wing mounted engines extending ahead of the wing contribute to wing flutter suppression. 2) Excessive free play or backlash increases the speed at which control surface flutter occurs.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is incorrect, 2) is incorrect.","C":"1) is correct, 2) is incorrect.","D":"1) is correct, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-057"},{"id":58,"question":"Assuming zero wind, an aeroplane with a L/D ratio of 25:1 would cover a distance of approximately _ for every 1000 ft of height lost during a straight steady glide.","options":{"A":"4 NM","B":"2.5 NM","C":"25 NM","D":"40 NM"},"answer":"A","valid":true,"red":false,"review":{"lesson":"glide","status":"calculation","vi":"Cứ mất 1000 ft cao thì đi ngang 25 000 ft. Chia 6080 ft/NM được 4,11NM, gần 4NM.","en":"A 1000 ft height loss gives 25,000 ft horizontally. Dividing by 6080 ft/NM gives 4.11 NM, approximately 4 NM.","noteVi":"Quy đổi 1NM≈6080 ft theo cách làm tròn của giáo trình, trang 12.","noteEn":"Uses the textbook rounding 1 NM≈6080 ft on page 12.","formula":"Range = 1,000 × 25 / 6,080 ≈ 4.11 NM"},"topic":"Flight Mechanics","uid":"POF-058"},{"id":59,"question":"Which statement about an aeroplane entering ground effect is correct? 1) The downwash angle remains constant. 2) The induced angle of attack decreases.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-059"},{"id":60,"question":"Ignoring downwash effects on the tailplane, extension of Fowler-type flaps, will produce:","options":{"A":"a nose-down pitching moment.","B":"no pitching moment.","C":"a nose-up pitching moment.","D":"a force which reduces drag."},"answer":"A","valid":true,"red":true,"review":{"lesson":"flappitch","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-060"},{"id":61,"question":"When Fowler type trailing edge flaps are extended at a constant angle of attack, the following changes will occur:","options":{"A":"CL increases and CD remains constant.","B":"CL increases and the centre of pressure moves forward.","C":"CL and CD increase.","D":"CD decreases and the centre of pressure moves aft."},"answer":"C","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-061"},{"id":62,"question":"Given: Aeroplane mass: 50 000 kg;Lift/Drag ratio: 12;Thrust per engine: 21 000 N;Assumed g: 10 m/s²; For a straight, steady, wings level climb of a four-engine aeroplane, the all engines climb gradient will be:","options":{"A":"8.5%","B":"4.3%","C":"7.7%","D":"6.0%"},"answer":"A","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 4 động cơ tạo thrust: T=4×21,000=84,000 N. D≈500 000/12≈41,667 N; gradient≈(84,000−41,667)/500 000×100=8.47%.","en":"W=50,000×10=500,000 N. There are 4 thrust-producing engines: T=4×21,000=84,000 N. D≈500,000/12≈41,667 N, so gradient≈(84,000−41,667)/500,000×100=8.47%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 84,000 N; gradient ≈ 8.47%"},"topic":"Flight Mechanics","uid":"POF-062"},{"id":63,"question":"On an asymmetrical, single curve aerofoil, in subsonic airflow, at low angle of attack, when the angle of attack is increased, the centre of pressure will (assume a conventional transport aeroplane):","options":{"A":"move forward.","B":"move aft.","C":"remain matching the airfoil aerodynamic centre.","D":"remain unaffected."},"answer":"A","valid":true,"red":false,"review":{"lesson":"cp","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-063"},{"id":64,"question":"Which of these variables are required to calculate drag using the drag formula?","options":{"A":"Total pressure and wing area only.","B":"Frontal wing area, density and wing loading.","C":"Angle of attack, aspect ratio and dynamic pressure.","D":"Dynamic pressure, drag coefficient and wing area."},"answer":"D","valid":true,"red":false,"review":{"lesson":"parasitic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-064"},{"id":65,"question":"Assuming ISA conditions and no compressibility effects, if an aeroplane maintains straight and level flight at the same angle of attack at two different altitudes, the:","options":{"A":"IAS at both altitudes is the same.","B":"TAS at both altitudes is the same.","C":"IAS is higher at the higher altitude.","D":"TAS is lower at the higher altitude."},"answer":"A","valid":true,"red":false,"review":{"lesson":"ias","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-065"},{"id":66,"question":"To hold a given sideslip angle and airspeed. increased geometric dihedral would:","options":{"A":"reduce the stick force to zero.","B":"have no effect on stick force.","C":"decrease the stick force.","D":"increase the stick force."},"answer":"D","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-066"},{"id":67,"question":"Which of these statements about the strength of wing tip vortices are correct or incorrect? 1) Assuming no flow separation, the strength of wing tip vortices increases as the angle of attack increases. 2) The strength of wing tip vortices is not affected by aspect ratio.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"B","valid":true,"red":false,"review":{"lesson":"spanflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-067"},{"id":68,"question":"When the air is passing through a shock wave, the density will:","options":{"A":"decrease and beyond a certain Mach number start increasing again.","B":"decrease.","C":"stay constant.","D":"increase."},"answer":"D","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-068"},{"id":69,"question":"A jet transport aeroplane is in a straight climb at a constant IAS and constant weight. The operational limit that may be exceeded is:","options":{"A":"VNE","B":"VMO","C":"MMO","D":"VD"},"answer":"C","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-069"},{"id":70,"question":"Which of these statements about an oblique shock wave are correct or incorrect? 1) The static temperature behind an oblique shock wave is lower than in front of it. 2) The static pressure behind an oblique shock wave is lower than in front of it.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"D","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-070"},{"id":71,"question":"The bow wave will first appear at:","options":{"A":"a free stream Mach number just below M = 1.","B":"a free stream Mach number exactly equal to 1.","C":"a free stream Mach number just above M = 1.","D":"the critical Mach number."},"answer":"C","valid":true,"red":false,"review":{"lesson":"bow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-071"},{"id":72,"question":"In general jet transport aeroplanes with power assisted flight controls are fitted with an adjustable stabiliser instead of trim tabs on the elevator. This is because:","options":{"A":"the pilot does not feel the stick forces at all.","B":"an adjustable stabiliser is a more powerful means to generate the tail loads required for these kind of aeroplanes.","C":"mechanical adjustment of trim tabs creates too many problems.","D":"trim tab deflection increases VMO."},"answer":"B","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-072"},{"id":73,"question":"Which of these statements about flutter are correct or incorrect? 1) Aero-elastic coupling does not affect flutter characteristics. 2) Occurrence of flutter is independent of IAS.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is incorrect","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flutter","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-073"},{"id":74,"question":"Which of these statements about an oblique shock wave are correct or incorrect? 1) The Mach number behind an oblique shock wave is higher than in front of it. 2) The total pressure behind an oblique shock wave is lower than in front of it.","options":{"A":"1) is correct, 2) is correct","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect","D":"1) is incorrect, 2) is correct"},"answer":"D","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-074"},{"id":75,"question":"A forward CG shift","options":{"A":"decreases static longitudinal stability.","B":"has no influence on static longitudinal stability.","C":"increases longitudinal manoeuvrability.","D":"decreases longitudinal manoeuvrability."},"answer":"D","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-075"},{"id":76,"question":"In twin engine aeroplanes with propellers turning clockwise as seen from behind:","options":{"A":"the left engine produces a higher yaw moment if the right engine fails than vice versa.","B":"the left engine is the critical engine.","C":"the minimum control speed is determined by the failure of the right engine.","D":"the right engine is the critical engine."},"answer":"B","valid":true,"red":false,"review":{"lesson":"pfactor","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-076"},{"id":77,"question":"Given: Aeroplane mass: 50 000 kg; Lift/Drag ratio: 12; Thrust per engine: 28 000 N; Assumedg: 10 m/s²; For a straight, steady, wings level climb of a three-engine aeroplane, the one-engineinoperative climb; gradient will be:","options":{"A":"8.0%","B":"9.7%","C":"2.9%","D":"8.5%"},"answer":"C","valid":true,"red":false,"review":{"lesson":"climbcalc","status":"calculation","vi":"W=50 000×10=500 000 N. Có 2 động cơ tạo thrust: T=2×28,000=56,000 N. D≈500 000/12≈41,667 N; gradient≈(56,000−41,667)/500 000×100=2.87%.","en":"W=50,000×10=500,000 N. There are 2 thrust-producing engines: T=2×28,000=56,000 N. D≈500,000/12≈41,667 N, so gradient≈(56,000−41,667)/500,000×100=2.87%.","noteVi":"","noteEn":"","formula":"W = 500,000 N; D ≈ 41,667 N; T = 56,000 N; gradient ≈ 2.87%"},"topic":"Flight Mechanics","uid":"POF-077"},{"id":78,"question":"Directional stability is the stability around the:","options":{"A":"longitudinal axis.","B":"lateral axis.","C":"normal axis.","D":"pitch axis."},"answer":"C","valid":true,"red":false,"review":{"lesson":"axes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-078"},{"id":79,"question":"The critical angle of attack for the flaps down configuration, compared to flaps up is:","options":{"A":"greater.","B":"smaller.","C":"unchanged.","D":"smaller or greater, depending on CG position."},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-079"},{"id":80,"question":"When an aircraft is flying at speeds above Mach 1, pressure disturbances from the aircraft will affect only the flow:","options":{"A":"within the Mach cone.","B":"in front of the Mach cone.","C":"in front of the oblique shockwave.","D":"in front ofthe normal shockwave."},"answer":"A","valid":true,"red":false,"review":{"lesson":"bow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-080"},{"id":81,"question":"Which of these statements about induced drag are correct or incorrect? 1) Induced drag increases as angle of attack decreases. 2) At constant load factor, induced drag increases with decreasing aeroplane mass.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is correct.","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"A","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-081"},{"id":82,"question":"The contribution of the wing to the static longitudinal stability of an aeroplane:","options":{"A":"is always negative.","B":"depends on CG location relative to the wing aerodynamic centre.","C":"depends on the wing location relative to the fuselage.","D":"is positive if the wing has a positively cambered aerofoil section and the aerodynamic centre is ahead of the CG."},"answer":"B","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-082"},{"id":83,"question":"What is the most effective flap system?","options":{"A":"Single slotted flap","B":"Split flap.","C":"Plain flap.","D":"Fowler flap."},"answer":"D","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-083"},{"id":84,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the wing area increases, the gust load factor decreases. 2) When the EAS increases, the gust load factor decreases.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-084"},{"id":85,"question":"The relationship between induced drag and the aspect ratio is:","options":{"A":"a decrease in the aspect ratio increases the induced drag.","B":"there is no relationship.","C":"induced drag = 1.3 aspect ratio value.","D":"an increase in the aspect ratio increases the induced drag."},"answer":"A","valid":true,"red":true,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-085"},{"id":86,"question":"Given an aeroplane with a propeller turning anti-clockwise as seen from behind, the torque effect will tend to:","options":{"A":"pitch the aeroplane nose down.","B":"pitch the aeroplane nose up.","C":"roll the aeroplane to the right.","D":"roll the aeroplane to the left."},"answer":"C","valid":true,"red":false,"review":{"lesson":"torque","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-086"},{"id":87,"question":"Which statement, about an aeroplane entering ground effect at constant angle of attack, is correct? 1) The lift coefficient CL decreases. 2) The induced drag coefficient CDi increases.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-087"},{"id":88,"question":"Which of the following (i) aerofoils and (ii) angles of attack will produce the lowest MCRIT values?","options":{"A":"i) thick; ii) small","B":"i) thick; ii) large","C":"i) thin; ii) large","D":"i) thin; ii) small"},"answer":"B","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-088"},{"id":89,"question":"Comparing the differences between a horizontal trimmable stabiliser and an elevator trim tab, which of these statements are correct or incorrect? 1) An elevator trim tab is more suitable to cope with the large trim changes generated by the high lift devices on most jet transport aeroplanes. 2) A trim tab runaway causes less control difficulty.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is incorrect."},"answer":"A","valid":true,"red":false,"review":{"lesson":"trim","status":"limited","vi":"Stabilizer có khả năng trim mạnh hơn, phù hợp thay đổi trim lớn. Tuy nhiên nguồn đã đọc không định lượng hay so sánh riêng độ khó giữa trim-tab runaway và stabilizer runaway; vế đó của đáp án chưa được xác minh trực tiếp.","en":"The stabilizer is the more powerful trim device and suits large trim changes. However, the checked passage does not quantify or directly compare control difficulty from trim-tab and stabilizer runaways; that part of the keyed answer remains unverified.","noteVi":"Vế so sánh runaway chưa có đoạn nguồn trực tiếp.","noteEn":"The runaway comparison lacks direct source support."},"topic":"Stability and Control","uid":"POF-089"},{"id":90,"question":"Speed brakes are devices used on large transport category aircraft:","options":{"A":"for speed reduction during landing.","B":"and are an old version of ami-block system.","C":"to increase drag in order to maintain a steeper gradient of descent","D":"used at high speeds for turning when a yaw damper is not installed."},"answer":"C","valid":true,"red":false,"review":{"lesson":"spoilers","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-090"},{"id":91,"question":"Which statement about a propeller is correct? 1) Asymmetric blade effect increases when engine power is increased. 2) Asymmetric blade effect is independent of the angle between the propeller axis and the airflow through the propeller disc.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is incorrect","C":"1) is incorrect, 2) is correct.","D":"1) is correct, 2) is incorrect."},"answer":"D","valid":true,"red":false,"review":{"lesson":"pfactor","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-091"},{"id":92,"question":"If the propeller pitch of a windmilling propeller is increased during a glide at constant IAS the propeller drag in the direction of flight will:","options":{"A":"decrease and the rate of descent will decrease.","B":"increase and the rate of descent will decrease.","C":"decrease and the rate of descent will increase.","D":"increase and the rate of descent will increase."},"answer":"A","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-092"},{"id":93,"question":"One advantage of a movable-stabiliser system compared with an elevator trim system is that:","options":{"A":"the systems complexity is reduced.","B":"the struccure weighs less.","C":"it leads to greater stability in flight.","D":"it is a more powerful means of trimming."},"answer":"D","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-093"},{"id":94,"question":"Which statement about stick force per G is correct?","options":{"A":"The stick force per G can only be corrected by means of elearonic devices (stability augmentation) in case of an unacceptable value.","B":"The stick force per G increases, when centre of gravity is moved aft.","C":"The stick force per G must have both an upper and lower limit in order to assure acceptable control characteristics.","D":"If the slope of the force line becomes negative, generally speaking this is not a problem for control of an aeroplane."},"answer":"C","valid":true,"red":false,"review":{"lesson":"stickgcalc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-094"},{"id":95,"question":"Dihedral of the wing is:","options":{"A":"the angle between the 0.25 chord line of the wing and the vertical axis.","B":"the angle between the 0.25 chord line of the wing and the horizon.","C":"the angle between the 0.25 chord line of the wing and the lateral axis.","D":"the angle between the leading edge of the wing and the lateral axis."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"Đây là góc nâng cánh khi nhìn từ trước, so với phương ngang/trục ngang khi máy bay level. Đừng nhầm đường quarter-chord nhìn bằng dùng đo sweep với quarter-chord nhìn từ trước trong định nghĩa của đề.","en":"This is the upward wing angle in the front view relative to the horizontal/lateral axis with the aircraft level. Do not confuse the quarter-chord line in plan view for sweep with its front-view inclination here.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-095"},{"id":96,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the throat is higher than in the undisturbed airflow. 2) The total pressure in the throat is lower than in the undisturbed airflow.","options":{"A":"1) is incorrect, 2) is incorrect","B":"1) is correct, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-096"},{"id":97,"question":"If TAS is kept constant, to maintain straight and level flight with reduced air density the angle of attack of an aircraft's wings must be:","options":{"A":"increased.","B":"decreased.","C":"unaltered.","D":"increased to the critical angle of attack."},"answer":"A","valid":true,"red":false,"review":{"lesson":"lift","status":"reviewed","vi":"TAS được giữ nguyên, còn ρ giảm. Muốn L không giảm thì CL phải tăng, do đó tăng AoA trong vùng chưa stall.","en":"TAS is held constant while density decreases. CL must therefore rise to prevent a loss of lift, requiring a higher pre-stall angle of attack.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-097"},{"id":98,"question":"An aeroplane is performing a co-ordinated level turn with a constant bank angle. If the airspeed is increased the rate of turn will _ (i) and the load factor will _ (ii)","options":{"A":"i) decrease; ii) decrease.","B":"i) decrease; ii) not change.","C":"i) increase; ii) increase.","D":"i) increase; ii) not change."},"answer":"B","valid":true,"red":false,"review":{"lesson":"turngeometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-098"},{"id":99,"question":"How does positive camber of an aerofoil affect static longitudinal stability?","options":{"A":"Negatively, because the lift vector rotates forward at increasing angle of attack.","B":"Positively, because the centre of pressure shifts rearward at increasing angle of attack.","C":"No effect, because camber of the aerofoil produces a constant pitch down moment coefficient, independent of angle of attack.","D":"Positively, because the lift vector rotates backward at increasing angle of attack."},"answer":"C","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"Độ ổn định tĩnh dọc phụ thuộc độ dốc biến thiên mômen theo α. Mômen chúc mũi do camber có hệ số gần như cố định nên tự nó không tạo độ dốc phục hồi; nó thay đổi yêu cầu trim, không tạo thêm static stability theo cách nêu ở câu này.","en":"Static longitudinal stability depends on how moment changes with α. The nearly constant nose-down moment coefficient due to camber does not itself produce a restoring slope. It changes the trim requirement, not the static-stability contribution described here.","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-099"},{"id":100,"question":"A statically stable aeroplane:","options":{"A":"is never dynamically stable.","B":"is always dynamically stable.","C":"can show positive. neutral or negative dynamic longitudinal stability.","D":"will never show positive dynamic longitudinal stability. but always neutral dynamic longitudinal stability."},"answer":"C","valid":true,"red":false,"review":{"lesson":"staticdynamic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-100"},{"id":101,"question":"At MCRIT, a shockwave will appear first:","options":{"A":"at the leading edge.","B":"near to the point of maximum wing thickness.","C":"at the trailing edge.","D":"on the underside of the wing"},"answer":"B","valid":true,"red":false,"review":{"lesson":"mcrit","status":"conflict","vi":"Cụm “At MCRIT, a shockwave...” không khớp định nghĩa trong sách: trang 415 ghi rõ tại Mcrit không có shock wave. Vị trí gần max thickness mô tả nơi vận tốc cục bộ lớn ở α nhỏ, không làm tiền đề của câu trở thành đúng.","en":"The premise “At MCRIT, a shockwave...” contradicts the textbook definition: page 415 explicitly says no shock wave exists at Mcrit. Near maximum thickness is a typical local-velocity maximum at small α, but that does not validate the premise.","noteVi":"Sai khác ở tiền đề “at Mcrit”; giữ key B để nhận diện lỗi đề.","noteEn":"The premise “at Mcrit” is inconsistent; key B is retained to identify the bank issue.","bookAnswer":"Tại Mcrit: first local sonic flow, chưa có shock / no shock wave yet."},"topic":"High Speed Flight","uid":"POF-101"},{"id":102,"question":"Which statement is correct? 1) The angle of attack of a positively cambered aerofoil has a negative value when the lift coefficient equals zero. 2) There is a nose down pitching moment about a positively cambered aerofoil when the lift coefficient equals zero.","options":{"A":"1) is incorrect, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is correct, 2) is correct.","D":"1) is incorrect, 2) is incorrect"},"answer":"C","valid":true,"red":false,"review":{"lesson":"camberpositive","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-102"},{"id":103,"question":"Comparing the differences between a horizontal trimmable stabiliser and an elevator trim tab, which statement is correct? 1) A stabiliser trim is less suitable for jet transport aeroplanes because of their large speed range. 2) A trim tab is a more powerful means of trimming.","options":{"A":"1) is correct, 2) is correct.","B":"1) is incorrect, 2) is incorrect","C":"1) is correct, 2) is incorrect.","D":"1) is incorrect, 2) is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-103"},{"id":104,"question":"Considering subsonic incompressible airflow through a Venturi, which statement is correct? 1) The dynamic pressure in the throat is lower than in the undisturbed airflow. 2) The total pressure in the throat is higher than in the undisturbed airflow.","options":{"A":"1) is correct, 2) is incorrect.","B":"1) is incorrect, 2) is correct.","C":"1) is incorrect, 2) is incorrect","D":"1) is correct, 2) is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-104"},{"id":105,"question":"Which of these statements about stall speed is correct?","options":{"A":"Decreasing sweepback increases stall speed.","B":"Decreasing sweepback decreases stall speed.","C":"Decreasing wing anhedral decreases stall speed.","D":"Increasing wing anhedral decreases stall speed."},"answer":"B","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-105"},{"id":106,"question":"Which of these statements about the gust load factor on an aeroplane are correct or incorrect? 1) When the slope of the lift versus angle of attack curve decreases, the gust load factor increases. 2) When the wing loading decreases. the gust load factor increases.","options":{"A":"1) is correct, 2) is incorrect","B":"1) is incorrect, 2) is correct","C":"1) is correct, 2) is correct","D":"1) is incorrect, 2) is incorrect"},"answer":"B","valid":true,"red":true,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-106"},{"id":107,"question":"A rectangular wing, compared to other wing planforms, has a tendency to stall:","options":{"A":"first at the leading edge, with progression outward toward the wing root and tip.","B":"first at the Wingtip, with the stall progression toward the wing root.","C":"first at the wing root, with the stall progression towards the wing tip.","D":"first at the semi-span centre, giving good aerodynamic stall warning."},"answer":"C","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-107"},{"id":108,"question":"During a short period oscillation, the altitude:","options":{"A":"varies significantly, whereas during a phugoid it remains approximately constant.","B":"varies significantly, as it does during a phugoid.","C":"remains approximately constant, whereas during a phugoid it varies significantly.","D":"remains approximately constant, as it does during a phugoid."},"answer":"C","valid":true,"red":false,"review":{"lesson":"phugoid","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-108"},{"id":109,"question":"When the CG Is close to the forward limit:","options":{"A":"the stalling speed is reduced.","B":"the longitudinal stability is reduced.","C":"very small forces are required on ttte control column to produce pitch.","D":"very high stick forces are required in pitch because the aircraft is very stable"},"answer":"D","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-109"},{"id":110,"question":"Propeller slip is the difference between the:","options":{"A":"geometric pitch and the blade angle.","B":"geometric pitch and the effective pitch.","C":"plane of rotation and the aircraft's forward velocity.","D":"RPM of the engine and the RPM of the propeller."},"answer":"B","valid":t
