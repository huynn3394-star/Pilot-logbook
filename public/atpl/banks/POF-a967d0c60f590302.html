gh Lift Devices","uid":"POF-384"},{"id":385,"question":"The speed of sound is affected by the:","options":{"A":"density of the air.","B":"temperature of the air.","C":"humidity of the air.","D":"pressure of the air."},"answer":"B","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-385"},{"id":386,"question":"What data may be obtained from the Buffet Onset Boundary chart?","options":{"A":"The values of the Mach Number at which low speed and shock-stall occur at different weights and altitudes","B":"The values of MMO at different weights and altitudes","C":"The values of Mcrit at different weights and altitudes","D":"The values of the Mach Number at which low speed and Mach Buffet occur at different weights and altitudes"},"answer":"D","valid":true,"red":false,"review":{"lesson":"buffet","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-386"},{"id":387,"question":"Which of the following flight phenomena can occur at Mach numbers below the critical Mach number?","options":{"A":"Mach buffet.","B":"Dutch roll.","C":"Shock stall.","D":"Tuck under."},"answer":"B","valid":true,"red":false,"review":{"lesson":"dutchroll","status":"reviewed","vi":"Dutch roll là dao động stability roll/yaw, không đòi hỏi shock wave. Vì vậy có thể xảy ra dưới Mcrit; nó không phải Mach buffet.","en":"Dutch roll is a lateral-directional stability mode and does not require a shock wave. It can occur below Mcrit and is not Mach buffet.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-387"},{"id":388,"question":"The critical Mach number for an aerofoil equals the free stream airfoil Mach number at which:","options":{"A":"sonic speed (M=1) is reached at a certain point on the upper side of the aerofoil.","B":"the maximum operating temperature is reached.","C":"a shock-wave appears on the upper surface.","D":"a 'supersonic bell' appears on the upper surface."},"answer":"A","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-388"},{"id":389,"question":"When air has passed through a shock wave the local speed of sound is:","options":{"A":"increased","B":"not affected","C":"decreased","D":"decreased and beyond a certain Mach number start increasing again"},"answer":"A","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-389"},{"id":390,"question":"To increase the critical Mach number a conventional aerofoil should","options":{"A":"have a low thickness to chord ratio.","B":"have a large leading edge radius.","C":"be used with a high angle of attack.","D":"have a large camber."},"answer":"A","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-390"},{"id":391,"question":"Which statement is correct regarding a shockwave on a lift generating wing?","options":{"A":"It is located at the greatest wing thickness when the aeroplane reaches the speed of sound","B":"It reaches its highest strength when flying at the critical Mach number","C":"It moves forward when the Mach number is increased","D":"It moves slightly aft when an aileron is deflected downward"},"answer":"D","valid":true,"red":false,"review":{"lesson":"tuck","status":"limited","vi":"Sách cho biết aileron xuống làm tăng camber, giảm Mcrit và thay đổi vị trí shock; phần control buzz còn nêu shock có thể đi qua hinge. Nhưng những đoạn đã đọc không xác định luôn “slightly aft” cho điều kiện đề.","en":"The text explains that a down aileron increases camber, lowers Mcrit and alters the shock, and describes shock movement over a hinge in control buzz. The checked passages do not establish an invariably “slightly aft” motion for the condition stated.","noteVi":"Chưa tìm được căn cứ trực tiếp cho chiều dịch chuyển cụ thể của shock trong câu này.","noteEn":"The particular direction of shock movement remains unverified."},"topic":"Stability and Control","uid":"POF-391"},{"id":392,"question":"How will the density and static temperature change in a supersonic flow from a position in front of a shock wave to behind it ?","options":{"A":"Density will decrease, static temperature will decrease.","B":"Density will increase, static temperature will increase.","C":"Density will decrease, static temperature will increase.","D":"Density will increase, static temperature will decrease."},"answer":"B","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-392"},{"id":393,"question":"During landing of a low-winged jet aeroplane, the greatest elevator up deflection is normally required when the flaps are:","options":{"A":"up and the cg is fully forward.","B":"fully down and the cg is fully forward.","C":"up and the cg is fully aft.","D":"fully down and the cg is fully aft."},"answer":"B","valid":true,"red":false,"review":{"lesson":"landingcontrol","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-393"},{"id":394,"question":"The 'short period mode' is an:","options":{"A":"oscillation about the longitudinal axis","B":"oscillation about the lateral axis","C":"oscillation about the vertical axis","D":"unstable movement of the aeroplane, induced by the pilot"},"answer":"B","valid":true,"red":false,"review":{"lesson":"phugoid","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-394"},{"id":395,"question":"The aerodynamic contribution to the static longitudinal stability of the nacelles of aft fuselage mounted engines is:","options":{"A":"zero","B":"maximum during cruise","C":"positive","D":"negative"},"answer":"C","valid":true,"red":false,"review":{"lesson":"longstable","status":"limited","vi":"Một lực nâng tăng thêm tác dụng phía sau CG tạo mômen phục hồi nose-down. Điều đó giải thích đáp án về nacelles đặt aft theo cách xét lực tương đương. Tuy nhiên trang 261 chỉ nói đóng góp fuselage/nacelles thường là destabilizing; đoạn này không phân tích riêng mọi nacelle phía sau.","en":"An incremental upward force applied behind the CG creates a restoring nose-down moment, which explains the keyed aft-nacelle answer in a simple force model. However, page 261 describes fuselage/nacelles as generally destabilizing and does not establish the contribution of every aft-nacelle layout.","noteVi":"Nguồn hiện có chưa đủ xác nhận riêng tác dụng của aft-engine nacelles; không gán nhận định tổng quát cho sách.","noteEn":"The available passage does not directly verify the specific aft-nacelle contribution."},"topic":"Stability and Control","uid":"POF-395"},{"id":396,"question":"The effect of a ventral fin on the static stability of an aeroplane is as follows: (1=longitudinal, 2=lateral, 3=directional)","options":{"A":"1: negative, 2: positive, 3: positive","B":"1: positive, 2: negative, 3: negative","C":"1: no effect, 2: positive, 3: negative","D":"1: no effect, 2: negative, 3: positive"},"answer":"D","valid":true,"red":false,"review":{"lesson":"fins","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-396"},{"id":397,"question":"Static lateral stability should not be too small, because:","options":{"A":"after a disturbance around the longitudinal axis the aeroplane would show too strong a tendency to return to the original attitude","B":"the aeroplane would show too strong a tendency to spiral dive","C":"the aeroplane would show too strong a tendency for Dutch Roll","D":"the stick force per g would become unacceptably small"},"answer":"B","valid":true,"red":false,"review":{"lesson":"dutchroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-397"},{"id":398,"question":"Examples of aerodynamic balancing of control surfaces are:","options":{"A":"weight in the nose of the control surface, horn balance","B":"Fowler flaps, upper and lower rudder","C":"seal between wing's trailing edge and leading edge of a control surface, horn balance","D":"upper and lower rudder, seal between wing's trailing edge and leading edge of a control surface"},"answer":"C","valid":true,"red":false,"review":{"lesson":"tabs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-398"},{"id":399,"question":"What should be usually done to perform a landing with the stabilizer jammed in the cruise flight position ?","options":{"A":"if possible, relocate as many passengers as possible to the front of the cabin.","B":"choose a lower landing speed than normal.","C":"use the Mach trimmer until after landing.","D":"choose a higher landing speed than normal and/or use a lower flap setting for landing."},"answer":"D","valid":true,"red":false,"review":{"lesson":"landingcontrol","status":"limited","vi":"Tốc độ cao hơn làm tăng hiệu lực khí động của elevator; flap ít hơn giảm thay đổi trim. Hai nguyên lý giải thích hướng đáp án D, nhưng không đủ để coi đó là quy trình hạ cánh cho một stabilizer jam cụ thể. Cần dùng checklist/Flight Manual của loại máy bay.","en":"Higher speed increases elevator aerodynamic effectiveness and less flap can reduce the trim change. Those principles explain the direction of key D, but they do not constitute a landing procedure for a particular stabilizer jam; the type checklist/Flight Manual is required.","noteVi":"Nguồn chỉ hỗ trợ nguyên lý; không cung cấp quy trình xử lý stabilizer jam cho mọi loại máy bay.","noteEn":"Only the underlying principles are supported, not a universal stabilizer-jam procedure."},"topic":"Stability and Control","uid":"POF-399"},{"id":400,"question":"Increase of the delta load factor due to a given vertical upgust at a given EAS occurs when:","options":{"A":"the weight increases","B":"the slope of the CL - alpha graph becomes steeper","C":"the wing loading increases","D":"the altitude increases"},"answer":"B","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-400"},{"id":401,"question":"Does the pitch angle of a constant speed propeller alter in medium horizontal turbulence?","options":{"A":"Yes slightly","B":"Yes strongly","C":"Yes, but only if the pitch is full-fine","D":"No"},"answer":"A","valid":true,"red":false,"review":{"lesson":"propaoa","status":"derived","vi":"Horizontal turbulence đổi thành phần relative airflow/TAS, làm RPM có xu hướng biến đổi. Constant-speed governor đáp lại bằng thay blade pitch nhỏ để giữ RPM, nên pitch không hoàn toàn cố định. Đây là áp dụng nguyên lý governor, không phải giá trị biên độ pitch được sách định lượng.","en":"Horizontal turbulence changes the relative-airflow/TAS component and tends to change RPM. The constant-speed governor responds with small pitch adjustments to maintain RPM, so pitch is not perfectly fixed. This is an application of governor operation, not a quantified pitch-amplitude claim.","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-401"},{"id":402,"question":"The effect of a positive wing sweep on static directional stability is as follows:","options":{"A":"Destabilizing dihedral effect","B":"Stabilizing effect","C":"No effect","D":"Negative dihedral effect"},"answer":"B","valid":true,"red":false,"review":{"lesson":"directionalsweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-402"},{"id":403,"question":"The gust load factor due to a vertical upgust increases when:","options":{"A":"the gradient of the CL-alpha graph increases.","B":"altitude increases.","C":"wing loading increases.","D":"weight increases."},"answer":"A","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"So sánh với mọi yếu tố còn lại không đổi: area lớn hơn hoặc tốc độ cao hơn làm gust increment lớn hơn; slope nhỏ hơn làm increment nhỏ hơn; wing loading nhỏ hơn làm increment lớn hơn.","en":"With other factors fixed, larger wing area or higher speed increases the gust increment; a shallower lift-curve slope reduces it; lower wing loading increases it.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-403"},{"id":404,"question":"The SI units of air density (I) and force (II) are:","options":{"A":"(I) N / m3, (II) N","B":"(I) kg / m2, (II) kg","C":"(I) kg / m3, (II) N","D":"(I) N / kg, (II) kg"},"answer":"C","valid":true,"red":false,"review":{"lesson":"densityunits","status":"reviewed","vi":"Đề ghép hai đơn vị: density cần khối lượng chia thể tích (kg/m³), force cần newton (N). Không đổi thành N/m³, vì đó là trọng lượng trên một đơn vị thể tích chứ không phải mass density.","en":"The option must pair mass per unit volume (kg/m³) for density with newtons (N) for force. N/m³ would be weight per unit volume, not mass density.","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-404"},{"id":405,"question":"The angle between the aeroplane longitudinal axis and the chord line is the:","options":{"A":"climb path angle","B":"glide path angle","C":"angle of incidence","D":"angle of attack"},"answer":"C","valid":true,"red":false,"review":{"lesson":"angles","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-405"},{"id":406,"question":"The lift force, acting on an aerofoil:","options":{"A":"increases, proportional to the angle of attack until 40 degrees","B":"is maximum at an angle of attack of 2 degrees","C":"is mainly caused by overpressure at the underside of the aerofoil","D":"is mainly caused by suction on the upperside of the aerofoil"},"answer":"D","valid":true,"red":false,"review":{"lesson":"pressureflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-406"},{"id":407,"question":"The continuity equation states: If the area of a tube is increasing, the speed of the subsonic and incompressible flow inside is","options":{"A":"sonic","B":"increasing","C":"decreasing","D":"not changing"},"answer":"C","valid":true,"red":false,"review":{"lesson":"venturi","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Basic Aerodynamic Theory","uid":"POF-407"},{"id":408,"question":"With increasing angle of attack, the stagnation point will move (I) ...and the point of lowest pressure will move (II) ...Respectively (I) and (II) are:","options":{"A":"(I) down, (II) aft.","B":"(I) down, (II) forward.","C":"(I) up, (II) forward.","D":"(I) up, (II) aft."},"answer":"B","valid":true,"red":false,"review":{"lesson":"pressureflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-408"},{"id":409,"question":"Increasing dynamic pressure will have the following effect on the drag of an aeroplane (all other factors of importance remaining constant):","options":{"A":"none","B":"at speeds greater than the minimum drag speed, drag increases","C":"drag increases across the whole speed range","D":"drag decreases across the whole speed range"},"answer":"B","valid":true,"red":false,"review":{"lesson":"parasitic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-409"},{"id":410,"question":"Induced drag is created by the:","options":{"A":"spanwise flow pattern resulting in the tip vortices","B":"separation of the boundary layer over the wing","C":"propeller wash blowing across the wing","D":"interference of the air stream between wing and fuselage"},"answer":"A","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-410"},{"id":411,"question":"In what way do (1) induced drag and (2) parasite drag alter with increasing speed in straight and level flight?","options":{"A":"(1) decreases and (2) decreases","B":"(1) decreases and (2) increases","C":"(1) increases and (2) increases","D":"(1) increases and (2) decreases"},"answer":"B","valid":true,"red":false,"review":{"lesson":"parasitic","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-411"},{"id":412,"question":"Ground effect has the following influence on the landing distance:","options":{"A":"increases, only if the landing flaps are fully extended","B":"decreases","C":"does not change","D":"increases"},"answer":"D","valid":true,"red":false,"review":{"lesson":"ground","status":"derived","vi":"Trong giai đoạn flare, ground effect giảm induced drag nên máy bay mất tốc độ chậm hơn và có thể float xa hơn; ở các điều kiện tương đương landing distance tăng. Không hiểu thành lực lift buộc phải tăng dù phi công đã đổi AoA để giữ quỹ đạo.","en":"During the flare, ground effect reduces induced drag, so speed decays more slowly and the aircraft can float farther. With comparable conditions, landing distance increases. This does not mean lift must rise even after AoA is adjusted to control the flight path.","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-412"},{"id":413,"question":"Entering the stall the centre of pressure of a straight (1) wing and of a strongly swept back wing (2) will:","options":{"A":"(1) move aft, (2) move aft","B":"(1) not move (2) move forward","C":"(1) move aft, (2) not move","D":"(1) move aft, (2) move forward"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"Straight-wing stall trong mô tả sách làm CP dịch aft và pitch-down; swept-back tip stall làm mất lift phần ngoài/phía sau, nên CP dịch forward và pitch-up. Hướng chuyển phụ thuộc vùng stall trước, không chỉ tên hiện tượng stall.","en":"The textbook straight-wing stall shifts CP aft and produces pitch-down. On a swept-back wing, tip stall removes lift from the outer/aft region, moving CP forward and producing pitch-up. The shift follows which region stalls first, not simply the word stall.","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-413"},{"id":414,"question":"Increase of wing loading will:","options":{"A":"decrease take off speeds","B":"decrease the minimum gliding angle","C":"increase CLmax","D":"increase the stall speeds"},"answer":"D","valid":true,"red":false,"review":{"lesson":"vs","status":"derived","vi":"Vs=√[2(W/S)/(ρCLmax)]. Giữ density, configuration và CLmax như nhau, tăng wing loading làm Vs tăng theo căn bậc hai.","en":"Vs=√[2(W/S)/(ρCLmax)]. With density, configuration and CLmax unchanged, increasing wing loading increases stall speed with its square root.","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-414"},{"id":415,"question":"The stalling speed in IAS will change according to the following factors:","options":{"A":"Increase with increased load factor, icing conditions and an aft c.g. location","B":"Decrease in a forward c.g. location, higher altitude and due to the slip stream from a propeller on an engine located forward of the wing","C":"Increase during turn, increased mass and forward c.g. location","D":"Increase with increased load factor, more flaps but will not increase due to the bank angle in a turn"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-415"},{"id":416,"question":"Which of the following statements about the difference between Krueger flaps and slats is correct?","options":{"A":"Deploying a Krueger flap will form a slot, deploying a slat does not","B":"Deploying a slat will increase critical angle of attack, deploying a Krueger flap does not","C":"Deploying a Krueger flap will increase critical angle of attack, deploying a slat does not","D":"Deploying a slat will form a slot, deploying a Krueger flap does not"},"answer":"D","valid":true,"red":false,"review":{"lesson":"slats","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-416"},{"id":417,"question":"Mcrit is the free stream Mach Number at which:","options":{"A":"shockstall occurs.","B":"somewhere about the airframe Mach 1 is reached locally.","C":"the critical angle of attack is reached.","D":"Mach buffet occurs."},"answer":"B","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-417"},{"id":418,"question":"At higher altitudes, the stall speed (IAS):","options":{"A":"decreases until the tropopause","B":"remains the same","C":"increases","D":"decreases"},"answer":"C","valid":true,"red":false,"review":{"lesson":"vs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-418"},{"id":419,"question":"The loss of total pressure in a shock wave is due to the fact that","options":{"A":"the speed reduction is too high.","B":"the friction in the boundary layer is higher.","C":"the static pressure decrease is comparatively high.","D":"kinetic energy in the flow is converted into heat energy."},"answer":"D","valid":true,"red":false,"review":{"lesson":"shock","status":"derived","vi":"Sách mô tả kinetic energy chuyển thành nhiệt qua shock và gọi đó là energy drag. Ý cần giữ là quá trình shock không thuận nghịch làm mất total pressure; không nên suy ra tổng năng lượng của dòng tự nhiên biến mất.","en":"The text describes kinetic energy being converted to heat across the shock as energy drag. The essential point is irreversible total-pressure loss, not that the total energy of the flow simply disappears.","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-419"},{"id":420,"question":"The critical Mach number can be increased by","options":{"A":"positive dihedral of the wings.","B":"a T-tail.","C":"sweepback of the wings.","D":"an increase in wing aspect ratio."},"answer":"C","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-420"},{"id":421,"question":"Vortex generators on the upper side of the wing surface will:","options":{"A":"increase the critical Mach Number.","B":"increase the magnitude of the shock wave.","C":"decrease the span wise flow at high Mach Numbers.","D":"decrease the intensity of shock wave induced air separation."},"answer":"D","valid":true,"red":false,"review":{"lesson":"vortexgen","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-421"},{"id":422,"question":"The bow wave will first appear at:","options":{"A":"the critical Mach number","B":"Mach 1","C":"a Mach number just below M = 1","D":"a Mach number just above M = 1"},"answer":"D","valid":true,"red":false,"review":{"lesson":"bow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-422"},{"id":423,"question":"In which situation would the wing lift of an aeroplane in straight and level flight have the highest value?","options":{"A":"Forward centre of gravity and idle thrust","B":"Forward centre of gravity and take-off thrust","C":"Aft centre of gravity and idle thrust","D":"Aft centre of gravity and take-off thrust"},"answer":"A","valid":true,"red":false,"review":{"lesson":"winglift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-423"},{"id":424,"question":"The CG of an aeroplane is in a fixed position forward of the neutral point. Which of these statements about the stick force stability is correct?","options":{"A":"Stick force stability is not affected by trim","B":"Aeroplane nose up trim decreases the stick force stability","C":"An increase of 10 KT from the trimmed position at low speed has more effect on the stick force than an increase of 10 KT from the trimmed position at high speed","D":"Maintaining a steady speed above the trim speed requires a pull force"},"answer":"C","valid":true,"red":false,"review":{"lesson":"longstable","status":"limited","vi":"Key C khẳng định cùng tăng 10 kt tạo ảnh hưởng stick force lớn hơn ở tốc độ thấp. Nhưng trang 273 nêu stick-force gradient thấp ở low airspeed, còn không cung cấp điều kiện đủ để so sánh hai điểm trim như đề. Không thể dùng riêng đoạn này để xác nhận C.","en":"Key C asserts a larger stick-force effect from a 10 kt increase at low speed. Page 273 instead notes a low stick-force gradient at low airspeeds and does not provide the conditions for the two-trim-point comparison. That passage alone does not verify C.","noteVi":"Chưa đủ căn cứ trực tiếp cho so sánh stick force theo hai tốc độ trim.","noteEn":"Insufficient direct support for the comparison between the two trim speeds."},"topic":"Stability and Control","uid":"POF-424"},{"id":425,"question":"In case the Mach trimmer fails:","options":{"A":"try to relocate the centre-of-gravity aft.","B":"the speed must be kept constant.","C":"the aeroplane weight must be limited.","D":"the Mach number must be limited."},"answer":"D","valid":true,"red":false,"review":{"lesson":"tuck","status":"derived","vi":"Khi Mach trim không hoạt động, biên Mach phải được hạn chế theo tài liệu của loại máy bay vì đặc tính stick-force/trim cao tốc không còn được bù như thiết kế. Câu này không cung cấp giá trị Mach giới hạn cụ thể.","en":"Without Mach trim, Mach must be restricted in accordance with the aircraft documentation because the high-speed force/trim characteristic is no longer compensated as designed. This question supplies no specific Mach limit.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-425"},{"id":426,"question":"Which statement is correct? I Stick force per g is independent of altitude. II Stick force per g increases when the centre of gravity moves forward.","options":{"A":"I is incorrect, II is correct.","B":"I is correct, II is correct.","C":"I is incorrect, II is incorrect","D":"I is correct, II is incorrect."},"answer":"A","valid":true,"red":false,"review":{"lesson":"damping","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-426"},{"id":427,"question":"Dihedral of the wing:","options":{"A":"is the only way to increase the static lateral stability.","B":"is only positive for aeroplanes with high mounted wings.","C":"increases the static lateral stability.","D":"decreases the static lateral stability."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-427"},{"id":428,"question":"Given two identical aeroplanes with wing mounted engines, one fitted with jet engines and the other with counter rotating propellers, what happens following an engine failure?","options":{"A":"The same roll tendency for both aeroplanes.","B":"The same yaw tendency for both aeroplanes regardless of left or right engine failure.","C":"Less roll tendency for the propeller aeroplane.","D":"More roll tendency for the propeller aeroplane."},"answer":"D","valid":true,"red":false,"review":{"lesson":"engineoutroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-428"},{"id":429,"question":"When are outboard ailerons (if present) de-activated?","options":{"A":"Flaps (and slats) retracted or speed above a certain value","B":"Landing gear extended","C":"Landing gear retracted","D":"Flaps (and/or slats) extended or speed below a certain value"},"answer":"A","valid":true,"red":false,"review":{"lesson":"aileronlock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-429"},{"id":430,"question":"In general transport aeroplanes with power assisted flight controls are fitted with an adjustable stabilizer instead of trim tabs on the elevator. This is because:","options":{"A":"trim tab deflection increases Mcrit","B":"mechanical adjustment of trim tabs creates too many problems","C":"effectiveness of trim tabs is insufficient for those aeroplanes","D":"the pilot does not feel the stick forces at all"},"answer":"C","valid":true,"red":false,"review":{"lesson":"trim","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-430"},{"id":431,"question":"VLE is defined as the:","options":{"A":"maximum speed at which the landing gear may be extended or retracted.","B":"maximum landing gear extended speed.","C":"maximum authorised speed.","D":"maximum flap extended speed."},"answer":"B","valid":true,"red":false,"review":{"lesson":"gearlimits","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-431"},{"id":432,"question":"Which statement is correct about the gust load on an aeroplane (IAS and all other factors of importance remaining constant)? 1. the gust load increases, when the weight decreases. 2. the gust load increases, when the altitude increases.","options":{"A":"1 is correct and 2 is incorrect","B":"1 is incorrect and 2 is correct","C":"1 and 2 are incorrect","D":"1 and 2 are correct"},"answer":"A","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-432"},{"id":433,"question":"The torque effect during the take off run in respect of a right hand propeller, when viewed from behind, will tend to:","options":{"A":"roll the aeroplane to the right","B":"pitch the aeroplane nose down","C":"roll the aeroplane to the left","D":"pitch the aeroplane nose up"},"answer":"C","valid":true,"red":false,"review":{"lesson":"torque","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-433"},{"id":434,"question":"An aircraft has a buffet margin of 0.13g. 9.81m/s² standard for gravity. The maximum angle of bank where the stall is reached:","options":{"A":"15°","B":"9°","C":"88°","D":"27°"},"answer":"D","valid":true,"red":false,"review":{"lesson":"buffet","status":"calculation","vi":"Margin 0,13 g nghĩa là nmax=1+0,13=1,13. Vòng lượn bằng: φ=acos(1/1,13)≈27,8°; đáp án 27° là lựa chọn gần nhất.","en":"A margin of 0.13 g means nmax = 1 + 0.13 = 1.13. For a level turn, φ = acos(1/1.13) ≈ 27.8°; 27° is the nearest listed answer.","noteVi":"","noteEn":"","formula":"nmax = 1.13; φmax ≈ 27.8°"},"topic":"High Speed Flight","uid":"POF-434"},{"id":435,"question":"The relative thickness of an aerofoil is expressed as:","options":{"A":"% chord","B":"metres","C":"camber","D":"degrees cross section tail angle"},"answer":"A","valid":true,"red":false,"review":{"lesson":"geometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-435"},{"id":436,"question":"The induced drag:","options":{"A":"increases as the lift coefficient increases","B":"increases as the aspect ratio increases","C":"has no relation to the lift coefficient","D":"increases as the magnitude of the tip vortices decreases"},"answer":"A","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-436"},{"id":437,"question":"An aeroplane transitions from steady straight and level flight into a horizontal co-ordinated turn with a load factor of 2, the speed remains constant and the:","options":{"A":"induced drag increases by a factor of 4","B":"lift increases by a factor of 4","C":"total drag increases by a factor of 4","D":"angle of attack increases by a factor of ¼"},"answer":"A","valid":true,"red":false,"review":{"lesson":"induced","status":"calculation","vi":"Ở cùng tốc độ, n tăng từ 1 lên 2 đòi hỏi lift và CL gấp đôi. CDi tỷ lệ CL² nên induced drag gấp 4, không phải gấp 2.","en":"At constant speed, changing from n = 1 to n = 2 doubles lift and CL. Since CDi varies with CL², induced drag becomes four times, not twice, its previous value.","noteVi":"","noteEn":"","formula":"Di₂/Di₁ = (n₂/n₁)² = (2/1)² = 4"},"topic":"Lift","uid":"POF-437"},{"id":438,"question":"In a steady level, co-ordinated turn, the load factor n and the stalling speed VS will be:","options":{"A":"n greater than 1, VS lower than in straight and level flight","B":"n greater than 1, VS higher than in straight and level flight","C":"n smaller than 1, VS lower than in straight and level flight","D":"n smaller than 1, VS higher than in straight and level flight"},"answer":"B","valid":true,"red":false,"review":{"lesson":"vs","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-438"},{"id":439,"question":"Which aeroplane design has the highest probability of a super stall?","options":{"A":"A canard wing","B":"A low horizontal tail","C":"Swept wings","D":"A T-tail"},"answer":"D","valid":true,"red":false,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-439"},{"id":440,"question":"The stalling speed in IAS will change according to the following factors:","options":{"A":"May increase during turbulence and will always increase when banking in a turn","B":"Will increase during turn, increased mass and an aft c.g. location","C":"Will increase with increased load factor, icing conditions and more flaps","D":"Will decrease with a forward c.g. location, lower altitude and due to the slip stream from a propeller on an engine located forward of the wing"},"answer":"A","valid":true,"red":false,"review":{"lesson":"vs","status":"limited","vi":"Turbulence có thể làm tăng g và α tức thời. Phần “always ... banking in a turn” của đáp án cần hiểu là vòng lượn bằng phối hợp: bank tăng thì n tăng. Chỉ nghiêng cánh trong một chuyển động không giữ độ cao chưa đủ để kết luận n luôn tăng.","en":"Turbulence can increase instantaneous g and α. The keyed “always ... banking in a turn” must be read as a coordinated level turn, where bank requires increased n. Bank angle alone in a manoeuvre that does not maintain altitude does not guarantee an increase in n.","noteVi":"Đáp án thiếu điều kiện vòng lượn bằng/phối hợp.","noteEn":"The level, coordinated-turn condition is omitted from the option."},"topic":"Stalling","uid":"POF-440"},{"id":441,"question":"When 'spoilers' are used as speed brakes:","options":{"A":"they do not affect wheel braking action during landing","B":"at same angle of attack, CL remains unaffected","C":"CLmax of the polar curve is not affected","D":"at same angle of attack, CD is increased and CL is decreased"},"answer":"B","valid":true,"red":false,"review":{"lesson":"spoilers","status":"conflict","vi":"Key B nói CL không đổi ở cùng α. Điều này phù hợp mục tiêu của speedbrake thân lý tưởng, không phải spoiler trên cánh mà trang 345 xác nhận làm giảm lift. Không nên học thuộc B như đặc tính chung của wing spoiler.","en":"Key B says CL is unaffected at fixed α. That matches the objective of an ideal fuselage speed brake, not the wing spoiler that page 345 explicitly describes as reducing lift. B should not be memorized as a general wing-spoiler property.","noteVi":"Đáp án gốc B mâu thuẫn với tác dụng wing spoiler ở trang 345–346.","noteEn":"Original key B conflicts with the wing-spoiler effect on pages 345–346.","bookAnswer":"Wing spoiler: CL giảm, CD tăng / CL decreases, CD increases."},"topic":"Controls","uid":"POF-441"},{"id":442,"question":"An aeroplane is descending at a constant Mach number from FL 350. What is the effect on true airspeed ?","options":{"A":"It decreases as altitude decreases","B":"It increases as temperature increases","C":"It decreases as pressure increases","D":"It remains constant"},"answer":"B","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-442"},{"id":443,"question":"A jet aeroplane is cruising at high altitude with a Mach-number, that provides a buffet margin of 0.3 g incremental. In order to increase the buffet margin to 0.4 g incremental the pilot must:","options":{"A":"fly at a larger angle of attack","B":"extend the flaps to the first selection","C":"fly at a lower altitude and the same Mach-number","D":"fly at a higher Mach-number"},"answer":"C","valid":true,"red":false,"review":{"lesson":"buffet","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-443"},{"id":444,"question":"Some aeroplanes have a 'waist' or 'coke bottle' contoured fuselage. This is done to","options":{"A":"increase the strength of the wing root junction.","B":"apply area rule.","C":"improve the low speed characteristics.","D":"fit the engine intakes better to the fuselage."},"answer":"B","valid":true,"red":false,"review":{"lesson":"arearule","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-444"},{"id":445,"question":"If the total sum of moments about one of its axes is not zero, an aeroplane would:","options":{"A":"be difficult to control","B":"experience an angular acceleration about that axis","C":"not be affected because the situation is normal","D":"fly a path with a constant curvature"},"answer":"B","valid":true,"red":false,"review":{"lesson":"axes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-445"},{"id":446,"question":"The (1) stick force stability and the (2) manoeuvre stability are positively affected by:","options":{"A":"(1) aft C.G. movement (2) aft CG. movement.","B":"(1) forward C.G. movement (2) forward CG. movement.","C":"(1) trimming the aeroplane nose up (2) trimming the aeroplane nose up.","D":"(1) forward C.G. movement (2) trimming the aeroplane nose up."},"answer":"B","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-446"},{"id":447,"question":"Positive static lateral stability is the tendency of an aeroplane to:","options":{"A":"roll to the right in a right turn.","B":"roll to the left in the case of a positive sideslip angle (aeroplane nose to the left).","C":"roll to the right in the case of a positive sideslip angle (aeroplane nose to the left).","D":"roll to the left in a right turn."},"answer":"B","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-447"},{"id":448,"question":"What will increase the sensitivity to Dutch Roll?","options":{"A":"An increased anhedral.","B":"A forward movement of the centre of gravity.","C":"An increased static directional stability.","D":"An increased static lateral stability."},"answer":"D","valid":true,"red":false,"review":{"lesson":"dutchroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-448"},{"id":449,"question":"The manoeuvring speed VA expressed in indicated airspeed, of a transport aeroplane:","options":{"A":"is a constant value.","B":"depends on aeroplane mass and pressure altitude.","C":"is independent of aeroplane mass, but dependent on pressure altitude.","D":"depends on aeroplane mass and is independent of pressure altitude."},"answer":"B","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"derived","vi":"Mass làm thay đổi tốc độ đạt CLmax. Pressure altitude cũng có thể ảnh hưởng VA IAS của transport qua Mach/CLmax; không được biến xấp xỉ CLmax không đổi thành “VA IAS luôn độc lập altitude”.","en":"Mass changes the speed required to reach CLmax. Pressure altitude can also affect transport VA in IAS through Mach/CLmax; a constant-CLmax approximation does not imply altitude independence in every case.","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-449"},{"id":450,"question":"The angle of attack of a fixed pitch propeller blade increases when:","options":{"A":"velocity and RPM increase","B":"forward velocity increases and RPM decreasing","C":"velocity and RPM decrease","D":"RPM increases and forward velocity decreases"},"answer":"D","valid":true,"red":false,"review":{"lesson":"propaoa","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-450"},{"id":451,"question":"Gyroscopic precession of a propeller is induced by:","options":{"A":"increasing RPM and yawing.","B":"increasing RPM and rolling.","C":"pitching and yawing.","D":"pitching and rolling."},"answer":"C","valid":true,"red":false,"review":{"lesson":"gyro","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Propellers","uid":"POF-451"},{"id":452,"question":"Which of the following statements is correct I. VMCL is the minimum control speed in the landing configuration. II. The speed VMCL is always limited by maximum rudder deflection.","options":{"A":"I is incorrect, II is correct.","B":"I is correct, II is correct.","C":"I is correct, II is incorrect.","D":"I is incorrect, II is incorrect."},"answer":"C","valid":true,"red":false,"review":{"lesson":"vmc","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-452"},{"id":453,"question":"Which of the following statements is correct? I. A dorsal fin increases the contribution of the vertical tail plane to the static directional stability, in particular at large angles of sideslip. II. A dorsal and a ventral fin both have a positive effect on static lateral stability.","options":{"A":"I is incorrect, II is incorrect.","B":"I is correct, II is correct.","C":"I is correct, II is incorrect.","D":"I is incorrect, II is correct."},"answer":"C","valid":true,"red":false,"review":{"lesson":"fins","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-453"},{"id":454,"question":"The location of the centre of pressure of a positive cambered wing at increasing angle of attack will:","options":{"A":"shift aft","B":"not shift","C":"shift in spanwise direction","D":"shift forward"},"answer":"D","valid":true,"red":false,"review":{"lesson":"cp","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Subsonic Airflow","uid":"POF-454"},{"id":455,"question":"Which statement about induced drag and tip vortices is correct?","options":{"A":"The flow direction at the upper side of the wing has a component in wing root direction, the flow at the underside of the wing in wing tip direction","B":"Tip vortices can be diminished by vortex generators","C":"The flow direction at the upper and under side of the wing, both deviate in wing tip direction","D":"The wing tip vortices and the induced drag decrease at increasing angle of attack"},"answer":"A","valid":true,"red":false,"review":{"lesson":"spanflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-455"},{"id":456,"question":"The induced drag coefficient, CDi is proportional to:","options":{"A":"CL","B":"CL square","C":"CLmax","D":"square root (CL)"},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-456"},{"id":457,"question":"Which of the following statements about the spin is correct?","options":{"A":"An aeroplane is prone to spin when the stall starts at the wing root","B":"Every aeroplane should be designed such that it can never enter a spin","C":"In the spin, airspeed continuously increases","D":"During spin recovery the ailerons should be kept in the neutral position"},"answer":"D","valid":true,"red":false,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-457"},{"id":458,"question":"A jet aeroplane cruises buffet free at high constant altitude. Which type of stall can occur if this aeroplane decelerates during an inadvertent increase in load factor?","options":{"A":"Deep stall","B":"Low speed stall","C":"Shock stall","D":"Accelerated stall"},"answer":"D","valid":true,"red":false,"review":{"lesson":"stall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-458"},{"id":459,"question":"Deploying a Fowler flap, the flap will:","options":{"A":"turn down, then move aft","B":"move aft, then turn down","C":"just turn down","D":"just move aft"},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-459"},{"id":460,"question":"The trailing edge flaps when extended:","options":{"A":"significantly lower the drag","B":"degrade the best angle of glide","C":"significantly increase the angle of attack for maximum lift","D":"increase the zero lift angle of attack"},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-460"},{"id":461,"question":"A plain flap will increase CLmax by","options":{"A":"increasing the camber of the aerofoil.","B":"centre of lift movement.","C":"increasing angle of attack.","D":"boundary layer control."},"answer":"A","valid":true,"red":false,"review":{"lesson":"flaptypes","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-461"},{"id":462,"question":"Spoiler deflection causes:","options":{"A":"an increase in lift only","B":"an increase in lift and drag","C":"an increase in drag and decrease in lift","D":"decrease in lift and drag"},"answer":"C","valid":true,"red":false,"review":{"lesson":"spoilers","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-462"},{"id":463,"question":"The critical Mach Number of an aeroplane is the free stream Mach Number, which produces the first evidence of:","options":{"A":"buffet.","B":"shock wave.","C":"local sonic flow.","D":"supersonic flow."},"answer":"C","valid":true,"red":false,"review":{"lesson":"mcrit","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-463"},{"id":464,"question":"Critical Mach number is the free stream Mach number at which:","options":{"A":"there is subsonic flow over all parts of the aeroplane.","B":"the aeroplane has zero buffet margin.","C":"there is supersonic flow over all parts of the aeroplane.","D":"local supersonic flow first exists on any part of the aeroplane."},"answer":"D","valid":true,"red":false,"review":{"lesson":"mcrit","status":"conflict","vi":"Đề chọn D “local supersonic flow first exists”, còn sách định nghĩa lần đầu local sonic flow M=1. Hai từ sonic và supersonic không đồng nghĩa. Vì vậy D chỉ gần ý về ngưỡng, không chính xác như định nghĩa sách.","en":"The bank selects D, “local supersonic flow first exists”, whereas the text defines the first local sonic point, M = 1. Sonic and supersonic are not interchangeable. D approximates the threshold idea but is not the precise textbook definition.","noteVi":"Thuật ngữ “supersonic” ở đáp án không khớp “sonic” trong định nghĩa nguồn.","noteEn":"“Supersonic” in the option does not match “sonic” in the source definition.","bookAnswer":"Local sonic flow, M = 1."},"topic":"High Speed Flight","uid":"POF-464"},{"id":465,"question":"Compared with an oblique shock wave at the same Mach number a normal shock wave has a","options":{"A":"higher total pressure.","B":"higher total temperature.","C":"higher loss in total pressure.","D":"lower static temperature."},"answer":"C","valid":true,"red":false,"review":{"lesson":"shock","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-465"},{"id":466,"question":"The application of the area rule on aeroplane design will decrease the","options":{"A":"wave drag.","B":"skin friction drag.","C":"form drag.","D":"induced drag."},"answer":"A","valid":true,"red":false,"review":{"lesson":"arearule","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-466"},{"id":467,"question":"Which part of an aeroplane provides the greatest positive contribution to the static longitudinal stability ?","options":{"A":"The wing.","B":"The engine.","C":"The fuselage.","D":"The horizontal tailplane."},"answer":"D","valid":true,"red":false,"review":{"lesson":"longstable","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-467"},{"id":468,"question":"An aeroplane has a servo tab controlled elevator. What will happen if the elevator jams during flight?","options":{"A":"Pitch control sense is reversed.","B":"The pitch control forces double.","C":"Pitch control is lost.","D":"The servo-tab now works as a negative trim-tab."},"answer":"A","valid":true,"red":false,"review":{"lesson":"tabs","status":"derived","vi":"Nếu elevator bị kẹt nhưng servo tab vẫn còn chuyển động, lực nhỏ trên chính tab tác dụng trực tiếp như một elevator nhỏ. Chiều tab vốn ngược elevator mong muốn nên đáp ứng pitch còn lại đảo chiều so với cảm giác điều khiển bình thường. Đây là suy luận từ linkage servo-tab, với điều kiện tab không bị kẹt theo.","en":"If the elevator is jammed but its servo tab can still move, the tab force acts directly as a small elevator. Because tab motion normally opposes the intended elevator motion, the remaining pitch response has the reverse sense. This is inferred from the servo-tab linkage and assumes the tab itself remains free.","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-468"},{"id":469,"question":"What is the position of the elevator in relation to the trimmable horizontal stabiliser of a power assisted aeroplane that is in trim?","options":{"A":"At a forward CG the elevator is deflected upward and at an aft CG the elevator is deflected downward.","B":"The position depends on speed, the position of slats and flaps and the position of the centre of gravity.","C":"The elevator is always deflected slightly downwards in order to have sufficient remaining flare capability.","D":"The elevator deflection (compared to the stabilizer position) is always zero."},"answer":"B","valid":true,"red":false,"review":{"lesson":"trim","status":"derived","vi":"Trang 352 nói elevator “approximately neutral” sau khi trim. Đó không phải quy luật elevator phải thẳng chính xác với stabilizer ở mọi tốc độ, CG và high-lift configuration; đáp án B giữ được sự phụ thuộc điều kiện này.","en":"Page 352 says the elevator is “approximately neutral” after trim. This is not a requirement for exact alignment at every speed, CG and high-lift configuration; key B retains that dependence on the operating condition.","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-469"},{"id":470,"question":"By what percentage does VA (EAS) alter when the aeroplane's weight decreases by 19%?","options":{"A":"19% lower.","B":"no change","C":"4.36% lower.","D":"10% lower."},"answer":"D","valid":true,"red":false,"review":{"lesson":"loadlimits","status":"calculation","vi":"Weight giảm 19% còn 81%.√0,81=0,90 nên VA EAS giảm 10%.","en":"A19% weight reduction leaves 81%.√0.81=0.90, so VA in EAS decreases by 10%.","noteVi":"","noteEn":"","formula":"VA₂/VA₁ ≈ √0.81 = 0.90 → 10% lower"},"topic":"Limitations","uid":"POF-470"},{"id":471,"question":"Which statement is correct about the gust load on an aeroplane, while all other factors of importance remain constant? I When the mass increases, the gust load increases. II When the altitude decreases, the gust load increases.","options":{"A":"I is incorrect, II is incorrect.","B":"I is incorrect, II is correct.","C":"I is correct, II is incorrect.","D":"I is correct, II is correct."},"answer":"B","valid":true,"red":false,"review":{"lesson":"gustsensitivity","status":"derived","vi":"Phần kết luận về altitude là áp dụng mô hình với cùng IAS/EAS máy bay và cùng vận tốc gust thực. Mass giảm làm Δn tăng; altitude giảm làm Δn tăng. Không dùng kết luận này cho trường hợp giữ cùng gust EAS mà không đổi quy ước.","en":"The altitude conclusion applies the model at unchanged aircraft IAS/EAS and unchanged actual gust velocity. Decreasing mass increases Δn; decreasing altitude also increases Δn. Do not transfer this conclusion to fixed gust EAS without checking the convention.","noteVi":"Đề không ghi đầy đủ quy ước gust; kết quả về altitude có điều kiện như phần giải thích.","noteEn":"The stem does not fully state the gust convention; the altitude conclusion has the conditions explained above."},"topic":"Limitations","uid":"POF-471"},{"id":472,"question":"If you decrease the propeller pitch during a glide with idle-power at constant IAS the lift to drag ratio will:","options":{"A":"decrease and the rate of descent will decrease","B":"decrease and the rate of descent will increase","C":"increase and the rate of descent will increase","D":"increase and the rate of descent will decrease"},"answer":"B","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-472"},{"id":473,"question":"Which statement, about an aeroplane entering ground effect at constant angle of attack, is correct? 1) The lift coefficient CL increases. 2) The induced drag coefficient CDi increases.","options":{"A":"1) is correct, 2) is correct.","B":"1) is correct, 2) is incorrect.","C":"1) is incorrect, 2) is correct.","D":"1) is incorrect, 2) is incorrect."},"answer":"B","valid":true,"red":false,"review":{"lesson":"ground","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-473"},{"id":474,"question":"The mean camber line of an aerofoil section is:","options":{"A":"an arc of circle from the leading edge to the trailing edge.","B":"a straight line from the leading edge to the trailing edge.","C":"the profile of the upper surface of an aerofoil section.","D":"a line from the leading to the trailing edge equidistant from the upper and lower surfaces."},"answer":"D","valid":true,"red":false,"review":{"lesson":"geometry","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Overview and Definitions","uid":"POF-474"},{"id":475,"question":"The span-wise flow is caused by the difference between the air pressure on top and beneath the wing and its direction of movement goes from:","options":{"A":"beneath to the top of the wing via the wing tip","B":"the top to beneath the wing via the wing's trailing edge","C":"the top to beneath the wing via the leading edge","D":"beneath to the top of the wing via the trailing edge"},"answer":"A","valid":true,"red":false,"review":{"lesson":"spanflow","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-475"},{"id":476,"question":"Which of the following wing planforms gives the highest local lift coefficient at the wing root?","options":{"A":"Positive angle of sweep","B":"Elliptical","C":"Rectangular","D":"Tapered"},"answer":"C","valid":true,"red":false,"review":{"lesson":"stallshape","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-476"},{"id":477,"question":"","options":{},"answer":null,"valid":false,"red":false,"uid":"POF-477"},{"id":478,"question":"During an erect spin recovery:","options":{"A":"the ailerons are held in the neutral position","B":"the control stick is moved side ways, against the angle of bank","C":"the control stick is pulled to the most aft position","D":"the control stick is moved side ways, in the direction of the angle of bank"},"answer":"A","valid":true,"red":false,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-478"},{"id":479,"question":"Which type of stall has the largest associated angle of attack?","options":{"A":"Deep stall","B":"Low speed stall","C":"Accelerated stall","D":"Shock stall"},"answer":"A","valid":true,"red":false,"review":{"lesson":"deepstall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-479"},{"id":480,"question":"After the transition point between the laminar and turbulent boundary layer","options":{"A":"the boundary layer gets thinner and the speed increases","B":"the mean speed and friction drag increases","C":"the mean speed increases and the friction drag decreases","D":"the boundary layer gets thicker and the speed decreases"},"answer":"B","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"Từ “mean speed” trong đáp án cần hiểu là vận tốc trung bình trong lớp biên, nhất là gần bề mặt, được tăng nhờ trao đổi động lượng. Không có nghĩa toàn bộ máy bay hoặc free-stream airflow tăng tốc sau transition.","en":"“Mean speed” in the answer refers to velocity within the boundary layer, particularly near the wall, increased by momentum transfer. It does not mean the aircraft or the entire free stream accelerates after transition.","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-480"},{"id":481,"question":"The wing of an aeroplane will never stall at low subsonic speeds as long as....","options":{"A":"there is a nose-down attitude","B":"the angle of attack is smaller than the value at which the stall occurs","C":"the IAS exceeds the power-on stall speed","D":"the CAS exceeds the power-on stall speed"},"answer":"B","valid":true,"red":false,"review":{"lesson":"stall","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-481"},{"id":482,"question":"One important advantage the turbulent boundary layer has over the laminar layer is that:","options":{"A":"skin friction drag is less","B":"it has less tendency to separate from the surface","C":"it is thinner","D":"energy is less"},"answer":"B","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-482"},{"id":483,"question":"Assuming ISA conditions, which statement with respect to the climb is correct ?","options":{"A":"At constant Mach number the IAS increases","B":"At constant TAS the Mach number decreases","C":"At constant IAS the TAS decreases","D":"At constant IAS the Mach number increases"},"answer":"D","valid":true,"red":false,"review":{"lesson":"mach","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-483"},{"id":484,"question":"The critical Mach Number of an aeroplane can be increased by:","options":{"A":"vortex generators.","B":"control deflection","C":"dihedral of the wings.","D":"sweep back of the wings."},"answer":"D","valid":true,"red":false,"review":{"lesson":"sweep","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Speed Flight","uid":"POF-484"},{"id":485,"question":"The Mach-trim function is installed on most commercial jets in order to minimize the adverse effects of:","options":{"A":"changes in the position of centre of pressure","B":"compressibility effects on the stabilizer","C":"increased drag due to shock wave formation","D":"uncontrolled changes in stabilizer setting"},"answer":"A","valid":true,"red":false,"review":{"lesson":"tuck","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-485"},{"id":486,"question":"Tuck under will happen","options":{"A":"only at the critical Mach number.","B":"only above the critical Mach number.","C":"above or below the critical Mach number depending on the angle of attack.","D":"only below the critical Mach number."},"answer":"B","valid":true,"red":false,"review":{"lesson":"tuck","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-486"},{"id":487,"question":"On a un-swept wing, when the aerofoil is accelerated from subsonic to supersonic speeds, the aerodynamic centre:","options":{"A":"shifts aft by about 10%.","B":"remains unchanged.","C":"shifts from 25% to about 50% of the aerofoil chord.","D":"slightly shifts forward."},"answer":"C","valid":true,"red":false,"review":{"lesson":"supersonicac","status":"limited","vi":"","en":"","noteVi":"Key được giữ nguyên. Không dùng đoạn CP làm bằng chứng thay cho AC.","noteEn":"Original key retained. A CP statement is not substituted as evidence for AC."},"topic":"High Speed Flight","uid":"POF-487"},{"id":488,"question":"Which statement is correct for a side slip condition at constant speed and side slip angle, where the geometric dihedral of an aeroplane is increased ?","options":{"A":"the required lateral control force decreases.","B":"the stick force per g decreases.","C":"the required lateral control force increases.","D":"the required lateral control force does not change."},"answer":"C","valid":true,"red":false,"review":{"lesson":"dihedral","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stability and Control","uid":"POF-488"},{"id":489,"question":"If the nose of an aeroplane yaws left, this causes:","options":{"A":"an increase in lift on the left wing.","B":"a decrease in relative airspeed on the right wing.","C":"a roll to the right.","D":"a roll to the left."},"answer":"D","valid":true,"red":false,"review":{"lesson":"yawroll","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Controls","uid":"POF-489"},{"id":490,"question":"Which of the following statements is true?","options":{"A":"Flap extension in severe turbulence at constant speed moves the centre of pressure aft, which increases the structural limitation margins","B":"By increasing the flap setting in severe turbulence at constant speed the stall speed will be reduced and the risk for exceeding the structural limits will be decreased","C":"Flight in severe turbulence may lead to a stall and/or structural limitations being exceeded","D":"Flap extension in severe turbulence at constant speed increases both the stall speed and the structural limitation margins"},"answer":"C","valid":true,"red":false,"review":{"lesson":"roughair","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Limitations","uid":"POF-490"},{"id":491,"question":"If you increase the propeller pitch during a glide with idle-power at constant IAS the lift to drag ratio will","options":{"A":"decrease and the rate of descent will decrease.","B":"increase and the rate of descent will increase.","C":"decrease and the rate of descent will increase.","D":"increase and the rate of descent will decrease."},"answer":"D","valid":true,"red":false,"review":{"lesson":"windmill","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Flight Mechanics","uid":"POF-491"},{"id":492,"question":"The difference between IAS and TAS will:","options":{"A":"decrease with increasing speed","B":"increase with increasing air density","C":"increase with decreasing temperature","D":"decrease with decreasing altitude"},"answer":"D","valid":true,"red":false,"review":{"lesson":"ias","status":"derived","vi":"Theo bối cảnh giữ IAS trong sách, khi hạ thấp và mật độ tiến gần giá trị mực biển, phần chênh do mật độ giữa TAS và IAS giảm. Không coi đây là phát biểu độc lập với mọi điều kiện nhiệt độ, tốc độ và sai số thiết bị.","en":"In the textbook constant-IAS context, descending towards sea-level density reduces the density-related TAS–IAS difference. This is not an unconditional statement covering all temperatures, speeds and instrument errors.","noteVi":"","noteEn":""},"topic":"The Atmosphere","uid":"POF-492"},{"id":493,"question":"Bernoulli's law states: (note: rho is the mean sea level density under ISA conditions; pstat is static pressure; pdyn is dynamic pressure; ptot is total pressure)","options":{"A":"pdyn + 1/2 rho V2 = constant","B":"ptot + 1/2 rho V2 = pstat","C":"pstat + 1/2 rho V2 = constant","D":"pstat + 1/2 rho TAS2 = constant"},"answer":"C","valid":true,"red":false,"review":{"lesson":"venturi","status":"limited","vi":"Bernoulli dùng mật độ của chính dòng khí đang xét. Giá trị mật độ ISA mực biển chỉ dùng khi đó là điều kiện của bài; nó không phải hằng số mật độ áp dụng cho mọi độ cao.","en":"Bernoulli uses the density of the flow being considered. ISA sea-level density is applicable only when that is the specified condition, not as a universal density at every altitude.","noteVi":"Phần chú thích ρ trong đề quá hẹp; cần giữ điều kiện dòng không nén được, lý tưởng.","noteEn":"The stem defines ρ too narrowly; the ideal, incompressible-flow assumptions must be retained."},"topic":"Basic Aerodynamic Theory","uid":"POF-493"},{"id":494,"question":"The aerofoil polar is:","options":{"A":"the relation between the horizontal and the vertical speed","B":"a graph of the relation between the lift coefficient and the drag coefficient","C":"a graph, in which the thickness of the wing aerofoil is given as a function of the chord","D":"a graph of the relation between the lift coefficient and the angle of attack"},"answer":"B","valid":true,"red":false,"review":{"lesson":"polar","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-494"},{"id":495,"question":"Induced drag may be reduced by:","options":{"A":"an increase in the taper ratio of the wing","B":"an increase in aspect ratio","C":"the use of a wing tip with a much thinner aerofoil","D":"a decrease of the aspect ratio"},"answer":"B","valid":true,"red":false,"review":{"lesson":"induced","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-495"},{"id":496,"question":"Which of the following statements about boundary layers is correct?","options":{"A":"The turbulent boundary layer is thinner than the laminar boundary layer","B":"The turbulent boundary layer has more kinetic energy than the laminar boundary layer","C":"The turbulent boundary layer will separate more easily than the laminar boundary layer","D":"The turbulent boundary layer gives a lower skin friction than the laminar boundary layer"},"answer":"B","valid":true,"red":false,"review":{"lesson":"boundary","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Drag","uid":"POF-496"},{"id":497,"question":"Which of the following statements about the stall of a straight wing aeroplane is correct?","options":{"A":"The nose down effect is the result of increasing downwash, due to flow separation","B":"Just before the stall the aeroplane will be have an increased nose-down tendency","C":"The horizontal tail will stall at a higher speed than the wing","D":"Buffeting is the result of tailplane flow separation"},"answer":"B","valid":true,"red":false,"review":{"lesson":"stallshape","status":"limited","vi":"Trang 156 mô tả giai đoạn stall bắt đầu: CP lùi lại và lực đuôi thay đổi tạo xu hướng chúc mũi. Đề dùng “just before the stall”; không nên hiểu rằng mọi cánh thẳng đều có cùng mômen chúc mũi trước khi bất kỳ tách dòng nào xảy ra.","en":"Page 156 describes the onset and development of the stall: aft CP movement and the tail response produce a nose-down tendency. The stem says “just before the stall”; this should not be generalized to every straight wing before any separation has occurred.","noteVi":"Cách gọi thời điểm trong đề chưa trùng hoàn toàn mô tả của sách.","noteEn":"The timing stated in the stem is not identical to the textbook description."},"topic":"Stalling","uid":"POF-497"},{"id":498,"question":"The most important problem of ice accretion on a transport aeroplane during flight is:","options":{"A":"blocking of control surfaces","B":"increase in weight","C":"reduction in CLmax","D":"increase in drag"},"answer":"C","valid":true,"red":false,"review":{"lesson":"ice","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Lift","uid":"POF-498"},{"id":499,"question":"Vortex generators:","options":{"A":"take kinetic energy out of the boundary layer to reduce separation","B":"reduce the spanwise flow on swept wing","C":"change the turbulent boundary layer into a laminar boundary layer","D":"transfer energy from the free airflow into the boundary layer"},"answer":"D","valid":true,"red":false,"review":{"lesson":"vortexgen","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"Stalling","uid":"POF-499"},{"id":500,"question":"In order to maintain straight and level flight at a constant airspeed, whilst the flaps are being retracted, the angle of attack must be:","options":{"A":"increased or decreased depending upon the type of flap","B":"increased","C":"held constant","D":"decreased"},"answer":"B","valid":true,"red":false,"review":{"lesson":"flaplift","status":"reviewed","vi":"","en":"","noteVi":"","noteEn":""},"topic":"High Lift Devices","uid":"POF-500"}],"lessons":{"mass":{"id":"mass","title":"Mass, weight and power","chapter":"Overview and Definitions","pages":[7,8],"vi":"Khối lượng (mass) đo bằng kg là lượng vật chất của vật; trọng lượng (weight) là lực hấp dẫn W = mg, đo bằng N. Vì g có thể thay đổi mà lượng vật chất không đổi, mass không phụ thuộc gia tốc trọng trường. Công suất là công thực hiện trong một giây: P = F × quãng đường / thời gian = F × vận tốc, đơn vị W = J/s = N·m/s.","en":"Mass, measured in kg, is the quantity of matter; weight is the gravitational force W = mg, measured in N. A change in gravitational acceleration changes weight, not the amount of matter. Power is the rate of doing work: P = force × distance / time = force × velocity, with units W = J/s = N·m/s.","images":[]},"densityunits":{"id":"densityunits","title":"Density and force units","chapter":"Overview and Definitions","pages":[7,27],"vi":"Khối lượng riêng là khối lượng trên một đơn vị thể tích, nên đơn vị SI là kg/m³. Lực có đơn vị SI là newton (N); một khối lượng m chịu gia tốc a tạo lực F = ma.","en":"Density is mass per unit volume, so its SI unit is kg/m³. The SI unit of force is the newton (N), with F = ma. The density unit contains a cubic metre because the denominator is a volume, not an area.","images":[]},"pressure":{"id":"pressure","title":"Static pressure and pressure units","chapter":"The Atmosphere","pages":[25,26],"vi":"Áp suất là lực trên một đơn vị diện tích. Áp suất tĩnh của không khí tác dụng theo mọi hướng, không chỉ hướng dòng chảy. psi là pounds-force per square inch, nên là một đơn vị áp suất; đơn vị SI tương ứng là pascal, tức N/m².","en":"Pressure is force per unit area. Static air pressure acts in all directions, not only along the airflow. psi means pounds-force per square inch and is a pressure unit; the SI unit is the pascal, N/m².","images":[]},"density":{"id":"density","title":"Density at fixed pressure","chapter":"The Atmosphere","pages":[27,28],"vi":"Sách nêu: tại áp suất không đổi, khi nhiệt độ tăng thì mật độ không khí giảm. Quan hệ khí lý tưởng viết là ρ = p/(RT), với T là nhiệt độ tuyệt đối. Cùng áp suất nhưng khí nóng hơn sẽ có khối lượng nhỏ hơn trong mỗi mét khối.","en":"The text states that density decreases when temperature increases at constant pressure. In the ideal-gas relation ρ = p/(RT), T is absolute temperature. At the same pressure, warmer air contains less mass per cubic metre.","images":[]},"axes":{"id":"axes","title":"Aircraft axes and moments","chapter":"Overview and Definitions","pages":[10,241,242],"vi":"Trục dọc (longitudinal), trục ngang (lateral) và trục thẳng đứng/pháp tuyến (normal) đều đi qua trọng tâm CG. Roll là quay quanh trục dọc; pitch quanh trục ngang; yaw quanh trục normal. Nếu tổng mômen quanh một trục không bằng 0, máy bay có gia tốc góc quanh trục đó, chứ không ở cân bằng mômen.","en":"The longitudinal, lateral and normal axes all pass through the CG. Roll is rotation about the longitudinal axis; pitch about the lateral axis; yaw about the normal axis. A non-zero resultant moment about an axis produces angular acceleration rather than moment equilibrium.","images":[]},"geometry":{"id":"geometry","title":"Wing and aerofoil geometry","chapter":"Overview and Definitions","pages":[52,53,13,84,85],"vi":"Chord line nối thẳng mép trước với mép sau của tiết diện cánh. Mean camber line nối các điểm nằm giữa mặt trên và mặt dưới; nó không nhất thiết là đường thẳng. Taper ratio = chord đầu cánh / chord gốc cánh. Độ dày tương đối là độ dày lớn nhất chia chord, thường biểu diễn bằng %. Wing loading là trọng lượng chia diện tích cánh W/S.","en":"The chord line joins the leading and trailing edges with a straight line. The mean camber line is midway between the upper and lower surfaces and need not be straight. Taper ratio is tip chord divided by root chord. Relative thickness is maximum thickness divided by chord, usually expressed as a percentage. Wing loading is weight divided by wing area, W/S.","images":[]},"angles":{"id":"angles","title":"Incidence, pitch and angle of attack","chapter":"Overview and Definitions","pages":[52,53,10],"vi":"Góc tới (angle of incidence) là góc giữa chord line và trục dọc máy bay. Góc tấn (angle of attack, α) là góc giữa chord line và relative airflow. Góc pitch θ là góc giữa trục dọc và đường chân trời; góc quỹ đạo γ là góc giữa flight path và đường chân trời. Vì vậy cần phân biệt góc tấn của máy bay với góc tấn của cánh có incidence cố định.","en":"Angle of incidence is the angle between the chord line and the aircraft longitudinal axis. Angle of attack, α, is between the chord line and relative airflow. Pitch attitude θ is measured from the horizon to the longitudinal axis, while flight-path angle γ is measured from the horizon to the flight path. Thus aircraft angle of attack must be distinguished from wing angle of attack when the wing has a fixed incidence.","images":[]},"venturi":{"id":"venturi","title":"Continuity and Bernoulli in a Venturi","chapter":"Basic Aerodynamic Theory","pages":[43,44,45,46],"vi":"Đề giới hạn ở dòng cận âm, không nén được. Khối lượng riêng không đổi và lưu lượng khối lượng phải liên tục, nên ρAV = hằng số: tiết diện nhỏ hơn thì vận tốc lớn hơn. Ở họng Venturi, V tăng làm áp suất động q = ½ρV² tăng; áp suất tĩnh giảm. Theo mô hình dòng lý tưởng trong sách, tổng áp suất pₜ = pₛ + q giữ nguyên. Không được nhầm áp suất động tăng với tổng áp suất tăng.","en":"The stated flow is subsonic and incompressible. Density is constant and mass flow is conserved, so ρAV is constant: a smaller area requires a higher velocity. At the Venturi throat, higher V increases dynamic pressure q = ½ρV² and decreases static pressure. In the textbook ideal-flow model, total pressure pₜ = pₛ + q remains constant. An increase in dynamic pressure is not an increase in total pressure.","images":[44]},"dynamic":{"id":"dynamic","title":"Dynamic and total pressure","chapter":"The Atmosphere","pages":[30,31,44],"vi":"Áp suất động là q = ½ρV², trong đó V là tốc độ dòng khí tương đối. Nếu mật độ giữ nguyên, tăng V hai lần làm q tăng bốn lần. Tổng áp suất bằng áp suất tĩnh cộng áp suất động; hai đại lượng này không phải cùng một khái niệm.","en":"Dynamic pressure is q = ½ρV², where V is relative airflow speed. With density unchanged, doubling V quadruples q. Total pressure is static plus dynamic pressure; these are distinct quantities.","images":[]},"pressureflow":{"id":"pressureflow","title":"Stagnation and the suction peak","chapter":"Subsonic Airflow","pages":[56,57],"vi":"Ở stagnation point, vận tốc tương đối bằng 0 và áp suất đạt giá trị stagnation. Khi góc tấn tăng trong vùng dòng còn bám, điểm stagnation phía trước dịch vòng qua mép trước xuống mặt dưới. Đồng thời vùng hút mạnh nhất trên mặt trên dịch về phía trước. Giảm góc tấn làm các chuyển động này đảo chiều. Vùng hút mặt trên đóng góp phần lớn lực nâng trong ví dụ profile camber của sách.","en":"At a stagnation point, relative velocity is zero and pressure reaches the stagnation value. As angle of attack increases within attached flow, the forward stagnation point moves around the leading edge towards the lower surface. The upper-surface suction peak moves forward. Reducing angle of attack reverses these trends. Upper-surface suction supplies the largest contribution to lift in the cambered-section example.","images":[57]},"cp":{"id":"cp","title":"Centre of pressure movement","chapter":"Subsonic Airflow","pages":[58,60,62],"vi":"Centre of pressure (CP) là vị trí quy tụ tương đương của phân bố lực nâng. Với profile camber trong dòng cận âm còn bám, tăng góc tấn làm đỉnh hút dịch về trước và CP cũng dịch về trước. Gần stall CP ở vị trí trước nhất; khi stall, lift giảm và CP của tiết diện thông thường lùi lại. CP thay đổi không phải là aerodynamic centre cố định.","en":"The centre of pressure is the effective point of application of the distributed lift. For a cambered section in attached subsonic flow, increasing angle of attack moves the suction peak and CP forward. CP is furthest forward just before stall; at stall, lift falls and CP generally moves aft. The moving CP must not be confused with the fixed aerodynamic centre.","images":[]},"ac":{"id":"ac","title":"Aerodynamic centre","chapter":"Subsonic Airflow","pages":[60,61],"vi":"Aerodynamic centre là điểm mà mômen chúc/ngóc tính quanh nó không đổi khi góc tấn thay đổi trong vùng làm việc bình thường. Cách diễn đạt theo hệ số là pitching-moment coefficient không phụ thuộc α ở vùng đó. Trong mô hình cận âm thấp của sách, AC gần 25% chord. Đây là tính chất mômen, không phải khẳng định lực nâng hoặc vị trí CP không thay đổi.","en":"The aerodynamic centre is the point about which pitching moment remains unchanged as angle of attack varies through the normal range. Expressed in coefficient form, pitching-moment coefficient is independent of α there. In the textbook low-subsonic model, AC is near 25% chord. This is a moment property, not a statement that lift or CP position remains constant.","images":[]},"camberpositive":{"id":"camberpositive","title":"Positive camber: zero lift and pitching moment","chapter":"Subsonic Airflow","pages":[57,60,78,79,258,259],"vi":"Profile có camber dương vẫn tạo lift dương ở α = 0, nên phải giảm α xuống giá trị âm mới đưa CL về 0. Vì vậy đường CL–α cắt trục α ở bên trái gốc. Với profile camber dương thông thường, mômen khí động quanh AC là nose-down trong vùng góc tấn bình thường, kể cả tại zero lift. Zero net lift không đồng nghĩa zero pitching moment: phân bố áp suất vẫn có thể tạo một ngẫu lực.","en":"A positively cambered section produces positive lift at α = 0, so a negative α is needed for CL to become zero. Its CL–α curve therefore crosses the α-axis to the left of the origin. A conventional positively cambered section has a nose-down aerodynamic moment about AC within the normal range, including at zero lift. Zero net lift does not imply zero pitching moment: the pressure distribution can still produce a couple.","images":[78]},"symmetrical":{"id":"symmetrical","title":"Symmetrical and negatively cambered aerofoils","chapter":"Subsonic Airflow","pages":[61,76,78],"vi":"Profile đối xứng có mặt trên/mặt dưới đối xứng qua chord, nên tại α = 0 lực nâng tổng bằng 0 và mômen quanh AC bằng 0. Đường CL–α đi qua gốc. Với profile camber âm, đường lift bị dịch theo chiều ngược camber dương: CL tại α = 0 là âm và cần α dương để đạt zero lift.","en":"A symmetrical section has
