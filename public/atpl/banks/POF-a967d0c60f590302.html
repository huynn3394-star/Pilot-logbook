<script>(function(){
'use strict';
const E=window.ATPLQuizEngine;
const DATA=JSON.parse(document.getElementById('bank-data').textContent)[window.ATPL_SUBJECT];
const BANK=DATA.questions, LESSONS=DATA.lessons, INFO=DATA.info;
const BY_ID=new Map(BANK.map(q=>[q.id,q]));
const VALID=E.valid(BANK), ALL_IDS=VALID.map(q=>q.id);
const MAX_ID=Math.max(...BANK.map(q=>q.id)); const RANGE_COUNT=Math.ceil(MAX_ID/100);
const disp=q=>q?.uid||String(q?.id||'');
function sourceOnly(q){return !q.review?.lesson || !LESSONS[q.review.lesson];}
const view=document.getElementById('view'),dock=document.getElementById('dock'),dialog=document.getElementById('dialog'),imageDialog=document.getElementById('image-dialog');
let media=null;
function asset(key){if(!media)media=JSON.parse(document.getElementById('media-data').textContent);return media[key]||'';}
let store=null;try{store=window.localStorage;}catch(_){}
const loaded=E.load(store,BANK);let state=loaded.state;let readOnly=!!loaded.readError;let storageOK=Boolean(store);let saveMessage=loaded.warning;
let pageMode='home',reviewItems=[],reviewIndex=0,report=null,resultFilter='all',currentLabel='Học';
let picker={filter:'all',range:0,search:'',topic:''},toastTimer;
const topicLabels={'Overview and Definitions':'Khái niệm cơ bản','The Atmosphere':'Khí quyển','Basic Aerodynamic Theory':'Khí động học cơ bản','Subsonic Airflow':'Dòng khí cận âm','Lift':'Lực nâng','Drag':'Lực cản','Stalling':'Thất tốc','High Lift Devices':'Thiết bị tăng lực nâng','Airframe Contamination':'Băng & bề mặt cánh','Stability and Control':'Ổn định & điều khiển','Controls':'Bề mặt điều khiển','Flight Mechanics':'Cơ học bay','High Speed Flight':'Bay tốc độ cao','Limitations':'Giới hạn','Windshear':'Windshear','Propellers':'Cánh quạt'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(action,label,cls='',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function labelTopic(t){return topicLabels[t]||t;}
function toast(text){const n=document.getElementById('toast');n.textContent=text;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{n.hidden=true;},3800);}
function setStorageLine(){const n=document.getElementById('storage-line');n.classList.toggle('unsaved',!storageOK||readOnly);n.innerHTML=storageOK&&!readOnly?'Lưu trên trình duyệt này · Có thể xuất bản sao trong Cài đặt':'Chưa lưu bền vững · Xuất tiến độ trước khi đóng';const w=document.getElementById('storage-warning');w.hidden=!saveMessage;if(saveMessage)w.textContent=saveMessage;}
function persist(){if(readOnly){storageOK=false;setStorageLine();return;}storageOK=E.save(store,state);if(!storageOK)saveMessage='Không lưu được tiến độ trên trình duyệt. Bài vẫn làm được trong phiên này; hãy dùng Cài đặt → Xuất tiến độ trước khi đóng.';else if(!loaded.readError)saveMessage='';setStorageLine();}
function activeTheme(){return state.settings.theme==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.settings.theme;}
function applyTheme(){const t=activeTheme();document.documentElement.dataset.theme=t;document.getElementById('theme-btn').textContent=t==='dark'?'Ban ngày':'Ban đêm';document.getElementById('theme-btn').setAttribute('aria-label',t==='dark'?'Chuyển sang ban ngày':'Chuyển sang ban đêm');}
function count(){const a=Object.values(state.progress);const attempts=a.reduce((s,x)=>s+x.attempts,0),correct=a.reduce((s,x)=>s+x.correct,0);return {done:a.length,attempts,accuracy:attempts?Math.round(correct/attempts*100):0};}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function closeDialog(){if(dialog.open)dialog.close();}
function modal(title,body){dialog.innerHTML=`<div class="dialog-header"><h3>${esc(title)}</h3>${btn('close','Đóng','quiet')}</div><div class="dialog-body">${body}</div>`;if(!dialog.open)dialog.showModal();}
function status(q){if(isNext(q))return nxStatus(q);if(isMass(q))return mbStatus(q);if(isLawAudit(q))return lawStatus(q);if(sourceOnly(q))return `<div class="status pending">${q.figureBlocked?'Thiếu hình hoặc hình nguồn chưa đầy đủ · ':q.review.status==='limited'?'Có lưu ý dữ liệu nguồn · ':''}Đáp án theo đề · Chưa có lời giải đối chiếu đầy đủ</div>`;const r=q.review;const names={reviewed:'Nguyên lý và đáp án có nguồn trực tiếp',calculation:'Tính từ công thức trong sách',derived:'Nguyên lý từ sách · cần đối chiếu điều kiện câu',limited:'Cần đối chiếu thêm',conflict:'Đề và nguồn có điểm không khớp'};return `<div class="status ${esc(r.status)}">${names[r.status]||'Cần đối chiếu'} · ${esc(INFO.source)}</div>`;}
// Air Law audit presentation. The original answer key still controls scoring.
const LAW_LABELS={verified:'Đã xác minh theo giáo trình',conflict:'Key gốc khác giáo trình',insufficient:'Chưa đủ căn cứ',ambiguous:'Đề hoặc nguồn mơ hồ'};
function isLawAudit(q){return INFO.subjectId==='LAW'&&Boolean(q?.audit);}
function lawBookSummary(){const c=INFO.auditCounts;return `Đã đối chiếu ${INFO.auditTotal}/453 câu: ${c.verified} xác minh theo sách; ${c.conflict} key khác sách; ${c.insufficient} chưa đủ căn cứ; ${c.ambiguous} đề hoặc nguồn mơ hồ. Xác minh theo giáo trình 2014 không đồng nghĩa quy định còn hiện hành.`;}
function lawBookStatus(q){const a=q.audit;return `<div class="status ${a.status==='verified'?'reviewed':a.status==='conflict'?'conflict':'limited'}">${esc(LAW_LABELS[a.status])} · CAE Oxford 2014${a.currentRule.status==='changed'?' · Có khác biệt với quy định mới':''}</div>`;}
function lawCurrent(a){const c=a.currentRule;const labels={not_checked:'Quy định hiện hành: chưa kiểm tra',checked:'Đã kiểm tra phạm vi quy định ghi dưới đây',changed:'Giáo trình và quy định mới có khác biệt'};return `<div class="callout ${c.status==='changed'?'warning':''}"><b>${esc(labels[c.status])}</b>${paragraphs(c.noteVi)}<p lang="en">${esc(c.noteEn)}</p>${c.currentAnswer?`<p>Lựa chọn theo phạm vi kiểm tra bổ sung: <b>${esc(c.currentAnswer)}</b>. Kết luận giáo trình và key chấm điểm vẫn giữ riêng.</p>`:''}${c.url?`<p><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.authority||'Nguồn chính thức')}</a> · kiểm tra ${esc(c.checkedDate||'2026-10-13')}</p>`:''}</div>`;}
function lawSource(q){const a=q.audit,p=a.importCheck;return `<details class="sourcebox" open><summary>Chứng cứ giáo trình · ${a.evidence.length} đoạn</summary><p><b>CAE Oxford Aviation Academy — ATPL Book 1: Air Law (2014)</b></p>${!a.evidence.length?'<p>Chưa tìm được đoạn sách chứng minh câu này. Không dùng key gốc làm chứng cứ.</p>':''}${a.evidence.map((e,i)=>`<section class="law-evidence"><h4>${i+1}. ${esc(e.chapter)}</h4><p><b>Trang in ${esc(e.printedPage)} · trang PDF ${e.pdfPage}</b> · ${esc(e.section)}</p><blockquote class="source-quote">${esc(e.excerpt)}</blockquote>${e.explanation?`<p class="muted">${esc(e.explanation)}</p>`:''}<details><summary>Xem ảnh trang nguồn · PDF ${e.pdfPage}</summary>${imageBlock(e.imageKey,`010-Air_law.pdf · ${e.chapter} · trang in ${e.printedPage} / PDF ${e.pdfPage} · ${e.section}`)}</details></section>`).join('')}<p class="muted">Trích dẫn giữ nội dung nguồn; lời giải Việt–Anh là diễn giải. Với câu chưa đủ căn cứ, đoạn trích chỉ chứng minh phần đã nêu, không xác nhận trọn đáp án.</p></details><details class="sourcebox"><summary>Đối chiếu ngân hàng gốc Word / Excel</summary>${(q.sourceFiles||[]).map(s=>`<p>${esc(s)}</p>`).join('')}${p?`<p>Excel: ${esc(p.xlsx?.file)} · dòng ${p.xlsx?.row} · key ${esc(p.xlsx?.answer)}. Nội dung câu, lựa chọn và key khớp app gốc sau chuẩn hóa khoảng trắng.</p><p>${p.docx?.length?`Word: ${p.docx.length} bản tương ứng; đáp án in đậm khớp Excel.`:'Không tìm thấy bản Word tương ứng; đã đối chiếu Excel.'}</p>`:''}<p>Đối chiếu nguồn đề không chứng minh đáp án đúng về chuyên môn.</p></details>`;}
function lawBookExplanation(q){const a=q.audit,lang=state.settings.language;return `<section class="explanation law-explanation" aria-label="Giải thích câu ${q.id}"><div class="answer-focus"><div class="eyebrow">Key gốc của đề · dùng để chấm điểm</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div><div class="callout ${a.status==='verified'?'':'warning'}"><b>${esc(LAW_LABELS[a.status])}</b><p>${a.bookAnswer?`Kết luận giáo trình: <b>${esc(a.bookAnswer)} — ${esc(q.options[a.bookAnswer])}</b>`:'Chưa xác định được một lựa chọn được giáo trình chứng minh đầy đủ.'}</p>${a.status!=='verified'?'<p>Key gốc được giữ để nhận biết nguồn đề. Khớp key này không có nghĩa đáp án đã được kiểm định.</p>':''}</div><div class="lang-switch" role="group" aria-label="Ngôn ngữ giải thích">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ']].map(([k,v])=>btn('language',v,'',`data-lang="${k}" aria-pressed="${lang===k}"`)).join('')}</div><div class="explanation-grid ${lang==='both'?'both':''}">${lang!=='en'?`<section class="language-block" lang="vi"><div class="label">Tiếng Việt</div>${paragraphs(a.vi)}</section>`:''}${lang!=='vi'?`<section class="language-block" lang="en"><div class="label">English</div>${paragraphs(a.en)}</section>`:''}</div>${lawCurrent(a)}${lawSource(q)}</section>`;}
function lawBookAudit(){pageMode='audit';dock.hidden=true;const qs=VALID.filter(q=>q.audit.status!=='verified'||q.audit.currentRule.status==='changed');view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Kết quả đối chiếu Air Law</h2><p>${lawBookSummary()}</p><p>Danh sách dưới có ${qs.length} câu cần xử lý thêm. Mỗi câu vẫn giữ key gốc; thi thử mặc định loại các câu này.</p>${qs.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${esc(q.uid)} · ${esc(LAW_LABELS[q.audit.status])}</b><br>${esc(q.audit.reasonVi||q.audit.vi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('')}</section>`;goTop();}

// Follow-up findings are distinct from the original bank and 2014 book audit.
const LAW_RES_LABELS={key_confirmed:'Xác nhận key gốc bằng chứng cứ bổ sung',key_corrected:'Key gốc sai · có đáp án thay thế',stem_defect:'Lỗi đề · có bản sửa biên tập',source_missing:'Thiếu nguồn gốc · chưa thể kết luận'};
function lawSummary(){const c=INFO.resolutionCounts;return `Đã đối chiếu 453/453 câu. Theo sách 2014: ${INFO.auditCounts.verified} câu xác minh. Đã tra cứu thêm toàn bộ 126 câu có cờ: ${c.key_confirmed} xác nhận key gốc, ${c.key_corrected} sửa key, ${c.stem_defect} lỗi đề có bản sửa, ${c.source_missing} còn thiếu nguồn. Nguồn bổ sung và kết luận sách được ghi riêng. Thi thử mặc định: ${INFO.defaultExamCount} câu.`;}
function lawStatus(q){const r=q.resolution;if(!r)return lawBookStatus(q);return `<div class="status ${r.kind==='key_confirmed'?'reviewed':r.kind==='key_corrected'?'conflict':'limited'}">${esc(LAW_RES_LABELS[r.kind])}${r.currentRuleStatus==='changed'?' · Khác quy định/nguồn mới':''}</div>`;}
function lawResolutionSource(r){return `<details class="sourcebox" open><summary>Chứng cứ bổ sung · ${r.evidence.length} nguồn</summary>${r.evidence.map((e,i)=>`<section class="law-resolution-evidence"><h4>${i+1}. ${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>`:esc(e.title)}</h4><p><b>${esc(e.authority)}</b> · ${esc(e.section)}${e.pdfPage?` · PDF ${e.pdfPage} / trang in ${esc(e.printedPage||'xem tài liệu')}`:''}</p><p class="muted">Phiên bản: ${esc(e.version)} · truy cập ${esc(e.accessDate)}</p>${e.finding?`<p>${esc(e.finding)}</p>`:''}${e.excerpt?`<blockquote>${esc(e.excerpt)}</blockquote>`:''}${e.imageKey?`<details><summary>Xem ảnh trang nguồn đã tải lên</summary>${imageBlock(e.imageKey,`${e.title}${e.pdfPage?` · PDF ${e.pdfPage}`:''} · ${e.section}`)}</details>`:''}</section>`).join('')}</details>`;}
function lawExplanation(q){const r=q.resolution;if(!r)return lawBookExplanation(q);const lang=state.settings.language;return `<section class="explanation law-explanation" aria-label="Giải thích câu ${q.id}"><div class="answer-focus"><div class="eyebrow">Key gốc của đề · dùng để chấm điểm</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div><div class="callout ${r.kind==='key_confirmed'?'':'warning'}"><b>${esc(LAW_RES_LABELS[r.kind])}</b><p>${r.answer?`Kết luận bổ sung về đề gốc: <b>${esc(r.answer)} — ${esc(q.options[r.answer])}</b>`:'Đề gốc chưa có một đáp án được xác nhận đầy đủ.'}</p><p>${r.scope==='current_rule'?'Đã kiểm tra điều khoản trong phạm vi ghi ở từng nguồn.':r.scope==='unresolved'?'Chờ nguồn hoặc hình gốc.':'Kết luận theo sách/khái niệm hoặc nguồn lịch sử; chưa chứng nhận toàn bộ quy định hiện hành.'} ${r.currentRuleStatus==='changed'?'Có khác biệt giữa ngân hàng/sách cũ và nguồn mới.':r.currentRuleStatus==='not_checked'?'Chưa kiểm tra tính hiện hành ngoài phạm vi này.':''}</p></div><div class="lang-switch" role="group" aria-label="Ngôn ngữ giải thích">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ']].map(([k,v])=>btn('language',v,'',`data-lang="${k}" aria-pressed="${lang===k}"`)).join('')}</div><div class="explanation-grid ${lang==='both'?'both':''}">${lang!=='en'?`<section class="language-block" lang="vi"><div class="label">Tiếng Việt</div>${paragraphs(r.vi)}</section>`:''}${lang!=='vi'?`<section class="language-block" lang="en"><div class="label">English</div>${paragraphs(r.en)}</section>`:''}</div>${r.missing?`<div class="callout warning"><b>Nguồn còn thiếu</b><p>${esc(r.missing)}</p></div>`:''}${r.correctedQuestionEn||r.correctedOptionEn?`<details class="sourcebox" open><summary>Bản sửa biên tập đề xuất · chưa thay đề hoặc key chấm điểm</summary>${r.correctedQuestionEn?`<p lang="en"><b>Stem:</b> ${esc(r.correctedQuestionEn)}</p>`:''}${r.correctedOptionEn?`<p lang="en"><b>Option:</b> ${esc(r.correctedOptionEn)}</p>`:''}<p>Bản sửa là nội dung biên tập dựa trên điều khoản, không phải trích nguyên văn ngân hàng. Thi thử mặc định loại câu lỗi đề.</p></details>`:''}${lawResolutionSource(r)}<details class="sourcebox law-book-history"><summary>Kết luận trước đây từ giáo trình 2014 · ${esc(LAW_LABELS[q.audit.status])}</summary>${lawBookExplanation(q).replace('explanation law-explanation','explanation law-book-explanation').replace(/<div class="lang-switch"[^>]*>[\s\S]*?<\/div>/,'')}</details></section>`;}
function lawAudit(){pageMode='audit';dock.hidden=true;const pending=VALID.filter(q=>q.resolution?q.resolution.kind!=='key_confirmed':q.review?.status!=='reviewed'),confirmed=VALID.filter(q=>q.resolution?.kind==='key_confirmed');const list=qs=>qs.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${esc(q.uid)} · ${esc(q.resolution?LAW_RES_LABELS[q.resolution.kind]:LAW_LABELS[q.audit.status])}</b><br>${esc(q.resolution?.vi||q.audit.reasonVi||q.audit.vi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('');view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Kết quả đối chiếu Air Law</h2><p>${lawSummary()}</p><p>${pending.length} câu vẫn bị loại khỏi thi thử mặc định vì lỗi key/đề/nguồn hoặc khác biệt quy định. Key gốc còn được dùng để chấm điểm khi bạn chủ động học các câu này.</p>${list(pending)}<details><summary>${confirmed.length} câu đã xác nhận thêm key gốc</summary>${list(confirmed)}</details></section>`;goTop();}

// Mass & Balance explanations are item-specific and preserve the source scoring key.
const MB_LABELS={verified:'Đáp án được chứng cứ hỗ trợ',conflict:'Key nguồn không khớp kết quả đối chiếu',ambiguous:'Đề còn mơ hồ hoặc thiếu điều kiện',insufficient:'Chưa đủ dữ kiện hoặc nguồn để kết luận'};
function isMass(q){return ['MB','MBR'].includes(INFO.subjectId)&&Boolean(q?.massAudit);}
function mbOriginalSummary(){const c=INFO.massAuditCounts;return `Đã đối chiếu ${INFO.questionCount}/300 câu: ${c.verified||0} đáp án nguồn được hỗ trợ; ${c.conflict||0} câu key không khớp; ${c.ambiguous||0} câu mơ hồ; ${c.insufficient||0} câu thiếu dữ kiện/nguồn. Bài tính trình bày dữ kiện, công thức, thay số và đơn vị. Thi thử mặc định có ${INFO.defaultExamCount} câu.`;}
function mbOriginalStatus(q){const a=q.massAudit;return `<div class="status ${a.status==='verified'?'reviewed':a.status==='conflict'?'conflict':'limited'}">${esc(MB_LABELS[a.status])}</div>`;}
function mbNumber(n){return typeof n==='number'?new Intl.NumberFormat('en-US',{maximumFractionDigits:8}).format(n):String(n);}
function mbDisplayMath(s,prose=false){let t=String(s).replace(/sqrt\s*\(/g,'√(').replace(/\*\*/g,'^').replace(/\*/g,' × ');t=t.replace(/(?<=[\d)])\s*-\s*(?=[\d(])/g,' − ').replace(/(?<=\()\s*-\s*(?=\d)/g,'−');return prose?t.replace(/(?<=[\d)])\s*\/\s*(?=[\d(])/g,' ÷ '):t.replace(/\//g,' ÷ ');}
function mbMath(s,label=''){const display=/Result|Kết quả/.test(label)?s:mbDisplayMath(s);return s?`<p class="mb-math">${label?`<b>${esc(label)}</b> `:''}${esc(display)}</p>`:'';}
function mbSymbols(){const lang=state.settings.language,terms=[['DOM','Dry Operating Mass: máy bay sẵn sàng cho loại khai thác, có crew và operating items; chưa có usable fuel và traffic load.','Dry Operating Mass: aircraft ready for the specified operation, including crew and operating items, excluding usable fuel and traffic load.'],['TL','Traffic Load: hành khách, hành lý và hàng hóa, kể cả tải không thu tiền.','Traffic Load: passengers, baggage and cargo, including non-revenue load.'],['ZFM','Zero Fuel Mass = DOM + TL; vẫn gồm unusable fuel trong khối lượng cơ bản.','Zero Fuel Mass = DOM + TL; unusable fuel remains within the basic aircraft mass.'],['TOF / TOM','Take-off Fuel = block fuel − taxi fuel. Take-off Mass = ZFM + TOF.','Take-off Fuel = block fuel − taxi fuel. Take-off Mass = ZFM + TOF.'],['LM','Landing Mass = TOM − trip fuel, khi không có thay đổi tải hoặc khối lượng khác.','Landing Mass = TOM − trip fuel when there are no other mass or load changes.'],['CG / arm','CG là trọng tâm; arm là khoảng cách có dấu từ datum. Dùng cùng mốc và cùng đơn vị cho tất cả moment.','CG is the centre of gravity; arm is the signed distance from the datum. Use a common datum and consistent units for every moment.'],['LEMAC / MAC','LEMAC là vị trí mép trước MAC so với datum; MAC là chiều dài dây cung khí động trung bình. Hai số này không phải CG.','LEMAC is the datum-relative leading-edge position of the mean aerodynamic chord; MAC is that chord’s length. Neither is the CG.']];return `<details class="sourcebox mb-symbols"><summary>Nhắc lại ký hiệu và công thức / Symbols and formulas</summary><dl>${terms.map(([t,vi,en])=>`<dt><b>${esc(t)}</b></dt><dd>${lang!=='en'?`<p lang="vi">${esc(vi)}</p>`:''}${lang!=='vi'?`<p lang="en">${esc(en)}</p>`:''}</dd>`).join('')}</dl>${mbMath('CG arm = Σ(mass × arm) ÷ Σmass')}${mbMath('%MAC = (CG arm − LEMAC) ÷ MAC × 100')}<p class="muted">CAE Oxford, chương 2 — Definitions and Calculations, trang in 29–32 và 48. Dấu arm: trước datum âm, sau datum dương theo quy ước trong sách; không trộn m với inch hoặc kg với lb.</p><details><summary>Xem công thức %MAC trong giáo trình · PDF 54</summary>${imageBlock('mb_textbook_pdf_54','CAE Oxford · chương 2 · trang in 48 / PDF 54 · CG as %MAC')}</details></details>`;}
function mbFigures(q){return (q.questionFigures||[]).map(f=>`<div class="mb-question-figure">${imageBlock(f.imageKey,`${f.captionVi} / ${f.captionEn}`,true)}</div>`).join('');}
function mbOriginalSources(q){const a=q.massAudit;return `<details class="sourcebox" open><summary>Đối chiếu nguồn · ${a.evidence.length} đoạn/bảng/hình</summary>${a.evidence.map((e,i)=>`<section class="mb-evidence"><h4>${i+1}. ${esc(e.title)}</h4><p><b>${esc(e.chapter)}</b> · ${esc(e.section)}${e.pdfPage?` · PDF ${e.pdfPage}${e.printedPage?` / trang in ${esc(e.printedPage)}`:''}`:''}</p><p class="muted">${esc(e.version)}${!['textbook','question_bank'].includes(e.source)?' · nguồn bổ sung ngoài tài liệu đã tải lên':''}</p>${e.excerpt?`<blockquote class="source-quote">${esc(e.excerpt)}</blockquote>`:''}${e.finding?`<p>${esc(e.finding)}</p>`:''}${e.imageKey?`<details><summary>Xem ảnh trang nguồn</summary>${imageBlock(e.imageKey,`${e.title} · ${e.chapter} · ${e.section} · PDF ${e.pdfPage}`)}</details>`:''}${e.url?`<p><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Mở nguồn chính thức</a></p>`:''}</section>`).join('')}<p>Trích dẫn là nội dung nguồn; phần giải thích và cách áp dụng là diễn giải riêng cho câu hỏi. Với câu có cờ, chứng cứ chỉ hỗ trợ phần đã nêu.</p></details><details class="sourcebox"><summary>Đề và key nguồn Word</summary><p>${esc(q.sourceLocation.file)} · đoạn ${q.sourceLocation.paragraphStart}–${q.sourceLocation.paragraphEnd}.</p><p>STT gốc ${q.sourceNumber}; giữ nguyên nội dung và lựa chọn, chỉ bỏ nhãn A/B/C/D lặp ở đầu lựa chọn khi nhập. Key nguồn ${esc(q.answer)} được giữ riêng với kết luận kiểm định.</p></details>`;}
function mbPitfall(a,lang){const text=lang==='vi'?a.pitfallVi:a.pitfallEn;return text?`<div class="mb-pitfall"><b>${lang==='vi'?'Lỗi dễ nhầm':'Common pitfall'}</b>${paragraphs(mbDisplayMath(text,true))}</div>`:'';}
function mbLanguage(a,lang){const vi=lang==='vi';return `<section class="language-block" lang="${lang}"><div class="label">${vi?'Tiếng Việt':'English'}</div>${paragraphs(mbDisplayMath(a[lang],true))}<ol class="mb-steps">${a.steps.map(step=>`<li><h4>${esc((vi?step.labelVi:step.labelEn).replace(/^\s*\d+[.)]\s*/,''))}</h4>${paragraphs(mbDisplayMath(step[lang],true))}${mbMath(step.formula,vi?'Công thức:':'Formula:')}${mbMath(step.substitution,vi?'Thay số:':'Substitution:')}${mbMath(step.result,vi?'Kết quả:':'Result:')}</li>`).join('')}</ol>${mbPitfall(a,lang)}</section>`;}
function mbOriginalExplanation(q){const a=q.massAudit,lang=state.settings.language,c=a.calculation;return `<section class="explanation mb-explanation" aria-label="Giải thích Mass & Balance câu ${q.id}"><div class="answer-focus"><div class="eyebrow">Key nguồn · dùng để chấm điểm ngân hàng</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div><div class="callout ${a.status==='verified'?'':'warning'}"><b>${esc(MB_LABELS[a.status])}</b><p>${a.bookAnswer?`Kết luận đối chiếu: <b>${esc(a.bookAnswer)} — ${esc(q.options[a.bookAnswer])}</b>`:'Chưa xác định được một lựa chọn đúng duy nhất với đầy đủ dữ kiện của đề gốc.'}</p>${a.status!=='verified'?'<p>Điểm chỉ phản ánh việc khớp key nguồn. Câu này bị loại khỏi thi thử mặc định; không tự bù số liệu để làm cho key đúng.</p>':''}</div><div class="lang-switch" role="group" aria-label="Ngôn ngữ giải thích">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ']].map(([k,v])=>btn('language',v,'',`data-lang="${k}" aria-pressed="${lang===k}"`)).join('')}</div>${c?`<details class="sourcebox mb-calculation" open><summary>Dữ kiện và phép tính / Data and calculation</summary><div class="mb-input-grid">${c.inputs.map(x=>`<div><span>${esc(x.label)}</span><strong>${esc(mbNumber(x.value))} <small>${esc(x.unit)}</small></strong></div>`).join('')}</div>${mbMath(c.formula,'Formula:')}${mbMath(c.substitution,'Substitution:')}${mbMath(`${mbNumber(c.result.value)} ${c.result.unit}`,'Result:')}<p class="muted">Cách làm tròn, quy ước dấu và phạm vi áp dụng được giải thích ở từng bước dưới đây.</p></details>`:''}<div class="explanation-grid ${lang==='both'?'both':''}">${lang!=='en'?mbLanguage(a,'vi'):''}${lang!=='vi'?mbLanguage(a,'en'):''}</div>${a.missing?`<div class="callout warning"><b>Dữ kiện hoặc nguồn còn thiếu</b>${paragraphs(a.missing)}</div>`:''}<details class="sourcebox" ${a.currentRule.status==='changed'?'open':''}><summary>Phiên bản và phạm vi quy định · ${a.currentRule.status==='changed'?'có khác biệt':a.currentRule.status==='checked'?'đã kiểm tra điều khoản cụ thể':'chưa kiểm tra luật hiện hành'}</summary>${paragraphs(a.currentRule.noteVi)}<p lang="en">${esc(a.currentRule.noteEn)}</p>${a.currentRule.url?`<a href="${esc(a.currentRule.url)}" target="_blank" rel="noopener noreferrer">Nguồn quy định bổ sung</a>`:''}</details>${mbSymbols()}${mbSources(q)}</section>`;}
function mbOriginalAudit(){pageMode='audit';dock.hidden=true;const qs=VALID.filter(q=>q.massAudit.status!=='verified');view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Các câu Mass & Balance cần đối chiếu</h2><p>${mbSummary()}</p>${qs.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${esc(q.uid)} · ${esc(MB_LABELS[q.massAudit.status])}</b><br>${esc(q.massAudit.vi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('')}</section>`;goTop();}

// Edited learning questions have a separate bank, score history and backup.
const MB_REPAIR_LABELS={source_confirmed:'Xác nhận thêm đề gốc',key_corrected:'Đã sửa key của bản luyện tập',question_repaired:'Câu luyện tập đã hiệu chỉnh',unresolved:'Vẫn cần nguồn hoặc dữ kiện'};
function mbSummary(){if(INFO.subjectId!=='MBR')return mbOriginalSummary().replace(`Thi thử mặc định có ${INFO.defaultExamCount} câu.`,`Thi thử theo key gốc mặc định dùng đủ 300 câu; ${INFO.defaultExamCount} câu có chứng cứ hỗ trợ.`);const c=INFO.repairCounts;return `Bản luyện tập: 256 câu giữ nguyên; đã xử lý thêm 44 câu có cờ (${c.source_confirmed||0} xác nhận đề gốc, ${c.key_corrected||0} sửa key, ${c.question_repaired||0} hiệu chỉnh đề, ${c.unresolved||0} còn chờ). Thi thử mặc định: ${INFO.defaultExamCount} câu. Hiệu chỉnh đề không phải xác minh đề gốc; mỗi thay đổi đều có thông báo và nguồn.`;}
function mbStatus(q){return q.massRepair?`<div class="status ${q.massRepair.kind==='unresolved'?'limited':'reviewed'}">${esc(MB_REPAIR_LABELS[q.massRepair.kind])} · ${q.massRepair.kind==='unresolved'?'loại khỏi thi thử':'chấm theo bản luyện tập đang hiển thị'}</div>`:mbOriginalStatus(q);}
function mbRepairNotice(q,exam=false){const r=q.massRepair;if(!r)return '';if(exam)return `<aside class="mb-repair-notice callout"><strong>Câu luyện tập đã hiệu chỉnh · ${esc(q.uid)}</strong><p>Đang thi thử: phần so sánh với đề gốc và chi tiết hiệu chỉnh được mở sau khi nộp bài.</p></aside>`;return `<aside class="mb-repair-notice callout warning"><strong>${esc(MB_REPAIR_LABELS[r.kind])} · ${esc(q.uid)}</strong><p>${esc(r.changeVi)}</p><p lang="en">${esc(r.changeEn)}</p><details class="mb-original"><summary>Xem đề, lựa chọn và key gốc trước hiệu chỉnh</summary><p class="qtext" lang="en">${esc(r.original.question)}</p><ol type="A">${Object.values(r.original.options).map(t=>`<li lang="en">${esc(t)}</li>`).join('')}</ol><p><b>Key gốc: ${esc(r.original.answer)}.</b> Bản gốc và lịch sử làm bài được giữ ở chế độ “Đề gốc”.</p></details></aside>`;}
function mbExplanation(q){let html=mbOriginalExplanation(q);if(INFO.subjectId!=='MBR')return html;return html.replace('Key nguồn · dùng để chấm điểm ngân hàng',q.massRepair?'Đáp án bản luyện tập hiệu chỉnh · dùng để chấm điểm':'Đáp án câu giữ nguyên từ ngân hàng').replace('Kết luận đối chiếu:','Kết luận cho câu đang hiển thị:');}
function mbSources(q){let html=mbOriginalSources(q);if(INFO.subjectId!=='MBR'||!q.massRepair)return html;return html.replace('Đề và key nguồn Word','Nguồn Word của nguyên bản').replace(/STT gốc[\s\S]*?<\/p><\/details>$/,`Nguyên bản STT ${q.sourceNumber} được giữ trong chế độ Đề gốc và trong mục nguyên bản trước câu hỏi. Câu đang luyện tập đã hiệu chỉnh như thông báo; nguồn Word không chứng nhận nội dung thêm hoặc key mới.</p></details>`);}
function mbAudit(){if(INFO.subjectId!=='MBR')return mbOriginalAudit();pageMode='audit';dock.hidden=true;const qs=VALID.filter(q=>q.massRepair);view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Kết quả xử lý 44 câu Mass & Balance</h2><p>${mbSummary()}</p>${qs.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${esc(q.uid)} · ${esc(MB_REPAIR_LABELS[q.massRepair.kind])}</b><br>${esc(q.massRepair.changeVi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('')}</section>`;goTop();}
function mbEditionBanner(){if(!['MB','MBR'].includes(INFO.subjectId))return;const revised=INFO.subjectId==='MBR',n=document.createElement('aside');n.className='callout mb-edition';n.innerHTML=`<strong>${revised?'Bài tập hiệu chỉnh · chỉ tham khảo':'Ngân hàng gốc · giữ nguyên key và tiến độ cũ'}</strong><p>${revised?'Chế độ này dùng câu/key hiệu chỉnh để tham khảo. Nếu thi theo đáp án ngân hàng, hãy mở Đề gốc ở liên kết dưới.':'Chấm điểm theo đáp án gốc của ngân hàng thi. Giữ nguyên toàn bộ câu hỏi, lựa chọn và key. Phần giải thích/đối chiếu chỉ tham khảo; không thay đáp án chấm điểm.'}</p><a class="mb-mode-link" href="#${revised?'MB':'MBR'}">${revised?'Mở đề gốc và tiến độ cũ':'Xem bài tập hiệu chỉnh để tham khảo'} →</a>`;view.before(n);n.querySelector('a').addEventListener('click',e=>{e.preventDefault();location.hash=revised?'MB':'MBR';location.reload();});}

function mbSourceExamPicker(){modal('Thi theo đáp án gốc',`<p>Chấm điểm hoàn toàn theo key gốc của ngân hàng, kể cả các câu có lưu ý đối chiếu. Đáp án và giải thích được ẩn đến sau khi nộp.</p><div class="callout warning">Có đủ <b>300 câu gốc</b>; 44 câu có lưu ý về đề/nguồn. Những lưu ý đó không đổi key chấm điểm.</div><label style="font-size:13px;display:block;margin:16px 0"><input type="checkbox" id="exam-all" checked> Dùng đủ 300 câu theo key gốc (bỏ chọn để chỉ lấy 256 câu đủ chứng cứ)</label><div class="row">${[20,50,100].map(n=>btn('start-exam',`${n} câu`,'primary',`data-size="${n}"`)).join('')}</div>`);}

// Second review is separate from the immutable original audit and exam key.
const RX_LABELS={key_supported:'Đã đối chiếu · chứng cứ hỗ trợ key gốc',key_conflict:'Đã xác định xung đột · vẫn chấm key gốc',stem_defect:'Đã giải thích lỗi đề / điều kiện áp dụng',source_missing:'Còn cần dữ kiện gốc · chưa xác nhận key'};
function nxActiveAudit(q){if(!q.resolution)return q.audit;const r=q.resolution;return {...r,status:({key_supported:'supported',key_conflict:'conflict',stem_defect:'ambiguous',source_missing:'insufficient'})[r.kind],calculation:r.calculation||null};}
function nxResolutionNotice(q){const r=q.resolution;if(!r)return '';return `<div class="callout ${r.kind==='key_supported'?'':'warning'}"><b>Rà soát bổ sung · ${esc(RX_LABELS[r.kind])}</b><p>Key dùng để chấm: <b>${esc(q.answer)}</b>. ${r.bookAnswer&&r.bookAnswer!==q.answer?'Lựa chọn được chứng cứ hỗ trợ riêng: <b>'+esc(r.bookAnswer)+'</b>. ':''}Kết luận này không sửa đề hoặc đáp án nguồn.</p>${r.clarification?`<details><summary>Cách hiểu / hiệu chỉnh tham khảo</summary>${paragraphs(r.clarification.vi)}<p lang="en">${esc(r.clarification.en)}</p>${r.clarification.question?paragraphs(r.clarification.question):''}${r.clarification.answer?paragraphs(r.clarification.answer):''}${r.clarification.assumptions?.length?`<p><b>Giả thiết / Assumptions</b></p><ul>${r.clarification.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}</details>`:''}</div>`;}
function nxOriginalAudit(q){if(!q.resolution)return '';const a=q.audit;return `<details class="sourcebox"><summary>Lưu vết đánh giá trước lần rà soát này</summary><p>${esc(NX_LABELS[a.status])}</p>${paragraphs(a.vi)}<p lang="en">${esc(a.en)}</p>${a.missing?paragraphs(a.missing):''}<p class="muted">Được giữ để kiểm tra thay đổi kết luận; lời giải cập nhật nằm phía trên. Key nguồn luôn là ${esc(q.answer)}.</p></details>`;}

// New banks retain their source keys; evidence verdict never changes scoring.
const NX_CODES=['AGK','PERF','OPS','HUM','COM','INS','MET','RNAV'];
const NX_LABELS={supported:'Chứng cứ hỗ trợ đáp án nguồn',conflict:'Key hoặc nguồn có điểm không khớp',ambiguous:'Đề còn mơ hồ hoặc thiếu điều kiện',insufficient:'Chưa đủ căn cứ để xác nhận đáp án'};
function isNext(q){return NX_CODES.includes(INFO.subjectId)&&Boolean(q?.audit);}
function nxBaselineSummary(){const c=INFO.auditCounts;return `${INFO.questionCount} câu có đề và key gốc: ${c.supported||0} được chứng cứ hỗ trợ; ${c.conflict||0} có xung đột; ${c.ambiguous||0} mơ hồ; ${c.insufficient||0} chưa đủ căn cứ.${INFO.missing.length?' Vị trí trống trong nguồn: '+INFO.missing.join(', ')+'.':''} Thi thử mặc định dùng toàn bộ câu có key gốc.`;}
function nxBaselineStatus(q){return `<div class="status ${q.audit.status==='supported'?'reviewed':q.audit.status==='conflict'?'conflict':'limited'}">${esc(NX_LABELS[q.audit.status])}${q.sourceKeyAudit?.status==='conflict'?' · Word và Excel khác key':''}</div>`;}
function nxFigureCaption(f){return [f.captionVi,f.captionEn].filter(Boolean).join(' / ')||'Hình nguyên bản trong đề';}
function nxFigures(q){return (q.questionFigures||[]).filter(f=>f.role!=='option').map(f=>`<div class="mb-question-figure">${imageBlock(f.imageKey,nxFigureCaption(f),true)}</div>`).join('');}
function nxOption(q,k){return (q.questionFigures||[]).filter(f=>f.role==='option'&&f.option===k).map(f=>`<img class="nx-option-figure" src="${asset(f.imageKey)}" alt="Hình đáp án ${esc(k)} trong đề gốc" decoding="async">`).join('');}
function nxSourceLocation(loc){if(!loc)return '';return [loc.file,loc.sheet?'sheet '+loc.sheet:'',loc.row?'dòng '+loc.row:'',loc.paragraphStart?'đoạn '+loc.paragraphStart+'–'+loc.paragraphEnd:''].filter(Boolean).map(esc).join(' · ');}
function nxSources(q){const a=nxActiveAudit(q),r=q.sourceRecords;return `<details class="sourcebox" open><summary>Chứng cứ và ảnh trang nguồn · ${a.evidence.length} mục</summary>${!a.evidence.length?'<p>Chưa tìm được đoạn nguồn đủ căn cứ. Không dùng key của đề làm chứng cứ.</p>':''}${a.evidence.map(e=>`<section class="mb-evidence"><h4>${esc(e.title)}</h4><p><b>${esc(e.chapter)}</b> · ${esc(e.section)}${e.pdfPage?' · PDF '+e.pdfPage:''}${e.printedPage?' / trang in '+esc(e.printedPage):''}</p><p class="muted">${esc(e.version||'Ấn bản trong hồ sơ nguồn')}</p>${e.excerpt?`<blockquote class="source-quote">${esc(e.excerpt)}</blockquote>`:''}${e.finding?paragraphs(e.finding):''}${e.imageKey?`<details><summary>Xem ảnh trang nguồn · PDF ${e.pdfPage}</summary>${imageBlock(e.imageKey,`${e.title} · ${e.chapter} · ${e.section} · PDF ${e.pdfPage}`)}</details>`:''}${e.url?`<p><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Mở nguồn chính thức</a></p>`:''}</section>`).join('')}<p class="muted">Đoạn trích giữ nội dung nguồn; lời giải là diễn giải để học. Ở câu có cờ, đoạn trích chỉ hỗ trợ phần đã nêu.</p></details><details class="sourcebox"><summary>Đề và đáp án gốc · hồ sơ nhập liệu</summary><p>${nxSourceLocation(q.sourceLocation)}</p>${q.previousReview?`<p>${(q.sourceFiles||[]).map(esc).join("<br>")}</p><p>Đối chiếu nhập liệu Word–Excel: ${esc(q.pairStatus||"Chưa ghi nhận")}.</p>${q.previousReview.noteVi?`<details class="callout warning" open><summary>Ghi chú nhập liệu và đối chiếu cũ</summary><p>Kết luận đối chiếu mới nằm trong lời giải phía trên. Ghi chú dưới đây được giữ để tra lịch sử dữ liệu.</p>${paragraphs(q.previousReview.noteVi)}</details>`:""}`:""}<p>Mã ${esc(q.uid)} · số gốc ${esc(q.sourceNumber)} · key chấm điểm <b>${esc(q.answer)}</b>.</p>${q.keySource?`<p>Cách xác định key: ${esc(q.keySource.method)}${q.keySource.literal?' · '+esc(q.keySource.literal):q.keySource.raw?' · '+esc(q.keySource.raw):''}</p>`:''}${r?.xlsx?`<p>Excel: ${nxSourceLocation(r.xlsx)} · ô ${esc(r.xlsx.answerCell)} · giá trị gốc ${esc(r.xlsx.rawAnswer)} · key ${esc(r.xlsx.answer)}.</p>`:''}${(r?.docx||[]).map(d=>`<p>Word: ${nxSourceLocation(d)} · đáp án in đậm ${esc(d.keyProof?.answer||'không xác định duy nhất')}.</p>`).join('')}${q.sourceKeyCheck?`<pre class="nx-provenance">${esc(JSON.stringify(q.sourceKeyCheck,null,2))}</pre>`:''}<p>Nội dung và key được giữ theo hồ sơ nguồn; ghi nhận Word–Excel khớp nhau không phải là kiểm định chuyên môn.</p></details>`;}
function nxLanguage(a,lang){const vi=lang==='vi',repeated=a.steps.some(x=>x[lang]===a[lang]);return `<section class="language-block" lang="${lang}"><div class="label">${vi?'Tiếng Việt':'English'}</div>${repeated?'':paragraphs(mbDisplayMath(a[lang],true))}<ol class="mb-steps">${a.steps.map(st=>`<li><h4>${esc(vi?st.labelVi:st.labelEn)}</h4>${paragraphs(mbDisplayMath(st[lang],true))}${mbMath(st.formula,vi?'Công thức:':'Formula:')}${mbMath(st.substitution,vi?'Thay số:':'Substitution:')}${mbMath(st.result,vi?'Kết quả:':'Result:')}</li>`).join('')}</ol>${mbPitfall(a,lang)}</section>`;}
function nxExplanation(q){const a=nxActiveAudit(q),l=state.settings.language,c=a.calculation,cr=a.currentRule;return `<section class="explanation mb-explanation nx-explanation" aria-label="Giải thích ${esc(q.uid)}"><div class="answer-focus"><div class="eyebrow">Đáp án gốc · dùng để chấm điểm luyện thi</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div>${nxResolutionNotice(q)}<div class="callout ${a.status==='supported'?'':'warning'}"><b>${esc(NX_LABELS[a.status])}</b><p>Điểm thi phản ánh việc khớp key gốc. Kết luận đối chiếu được ghi riêng bên dưới.</p></div><div class="lang-switch" role="group" aria-label="Ngôn ngữ giải thích">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ']].map(([k,v])=>btn('language',v,'',`data-lang="${k}" aria-pressed="${l===k}"`)).join('')}</div>${c?`<details class="sourcebox mb-calculation" open><summary>Công thức và thay số / Calculation</summary>${c.inputs?.length?`<div class="mb-input-grid">${c.inputs.map(x=>`<div><span>${esc(x.label)}</span><strong>${esc(mbNumber(x.value))} <small>${esc(x.unit)}</small></strong></div>`).join('')}</div>`:''}${mbMath(c.formula,'Formula:')}${mbMath(c.substitution,'Substitution:')}${mbMath(`${mbNumber(c.result.value)} ${c.result.unit}`,'Result:')}</details>`:''}<div class="explanation-grid ${l==='both'?'both':''}">${l!=='en'?nxLanguage(a,'vi'):''}${l!=='vi'?nxLanguage(a,'en'):''}</div>${a.missing?`<div class="callout warning"><b>Điểm chưa đủ căn cứ / điều kiện cần lưu ý</b>${paragraphs(a.missing)}</div>`:''}${q.sourceKeyAudit?.status==='conflict'?`<div class="callout warning"><b>Word và Excel có key khác nhau</b>${paragraphs(q.sourceKeyAudit.vi)}<p lang="en">${esc(q.sourceKeyAudit.en)}</p></div>`:''}${cr?`<details class="sourcebox"><summary>Phiên bản và phạm vi kiểm tra</summary>${paragraphs(cr.noteVi)}<p lang="en">${esc(cr.noteEn)}</p>${cr.url?`<a href="${esc(cr.url)}" target="_blank" rel="noopener noreferrer">Nguồn bổ sung</a>`:''}</details>`:''}${nxSources(q)}${nxOriginalAudit(q)}</section>`;}
function nxAudit(){pageMode='audit';dock.hidden=true;const rows=VALID.filter(q=>q.resolution||nxActiveAudit(q).status!=='supported'||q.sourceKeyAudit?.status==='conflict');view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Rà soát bổ sung · ${esc(INFO.name)}</h2><p>${nxSummary()}</p><p>Danh sách gồm các câu đã rà soát bổ sung và các cờ nguồn còn lại. “Đã xác định lỗi” không đồng nghĩa “key đã xác minh”.</p>${rows.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${esc(q.uid)} · ${esc(q.resolution?RX_LABELS[q.resolution.kind]:NX_LABELS[nxActiveAudit(q).status])}</b><br>${esc(nxActiveAudit(q).vi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('')}</section>`;goTop();}

function beginStudy(mode,qs,index=0){if(!qs.length){toast('Không có câu phù hợp với lựa chọn này.');return;}closeDialog();const names={study:'Học theo thứ tự',unanswered:'Câu chưa làm',random:'Ngẫu nhiên',red:'Câu đỏ trong đề',wrong:'Ôn câu sai',bookmarks:'Đã đánh dấu',topic:'Theo chủ đề',review:'Cần đối chiếu'};currentLabel=names[mode]||'Học';state=E.openStudy(state,qs.map(q=>q.id),qs[index].id,mode);persist();pageMode='study';renderStudy();goTop();}
function resume(){const r=E.resumeStudy(state,BANK);if(!r){toast('Phiên học trước đã hoàn tất.');return;}state=E.moveStudy(state,r.qid);persist();pageMode='study';currentLabel='Tiếp tục học';renderStudy();goTop();}
function imageBlock(key,caption,isQuestion=false){if(!key)return '';return `<figure class="figure ${isQuestion?'question-figure':''}"><button class="imagebutton" data-action="image" data-asset="${esc(key)}" data-caption="${esc(caption)}" aria-label="Phóng to ${esc(caption)}"><img src="${asset(key)}" loading="lazy" decoding="async" alt="${esc(caption)}"></button><figcaption>${esc(caption)} · Chạm hình để phóng to</figcaption></figure>`;}
function sourceHtml(q){if(isNext(q))return nxSources(q);if(isMass(q))return mbSources(q);if(isLawAudit(q))return lawSource(q);if(sourceOnly(q)){const ref=q.reference||{};return `<details class="sourcebox"><summary>Nguồn gốc câu hỏi · ${ref.type==='automatically_suggested'?'trang sách liên quan, chưa xác nhận key':'chưa tìm được trang đủ căn cứ'}</summary>${(q.sourceFiles||[]).map(s=>`<p>${esc(s)}</p>`).join('')}<p>Đối chiếu Word–Excel: ${esc(q.pairStatus||'Chưa ghi nhận')}. Đây là nguồn đề, không phải chứng nhận đáp án.</p>${ref.type==='automatically_suggested'?`<div class="callout warning"><strong>Trang sách gợi ý — tra cứu tự động</strong><p>${esc(ref.source)} · PDF page ${ref.pdfPage}. Đoạn dưới được tìm theo nội dung câu hỏi; chưa đủ chứng minh đáp án.</p><blockquote>${esc(ref.excerpt)}</blockquote></div>`:'<p>Chưa tìm thấy đoạn tài liệu đủ phù hợp để giới thiệu. Cần kiểm tra thủ công.</p>'}</details>`;}const l=LESSONS[q.review.lesson];if(INFO.subjectId!=='POF')return `<details class="sourcebox" open><summary>Đối chiếu giáo trình · trang PDF ${l.pages[0]}</summary><p><b>${esc(l.book)}</b> · PDF page ${l.pages[0]}</p><blockquote class="source-quote">${esc(l.excerpt)}</blockquote>${l.sourceImage?imageBlock(l.sourceImage,`Ảnh trang ${l.pages[0]} trong giáo trình ${INFO.name}`):''}<p class="muted">Đoạn sách được trích nguyên nội dung. Phần giải thích ở trên là diễn giải để học, không phải nguyên văn sách. ${q.review.status==='derived'?'Việc áp dụng vào toàn bộ chi tiết câu hỏi cần được thẩm định thêm.':''}</p></details>`;return `<details class="sourcebox"><summary>Đối chiếu tài liệu gốc · ${l.pages.length} trang</summary><p><b>CAE Oxford Aviation Academy — Principles of Flight (2014)</b><br>${esc(l.chapter)} · ${esc(l.title)}<br>Số trên nút là trang in trong sách; số trong file PDF cao hơn 6 trang.</p><div class="source-links">${l.pages.map(p=>btn('source',`Sách ${p} · PDF ${p+6}`,'quiet',`data-page="${p}"`)).join('')}</div><p>Phần diễn giải phía trên đã được tách khỏi trang sách. “Suy luận có điều kiện” là áp dụng nguyên lý vào đề; “Cần đối chiếu thêm” không đồng nghĩa đáp án đã được nguồn xác nhận.</p></details>`;}
function paragraphs(s){if(!s)return '';const chunks=s.split(/\n+/).filter(Boolean);return chunks.map(t=>`<p>${esc(t)}</p>`).join('');}
function languageBlock(q,lang){const l=LESSONS[q.review.lesson],r=q.review;const code=lang==='vi'?'vi':'en';return `<section class="language-block" lang="${code}"><div class="label">${lang==='vi'?'Tiếng Việt':'English'}</div>${paragraphs(l[code])}${r[code]?`<div class="application"><h4>${lang==='vi'?'Áp dụng vào câu này':'Applying it to this question'}</h4>${paragraphs(r[code])}</div>`:''}${r['note'+(lang==='vi'?'Vi':'En')]?`<div class="callout ${['limited','conflict'].includes(r.status)?'warning':''}">${esc(r['note'+(lang==='vi'?'Vi':'En')])}</div>`:''}</section>`;}
function explanation(q){if(isNext(q))return nxExplanation(q);if(isMass(q))return mbExplanation(q);if(isLawAudit(q))return lawExplanation(q);if(sourceOnly(q))return `<section class="explanation" aria-label="Đáp án nguồn"><div class="answer-focus"><div class="eyebrow">Đáp án gốc của đề · chưa được xác minh chuyên môn</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div><div class="callout warning"><b>Chưa có lời giải đã đối chiếu đầy đủ cho câu này</b><p>Đây là đáp án gốc trong đề, không phải kết luận đã được giáo trình xác nhận. Bên dưới có thể có một đoạn sách liên quan được tìm tự động; đó chỉ là gợi ý tra cứu, không phải lời giải của câu.</p><p lang="en">A source-checked explanation has not yet been authored for this item. The answer shown is the original bank key, not an independently validated conclusion.</p></div>${q.review.noteVi?`<div class="callout"><b>Lưu ý dữ liệu nguồn</b>${paragraphs(q.review.noteVi)}</div>`:''}${sourceHtml(q)}</section>`;const r=q.review,l=LESSONS[r.lesson],lang=state.settings.language,limited=['limited','conflict'].includes(r.status);return `<section class="explanation" aria-label="Giải thích câu ${q.id}"><div class="answer-focus"><div class="eyebrow">${limited?'Đáp án gốc của đề · chưa coi là xác nhận đúng':'Đáp án theo đề'}</div><div class="key">${esc(q.answer)} — ${esc(q.options[q.answer])}</div></div>
 ${limited?`<div class="callout warning"><strong>${r.status==='conflict'?'Có điểm không khớp với nguồn':'Đây là nguyên lý nền; chưa xác minh độc lập mọi điều kiện câu hỏi'}</strong>${esc(r.noteVi||'Xem phần đối chiếu bên dưới.')}<br><span lang="en">${esc(r.noteEn||'See the source review below.')}</span></div>`:''}
 <div class="lang-switch" role="group" aria-label="Ngôn ngữ giải thích">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ']].map(([k,v])=>btn('language',v,'',`data-lang="${k}" aria-pressed="${lang===k}"`)).join('')}</div>
 ${r.formula?`<div class="formula" aria-label="Công thức">${esc(r.formula)}</div>`:''}
 <div class="explanation-grid ${lang==='both'?'both':''}">${lang!=='en'?languageBlock(q,'vi'):''}${lang!=='vi'?languageBlock(q,'en'):''}</div>
 ${INFO.subjectId==='POF'&&!limited&&l.images.length?imageBlock(`p${l.images[0]}`,`Minh họa gốc CAE Oxford · trang sách ${l.images[0]} / PDF ${l.images[0]+6}. Số liệu trong hình là ví dụ của sách.`):''}
 ${sourceHtml(q)}</section>`;}
function questionStem(q){return q.displayQuestion||q.question;}
function questionBody(q,selected,revealed,exam=false){const limited=['limited','conflict'].includes(q.review.status);return `<article class="card qcard" data-question-id="${q.id}"><div class="qhead"><span class="qid">${esc(disp(q))}</span><span class="pill">STT ${q.id}</span><span class="pill">${esc(labelTopic(q.topic))}</span>${redBadge(q)}</div>${!exam?status(q):''}${isMass(q)?mbRepairNotice(q,exam):''}<h2 class="qtext ${q.red?'original-red':''}" lang="en">${esc(questionStem(q))}</h2>${isNext(q)?nxFigures(q):''}${['MB','MBR'].includes(INFO.subjectId)?mbFigures(q):''}${q.figure?imageBlock(q.figure,`Hình nguồn · ${disp(q)}${q.figureStatus==='partial'?' · Ảnh gốc bị cắt':''}`,true):''}${q.figureBlocked?'<div class="callout warning">Hình nguồn còn thiếu hoặc chưa đầy đủ. Không dùng câu này như một bài kiểm tra đủ dữ kiện.</div>':''}
 <div class="options" role="group" aria-label="Chọn đáp án">${Object.keys(q.options).map(k=>`<button type="button" class="answer-option ${selected===k?'selected':''} ${revealed&&k===q.answer?'correct':''} ${revealed&&selected===k&&k!==q.answer?'incorrect':''}" data-action="answer" data-key="${k}" ${revealed?'disabled':''}><span class="letter">${k}</span><span lang="en">${esc(q.options[k])}${isNext(q)?nxOption(q,k):''}</span></button>`).join('')}</div>
 ${revealed?`<div class="selection-note ${selected===q.answer?'good':'bad'}">${limited?'So với key của đề: ':''}${selected?`Bạn đã chọn ${esc(selected)} · ${selected===q.answer?'Khớp đáp án đề':'Chưa khớp đáp án đề'}`:'Câu chưa trả lời trong bài thi'}</div>${explanation(q)}`:`<p class="before-answer">${exam?'Đáp án và lời giải được ẩn tới khi nộp bài.':'Chọn một đáp án để xem giải thích. Không tự chuyển câu.'}</p>`}</article>`;}
function setDock(q,index,total,exam=false,review=false){dock.hidden=false;const marked=state.bookmarks.includes(q.id);dock.innerHTML=`<div class="dock-inner">${btn('prev','← Trước','quiet',index===0?'disabled':'')}${btn(exam?'exam-nav':'picker','Chọn câu','quiet')}${btn('bookmark',marked?'★':'☆',marked?'bookmarked':'quiet',`aria-label="${marked?'Bỏ đánh dấu':'Đánh dấu'} câu ${q.id}"`)}${btn('next',index===total-1?(exam?'Nộp bài':review?'Kết quả':'Hoàn tất'):'Tiếp →','primary')}</div>`;}
function renderStudy(){const st=state.study,q=BY_ID.get(st?.qid);if(!q){home();return;}const idx=st.ids.indexOf(q.id);view.innerHTML=`<div class="toolbar">${btn('home','← Trang chủ','quiet')}<span>${esc(currentLabel)}</span><span class="space"></span><span class="pill">${idx+1}/${st.ids.length}</span></div><div class="progress"><span style="width:${(idx+1)/st.ids.length*100}%"></span></div>${questionBody(q,st.answers[q.id]||null,Object.prototype.hasOwnProperty.call(st.answers,q.id))}`;setDock(q,idx,st.ids.length);}
function renderReview(){const r=reviewItems[reviewIndex],q=BY_ID.get(r?.id);if(!q){home();return;}view.innerHTML=`<div class="toolbar">${btn('results','← Kết quả','quiet')}<span>Xem lại · không tính thêm lượt làm</span><span class="space"></span><span class="pill">${reviewIndex+1}/${reviewItems.length}</span></div>${questionBody(q,r.selected,true)}`;setDock(q,reviewIndex,reviewItems.length,false,true);}
function renderExam(){const ex=state.exam;if(!ex){home();return;}if(ex.submitted){report=ex.report;showResults();return;}const idx=ex.ids.indexOf(ex.qid),q=BY_ID.get(ex.qid);view.innerHTML=`<div class="toolbar">${btn('home','← Tạm dừng','quiet')}<span>Thi thử · ${idx+1}/${ex.ids.length}</span><span class="space"></span><span class="pill">${Object.keys(ex.answers).length} đã chọn</span></div>${questionBody(q,ex.answers[q.id]||null,false,true)}`;setDock(q,idx,ex.ids.length,true);}
function nav(direction){if(pageMode==='review'){const next=reviewIndex+direction;if(next>=reviewItems.length){showResults();return;}if(next<0)return;reviewIndex=next;renderReview();goTop();return;}const session=pageMode==='exam'?state.exam:state.study;if(!session)return;const next=session.ids.indexOf(session.qid)+direction;if(next<0)return;if(next>=session.ids.length){if(pageMode==='exam')confirmSubmit();else home();return;}const qid=session.ids[next];state=pageMode==='exam'?E.moveExam(state,qid):E.moveStudy(state,qid);persist();if(pageMode==='exam')renderExam();else renderStudy();goTop();}
function currentQuestion(){return BY_ID.get(pageMode==='review'?reviewItems[reviewIndex]?.id:pageMode==='exam'?state.exam?.qid:state.study?.qid);}
function showPicker(){picker={filter:'all',range:Math.min(RANGE_COUNT-1,Math.floor(((currentQuestion()?.id||1)-1)/100)),search:'',topic:''};drawPicker();}
function drawPicker(){const subset=E.filter(BANK,state,{filter:picker.filter,search:picker.search,topic:picker.topic}),first=picker.range*100+1,last=first+99;
 const groups=Array.from({length:RANGE_COUNT},(_,i)=>btn('range',`${i*100+1}–${Math.min(MAX_ID,i*100+100)}`,picker.range===i?'active':'',`data-range="${i}"`)).join('');
 const filters=[['all','Tất cả'],['red','Câu đỏ'],['unanswered','Chưa làm'],['wrong','Câu sai'],['bookmarks','Đánh dấu'],['review','Cần đối chiếu']];
 let result;
 if(picker.search||picker.filter!=='all'||picker.topic){result=subset.length?`<p class="muted" style="font-size:13px">${subset.length} câu phù hợp</p><div class="picker-grid">${subset.map(q=>numberButton(q.id,true)).join('')}</div>`:'<div class="empty">Không có câu phù hợp.</div>';}
 else result=`<div class="ranges">${groups}</div><div class="picker-grid">${Array.from({length:Math.min(100,MAX_ID-first+1)},(_,i)=>numberButton(first+i,!!BY_ID.get(first+i)?.valid)).join('')}</div>`;
 modal('Chọn câu',`<div class="filterbar">${filters.map(([k,v])=>btn('filter',v,picker.filter===k?'active':'',`data-filter="${k}"`)).join('')}</div><input type="search" id="question-search" value="${esc(picker.search)}" placeholder="Tìm STT, mã câu (MET-10-019) hoặc từ khóa" aria-label="Tìm câu hỏi" autocomplete="off"><div class="legend"><span><span class="dot"></span> Đỏ trong đề gốc</span><span><i class="legend-swatch"></i>Đã làm</span><span><i class="legend-swatch wrong"></i>Cần ôn</span><span>Số gạch: thiếu trong đề</span></div>${result}`);
 const input=document.getElementById('question-search');input.addEventListener('input',()=>{const cursor=input.selectionStart;picker.search=input.value;drawPicker();const n=document.getElementById('question-search');n.focus();try{n.setSelectionRange(cursor,cursor);}catch(_){}});
}
function numberButton(id,available){const q=BY_ID.get(id),answered=Boolean(state.progress[id]),wrong=state.wrong.includes(id),curr=currentQuestion()?.id===id;return btn('jump',`${id}${q?.red?'<span class="dot" aria-hidden="true"></span>':''}`,`qnum ${answered?'answered':''} ${wrong?'wrong':''} ${curr?'current':''} ${!available?'missing':''}`,`data-qid="${id}" title="${esc(q?.uid||String(id))}" aria-label="${esc(q?.uid||String(id))}${q?.red?', đánh dấu đỏ trong đề':''}${!available?', thiếu trong đề':''}" ${available?'':'disabled'}`);}
function jump(id){if(!BY_ID.get(id)?.valid)return;closeDialog();beginStudy('study',VALID,ALL_IDS.indexOf(id));}
function showTopics(){modal('Chọn chủ đề',`<div class="grid">${[...new Set(VALID.map(q=>q.topic))].sort().map(t=>btn('topic',`${esc(labelTopic(t))} <small>· ${VALID.filter(q=>q.topic===t).length} câu</small>`,'',`data-topic="${esc(t)}"`)).join('')}</div>`);}
function showExamPicker(){if(NX_CODES.includes(INFO.subjectId))return nxExamPicker();if(INFO.subjectId==='MB')return mbSourceExamPicker();modal('Thi thử',`<p>Giữ đáp án ẩn tới khi nộp. Bài đang làm được lưu khi chuyển câu hoặc chọn đáp án.</p><div class="callout">Mặc định lấy từ <b>${E.examPool(BANK).length}</b> câu; loại ${VALID.length-E.examPool(BANK).length} câu có lưu ý chưa giải quyết hoặc thiếu hình. ${INFO.hasExplanations?'':'Toàn bộ môn này hiện chấm theo đáp án nguồn, chưa có bộ lời giải kiểm chứng.'}</div><label style="font-size:13px;display:block;margin:16px 0"><input type="checkbox" id="exam-all"> ${INFO.subjectId==='MBR'?'Bao gồm câu còn cần đối chiếu, nếu có (chấm theo bản hiệu chỉnh)':'Bao gồm cả câu cần đối chiếu (chấm theo key gốc của đề)'}</label><div class="row">${[20,50,100].map(n=>btn('start-exam',`${n} câu`,'primary',`data-size="${n}"`)).join('')}</div>`);}
function startExam(n){const all=document.getElementById('exam-all')?.checked;const pool=all?VALID:E.examPool(BANK);if(state.exam&&!state.exam.submitted&&!confirm('Thay bài thi đang dở bằng bài thi mới?'))return;state=E.startExam(state,E.shuffle(pool).slice(0,n).map(q=>q.id));persist();closeDialog();pageMode='exam';renderExam();goTop();}
function examNavigation(){const e=state.exam;modal('Câu trong bài thi',`<p>Chỉ số là vị trí trong bài thi, không phải số câu trong ngân hàng.</p><div class="exam-grid">${e.ids.map((id,i)=>btn('exam-jump',String(i+1),`${e.answers[id]?'done':''} ${e.qid===id?'current':''}`,`data-qid="${id}"`)).join('')}</div><div class="row" style="margin-top:15px">${btn('submit','Nộp bài','primary')}${btn('cancel-exam','Hủy bài đang làm','danger')}</div>`);}
function confirmSubmit(){const e=state.exam;if(!e)return;const left=e.ids.length-Object.keys(e.answers).length;modal('Nộp bài thi?',`<p>${left?`Còn ${left} câu chưa chọn; các câu bỏ trống sẽ tính chưa đúng theo đề.`:'Bạn đã chọn hết các câu.'}</p><div class="row">${btn('do-submit','Nộp và xem kết quả','primary')}${btn('close','Quay lại','quiet')}</div>`);}
function showResults(){pageMode='results';closeDialog();dock.hidden=true;if(!report){home();return;}const rows=report.results||[],filtered=resultFilter==='wrong'?rows.filter(r=>!r.correct):rows;view.innerHTML=`<section class="card"><div class="toolbar">${btn('home','← Trang chủ','quiet')}<span class="space"></span><span class="pill">${INFO.subjectId==='MBR'?'Chấm theo key bản hiệu chỉnh':'Chấm theo key gốc'}</span></div><div class="eyebrow">Kết quả đã lưu</div><h1>${report.percent}% <small style="font-size:17px">· ${report.correct}/${report.size} câu</small></h1><p class="muted">Mở một câu để xem ngay lời giải, không tính thêm lượt trả lời. ${rows.length?'Danh sách hiển thị đầy đủ, không cắt ở60 câu.':'Bài thi từ bản cũ chỉ lưu điểm tổng, không có chi tiết từng câu.'}</p><div class="filterbar">${btn('result-all',`Tất cả (${rows.length})`,resultFilter==='all'?'active':'')}${btn('result-wrong',`Chưa đúng (${rows.filter(r=>!r.correct).length})`,resultFilter==='wrong'?'active':'')}</div><div>${filtered.length?filtered.map(r=>{const q=BY_ID.get(r.id);return btn('review',`<span class="num">#${r.id}</span><span><span class="${r.correct?'correct-mark':'wrong-mark'}">${r.correct?'Khớp key':'Chưa khớp key'}</span> · ${esc(q?.question||'')} ${q?.red?'<span class="dot"></span>':''}</span>`,'result-item',`data-qid="${r.id}"`);}).join(''):'<div class="empty">Không có câu trong bộ lọc này.</div>'}</div></section>`;goTop();}
function history(){pageMode='history';dock.hidden=true;view.innerHTML=`<section class="card"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Kết quả thi đã lưu</h2>${state.examHistory.length?[...state.examHistory].reverse().map((h,i)=>btn('history-open',`<strong>${h.percent}% · ${h.correct}/${h.size}</strong><span class="space"></span><small>${esc(new Date(h.at).toLocaleString('vi-VN'))}</small>`,'row result-item',`data-index="${state.examHistory.length-1-i}"`)).join(''):'<p class="muted">Chưa có bài thi đã nộp.</p>'}</section>`;goTop();}
function audit(){if(NX_CODES.includes(INFO.subjectId))return nxAudit();if(['MB','MBR'].includes(INFO.subjectId))return mbAudit();if(INFO.subjectId==='LAW')return lawAudit();pageMode='audit';dock.hidden=true;const qs=VALID.filter(q=>['limited','conflict'].includes(q.review.status));view.innerHTML=`<section class="card review-audit"><div class="toolbar">${btn('home','← Trang chủ','quiet')}</div><h2>Các câu cần đối chiếu</h2><p>${INFO.conflictCount} câu có điểm không khớp; ${INFO.limitedCount} câu chưa đủ nguồn/điều kiện. Giữ nguyên key để bạn nhận biết, không âm thầm đổi đề.</p>${qs.map(q=>btn('jump',`<span class="num">#${q.id}</span><span><b>${q.review.status==='conflict'?'Có điểm không khớp':'Cần thêm căn cứ'}</b><br>${esc(q.review.noteVi||q.review.vi)}</span>`,'result-item',`data-qid="${q.id}"`)).join('')}</section>`;goTop();}
function settings(){modal('Cài đặt & sao lưu',`<div class="settings-group"><label for="theme-select">Giao diện</label><select id="theme-select">${[['system','Theo thiết bị'],['light','Ban ngày'],['dark','Ban đêm']].map(([k,t])=>`<option value="${k}" ${state.settings.theme===k?'selected':''}>${t}</option>`).join('')}</select><label for="language-select">Lời giải mặc định</label><select id="language-select">${[['vi','Tiếng Việt'],['en','English'],['both','Song ngữ Việt–Anh']].map(([k,t])=>`<option value="${k}" ${state.settings.language===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="settings-group"><label>Tiến độ học</label><div class="row">${btn('export','Xuất tiến độ','primary')}${btn('import','Nhập tiến độ','quiet')}</div><p>Bản sao JSON gồm lượt làm, câu sai, đánh dấu, vị trí học, bài thi và tùy chọn. Cập nhật file HTML hoặc đổi thiết bị có thể làm trình duyệt dùng vùng lưu khác; hãy giữ bản sao.</p>${readOnly?btn('raw-export','Xuất dữ liệu gốc đang lỗi','quiet'):''}</div><div class="settings-group"><label>Thông tin</label><p>ATPL Trainer ${esc(INFO.version)} · ${VALID.length} câu · ${INFO.redCount} câu đỏ. Không gửi tài liệu hay tiến độ ra ngoài; nội dung học và ảnh nguồn có thể tải trước bằng nút Offline. Tiến độ vẫn lưu riêng trên trình duyệt này. Không có kết nối AI tự cập nhật.</p></div><div class="row">${btn('reset','Đặt lại tiến độ','danger')}${btn('audit','Xem câu cần đối chiếu','quiet')}</div>`);
 document.getElementById('theme-select').onchange=e=>{state.settings.theme=e.target.value;applyTheme();persist();};document.getElementById('language-select').onchange=e=>{state.settings.language=e.target.value;persist();if(pageMode==='study')renderStudy();else if(pageMode==='review')renderReview();};}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function exportData(){download('ATPL_'+window.ATPL_SUBJECT+'_tien_do_'+new Date().toISOString().slice(0,10)+'.json',E.exportBackup(state));toast('Đã tạo tệp sao lưu. Giữ tệp JSON để nhập lại khi cần.');}
async function importData(file){if(!file)return;try{if(file.size>10000000)throw new Error('Tệp vượt10MB.');const next=E.importBackup(await file.text(),BANK);const n=Object.keys(next.progress).length;if(!confirm(`Nhập ${n} câu đã làm và ${next.examHistory.length} bài thi từ bản sao? Tiến độ hiện tại sẽ được thay thế. Nên xuất bản sao trước.`))return;state=next;readOnly=false;persist();applyTheme();closeDialog();home();toast(storageOK?'Đã nhập và lưu tiến độ.':'Đã nhập cho phiên này nhưng chưa lưu bền vững; hãy xuất trước khi đóng.');}catch(err){toast('Không nhập: '+err.message+' Tiến độ hiện tại giữ nguyên.');}}
function showImage(key,caption){const src=asset(key);if(!src){toast('Không có ảnh cho nguồn này.');return;}imageDialog.innerHTML=`<div class="dialog-header"><h3>${esc(caption)}</h3><div class="image-tools">${btn('image-zoom','Phóng to','quiet')}${btn('image-close','Đóng','quiet')}</div></div><div class="image-stage"><img src="${src}" alt="${esc(caption)}"></div>`;imageDialog.classList.add('image-dialog');if(!imageDialog.open)imageDialog.showModal();}
function redraw(){const y=window.scrollY;if(pageMode==='study')renderStudy();else if(pageMode==='review')renderReview();window.scrollTo({top:y,behavior:'instant'});}
// One delegated event handler avoids re-registering listeners after each render.
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;try{switch(a){
 case 'home':home();break;
 case 'close':closeDialog();break;
 case 'theme':state.settings.theme=activeTheme()==='dark'?'light':'dark';applyTheme();persist();break;
 case 'language':state.settings.language=b.dataset.lang;persist();redraw();break;
 case 'settings':settings();break;
 case 'study':beginStudy('study',VALID);break;
 case 'resume':resume();break;
 case 'unanswered':beginStudy('unanswered',E.filter(BANK,state,{filter:'unanswered'}));break;
 case 'random':beginStudy('random',E.shuffle(VALID));break;
 case 'red-study':beginStudy('red',E.filter(BANK,state,{filter:'red'}));break;
 case 'wrong':beginStudy('wrong',E.filter(BANK,state,{filter:'wrong'}));break;
 case 'bookmarks':beginStudy('bookmarks',E.filter(BANK,state,{filter:'bookmarks'}));break;
 case 'topics':showTopics();break;
 case 'topic':beginStudy('topic',E.filter(BANK,state,{topic:b.dataset.topic}));break;
 case 'picker':showPicker();break;
 case 'range':picker.range=Number(b.dataset.range);drawPicker();break;
 case 'filter':picker.filter=b.dataset.filter;drawPicker();break;
 case 'jump':jump(Number(b.dataset.qid));break;
 case 'answer':if(pageMode==='exam'){state=E.answerExam(state,state.exam.qid,b.dataset.key);persist();renderExam();}else if(pageMode==='study'){state=E.answerStudy(state,state.study.qid,b.dataset.key,BANK);persist();renderStudy();}break;
 case 'bookmark':{const q=currentQuestion();if(q){state=E.toggleBookmark(state,q.id);persist();if(pageMode==='exam')renderExam();else redraw();}}break;
 case 'prev':nav(-1);break;
 case 'next':nav(1);break;
 case 'image':showImage(b.dataset.asset,b.dataset.caption);break;
 case 'source':{const p=Number(b.dataset.page);showImage(`p${p}`,`CAE Oxford · Trang sách ${p} / PDF ${p+6}`);}break;
 case 'image-close':imageDialog.close();break;
 case 'image-zoom':{const st=imageDialog.querySelector('.image-stage');const zoom=st.classList.toggle('zoomed');b.textContent=zoom?'Vừa màn hình':'Phóng to';}break;
 case 'exam-picker':showExamPicker();break;
 case 'start-exam':startExam(Number(b.dataset.size));break;
 case 'resume-exam':pageMode='exam';renderExam();goTop();break;
 case 'exam-nav':examNavigation();break;
 case 'exam-jump':state=E.moveExam(state,Number(b.dataset.qid));persist();closeDialog();renderExam();goTop();break;
 case 'submit':confirmSubmit();break;
 case 'do-submit':state=E.submitExam(state,BANK);persist();report=state.exam.report;resultFilter='all';showResults();break;
 case 'cancel-exam':if(confirm('Hủy bài thi đang dở? Lượt học trước đó vẫn giữ nguyên.')){state.exam=null;persist();closeDialog();home();}break;
 case 'results':showResults();break;
 case 'result-all':resultFilter='all';showResults();break;
 case 'result-wrong':resultFilter='wrong';showResults();break;
 case 'review':reviewItems=resultFilter==='wrong'?report.results.filter(r=>!r.correct):report.results;reviewIndex=reviewItems.findIndex(r=>r.id===Number(b.dataset.qid));pageMode='review';renderReview();goTop();break;
 case 'history':history();break;
 case 'history-open':report=state.examHistory[Number(b.dataset.index)];resultFilter='all';showResults();break;
 case 'audit':closeDialog();audit();break;
 case 'export':exportData();break;
 case 'import':document.getElementById('import-file').click();break;
 case 'raw-export':{const raw={};for(const k of [E.KEY,'atpl_pof_v1_progress','atpl_pof_v1_wrong','atpl_pof_v1_bookmarks','atpl_pof_v1_exam_history']){try{raw[k]=store?.getItem(k);}catch(_){}}download('ATPL_du_lieu_goc_can_phuc_hoi.json',JSON.stringify(raw,null,2));}break;
 case 'reset':if(confirm('Xóa tiến độ bản mới trên trình duyệt này? Hãy xuất tiến độ trước. Không xóa nội dung đề hoặc tùy chọn hiển thị.')){const settings=state.settings;state=E.defaultState();state.settings=settings;readOnly=false;persist();closeDialog();home();}break;
}}catch(err){toast('Không thực hiện được: '+err.message);}});
document.getElementById('import-file').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value='';});
for(const d of [dialog,imageDialog])d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='system')applyTheme();});}catch(_){}
document.addEventListener('keydown',e=>{if(dialog.open||imageDialog.open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(['study','exam','review'].includes(pageMode)){if(e.key==='ArrowRight'){e.preventDefault();nav(1);}else if(e.key==='ArrowLeft'){e.preventDefault();nav(-1);}}});
document.querySelector('.brand small').textContent=INFO.name+' · '+(['MB','MBR'].includes(INFO.subjectId)?'300 câu · lời giải từng bước':INFO.subjectId==='LAW'?`${INFO.auditTotal} câu đã đối chiếu · 126 cờ đã tra cứu bổ sung`:NX_CODES.includes(INFO.subjectId)?`${INFO.questionCount} câu gốc · lời giải và nguồn`:INFO.subjectId==='POF'?'Lời giải từ v2.1':`${INFO.countAuthored} câu có diễn giải · còn lại cần thẩm định`);
mbEditionBanner();applyTheme();setStorageLine();home();
})();
</script>
<script type="module" src="/atpl/bank-bridge.js"></script></body></html>
